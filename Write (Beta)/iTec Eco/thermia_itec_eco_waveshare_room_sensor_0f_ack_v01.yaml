climate:
  - platform: thermostat
    id: thermia_room_thermostat
    name: "Room Thermostat"
    icon: "mdi:thermostat"
    sensor: thermia_room_temperature
    min_heating_off_time: 0s
    min_heating_run_time: 0s
    min_idle_time: 0s
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 20 °C
    visual:
      min_temperature: 10 °C
      max_temperature: 30 °C
      temperature_step:
        target_temperature: 1.0 °C
        current_temperature: 0.1 °C
    heat_action:
      - lambda: |-
          // Keep HVAC action driven by actual heat pump state rather than local hysteresis
          if (id(thermia_heating_active).has_state() && id(thermia_heating_active).state) {
            id(thermia_room_thermostat).action = climate::CLIMATE_ACTION_HEATING;
          } else if (id(thermia_cooling_active).has_state() && id(thermia_cooling_active).state) {
            id(thermia_room_thermostat).action = climate::CLIMATE_ACTION_COOLING;
          } else {
            id(thermia_room_thermostat).action = climate::CLIMATE_ACTION_IDLE;
          }
    idle_action:
      - lambda: |-
          // Keep HVAC action driven by actual heat pump state rather than local hysteresis
          if (id(thermia_heating_active).has_state() && id(thermia_heating_active).state) {
            id(thermia_room_thermostat).action = climate::CLIMATE_ACTION_HEATING;
          } else if (id(thermia_cooling_active).has_state() && id(thermia_cooling_active).state) {
            id(thermia_room_thermostat).action = climate::CLIMATE_ACTION_COOLING;
          } else {
            id(thermia_room_thermostat).action = climate::CLIMATE_ACTION_IDLE;
          }
    target_temperature_change_action:
      - lambda: |-
          // Keep HVAC action driven by actual heat pump state
          if (id(thermia_heating_active).has_state() && id(thermia_heating_active).state) {
            id(thermia_room_thermostat).action = climate::CLIMATE_ACTION_HEATING;
          } else if (id(thermia_cooling_active).has_state() && id(thermia_cooling_active).state) {
            id(thermia_room_thermostat).action = climate::CLIMATE_ACTION_COOLING;
          } else {
            id(thermia_room_thermostat).action = climate::CLIMATE_ACTION_IDLE;
          }

          // Ignore boot-time preset initialization before bus/flash state has settled
          if (millis() < 5000UL) return;

          int target = int(roundf(id(thermia_room_thermostat).target_temperature));
          if (target < 10) target = 10;
          if (target > 30) target = 30;

          if (!id(thermia_target_room_setpoint)->has_state() ||
              int(roundf(id(thermia_target_room_setpoint)->state)) != target) {
            id(thermia_target_room_setpoint)->publish_state(float(target));
          }

          const bool matches_bus =
            id(thermia_room_setpoint)->has_state() &&
            int(roundf(id(thermia_room_setpoint)->state)) == target;
          if (!matches_bus && id(thermia_pending_setpoint_request) != int16_t(target)) {
            id(thermia_pending_setpoint_request) = int16_t(target);
            id(thermia_setpoint_request_retries) = 0;
            ESP_LOGI("thermia_setpoint", "Staged room setpoint change request via Thermostat to %d C", target);
          }


