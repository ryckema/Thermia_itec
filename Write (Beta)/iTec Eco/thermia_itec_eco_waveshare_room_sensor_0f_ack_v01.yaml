# =============================================================================
# THERMIA iTec Eco — WRITE (BETA) ROOM SENSOR EMULATOR v01
# iTec Eco room sensor emulation profile (Slave 0x0A)
# Prepared: 2026-11-03
#
# Credits & Provenance:
# - Transmit-side room sensor emulation discovery, timing measurements and 0x0A
#   frame verification on iTec Eco are by Piotr Romanowski:
#   https://github.com/piotr-romanowski/thermia-bus-sniffer
# - Register semantics, DHP-AQ protocol mapping and baseline ESPHome decoder
#   architecture are by ryckema:
#   https://github.com/ryckema/Thermia_itec
# - ESPHome integration, Home Assistant controls and fail-closed safety guards
#   implemented by Lauri Ampuja.
#
# Target family:
# - Thermia iTec Eco on Danfoss DHP-AQ controller family
# - Specifically tested & verified on iTec Eco 8 (display fw 2.3.0) and Eco 5
#
# Reference hardware:
# - Waveshare ESP32-S3-RS485-CAN / ESP32-S3-RS485-CAN-U
# - Onboard isolated RS485 transceiver (SP3485)
# - RS485 RX = GPIO18
# - RS485 TX = GPIO17
# - RS485 DE/RE direction = GPIO21 (HIGH = TX, LOW = RX)
#
# HOW IT WORKS:
# 1. The Thermia controller/display continuously polls slave 0x0A (Modbus room sensor)
#    every ~4.3 seconds using FC23 (read 3 @46000, write 3 @46020).
# 2. When emulation is enabled in Home Assistant (switch ON) and temperature data is fresh,
#    the ESP responds with an 11-byte frame:
#    0A 17 06 <temp*10> <setpoint_req> <topup_req> <CRC16>
#    - Word 0 (@46000): Indoor temperature x10 (e.g. 215 = 21.5 C)
#    - Word 1 (@46001): Target room setpoint request (10-30 C, 0 = no request)
#    - Word 2 (@46002): Hot-water top-up trigger (1 = trigger immersion heater run, 0 = idle)
# 3. The iTec Eco display auto-detects the room sensor and:
#    - Adopts the supplied indoor temperature for heating curve room compensation.
#    - Updates its active room setpoint when a non-zero setpoint request is received (mirrored in @46021).
#    - Starts a hot-water top-up cycle when word 2 is 1 (status mirrored in @46022, 2 = active).
# 4. Fail-closed safeguards:
#    - Emulation switch defaults to OFF after boot.
#    - DE is held LOW at all times except during the ~12 ms transmission.
#    - Safety watchdog halts transmission if HA data becomes stale (>30 min).
#    - Automatic collision protection halts transmission if an external physical
#      room sensor is detected on the bus.
# =============================================================================

# =============================================================================
# ESP
# =============================================================================

# Board: Waveshare ESP32-S3-RS485-CAN
# MCU: ESP32-S3R8, external 16 MB flash, 8 MB octal PSRAM

substitutions:
  device_name: "thermia-itec-eco"
  friendly_name: "Thermia iTec Eco"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - delay: 1s
        - lambda: |-
            id(thermia_room_temp_last_update_ms) = millis();

            // Restore cached settings only after this device has previously
            // observed a genuine Thermia 0x0F FC10 03E8..03F5 frame.
            if (id(thermia_settings_cache_valid)) {
              id(thermia_heating_curve)->publish_state(id(thermia_heating_curve_saved));
              id(thermia_heating_min)->publish_state(id(thermia_heating_min_saved));
              id(thermia_heating_max)->publish_state(id(thermia_heating_max_saved));
              id(thermia_curve_plus5)->publish_state(id(thermia_curve_plus5_saved));
              id(thermia_curve_zero)->publish_state(id(thermia_curve_zero_saved));
              id(thermia_curve_minus5)->publish_state(id(thermia_curve_minus5_saved));
              id(thermia_heating_stop)->publish_state(id(thermia_heating_stop_saved));
              id(thermia_reduced_temperature)->publish_state(id(thermia_reduced_temperature_saved));
              id(thermia_room_factor)->publish_state(id(thermia_room_factor_saved));
              id(thermia_room_setpoint_mirror)->publish_state(id(thermia_room_setpoint_mirror_saved));

              ESP_LOGD(
                "thermia_persist",
                "Restored validated settings cache: curve=%.0f min=%.0f max=%.0f corr=[%.0f,%.0f,%.0f] stop=%.0f reduced=%.0f room_factor=%.0f room_setpoint=%.0f",
                id(thermia_heating_curve_saved),
                id(thermia_heating_min_saved),
                id(thermia_heating_max_saved),
                id(thermia_curve_plus5_saved),
                id(thermia_curve_zero_saved),
                id(thermia_curve_minus5_saved),
                id(thermia_heating_stop_saved),
                id(thermia_reduced_temperature_saved),
                id(thermia_room_factor_saved),
                id(thermia_room_setpoint_mirror_saved)
              );
            } else {
              ESP_LOGD(
                "thermia_persist",
                "No validated settings cache yet; waiting for a live 0x0F FC10 03E8..03F5 frame."
              );
            }

            // Restore cached 0x0F 042E..0434 Hot Water settings once observed.
            if (id(thermia_dhw_cache_valid)) {
              id(thermia_dhw_enabled_setting)->publish_state(id(thermia_dhw_enabled_saved));
              const int16_t saved_mode = id(thermia_dhw_mode_saved);
              const char *saved_mode_str = "Unknown";
              if (saved_mode == 0) saved_mode_str = "Comfort";
              else if (saved_mode == 1) saved_mode_str = "Eco";
              else if (saved_mode == 2) saved_mode_str = "Super-Eco";
              id(thermia_dhw_mode_setting)->publish_state(saved_mode_str);
              id(thermia_startup_ht_setting)->publish_state(id(thermia_startup_ht_saved));
              id(thermia_heating_time_setting)->publish_state(id(thermia_heating_time_saved));

              ESP_LOGD(
                "thermia_persist",
                "Restored validated DHW settings cache: enabled=%d mode=%s (%d) startup_ht=%.0f heating_time=%.0f",
                id(thermia_dhw_enabled_saved) ? 1 : 0,
                saved_mode_str,
                (int) saved_mode,
                id(thermia_startup_ht_saved),
                id(thermia_heating_time_saved)
              );
            }

            // Initialize Room Thermostat climate entity state on boot
            id(thermia_room_thermostat).mode = climate::CLIMATE_MODE_HEAT;
            id(thermia_room_thermostat).action = climate::CLIMATE_ACTION_IDLE;
            if (id(thermia_target_room_setpoint)->has_state()) {
              id(thermia_room_thermostat).target_temperature = id(thermia_target_room_setpoint)->state;
            } else if (id(thermia_settings_cache_valid)) {
              id(thermia_room_thermostat).target_temperature = id(thermia_room_setpoint_mirror_saved);
            }
            id(thermia_room_thermostat).publish_state();

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# ESP32-S3R8 provides 8 MB octal PSRAM. Explicit PSRAM configuration is
# required by current ESPHome releases for ESP32-S3.
psram:
  mode: octal
  speed: 80MHz

# Batch preference writes. The persisted Thermia settings change rarely.
preferences:
  flash_write_interval: 1min

api:
  encryption:
    key: !secret thermia_api_encryption_key
  # Do not reboot merely because Home Assistant/API is temporarily unreachable.
  reboot_timeout: 0s

  services:
    - service: set_room_temperature
      variables:
        temperature: float
      then:
        - lambda: |-
            if (temperature >= 5.0f && temperature <= 35.0f) {
              id(thermia_room_temp_input)->publish_state(temperature);
              id(thermia_room_temp_last_update_ms) = millis();
              ESP_LOGI("thermia_service", "Room temperature updated via HA service: %.1f C", temperature);
            } else {
              ESP_LOGW("thermia_service", "Invalid room temperature: %.1f C", temperature);
            }

    - service: set_target_room_setpoint
      variables:
        setpoint: int
      then:
        - lambda: |-
            if (setpoint >= 10 && setpoint <= 30) {
              id(thermia_target_room_setpoint)->publish_state(float(setpoint));
              id(thermia_room_thermostat).target_temperature = float(setpoint);
              id(thermia_room_thermostat).publish_state();
              id(thermia_pending_setpoint_request) = int16_t(setpoint);
              id(thermia_setpoint_request_retries) = 0;
              ESP_LOGI("thermia_service", "Target room setpoint set via HA service: %d C", (int) setpoint);
            } else {
              ESP_LOGW("thermia_service", "Invalid target room setpoint: %d C", (int) setpoint);
            }

    - service: trigger_hot_water_topup
      then:
        - lambda: |-
            id(thermia_pending_dhw_topup) = true;
            ESP_LOGI("thermia_service", "Hot water top-up triggered via HA service");

ota:
  - platform: esphome
    password: !secret thermia_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # This controller is continuously powered: prefer reliability over Wi-Fi power saving.
  power_save_mode: none

  # Keep a network-stack recovery watchdog, but make it much less aggressive
  # than the ESPHome default. No access-point BSSID is hard-coded.
  reboot_timeout: 30min

  ap:
    ssid: "Thermia Fallback Hotspot"
    password: !secret thermia_fallback_password

captive_portal:


# Publish reset/heap/loop diagnostics so Wi-Fi loss can be separated from
# brownouts, watchdog resets, API loss and parser/resource problems.
debug:
  update_interval: 30s


# =============================================================================
# LOGGING
# =============================================================================

logger:
  # v28 production logging: warnings only.
  level: WARN
  baud_rate: 0
  logs:
    thermia: WARN
    thermia_persist: WARN


# =============================================================================
# THERMIA UART
#
# Confirmed bus settings: 9600 baud, 8E1, Modbus RTU CRC16.
#
# Waveshare ESP32-S3-RS485-CAN:
# - GPIO18 = RX
# - GPIO21 = DE/direction; held LOW for receive
# - GPIO17 TX is intentionally not configured in this build.
#
# This build is receive-only.
# =============================================================================

# =============================================================================
# WAVESHARE RS485 DIRECTION
# =============================================================================

# SP3485 DE and /RE are controlled by GPIO21 on this board.
# ALWAYS_OFF => GPIO21 LOW => receiver enabled, driver disabled.
# This switch is internal and is not exposed to Home Assistant.
switch:
  - platform: gpio
    id: waveshare_rs485_direction
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO21
      inverted: false

  - platform: template
    id: thermia_room_sensor_emulation
    name: "Room Sensor Emulation (0x0A)"
    icon: "mdi:thermometer-check"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          if (id(thermia_peer_room_sensor_detected)) {
            ESP_LOGW("thermia_room", "Cannot enable room sensor emulation: external physical sensor detected on bus!");
            id(thermia_room_sensor_emulation)->publish_state(false);
            id(thermia_room_sensor_status)->publish_state("BLOCKED: External sensor on bus");
            return;
          }
          id(thermia_room_sensor_status)->publish_state("ACTIVE");
          ESP_LOGI("thermia_room", "Room sensor emulation ENABLED");
    turn_off_action:
      - lambda: |-
          id(thermia_room_sensor_status)->publish_state("DISABLED");
          id(waveshare_rs485_direction).turn_off();
          ESP_LOGI("thermia_room", "Room sensor emulation DISABLED");

  - platform: template
    id: thermia_0f_ack_emulation
    name: "Online/DCM ACK Emulation (0x0F)"
    icon: "mdi:check-network-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          if (id(thermia_peer_0f_detected)) {
            ESP_LOGW("thermia_0f", "Cannot enable 0x0F ACK emulation: external 0x0F responder detected on bus!");
            id(thermia_0f_ack_emulation)->publish_state(false);
            return;
          }
          ESP_LOGI("thermia_0f", "0x0F Online/DCM ACK emulation ENABLED");
    turn_off_action:
      - lambda: |-
          id(waveshare_rs485_direction).turn_off();
          ESP_LOGI("thermia_0f", "0x0F Online/DCM ACK emulation DISABLED");


# =============================================================================
# BUS HEALTH
# =============================================================================

globals:
  # Room sensor emulation (0x0A) variables
  - id: thermia_room_temp_last_update_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: thermia_room_sensor_last_tx_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: thermia_room_sensor_responses_sent
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: thermia_peer_room_sensor_detected
    type: bool
    restore_value: no
    initial_value: 'false'

  # Room setpoint request state (@46001 / B3B1)
  - id: thermia_pending_setpoint_request
    type: int16_t
    restore_value: no
    initial_value: '0'

  - id: thermia_setpoint_request_retries
    type: uint8_t
    restore_value: no
    initial_value: '0'

  # Hot water top-up trigger state (@46002 / B3B2)
  - id: thermia_pending_dhw_topup
    type: bool
    restore_value: no
    initial_value: 'false'

  # Slave 0x0F ACK emulation state
  - id: thermia_0f_last_tx_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: thermia_0f_acks_sent
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: thermia_0f_0708_replies_sent
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: thermia_peer_0f_detected
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: thermia_last_valid_frame_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: thermia_valid_frame_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Persisted copies of the known 0x0F heating/settings block.
  # Values are never published after a fresh install until cache_valid has
  # been set by a genuine live Thermia settings frame.
  - id: thermia_settings_cache_valid
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: thermia_heating_curve_saved
    type: float
    restore_value: yes
    initial_value: '35.0'

  - id: thermia_heating_min_saved
    type: float
    restore_value: yes
    initial_value: '20.0'

  - id: thermia_heating_max_saved
    type: float
    restore_value: yes
    initial_value: '40.0'

  - id: thermia_curve_plus5_saved
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: thermia_curve_zero_saved
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: thermia_curve_minus5_saved
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: thermia_heating_stop_saved
    type: float
    restore_value: yes
    initial_value: '20.0'

  - id: thermia_reduced_temperature_saved
    type: float
    restore_value: yes
    initial_value: '20.0'

  - id: thermia_room_factor_saved
    type: float
    restore_value: yes
    initial_value: '2.0'

  - id: thermia_room_setpoint_mirror_saved
    type: float
    restore_value: yes
    initial_value: '22.0'

  # Persisted copies of the 0x0F 042E..0434 Hot Water settings block.
  - id: thermia_dhw_cache_valid
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: thermia_dhw_enabled_saved
    type: bool
    restore_value: yes
    initial_value: 'true'

  - id: thermia_dhw_mode_saved
    type: int16_t
    restore_value: yes
    initial_value: '1'

  - id: thermia_startup_ht_saved
    type: float
    restore_value: yes
    initial_value: '10.0'

  - id: thermia_heating_time_saved
    type: float
    restore_value: yes
    initial_value: '5.0'


uart:
  id: thermia_uart

  tx_pin:
    number: GPIO17
    inverted: false

  rx_pin:
    number: GPIO18
    inverted: false

  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

  rx_buffer_size: 2048

  # Prevent ESP-IDF from splitting Modbus RTU frames into ~7-byte chunks.
  rx_full_threshold: 120
  rx_timeout: 2

  debug:
    direction: RX
    dummy_receiver: true
    debug_prefix: "[THERMIA] "

    after:
      timeout: 5ms

    sequence:
      - lambda: |-

          // Robust Modbus RTU stream assembler. ESPHome may split long
          // frames across callbacks, so retain bytes until structure + CRC
          // prove a complete frame. Multiple frames per callback are OK.
          static std::vector<uint8_t> pending;
          if (pending.capacity() == 0) {
            pending.reserve(512);
          }
          pending.insert(pending.end(), bytes.begin(), bytes.end());

          if (pending.size() > 4096) {
            ESP_LOGW(
              "thermia",
              "RX stream buffer exceeded 4096 bytes; clearing buffer to recover."
            );
            pending.clear();
            return;
          }

          auto stream_crc16 = [](const uint8_t *data, size_t len) -> uint16_t {
            uint16_t crc = 0xFFFF;
            for (size_t i = 0; i < len; i++) {
              crc ^= data[i];
              for (uint8_t bit = 0; bit < 8; bit++)
                crc = (crc & 1) ? ((crc >> 1) ^ 0xA001) : (crc >> 1);
            }
            return crc;
          };

          auto valid_crc = [&](size_t len) -> bool {
            if (len < 5 || pending.size() < len) return false;
            uint16_t got = uint16_t(pending[len-2]) | (uint16_t(pending[len-1]) << 8);
            return stream_crc16(pending.data(), len - 2) == got;
          };

          auto known_slave = [](uint8_t s) -> bool {
            return s == 0x02 || s == 0x04 || s == 0x06 || s == 0x0A ||
                   s == 0x0F || s == 0x14 || s == 0x1E ||
                   s == 0xA4 || s == 0xA5;
          };

          auto process_frame = [&](const std::vector<uint8_t> &bytes) {
              // ===============================================================
              // THERMIA ITEC LEGACY PASSIVE MODBUS RTU DECODER
              // ===============================================================

              if (bytes.size() < 5) {
                ESP_LOGW(
                  "thermia",
                  "Chunk too short for Modbus RTU: %u bytes",
                  (unsigned) bytes.size()
                );
                return;
              }


              // ===============================================================
              // HELPERS
              // ===============================================================

              auto crc16_modbus =
                [](const uint8_t *data, size_t len) -> uint16_t {

                  uint16_t crc = 0xFFFF;

                  for (size_t i = 0; i < len; i++) {

                    crc ^= data[i];

                    for (uint8_t bit = 0; bit < 8; bit++) {

                      if (crc & 0x0001) {
                        crc = (crc >> 1) ^ 0xA001;
                      } else {
                        crc >>= 1;
                      }
                    }
                  }

                  return crc;
                };


              auto u16 =
                [](const std::vector<uint8_t> &b, size_t pos) -> uint16_t {

                  return
                    (uint16_t(b[pos]) << 8) |
                    uint16_t(b[pos + 1]);
                };


              auto s16 =
                [](const std::vector<uint8_t> &b, size_t pos) -> int16_t {

                  return int16_t(
                    (uint16_t(b[pos]) << 8) |
                    uint16_t(b[pos + 1])
                  );
                };


              // ===============================================================
              // CHANGE-ONLY PUBLISH HELPERS
              //
              // The Thermia bus repeats many identical values every second.
              // Only forwarding actual changes keeps the ESPHome native API
              // queue small and prevents Home Assistant entities going
              // temporarily unavailable under heavy bus traffic.
              // ===============================================================

              auto publish_float_if_changed =
                [](auto *sensor, float value, float epsilon = 0.001f) {
                  if (!sensor->has_state() ||
                      isnan(sensor->state) ||
                      fabsf(sensor->state - value) >= epsilon) {
                    sensor->publish_state(value);
                  }
                };

              auto publish_bool_if_changed =
                [](auto *sensor, bool value) {
                  if (!sensor->has_state() || sensor->state != value) {
                    sensor->publish_state(value);
                  }
                };

              auto publish_text_if_changed =
                [](auto *sensor, const char *value) {
                  if (!sensor->has_state() || sensor->state != value) {
                    sensor->publish_state(value);
                  }
                };


              // ===============================================================
              // CRC VALIDATION
              // ===============================================================

              const uint16_t received_crc =
                uint16_t(bytes[bytes.size() - 2]) |
                (uint16_t(bytes[bytes.size() - 1]) << 8);

              const uint16_t calculated_crc =
                crc16_modbus(
                  bytes.data(),
                  bytes.size() - 2
                );


              if (received_crc != calculated_crc) {

                ESP_LOGW(
                  "thermia",
                  "CRC FAIL (%u bytes): received=0x%04X calculated=0x%04X",
                  (unsigned) bytes.size(),
                  received_crc,
                  calculated_crc
                );

                return;
              }


              const uint8_t slave = bytes[0];
              const uint8_t fc = bytes[1];

              id(thermia_last_valid_frame_ms) = millis();
              id(thermia_valid_frame_count)++;
              publish_bool_if_changed(id(thermia_bus_healthy), true);

              ESP_LOGD(
                "thermia",
                "CRC OK: slave=0x%02X function=0x%02X length=%u",
                slave,
                fc,
                (unsigned) bytes.size()
              );


              // ===============================================================
              // REQUEST CONTEXT
              //
              // Responses to FC04/FC17 do not contain the original register
              // address. Remember the request so the response can be decoded.
              // ===============================================================

              static uint16_t fc04_start[256] = {};
              static uint16_t fc04_count[256] = {};
              static bool fc04_pending[256] = {};

              static uint16_t fc17_start[256] = {};
              static uint16_t fc17_count[256] = {};
              static bool fc17_pending[256] = {};

              // ===============================================================
              // MAPPER STATE
              // Change-only logging for selected register blocks.
              // ===============================================================

              static bool mapper_initialized = false;

              static int16_t prev_a7f8_block[0x0F] = {};
              static int16_t prev_a80c_block[0x07] = {};
              static int16_t prev_b3b0_block[0x03] = {};
              static int16_t prev_b3c4_block[0x03] = {};
              static int16_t prev_03e8_block[0x0E] = {};
              static int16_t prev_1e_fc04_block[0x16] = {};

              auto log_change =
                [&](const char *group,
                    uint16_t address,
                    int16_t old_value,
                    int16_t new_value) {

                  if (old_value == new_value) {
                    return;
                  }

                  ESP_LOGD(
                    "thermia_map",
                    "%s 0x%04X: %d -> %d",
                    group,
                    address,
                    old_value,
                    new_value
                  );
                };


              // ===============================================================
              // MINIMAL AUXILIARY MAPPING
              //
              // The public build intentionally omits the generic reverse-
              // engineering register database and its raw Home Assistant
              // entities. Keep only the few useful auxiliary values that are
              // sourced through generic_map_update call sites.
              // ===============================================================

              auto generic_map_update =
                [&](uint8_t source,
                    uint8_t slave_id,
                    uint16_t address,
                    int16_t value) {

                  if (source == 3 && slave_id == 0x0A && address == 0xB3C4) {
                    publish_float_if_changed(
                      id(thermia_room_bus_outdoor_temperature),
                      float(value),
                      0.5f
                    );
                    return;
                  }

                  if (source == 3 && slave_id == 0x06 && address == 0xAFDC) {
                    publish_float_if_changed(
                      id(thermia_dcm_status_afdc),
                      float(value),
                      0.5f
                    );
                    return;
                  }

                  if (source == 3 && slave_id == 0x06 && address == 0xAFE0) {
                    publish_float_if_changed(
                      id(thermia_dcm_outdoor_temperature),
                      float(value),
                      0.5f
                    );
                    return;
                  }
                };


              // ===============================================================
              // SLAVE 0x0F PEER DETECTION & FC03 0x0708 IDLE HANDLER
              // ===============================================================
              if (slave == 0x0F) {
                const uint32_t now_0f = millis();
                const uint32_t last_0f_tx = id(thermia_0f_last_tx_ms);
                const bool is_own_0f_echo = (last_0f_tx > 0 && (now_0f - last_0f_tx) < 150UL);

                // 8-byte FC10 ACK on bus: if not our own echo, an external 0x0F module is present
                if (fc == 0x10 && bytes.size() == 8) {
                  if (!is_own_0f_echo && !id(thermia_peer_0f_detected)) {
                    id(thermia_peer_0f_detected) = true;
                    id(thermia_0f_ack_emulation)->publish_state(false);
                    ESP_LOGW("thermia_0f", "External 0x0F FC10 ACK responder detected on bus! Disabling 0x0F ACK emulation.");
                  }
                  return;
                }

                // FC03 response (e.g. 17-byte reply to 0x0708) on bus: check if external
                if (fc == 0x03 && bytes.size() != 8) {
                  if (!is_own_0f_echo && !id(thermia_peer_0f_detected)) {
                    id(thermia_peer_0f_detected) = true;
                    id(thermia_0f_ack_emulation)->publish_state(false);
                    ESP_LOGW("thermia_0f", "External 0x0F FC03 responder detected on bus! Disabling 0x0F ACK emulation.");
                  }
                  return;
                }

                // FC03 request (8 bytes) to 0x0F
                if (fc == 0x03 && bytes.size() == 8) {
                  const uint16_t st03 = u16(bytes, 2);
                  const uint16_t ct03 = u16(bytes, 4);
                  ESP_LOGD(
                    "thermia_0f",
                    "FC03 to 0x0F: start=0x%04X count=%u",
                    st03,
                    ct03
                  );

                  if (st03 == 0x0708 && ct03 == 6 && id(thermia_0f_ack_emulation)->state && !id(thermia_peer_0f_detected)) {
                    static const uint8_t idle_0708[17] = {
                      0x0F, 0x03, 0x0C,
                      0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                      0x00, 0x00, 0x00, 0x00, 0x00, 0x06,
                      0x9D, 0x76
                    };
                    delay_microseconds_safe(5000);
                    id(waveshare_rs485_direction).turn_on();
                    delay_microseconds_safe(200);
                    id(thermia_uart).write_array(idle_0708, sizeof(idle_0708));
                    id(thermia_uart).flush();
                    delay_microseconds_safe(1200);
                    id(waveshare_rs485_direction).turn_off();

                    id(thermia_0f_last_tx_ms) = millis();
                    id(thermia_0f_0708_replies_sent)++;
                    ESP_LOGD(
                      "thermia_0f",
                      "Sent 0x0F FC03 0x0708 idle reply (total=%u)",
                      (unsigned) id(thermia_0f_0708_replies_sent)
                    );
                  }
                  return;
                }
              }


              // ===============================================================
              // FC04 REQUEST
              // Read Input Registers
              // ===============================================================

              if (
                fc == 0x04 &&
                bytes.size() == 8
              ) {

                fc04_start[slave] =
                  u16(bytes, 2);

                fc04_count[slave] =
                  u16(bytes, 4);

                fc04_pending[slave] = true;

                return;
              }


              // ===============================================================
              // FC04 RESPONSE
              // ===============================================================

              if (
                fc == 0x04 &&
                fc04_pending[slave] &&
                bytes.size() >= 5 &&
                bytes.size() == size_t(bytes[2]) + 5
              ) {

                const uint16_t start =
                  fc04_start[slave];

                const uint16_t count =
                  fc04_count[slave];

                const uint8_t byte_count =
                  bytes[2];


                if (byte_count != count * 2) {

                  fc04_pending[slave] = false;
                  return;
                }


                auto reg_u =
                  [&](uint16_t address) -> uint16_t {

                    const size_t offset =
                      size_t(address - start);

                    const size_t pos =
                      3 + offset * 2;

                    return u16(bytes, pos);
                  };


                auto reg_s =
                  [&](uint16_t address) -> int16_t {

                    const size_t offset =
                      size_t(address - start);

                    const size_t pos =
                      3 + offset * 2;

                    return s16(bytes, pos);
                  };


                // Generic mapper: scan complete FC04 response block.
                for (uint16_t i = 0; i < count; i++) {

                  const uint16_t address =
                    uint16_t(start + i);

                  generic_map_update(
                    1,
                    slave,
                    address,
                    reg_s(address)
                  );
                }


                // =============================================================
                // SLAVE 0x1E
                // Outdoor unit / compressor live data
                //
                // FC04 start 0x0000
                //
                // 0000 condenser inlet          x0.1 °C
                // 0001 condenser outlet         x0.1 °C
                // 0008 high pressure            x0.1 bar
                // 000A requested temperature    x0.1 °C
                // 000B compressor frequency     Hz
                // 000D compressor current       x0.1 A
                // 000E outdoor fan              rpm
                // 0010 expansion valve          steps
                // =============================================================

                if (
                  slave == 0x1E &&
                  start == 0x0000 &&
                  count >= 17
                ) {

                  // -----------------------------------------------------------
                  // Mapper: slave 0x1E FC04 block 0x0000..0x0015
                  // -----------------------------------------------------------

                  if (count >= 0x16) {
                    for (uint16_t addr = 0x0000; addr <= 0x0015; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr);

                      if (mapper_initialized) {
                        log_change(
                          "S1E_FC04",
                          addr,
                          prev_1e_fc04_block[idx],
                          v
                        );
                      }

                      prev_1e_fc04_block[idx] = v;
                    }
                  }

                  const float condenser_in =
                    float(reg_s(0x0000)) / 10.0f;

                  const float condenser_out =
                    float(reg_s(0x0001)) / 10.0f;

                  const float refrigerant_temperature_1 =
                    float(reg_s(0x0002)) / 10.0f;

                  const float discharge_gas_temperature =
                    float(reg_s(0x0003)) / 10.0f;

                  const float refrigerant_temperature_2 =
                    float(reg_s(0x0004)) / 10.0f;

                  const float average_outdoor_temperature =
                    float(reg_s(0x0005)) / 10.0f;

                  const float compressor_temperature =
                    float(reg_s(0x0006)) / 10.0f;

                  const float high_pressure =
                    float(reg_u(0x0008)) / 10.0f;

                  const float target_temperature =
                    float(reg_s(0x000A)) / 10.0f;

                  const float compressor_frequency =
                    float(reg_u(0x000B));

                  const float compressor_max_frequency_ratio =
                    float(reg_u(0x000C));

                  const float compressor_current =
                    float(reg_u(0x000D)) / 10.0f;

                  const float fan_speed =
                    float(reg_u(0x000E));

                  const float valve_steps =
                    float(reg_u(0x0010));


                  if (
                    condenser_in > -50.0f &&
                    condenser_in < 150.0f
                  ) {

                    publish_float_if_changed(id(thermia_condenser_in), condenser_in, 0.05f);
                  }


                  if (
                    condenser_out > -50.0f &&
                    condenser_out < 150.0f
                  ) {

                    publish_float_if_changed(id(thermia_condenser_out), condenser_out, 0.05f);
                  }


                  if (
                    condenser_in > -50.0f &&
                    condenser_in < 150.0f &&
                    condenser_out > -50.0f &&
                    condenser_out < 150.0f
                  ) {

                    publish_float_if_changed(
                      id(thermia_condenser_delta_t),
                      condenser_out - condenser_in,
                      0.05f
                    );
                  }


                  if (refrigerant_temperature_1 > -80.0f &&
                      refrigerant_temperature_1 < 200.0f) {
                    publish_float_if_changed(id(thermia_refrigerant_temperature_1), refrigerant_temperature_1, 0.05f);
                  }

                  if (discharge_gas_temperature > -80.0f &&
                      discharge_gas_temperature < 250.0f) {
                    publish_float_if_changed(id(thermia_discharge_gas_temperature), discharge_gas_temperature, 0.05f);
                  }

                  if (refrigerant_temperature_2 > -80.0f &&
                      refrigerant_temperature_2 < 200.0f) {
                    publish_float_if_changed(id(thermia_refrigerant_temperature_2), refrigerant_temperature_2, 0.05f);
                  }

                  if (average_outdoor_temperature > -80.0f &&
                      average_outdoor_temperature < 100.0f) {
                    publish_float_if_changed(id(thermia_average_outdoor_temperature), average_outdoor_temperature, 0.05f);
                  }

                  if (compressor_temperature > -80.0f &&
                      compressor_temperature < 200.0f) {
                    publish_float_if_changed(id(thermia_compressor_temperature), compressor_temperature, 0.05f);
                  }


                  if (
                    high_pressure >= 0.0f &&
                    high_pressure < 100.0f
                  ) {

                    publish_float_if_changed(id(thermia_high_pressure), high_pressure, 0.05f);
                  }


                  if (
                    target_temperature > -50.0f &&
                    target_temperature < 150.0f
                  ) {

                    publish_float_if_changed(id(thermia_target_temperature), target_temperature, 0.05f);
                  }


                  if (
                    compressor_frequency >= 0.0f &&
                    compressor_frequency < 200.0f
                  ) {

                    publish_float_if_changed(id(thermia_compressor_frequency), compressor_frequency, 0.5f);
                  }

                  if (
                    compressor_max_frequency_ratio >= 0.0f &&
                    compressor_max_frequency_ratio <= 200.0f
                  ) {
                    publish_float_if_changed(
                      id(thermia_compressor_max_frequency_ratio),
                      compressor_max_frequency_ratio,
                      0.5f
                    );
                  }


                  if (
                    compressor_current >= 0.0f &&
                    compressor_current < 100.0f
                  ) {

                    publish_float_if_changed(id(thermia_compressor_current), compressor_current, 0.05f);
                  }


                  if (
                    fan_speed >= 0.0f &&
                    fan_speed < 5000.0f
                  ) {

                    publish_float_if_changed(id(thermia_fan_speed), fan_speed, 1.0f);
                  }


                  if (
                    valve_steps >= 0.0f &&
                    valve_steps < 10000.0f
                  ) {

                    publish_float_if_changed(id(thermia_expansion_valve_steps), valve_steps, 1.0f);
                  }


                  // iTec Eco 8: 0014 is a confirmed status bitfield.
                  const uint16_t eco_outdoor_state_bits =
                    (count > 0x0014) ? reg_u(0x0014) : 0U;
                  const bool compressor_running =
                    (eco_outdoor_state_bits & 0x0001U) != 0;
                  const bool compressor_starting =
                    compressor_frequency > 0.0f && compressor_current < 0.2f;
                  const bool fan_running =
                    (eco_outdoor_state_bits & 0x0004U) != 0;
                  const bool condenser_pump_running =
                    (eco_outdoor_state_bits & 0x0008U) != 0;

                  publish_bool_if_changed(
                    id(thermia_compressor_running),
                    compressor_running
                  );

                  // Heuristic only: during the captured start sequence the
                  // frequency rises before the current register leaves 0.0 A.
                  // Useful diagnostically, but do not treat as a hard fault rule.
                  publish_bool_if_changed(
                    id(thermia_compressor_starting),
                    compressor_starting
                  );

                  publish_bool_if_changed(
                    id(thermia_outdoor_fan_running),
                    fan_running
                  );

                  publish_bool_if_changed(
                    id(thermia_condenser_pump_running),
                    condenser_pump_running
                  );

                  if (count > 0x0015) {
                    const uint16_t operating_state = eco_outdoor_state_bits;
                    const uint16_t status_flags = reg_u(0x0015);

                    // Status flag map from captured operation:
                    //   0x0020 = heating context
                    //   0x0040 = DHW / high-temperature context
                    //   0x0080 = cooling context
                    //   0x0200 = outdoor-unit run-enable acknowledged
                    //
                    // Observed examples:
                    //   0x021 (33)  = heating context, run-enable inactive
                    //   0x041 (65)  = DHW context, run-enable inactive
                    //   0x081 (129) = cooling context, run-enable inactive
                    //   0x221 (545) = heating + run-enable acknowledged
                    //   0x241 (577) = DHW + run-enable acknowledged
                    //   0x281 (641) = cooling + run-enable acknowledged
                    const bool heating_context = (status_flags & 0x0020U) != 0;
                    const bool dhw_context = (status_flags & 0x0040U) != 0;
                    const bool cooling_context = (status_flags & 0x0080U) != 0;
                    const bool run_enable_acknowledged = (status_flags & 0x0200U) != 0;

                    publish_float_if_changed(
                      id(thermia_outdoor_unit_operating_state_raw),
                      float(operating_state),
                      0.5f
                    );

                    publish_float_if_changed(
                      id(thermia_outdoor_unit_status_flags),
                      float(status_flags),
                      0.5f
                    );

                    publish_bool_if_changed(id(thermia_heating_context), heating_context);
                    publish_bool_if_changed(id(thermia_dhw_context), dhw_context);
                    publish_bool_if_changed(id(thermia_cooling_context), cooling_context);

                    // "Context" says which mode is selected/requested.
                    //
                    // "Active" requires:
                    //   - matching mode context from 0015,
                    //   - physical compressor operation (000B > 0 Hz),
                    //   - FC10 0007 overall outdoor-unit cycle request,
                    //   - FC10 0008 immediate outdoor-unit run enable.
                    //
                    // Requiring 0007 + 0008 avoids false mode-active states during
                    // heating <-> DHW handovers and during autonomous recovery
                    // sequences where the compressor can briefly run independently.
                    const bool cycle_request_active =
                      id(thermia_outdoor_unit_command_0007).has_state() &&
                      id(thermia_outdoor_unit_command_0007).state;

                    const bool run_enable_command_active =
                      id(thermia_outdoor_unit_command_0008).has_state() &&
                      id(thermia_outdoor_unit_command_0008).state;

                    publish_bool_if_changed(
                      id(thermia_heating_active),
                      heating_context &&
                      compressor_running &&
                      cycle_request_active &&
                      run_enable_command_active
                    );
                    publish_bool_if_changed(
                      id(thermia_dhw_active),
                      dhw_context &&
                      compressor_running &&
                      cycle_request_active &&
                      run_enable_command_active
                    );
                    publish_bool_if_changed(
                      id(thermia_cooling_active),
                      cooling_context &&
                      compressor_running &&
                      cycle_request_active &&
                      run_enable_command_active
                    );

                    const climate::ClimateAction desired_thermostat_action =
                      (heating_context && compressor_running && cycle_request_active && run_enable_command_active)
                        ? climate::CLIMATE_ACTION_HEATING
                        : ((cooling_context && compressor_running && cycle_request_active && run_enable_command_active)
                            ? climate::CLIMATE_ACTION_COOLING
                            : climate::CLIMATE_ACTION_IDLE);
                    if (id(thermia_room_thermostat).action != desired_thermostat_action) {
                      id(thermia_room_thermostat).action = desired_thermostat_action;
                      id(thermia_room_thermostat).publish_state();
                    }

                    // Keep the existing ESPHome id for compatibility, but give the
                    // entity its corrected meaning in Home Assistant.
                    publish_bool_if_changed(
                      id(thermia_outdoor_unit_enabled),
                      run_enable_acknowledged
                    );

                    // Eco 8: 0014 is a confirmed bitfield, not the XTR sequence enum.
                    // Confirmed over ~20,000 Eco 8 samples:
                    //   0x01 = compressor running
                    //   0x04 = outdoor fan turning
                    //   0x08 = water flow / circulation pump
                    //   0x10 = base bit in normal operation
                    //
                    // Known combinations are rendered below. Other combinations
                    // stay visible through the raw state-bits sensor.
                    const char *unit_state = "Other bitfield state";
                    switch (operating_state) {
                      case 16:
                        unit_state = "Idle";
                        break;
                      case 20:
                        unit_state = "Fan / autonomous sequence";
                        break;
                      case 24:
                        unit_state = "Water flow";
                        break;
                      case 25:
                        unit_state = "Water flow + compressor";
                        break;
                      case 28:
                        unit_state = "Water flow + fan";
                        break;
                      case 29:
                        unit_state = "Water flow + fan + compressor";
                        break;
                      default:
                        unit_state = "Other bitfield state";
                        break;
                    }

                    publish_text_if_changed(
                      id(thermia_outdoor_unit_state),
                      unit_state
                    );

                    const char *status_mode = "Unknown";
                    if (cooling_context) {
                      status_mode = "Cooling";
                    } else if (dhw_context) {
                      status_mode = "DHW / high temperature";
                    } else if (heating_context) {
                      status_mode = "Heating";
                    }

                    publish_text_if_changed(
                      id(thermia_operating_mode),
                      status_mode
                    );
                  }
                }


                fc04_pending[slave] = false;
                return;
              }


              // ===============================================================
              // FC10
              // Write Multiple Registers
              //
              // These frames are transmitted BY THERMIA.
              // The ESP only listens.
              // ===============================================================

              if (
                fc == 0x10 &&
                bytes.size() >= 9
              ) {

                const uint16_t start =
                  u16(bytes, 2);

                const uint16_t count =
                  u16(bytes, 4);

                const uint8_t byte_count =
                  bytes[6];


                if (
                  bytes.size() !=
                  size_t(byte_count) + 9
                ) {

                  return;
                }


                if (
                  byte_count !=
                  count * 2
                ) {

                  return;
                }


                auto reg_s =
                  [&](uint16_t address) -> int16_t {

                    const size_t offset =
                      size_t(address - start);

                    const size_t pos =
                      7 + offset * 2;

                    return s16(bytes, pos);
                  };


                // Send 8-byte FC10 ACK to slave 0x0F before mapping so 33-word pages
                // never miss the controller's ACK window.
                if (slave == 0x0F && id(thermia_0f_ack_emulation)->state && !id(thermia_peer_0f_detected)) {
                  uint8_t ack[8] = {
                    0x0F,
                    0x10,
                    uint8_t((start >> 8) & 0xFF),
                    uint8_t(start & 0xFF),
                    uint8_t((count >> 8) & 0xFF),
                    uint8_t(count & 0xFF),
                    0,
                    0
                  };
                  const uint16_t ack_crc = crc16_modbus(ack, 6);
                  ack[6] = uint8_t(ack_crc & 0xFF);
                  ack[7] = uint8_t((ack_crc >> 8) & 0xFF);

                  delay_microseconds_safe(5000);
                  id(waveshare_rs485_direction).turn_on();
                  delay_microseconds_safe(200);
                  id(thermia_uart).write_array(ack, sizeof(ack));
                  id(thermia_uart).flush();
                  delay_microseconds_safe(1200);
                  id(waveshare_rs485_direction).turn_off();

                  id(thermia_0f_last_tx_ms) = millis();
                  id(thermia_0f_acks_sent)++;
                  ESP_LOGD(
                    "thermia_0f",
                    "Sent 0x0F FC10 ACK: start=0x%04X count=%u (total=%u)",
                    start,
                    count,
                    (unsigned) id(thermia_0f_acks_sent)
                  );
                }


                // Generic mapper: scan complete FC10 write block.
                for (uint16_t i = 0; i < count; i++) {

                  const uint16_t address =
                    uint16_t(start + i);

                  generic_map_update(
                    2,
                    slave,
                    address,
                    reg_s(address)
                  );
                }

                // Outdoor-unit FC10 command block sent by the Thermia controller.
                //
                // Current functional map:
                //   0001 = commanded/live target temperature x0.1 °C
                //   0004 = operating/request mode: 1 heating, 2 DHW, 3 cooling
                //   0006 = periodic 0/1/2 state/counter; ~2 h steps observed, purpose unknown
                //   0007 = overall outdoor-unit cycle / sequence request; can stay ON across mode handovers
                //   0008 = immediate outdoor-unit run enable; can toggle OFF/ON during a heating<->DHW handover
                if (slave == 0x1E) {
                  if (start <= 0x0001 && (uint32_t(start) + uint32_t(count)) > 0x0001) {
                    const float commanded_target = float(reg_s(0x0001)) / 10.0f;
                    if (commanded_target > -50.0f && commanded_target < 150.0f) {
                      publish_float_if_changed(
                        id(thermia_commanded_target_temperature),
                        commanded_target,
                        0.05f
                      );
                    }
                  }

                  if (start <= 0x0004 && (uint32_t(start) + uint32_t(count)) > 0x0004) {
                    const int16_t mode_raw = reg_s(0x0004);
                    publish_float_if_changed(
                      id(thermia_mode_request_raw),
                      float(mode_raw),
                      0.5f
                    );

                    const char *mode_text = "Unknown";
                    if (mode_raw == 1) {
                      mode_text = "Heating";
                    } else if (mode_raw == 2) {
                      mode_text = "DHW / high temperature";
                    } else if (mode_raw == 3) {
                      mode_text = "Cooling";
                    }

                    publish_text_if_changed(
                      id(thermia_mode_request),
                      mode_text
                    );
                  }

                  if (start <= 0x0007 && (uint32_t(start) + uint32_t(count)) > 0x0007) {
                    publish_bool_if_changed(
                      id(thermia_outdoor_unit_command_0007),
                      reg_s(0x0007) != 0
                    );
                  }

                  if (start <= 0x0008 && (uint32_t(start) + uint32_t(count)) > 0x0008) {
                    publish_bool_if_changed(
                      id(thermia_outdoor_unit_command_0008),
                      reg_s(0x0008) != 0
                    );
                  }
                }


                // =============================================================
                // SLAVE 0x0F
                // Heating configuration block
                //
                // 03E8 Heating curve
                // 03E9 Heating MIN
                // 03EA Heating MAX
                // 03EB Curve +5
                // 03EC Curve 0
                // 03ED Curve -5
                // 03EE Heating stop
                // 03EF Reduced temperature
                // 03F0 Room factor
                // 03F4 Room setpoint state / DCM semantic field
                // =============================================================

                if (
                  slave == 0x0F &&
                  start == 0x03E8 &&
                  count >= 13
                ) {

                  // -----------------------------------------------------------
                  // Mapper: slave 0x0F FC10 block 0x03E8..0x03F5
                  // -----------------------------------------------------------

                  if (count >= 0x0E) {
                    for (uint16_t addr = 0x03E8; addr <= 0x03F5; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr - 0x03E8);

                      if (mapper_initialized) {
                        log_change(
                          "S0F_FC10",
                          addr,
                          prev_03e8_block[idx],
                          v
                        );
                      }

                      prev_03e8_block[idx] = v;
                    }
                  }

                  const float heating_curve = float(reg_s(0x03E8));
                  const float heating_min = float(reg_s(0x03E9));
                  const float heating_max = float(reg_s(0x03EA));
                  const float curve_plus5 = float(reg_s(0x03EB));
                  const float curve_zero = float(reg_s(0x03EC));
                  const float curve_minus5 = float(reg_s(0x03ED));
                  const float heating_stop = float(reg_s(0x03EE));
                  const float reduced_temperature = float(reg_s(0x03EF));
                  const float room_factor = float(reg_s(0x03F0));
                  const int16_t high_power = reg_s(0x03F3);
                  const float room_setpoint_mirror = float(reg_s(0x03F4));

                  // Persist only values received from the real Thermia settings block.
                  id(thermia_heating_curve_saved) = heating_curve;
                  id(thermia_heating_min_saved) = heating_min;
                  id(thermia_heating_max_saved) = heating_max;
                  id(thermia_curve_plus5_saved) = curve_plus5;
                  id(thermia_curve_zero_saved) = curve_zero;
                  id(thermia_curve_minus5_saved) = curve_minus5;
                  id(thermia_heating_stop_saved) = heating_stop;
                  id(thermia_reduced_temperature_saved) = reduced_temperature;
                  id(thermia_room_factor_saved) = room_factor;
                  id(thermia_room_setpoint_mirror_saved) = room_setpoint_mirror;
                  id(thermia_settings_cache_valid) = true;

                  publish_float_if_changed(id(thermia_heating_curve), heating_curve, 0.5f);
                  publish_float_if_changed(id(thermia_heating_min), heating_min, 0.5f);
                  publish_float_if_changed(id(thermia_heating_max), heating_max, 0.5f);

                  // Confirmed heating-curve correction points.
                  publish_float_if_changed(id(thermia_curve_plus5), curve_plus5, 0.5f);
                  publish_float_if_changed(id(thermia_curve_zero), curve_zero, 0.5f);
                  publish_float_if_changed(id(thermia_curve_minus5), curve_minus5, 0.5f);

                  publish_float_if_changed(id(thermia_heating_stop), heating_stop, 0.5f);
                  publish_float_if_changed(id(thermia_reduced_temperature), reduced_temperature, 0.5f);
                  publish_float_if_changed(id(thermia_room_factor), room_factor, 0.5f);

                  // 03F4 follows the controller room setpoint in this FC16 page.
                  // EXP343-352 later proved that the same field can be changed
                  // semantically through the native Online/DCM desired-page flow.
                  // This RX-only build only observes/publishes it; it performs no
                  // direct register write or DCM response. Keep the legacy
                  // "Room Setpoint Mirror" entity name for HA compatibility.
                  publish_float_if_changed(id(thermia_room_setpoint_mirror), room_setpoint_mirror, 0.5f);

                  // Eco 8 A/B-confirmed: 03F3 / decimal 1011 is HIGH POWER.
                  if (high_power == 0 || high_power == 1) {
                    publish_bool_if_changed(
                      id(thermia_high_power_setting),
                      high_power == 1
                    );
                  }
                }

                // =============================================================
                // iTec Eco COMPATIBILITY SETTINGS PAGES — RX ONLY
                // 042E/042F are supported by genuine Eco 5 Online captures.
                // Other XTR-v29 fields remain disabled candidates unless Eco-confirmed.
                // These are controller-originated FC16 pages. No response/TX.
                // =============================================================

                if (slave == 0x0F && start == 0x042E && count >= 15) {
                  const int16_t enabled = reg_s(0x042E);
                  const int16_t mode = reg_s(0x042F);
                  const int16_t startup_ht = reg_s(0x0433);
                  const int16_t heating_time = reg_s(0x0434);

                  if (enabled == 0 || enabled == 1) {
                    id(thermia_dhw_enabled_saved) = (enabled == 1);
                    publish_bool_if_changed(id(thermia_dhw_enabled_setting), enabled == 1);
                  }

                  const char *mode_str = "Unknown";
                  if (mode == 0) mode_str = "Comfort";
                  else if (mode == 1) mode_str = "Eco";
                  else if (mode == 2) mode_str = "Super-Eco";
                  if (mode >= 0 && mode <= 2) {
                    id(thermia_dhw_mode_saved) = mode;
                    id(thermia_dhw_cache_valid) = true;
                  }
                  publish_text_if_changed(id(thermia_dhw_mode_setting), mode_str);

                  if (startup_ht >= 0 && startup_ht <= 120) {
                    id(thermia_startup_ht_saved) = float(startup_ht);
                    publish_float_if_changed(id(thermia_startup_ht_setting), float(startup_ht), 0.5f);
                  }
                  if (heating_time >= 0 && heating_time <= 180) {
                    id(thermia_heating_time_saved) = float(heating_time);
                    publish_float_if_changed(id(thermia_heating_time_setting), float(heating_time), 0.5f);
                  }
                }

                if (slave == 0x0F && start == 0x0442 && count >= 13) {
                  const int16_t enabled = reg_s(0x0442);
                  const int16_t desired_temp = reg_s(0x0443);
                  const int16_t active_above = reg_s(0x0445);
                  const int16_t cooling_time = reg_s(0x0449);
                  const int16_t room_sensor = reg_s(0x044C);
                  const int16_t hyst_low = reg_s(0x044D);
                  const int16_t hyst_high = reg_s(0x044E);

                  if (enabled == 0 || enabled == 1)
                    publish_bool_if_changed(id(thermia_cooling_enabled_setting), enabled == 1);
                  if (desired_temp >= -20 && desired_temp <= 80)
                    publish_float_if_changed(id(thermia_cooling_desired_temperature_setting), float(desired_temp), 0.5f);
                  if (active_above >= -20 && active_above <= 80)
                    publish_float_if_changed(id(thermia_cooling_active_above_setting), float(active_above), 0.5f);
                  if (cooling_time >= 0 && cooling_time <= 180)
                    publish_float_if_changed(id(thermia_cooling_time_setting), float(cooling_time), 0.5f);
                  if (room_sensor == 0 || room_sensor == 1)
                    publish_bool_if_changed(id(thermia_cooling_room_sensor_setting), room_sensor == 1);
                  if (hyst_low >= 0 && hyst_low <= 200)
                    publish_float_if_changed(id(thermia_cooling_room_hyst_low_setting), float(hyst_low) / 10.0f, 0.05f);
                  if (hyst_high >= 0 && hyst_high <= 200)
                    publish_float_if_changed(id(thermia_cooling_room_hyst_high_setting), float(hyst_high) / 10.0f, 0.05f);
                }

                if (slave == 0x0F && start == 0x0546 && count >= 20) {
                  const int16_t mode = reg_s(0x0553);
                  if (mode == 0) publish_text_if_changed(id(thermia_operation_mode_setting), "Off");
                  else if (mode == 1) publish_text_if_changed(id(thermia_operation_mode_setting), "Auto");
                  else if (mode == 2) publish_text_if_changed(id(thermia_operation_mode_setting), "Compressor");
                  else if (mode == 3) publish_text_if_changed(id(thermia_operation_mode_setting), "Auxiliary Heater");
                  else if (mode == 4) publish_text_if_changed(id(thermia_operation_mode_setting), "Hot Water");
                  else publish_text_if_changed(id(thermia_operation_mode_setting), "Unknown");
                }

                return;
              }


              // ===============================================================
              // FC17 REQUEST
              // Read / Write Multiple Registers
              // ===============================================================

              if (
                fc == 0x17 &&
                bytes.size() >= 13
              ) {

                const uint16_t read_start =
                  u16(bytes, 2);

                const uint16_t read_count =
                  u16(bytes, 4);

                const uint16_t write_start =
                  u16(bytes, 6);

                const uint16_t write_count =
                  u16(bytes, 8);

                const uint8_t byte_count =
                  bytes[10];

                const size_t expected_size =
                  size_t(byte_count) + 13;


                if (
                  bytes.size() == expected_size &&
                  byte_count == write_count * 2
                ) {

                  fc17_start[slave] =
                    read_start;

                  fc17_count[slave] =
                    read_count;

                  fc17_pending[slave] =
                    true;


                  auto write_reg_s =
                    [&](uint16_t address) -> int16_t {

                      const size_t offset =
                        size_t(address - write_start);

                      const size_t pos =
                        11 + offset * 2;

                      return s16(bytes, pos);
                    };


                  // Generic mapper: scan complete FC17 write part.
                  for (uint16_t i = 0; i < write_count; i++) {

                    const uint16_t address =
                      uint16_t(write_start + i);

                    generic_map_update(
                      3,
                      slave,
                      address,
                      write_reg_s(address)
                    );
                  }


                  // ===========================================================
                  // MAPPER: FC17 write blocks
                  // ===========================================================

                  if (
                    slave == 0x0A &&
                    write_start <= 0xB3C4 &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) >= 0xB3C7
                  ) {

                    for (uint16_t addr = 0xB3C4; addr <= 0xB3C6; addr++) {
                      const int16_t v = write_reg_s(addr);
                      const size_t idx = size_t(addr - 0xB3C4);

                      if (mapper_initialized) {
                        log_change(
                          "S0A_FC17W",
                          addr,
                          prev_b3c4_block[idx],
                          v
                        );
                      }

                      prev_b3c4_block[idx] = v;
                    }

                    // B3C6 is an unresolved room-sensor control/status word.
                    // Values 0 / 2 have been observed, but "boost/enhanced" is
                    // not sufficiently proven. Keep the binary entity diagnostic
                    // and neutral: ON only means B3C6 is non-zero.
                    publish_bool_if_changed(
                      id(thermia_room_boost_request),
                      write_reg_s(0xB3C6) != 0
                    );
                  }


                  if (
                    slave == 0x02 &&
                    write_start <= 0xA80C &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) >= 0xA813
                  ) {

                    for (uint16_t addr = 0xA80C; addr <= 0xA812; addr++) {
                      const int16_t v = write_reg_s(addr);
                      const size_t idx = size_t(addr - 0xA80C);

                      if (mapper_initialized) {
                        log_change(
                          "S02_FC17W",
                          addr,
                          prev_a80c_block[idx],
                          v
                        );
                      }

                      prev_a80c_block[idx] = v;
                    }

                    const uint16_t a80c = uint16_t(write_reg_s(0xA80C));
                    const uint16_t a80e = uint16_t(write_reg_s(0xA80E));

                    publish_float_if_changed(
                      id(thermia_controller_state_a80c),
                      float(a80c),
                      0.5f
                    );

                    // Eco 8 manual-test mapping: A80C is an output bitfield.
                    // bit 0 = DHW reversing valve; bit 6 = controller active.
                    // Keep the text summary neutral because other output bits may coexist.
                    const bool eco_controller_active = (a80c & 0x0040U) != 0;
                    const bool eco_dhw_valve = (a80c & 0x0001U) != 0;
                    const char *controller_context = "Controller inactive";
                    if (eco_controller_active && eco_dhw_valve) {
                      controller_context = "Active / DHW valve";
                    } else if (eco_controller_active) {
                      controller_context = "Active / non-DHW";
                    } else if (eco_dhw_valve) {
                      controller_context = "DHW valve / controller inactive";
                    }
                    publish_text_if_changed(
                      id(thermia_controller_context),
                      controller_context
                    );

                    publish_float_if_changed(
                      id(thermia_controller_state_a80e),
                      float(a80e),
                      0.5f
                    );

                    // Keep these raw bit sensors neutral. A80C is primarily
                    // treated as a controller context/sequence value, while A80E
                    // behaves as a controller/accessory status bitfield.
                    publish_bool_if_changed(id(thermia_a80c_flag_0x10), (a80c & 0x0010U) != 0);
                    publish_bool_if_changed(id(thermia_a80c_flag_0x20), (a80c & 0x0020U) != 0);
                    publish_bool_if_changed(id(thermia_a80e_flag_0x08), (a80e & 0x0008U) != 0);
                    publish_bool_if_changed(id(thermia_a80e_flag_0x20), (a80e & 0x0020U) != 0);
                  }


                  // ===========================================================
                  // SLAVE 0x02 - Eco condenser/circulation-pump speed (A80F)
                  //
                  // iTec Eco 8 manual-test A/B confirmation:
                  // A80F / decimal 43023 follows the CONDENSER PUMP setting
                  // step-for-step. 5 = stopped, 10 = idle; active values are
                  // expressed as controller pump-speed percentages.
                  // ===========================================================

                  if (
                    slave == 0x02 &&
                    write_start <= 0xA80F &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) > 0xA80F
                  ) {
                    publish_float_if_changed(id(thermia_demand_raw), float(write_reg_s(0xA80F)), 0.5f);
                  }


                  // ===========================================================
                  // SLAVE 0x0A
                  //
                  // B3C4 = outdoor temperature pushed to room sensor
                  // B3C5 = controller-propagated / confirmed room setpoint
                  // B3C6 = hot-water top-up status (0 = idle, 2 = active)
                  // ===========================================================

                  if (
                    slave == 0x0A &&
                    write_start <= 0xB3C5 &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) > 0xB3C5
                  ) {

                    const float room_setpoint =
                      float(
                        write_reg_s(0xB3C5)
                      );


                    if (
                      room_setpoint >= 5.0f &&
                      room_setpoint <= 40.0f
                    ) {

                      publish_float_if_changed(id(thermia_room_setpoint), room_setpoint, 0.5f);

                      const int16_t current_sp_int = int16_t(roundf(room_setpoint));

                      // If a setpoint change was requested, check if master has adopted it
                      if (id(thermia_pending_setpoint_request) > 0) {
                        if (current_sp_int == id(thermia_pending_setpoint_request)) {
                          ESP_LOGI(
                            "thermia_setpoint",
                            "Heat pump confirmed new room setpoint: %d C! Clearing pending request.",
                            current_sp_int
                          );
                          id(thermia_pending_setpoint_request) = 0;
                          id(thermia_setpoint_request_retries) = 0;
                        }
                      } else {
                        // Keep Home Assistant target number & thermostat entities in sync with panel adjustments
                        if (id(thermia_target_room_setpoint)->has_state()) {
                          if (int16_t(roundf(id(thermia_target_room_setpoint)->state)) != current_sp_int) {
                            id(thermia_target_room_setpoint)->publish_state(float(current_sp_int));
                          }
                        } else {
                          id(thermia_target_room_setpoint)->publish_state(float(current_sp_int));
                        }
                        if (isnan(id(thermia_room_thermostat).target_temperature) ||
                            int16_t(roundf(id(thermia_room_thermostat).target_temperature)) != current_sp_int) {
                          id(thermia_room_thermostat).target_temperature = float(current_sp_int);
                          id(thermia_room_thermostat).publish_state();
                        }
                      }
                    }
                  }

                  if (
                    slave == 0x0A &&
                    write_start <= 0xB3C6 &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) > 0xB3C6
                  ) {
                    const int16_t topup_status = write_reg_s(0xB3C6);
                    publish_bool_if_changed(id(thermia_dhw_topup_active), (topup_status == 2));
                  }


                  // ===========================================================
                  // SLAVE 0x0A ROOM SENSOR EMULATION RESPONSE
                  // ===========================================================
                  if (
                    slave == 0x0A &&
                    read_start == 0xB3B0 &&
                    read_count == 3 &&
                    write_start == 0xB3C4 &&
                    write_count == 3
                  ) {
                    if (id(thermia_room_sensor_emulation)->state && !id(thermia_peer_room_sensor_detected)) {
                      const uint32_t now_tx = millis();
                      const uint32_t timeout_ms = uint32_t(id(thermia_room_temp_timeout_min)->state) * 60000UL;
                      const uint32_t last_update = id(thermia_room_temp_last_update_ms);
                      const bool timed_out = (timeout_ms > 0 && last_update > 0 && (now_tx - last_update) > timeout_ms);

                      if (!timed_out && id(thermia_room_temp_input)->has_state()) {
                        const float cur_temp = id(thermia_room_temp_input)->state;
                        if (!isnan(cur_temp) && cur_temp >= 5.0f && cur_temp <= 35.0f) {
                          const int16_t raw_temp = int16_t(roundf(cur_temp * 10.0f));

                          int16_t req_sp = 0;
                          if (id(thermia_pending_setpoint_request) > 0) {
                            req_sp = id(thermia_pending_setpoint_request);
                            id(thermia_setpoint_request_retries)++;
                            if (id(thermia_setpoint_request_retries) > 5) {
                              ESP_LOGW(
                                "thermia_setpoint",
                                "Setpoint change request %d C was not acknowledged after 5 cycles. Clearing request.",
                                req_sp
                              );
                              id(thermia_pending_setpoint_request) = 0;
                              id(thermia_setpoint_request_retries) = 0;
                            }
                          }

                          int16_t topup = 0;
                          if (id(thermia_pending_dhw_topup)) {
                            topup = 1;
                            id(thermia_pending_dhw_topup) = false;
                            ESP_LOGI("thermia_dhw", "Transmitted hot-water top-up trigger (1) in 0x0A response!");
                          }

                          uint8_t resp[11];
                          resp[0] = 0x0A;
                          resp[1] = 0x17;
                          resp[2] = 0x06;
                          resp[3] = uint8_t((raw_temp >> 8) & 0xFF);
                          resp[4] = uint8_t(raw_temp & 0xFF);
                          resp[5] = uint8_t((req_sp >> 8) & 0xFF);
                          resp[6] = uint8_t(req_sp & 0xFF);
                          resp[7] = uint8_t((topup >> 8) & 0xFF);
                          resp[8] = uint8_t(topup & 0xFF);

                          const uint16_t crc_val = crc16_modbus(resp, 9);
                          resp[9] = uint8_t(crc_val & 0xFF);
                          resp[10] = uint8_t((crc_val >> 8) & 0xFF);

                          // Modbus RTU T3.5 inter-frame spacing: wait ~3.8 ms
                          delay_microseconds_safe(3800);

                          // Assert RS485 Driver Enable (HIGH)
                          id(waveshare_rs485_direction).turn_on();
                          delay_microseconds_safe(200);

                          // Transmit response
                          id(thermia_uart).write_array(resp, sizeof(resp));
                          id(thermia_uart).flush();

                          // Hold until stop bit completes, then return transceiver to receive mode
                          delay_microseconds_safe(1200);
                          id(waveshare_rs485_direction).turn_off();

                          id(thermia_room_sensor_last_tx_ms) = now_tx;
                          id(thermia_room_sensor_responses_sent)++;
                          id(thermia_room_sensor_responses_sent_sensor)->publish_state(float(id(thermia_room_sensor_responses_sent)));
                          publish_float_if_changed(id(thermia_room_sensor_last_sent_temp_sensor), cur_temp, 0.05f);
                          publish_float_if_changed(id(thermia_room_temperature), cur_temp, 0.05f);

                          ESP_LOGD(
                            "thermia_room",
                            "Transmitted 0x0A room sensor response: %.1f C (raw=%d), req_sp=%d, topup=%d",
                            cur_temp, raw_temp, req_sp, topup
                          );
                        }
                      }
                    }
                  }

                  return;
                }
              }


              // ===============================================================
              // FC17 RESPONSE
              // ===============================================================

              if (
                fc == 0x17 &&
                fc17_pending[slave] &&
                bytes.size() >= 5 &&
                bytes.size() ==
                  size_t(bytes[2]) + 5
              ) {

                const uint16_t start =
                  fc17_start[slave];

                const uint16_t count =
                  fc17_count[slave];

                const uint8_t byte_count =
                  bytes[2];


                if (
                  byte_count !=
                  count * 2
                ) {

                  fc17_pending[slave] = false;
                  return;
                }


                auto reg_s =
                  [&](uint16_t address) -> int16_t {

                    const size_t offset =
                      size_t(address - start);

                    const size_t pos =
                      3 + offset * 2;

                    return s16(bytes, pos);
                  };


                // Generic mapper: scan complete FC17 read response block.
                for (uint16_t i = 0; i < count; i++) {

                  const uint16_t address =
                    uint16_t(start + i);

                  generic_map_update(
                    4,
                    slave,
                    address,
                    reg_s(address)
                  );
                }


                // =============================================================
                // SLAVE 0x02
                //
                // A7F8 Supply temperature
                // A7FB DHW upper
                // A7FC DHW main
                // A7FD SG discriminator 1
                // A802 Outdoor temperature
                // A803 SG discriminator 2
                // =============================================================

                if (
                  slave == 0x02 &&
                  start == 0xA7F8 &&
                  count >= 15
                ) {

                  // -----------------------------------------------------------
                  // Mapper: slave 0x02 FC17 read block 0xA7F8..0xA806
                  // -----------------------------------------------------------

                  if (count >= 0x0F) {
                    for (uint16_t addr = 0xA7F8; addr <= 0xA806; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr - 0xA7F8);

                      if (mapper_initialized) {
                        log_change(
                          "S02_FC17R",
                          addr,
                          prev_a7f8_block[idx],
                          v
                        );
                      }

                      prev_a7f8_block[idx] = v;
                    }
                  }

                  const int16_t supply =
                    reg_s(0xA7F8);

                  const int16_t dhw_upper =
                    reg_s(0xA7FB);

                  const int16_t dhw =
                    reg_s(0xA7FC);

                  const int16_t outdoor =
                    reg_s(0xA802);

                  const int16_t sg_a =
                    reg_s(0xA7FD);

                  const int16_t sg_b =
                    reg_s(0xA803);


                  // ===========================================================
                  // DIAGNOSTIC: complete A7F8 block
                  // Useful to verify whether A7F8 really changes with supply.
                  // ===========================================================

                  ESP_LOGD(
                    "thermia_a7f8",
                    "A7F8=%d A7F9=%d A7FA=%d A7FB=%d A7FC=%d A7FD=%d "
                    "A7FE=%d A7FF=%d A800=%d A801=%d A802=%d A803=%d "
                    "A804=%d A805=%d A806=%d",
                    reg_s(0xA7F8),
                    reg_s(0xA7F9),
                    reg_s(0xA7FA),
                    reg_s(0xA7FB),
                    reg_s(0xA7FC),
                    reg_s(0xA7FD),
                    reg_s(0xA7FE),
                    reg_s(0xA7FF),
                    reg_s(0xA800),
                    reg_s(0xA801),
                    reg_s(0xA802),
                    reg_s(0xA803),
                    reg_s(0xA804),
                    reg_s(0xA805),
                    reg_s(0xA806)
                  );

                  ESP_LOGD(
                    "thermia_supply",
                    "Supply candidate A7F8 raw=%d -> %.1f C",
                    supply,
                    float(supply)
                  );


                  if (
                    supply != -1000 &&
                    supply > -50 &&
                    supply < 150
                  ) {

                    publish_float_if_changed(id(thermia_supply_temperature), float(supply), 0.5f);
                  }


                  if (
                    dhw_upper != -1000 &&
                    dhw_upper > 0 &&
                    dhw_upper < 100
                  ) {

                    publish_float_if_changed(id(thermia_dhw_upper_temperature), float(dhw_upper), 0.5f);
                  }


                  if (
                    dhw != -1000 &&
                    dhw > 0 &&
                    dhw < 100
                  ) {

                    publish_float_if_changed(id(thermia_dhw_temperature), float(dhw), 0.5f);
                  }


                  if (
                    outdoor != -1000 &&
                    outdoor > -50 &&
                    outdoor < 70
                  ) {

                    publish_float_if_changed(id(thermia_outdoor_temperature), float(outdoor), 0.5f);
                  }


                  if (
                    dhw_upper != -1000 &&
                    dhw != -1000
                  ) {

                    publish_float_if_changed(
                      id(thermia_dhw_delta_t),
                      float(dhw_upper - dhw),
                      0.5f
                    );
                  }


                  // ===========================================================
                  // SG MODE
                  //
                  // Controlled tests:
                  //
                  // A7FD    A803     SG input state from controlled tests
                  //
                  // -1000   232      Blocked  (SG 1-0)
                  //  1000   224      Normal   (SG 0-0)
                  //  1000   232      Enhanced (SG 0-1)
                  // -1000   224      Peak     (SG 1-1)
                  // ===========================================================

                  ESP_LOGD(
                    "thermia_sg",
                    "SG discriminators: A7FD=%d A803=%d",
                    sg_a,
                    sg_b
                  );


                  // Corrected from repeated physical SG1/SG2 test:
                  // 00 -> A7FD=-1000, A803=224 -> Normal
                  // 10 -> A7FD=-1000, A803=232 -> Blocked
                  // 01 -> A7FD= 1000, A803=224 -> Enhanced
                  // 11 -> A7FD= 1000, A803=232 -> Peak
                  //
                  // Intermediate A7FD values are treated as transitions.

                  if (
                    sg_a == -1000 &&
                    sg_b == 224
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Normal (0-0)");
                  }

                  else if (
                    sg_a == -1000 &&
                    sg_b == 232
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Blocked (1-0)");
                  }

                  else if (
                    sg_a == 1000 &&
                    sg_b == 224
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Enhanced (0-1)");
                  }

                  else if (
                    sg_a == 1000 &&
                    sg_b == 232
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Peak (1-1)");
                  }

                  else {

                    // Hold the last valid state during the short transition.
                    // Do not publish a misleading fifth SG mode.
                  }
                }


                // =============================================================
                // SLAVE 0x0A
                //
                // B3B0 = room temperature x0.1 °C
                // =============================================================

                if (
                  slave == 0x0A &&
                  start == 0xB3B0 &&
                  count >= 1
                ) {

                  // Check if this response came from another physical device on the bus
                  const uint32_t now_resp = millis();
                  const uint32_t last_tx = id(thermia_room_sensor_last_tx_ms);
                  if (last_tx == 0 || (now_resp - last_tx) > 500) {
                    if (!id(thermia_peer_room_sensor_detected)) {
                      id(thermia_peer_room_sensor_detected) = true;
                      ESP_LOGW("thermia_room", "External peer room sensor detected on slave 0x0A! Disabling emulation.");
                      id(thermia_room_sensor_emulation)->publish_state(false);
                      id(thermia_room_sensor_status)->publish_state("BLOCKED: External sensor on bus");
                    }
                  }

                  // -----------------------------------------------------------
                  // Mapper: slave 0x0A FC17 read block 0xB3B0..0xB3B2
                  // -----------------------------------------------------------

                  if (count >= 3) {
                    for (uint16_t addr = 0xB3B0; addr <= 0xB3B2; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr - 0xB3B0);

                      if (mapper_initialized) {
                        log_change(
                          "S0A_FC17R",
                          addr,
                          prev_b3b0_block[idx],
                          v
                        );
                      }

                      prev_b3b0_block[idx] = v;
                    }
                  }

                  mapper_initialized = true;

                  const float room_temperature =
                    float(
                      reg_s(0xB3B0)
                    ) / 10.0f;


                  if (
                    room_temperature > -20.0f &&
                    room_temperature < 60.0f
                  ) {

                    publish_float_if_changed(id(thermia_room_temperature), room_temperature, 0.05f);
                  }
                }


                fc17_pending[slave] = false;
                return;
              }

          };

          while (true) {
            if (pending.size() < 5) break;

            uint8_t slave = pending[0];
            uint8_t fn = pending[1];
            bool known_fn =
              fn == 0x03 || fn == 0x04 || fn == 0x10 || fn == 0x17 ||
              (fn & 0x80);
            if (!known_slave(slave) || !known_fn) {
              pending.erase(pending.begin());
              continue;
            }

            std::vector<size_t> candidates;
            if (fn & 0x80) candidates.push_back(5);
            if (fn == 0x03) {
              candidates.push_back(8);
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2]));
            }
            if (fn == 0x04) {
              candidates.push_back(8);
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2]));
            }
            if (fn == 0x10) {
              candidates.push_back(8);
              if (pending.size() >= 7 && pending[6] <= 240)
                candidates.push_back(9 + size_t(pending[6]));
            }
            if (fn == 0x17) {
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2]));
              if (pending.size() >= 11 && pending[10] <= 240)
                candidates.push_back(13 + size_t(pending[10]));
            }

            std::sort(candidates.begin(), candidates.end());
            candidates.erase(std::unique(candidates.begin(), candidates.end()), candidates.end());

            size_t matched = 0;
            bool waiting = false;
            for (size_t len : candidates) {
              if (len < 5 || len > 256) continue;
              if (pending.size() < len) { waiting = true; continue; }
              if (valid_crc(len)) { matched = len; break; }
            }

            if (matched) {
              std::vector<uint8_t> frame(pending.begin(), pending.begin() + matched);
              pending.erase(pending.begin(), pending.begin() + matched);
              process_frame(frame);
              continue;
            }

            if (waiting) break;

            ESP_LOGW("thermia_stream", "CRC resync at 0x%02X 0x%02X", slave, fn);
            pending.erase(pending.begin());
          }

          if (pending.size() > 512) {
            ESP_LOGW("thermia_stream", "Dropping pending buffer (%u bytes)",
                     (unsigned) pending.size());
            pending.clear();
          }

