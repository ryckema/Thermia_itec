# =============================================================================
# PERIODIC BUS HEALTH CHECK
# =============================================================================

interval:
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t last = id(thermia_last_valid_frame_ms);
          if (last == 0 || (millis() - last) > 10000UL) {
            if (!id(thermia_bus_healthy)->has_state() || id(thermia_bus_healthy)->state) {
              id(thermia_bus_healthy)->publish_state(false);
            }
          }

          // Update room sensor emulation status
          if (id(thermia_peer_room_sensor_detected)) {
            id(thermia_room_sensor_status)->publish_state("BLOCKED: External sensor on bus");
          } else if (!id(thermia_room_sensor_emulation)->state) {
            id(thermia_room_sensor_status)->publish_state("DISABLED");
          } else {
            const uint32_t now = millis();
            const uint32_t timeout_ms = uint32_t(id(thermia_room_temp_timeout_min)->state) * 60000UL;
            const uint32_t last_update = id(thermia_room_temp_last_update_ms);
            if (timeout_ms > 0 && last_update > 0 && (now - last_update) > timeout_ms) {
              id(thermia_room_sensor_status)->publish_state("TIMEOUT: Stale HA data");
            } else if (last_update == 0) {
              id(thermia_room_sensor_status)->publish_state("WAITING: No HA data yet");
            } else {
              id(thermia_room_sensor_status)->publish_state("ACTIVE");
            }
          }
