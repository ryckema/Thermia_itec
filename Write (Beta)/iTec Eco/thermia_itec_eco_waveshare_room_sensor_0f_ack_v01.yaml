    max_value: 30.0
    step: 1.0
    unit_of_measurement: "°C"
    mode: BOX
    optimistic: true
    restore_value: true
    initial_value: 20.0
    set_action:
      - lambda: |-
          int target = int(roundf(x));
          if (target < 10) target = 10;
          if (target > 30) target = 30;
          if (isnan(id(thermia_room_thermostat).target_temperature) ||
              int(roundf(id(thermia_room_thermostat).target_temperature)) != target) {
            id(thermia_room_thermostat).target_temperature = float(target);
            id(thermia_room_thermostat).publish_state();
          }
          id(thermia_pending_setpoint_request) = int16_t(target);
          id(thermia_setpoint_request_retries) = 0;
          ESP_LOGI("thermia_setpoint", "Staged room setpoint change request to %d C", target);


