# ==============================================================================
# THERMIA iTec XTR M - WRITE (BETA) v2.1
# ==============================================================================
#
# PURPOSE
# - Beta build intended for long-running use, derived from the locally proven Thermia DCM write path,
#   EXP355 controller-session recovery, and EXP357 reusable stale-cache refresh/write validation.
# - Preserves the complete read-only Thermia/Home Assistant functionality from
#   the experimental lineage while enabling ONE proven writable setting:
#     Room Setpoint = register 03F4 inside controller page 03E8/count14.
#
# PROVEN LOCAL WRITE MODEL
# - Persistent Online/DCM runtime service on slave 0x0F.
# - Idle 0708 response: W0..W5 = 0000,0000,0000,0000,0000,0006.
# - Fresh-current-page request for 03E8: W3 bit0 with W1=0:
#     0F030C000000000000000100000006A0B6
# - Desired-page selector for 03E8: W1 bit0 + W3 bit0:
#     0F030C000000010000000100000006AD26
# - Controller FC03 03E8/count14 is answered from the latest fresh controller
#   page with exactly one changed word: 03F4.
# - Exact controller FC16 03E8/count14 republish confirms application and
#   becomes the source page for the next write.
# - Native Thermia front-display changes update the same cache.
# - Qualified stage-40 runtime can recover from one controller power-cycle per ESP boot:
#     >=5 s valid-bus silence -> invalidate old semantic cache -> fresh guarded bootstrap
#     -> one locally proven replay response -> full ordered initial sync -> fresh runtime qualification.
#
# PRODUCTION-BETA CHANGES FROM Thermia DCM
# - Removes the one-refresh-per-boot test budget: EXP357 locally proved a second stale-cache
#   W3-bit0 refresh and subsequent confirmed semantic write in the same ESP boot.
# - Removes the eight-semantic-response test budget: transactions remain
#   serialized and individually guarded instead of being boot-count limited.
# - Promotes long-running counters to uint32_t.
# - Keeps explicit Apply semantics: changing the desired number alone does NOT
#   transmit a semantic write.
# - Removes the experiment Abort button from Home Assistant.
# - Renames user-facing Thermia DCM controls/status to Thermia DCM / Room Setpoint.
# - Experiment-only diagnostics remain available but are disabled by default.
# - Normal runtime traces are DEBUG; write lifecycle events are INFO/WARN.
#
# SAFETY / LIMITS
# - ONLY 03F4 is writable in this build.
# - Requested and current values must be whole degrees in 10..30 °C.
# - No page is seeded as write-eligible at boot.
# - Stale/missing page (>300 s) must be refreshed from the controller first.
# - One semantic transaction at a time.
# - Desired page changes exactly one word (03F4).
# - Controller republish must match the desired page with zero extra deltas.
# - Unknown/session-conflicting traffic remains fail-closed.
# - W5=0006 is a proven working runtime value; its abstract meaning is unknown.
# - Controller recovery is locally proven only for one controller power-cycle while the ESP
#   remains powered. A second >=5 s bus-loss event in the same ESP boot fails closed.
# - The fixed 16-byte 071C/0730 response is a locally proven replay on this XTR M,
#   not the native Thermia/Danfoss challenge-response algorithm. Genuine gateway
#   captures show that native responses vary by challenge/session.
#
# EVIDENCE NOTE
# - EXP355: COMPLETE / POSITIVE for controller cold-reboot recovery without ESP reboot.
# - EXP357: COMPLETE / POSITIVE; two stale-cache refreshes were confirmed in one ESP boot,
#   and the second refresh was followed by an exact controller-confirmed 03F4 write.
# - v2.1 hardening is code-only: runtime 04A6 stays capture-only, unsupported 0834 is never ACKed,
#   085F ACKs are payload-qualified, and runtime readiness is published only after qualification.
#   These hardening changes require EXP358 regression before promotion beyond beta.
# ==============================================================================
substitutions:
  device_name: "thermia-itec-xtr-m"
  friendly_name: "Thermia iTec XTR M"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - delay: 1s
        - lambda: |-
            // Restore cached settings only after this device has previously
            // observed a genuine Thermia 0x0F FC10 03E8..03F5 frame.
            if (id(thermia_settings_cache_valid)) {
              id(thermia_heating_curve)->publish_state(id(thermia_heating_curve_saved));
              id(thermia_heating_min)->publish_state(id(thermia_heating_min_saved));
              id(thermia_heating_max)->publish_state(id(thermia_heating_max_saved));
              id(thermia_curve_plus5)->publish_state(id(thermia_curve_plus5_saved));
              id(thermia_curve_zero)->publish_state(id(thermia_curve_zero_saved));
              id(thermia_curve_minus5)->publish_state(id(thermia_curve_minus5_saved));
              id(thermia_heating_stop)->publish_state(id(thermia_heating_stop_saved));
              id(thermia_reduced_temperature)->publish_state(id(thermia_reduced_temperature_saved));
              id(thermia_room_factor)->publish_state(id(thermia_room_factor_saved));
              id(thermia_room_setpoint_mirror)->publish_state(id(thermia_room_setpoint_mirror_saved));

              ESP_LOGI(
                "thermia_persist",
                "Restored validated settings cache: curve=%.0f min=%.0f max=%.0f corr=[%.0f,%.0f,%.0f] stop=%.0f reduced=%.0f room_factor=%.0f room_setpoint=%.0f",
                id(thermia_heating_curve_saved),
                id(thermia_heating_min_saved),
                id(thermia_heating_max_saved),
                id(thermia_curve_plus5_saved),
                id(thermia_curve_zero_saved),
                id(thermia_curve_minus5_saved),
                id(thermia_heating_stop_saved),
                id(thermia_reduced_temperature_saved),
                id(thermia_room_factor_saved),
                id(thermia_room_setpoint_mirror_saved)
              );
            } else {
              ESP_LOGI(
                "thermia_persist",
                "No validated settings cache yet; waiting for a live 0x0F FC10 03E8..03F5 frame."
              );
            }
    - priority: -200
      then:
        - delay: 5s
        - lambda: |-
            id(waveshare_rs485_direction).turn_off();
            const uint32_t now=millis(), last=id(thermia_last_valid_frame_ms);
