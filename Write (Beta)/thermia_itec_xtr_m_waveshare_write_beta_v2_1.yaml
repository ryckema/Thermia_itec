                          id(thermia_write_semantic_response_count_sensor)->publish_state(float(id(exp352_semantic_response_count)));
                          ESP_LOGD("thermia_write","\033[31m[WRITE] ===== DESIRED_PAGE_TX_INTENT phase=%s currentCache03F4=%u desired03F4=%u deltaWords=1 semanticResponse=%u crc=%04X frame=%s RAWREQ=%s =====\033[0m",
                            "WRITE",unsigned(id(exp352_page_w12)),unsigned(desired03f4),
                            unsigned(id(exp352_semantic_response_count)),unsigned(crc),rsphex,raw325);
                          id(waveshare_rs485_direction).turn_on(); delay_microseconds_safe(1000);
                          id(thermia_uart).write_array(rsp,sizeof(rsp)); id(thermia_uart).flush();
                          delay_microseconds_safe(1000); id(waveshare_rs485_direction).turn_off();
                          ESP_LOGD("thermia_write","\033[31m[WRITE] ===== DESIRED_PAGE_TX_EXECUTED phase=%s desired03F4=%u DE=LOW wait=FC16_03E8_14_REPUBLISH =====\033[0m",
                            "WRITE",unsigned(desired03f4));
                        }
                      } else {
                        id(exp352_runtime_unknown_fc03_count)++;
                        id(thermia_write_runtime_unknown_fc03_sensor)->publish_state(float(id(exp352_runtime_unknown_fc03_count)));
                        ESP_LOGD("thermia_write","\033[31m[WRITE] ===== RUNTIME_UNEXPECTED_FC03 start=%04X count=%u writeState=%u NO_TX RAW=%s =====\033[0m",
                          unsigned(st),unsigned(ct),unsigned(ws),raw325);
                        exp352_stop("COMPLETE / INCONCLUSIVE / unexpected runtime FC03",
                                    "unexpected FC03 captured; no response");
                      }
                    } else {
                      ESP_LOGD("thermia_write","\033[31m[WRITE] ===== EARLY_FC03 stage=%u start=%04X count=%u NO_TX RAW=%s =====\033[0m",
                        unsigned(id(exp352_stage)),unsigned(st),unsigned(ct),raw325);
                      exp352_stop("COMPLETE / INCONCLUSIVE / FC03 before full tail completion","early FC03 captured; no response");
                    }
                  }
                }
                }
              }

              // ===============================================================
              // REQUEST CONTEXT
              //
              // Responses to FC04/FC17 do not contain the original register
              // address. Remember the request so the response can be decoded.
              // ===============================================================

              static uint16_t fc04_start[256] = {};
              static uint16_t fc04_count[256] = {};
              static bool fc04_pending[256] = {};

              static uint16_t fc17_start[256] = {};
              static uint16_t fc17_count[256] = {};
              static bool fc17_pending[256] = {};

              // ===============================================================
              // MAPPER STATE
              // Change-only logging for selected register blocks.
              // ===============================================================

              static bool mapper_initialized = false;

              static int16_t prev_a7f8_block[0x0F] = {};
              static int16_t prev_a80c_block[0x07] = {};
              static int16_t prev_b3b0_block[0x03] = {};
              static int16_t prev_b3c4_block[0x03] = {};
              static int16_t prev_03e8_block[0x0E] = {};
              static int16_t prev_1e_fc04_block[0x16] = {};

              auto log_change =
                [&](const char *group,
                    uint16_t address,
                    int16_t old_value,
                    int16_t new_value) {

                  if (old_value == new_value) {
                    return;
                  }

                  ESP_LOGI(
                    "thermia_map",
                    "%s 0x%04X: %d -> %d",
                    group,
                    address,
                    old_value,
                    new_value
                  );
                };


              // ===============================================================
              // MINIMAL AUXILIARY MAPPING
              //
              // The public build intentionally omits the generic reverse-
              // engineering register database and its raw Home Assistant
              // entities. Keep only the few useful auxiliary values that are
              // sourced through generic_map_update call sites.
              // ===============================================================

              auto generic_map_update =
                [&](uint8_t source,
                    uint8_t slave_id,
                    uint16_t address,
                    int16_t value) {

                  if (source == 3 && slave_id == 0x0A && address == 0xB3C4) {
                    publish_float_if_changed(
                      id(thermia_room_bus_outdoor_temperature),
                      float(value),
                      0.5f
                    );
                    return;
                  }

                  if (source == 3 && slave_id == 0x06 && address == 0xAFDC) {
                    publish_float_if_changed(
                      id(thermia_dcm_status_afdc),
                      float(value),
                      0.5f
                    );
                    return;
                  }

                  if (source == 3 && slave_id == 0x06 && address == 0xAFE0) {
                    publish_float_if_changed(
                      id(thermia_dcm_outdoor_temperature),
                      float(value),
                      0.5f
                    );
                    return;
                  }
                };


              // FC04 REQUEST
              // Read Input Registers
              // ===============================================================

              if (
                fc == 0x04 &&
                bytes.size() == 8
              ) {

                fc04_start[slave] =
                  u16(bytes, 2);

                fc04_count[slave] =
                  u16(bytes, 4);

                fc04_pending[slave] = true;

                return;
              }


              // ===============================================================
              // FC04 RESPONSE
              // ===============================================================

              if (
                fc == 0x04 &&
                fc04_pending[slave] &&
                bytes.size() >= 5 &&
                bytes.size() == size_t(bytes[2]) + 5
              ) {

                const uint16_t start =
                  fc04_start[slave];

                const uint16_t count =
                  fc04_count[slave];

                const uint8_t byte_count =
                  bytes[2];


                if (byte_count != count * 2) {

                  fc04_pending[slave] = false;
                  return;
                }


                auto reg_u =
                  [&](uint16_t address) -> uint16_t {

                    const size_t offset =
                      size_t(address - start);

                    const size_t pos =
                      3 + offset * 2;

                    return u16(bytes, pos);
                  };


                auto reg_s =
                  [&](uint16_t address) -> int16_t {

                    const size_t offset =
                      size_t(address - start);

                    const size_t pos =
                      3 + offset * 2;

                    return s16(bytes, pos);
                  };


                // Generic mapper: scan complete FC04 response block.
                for (uint16_t i = 0; i < count; i++) {

                  const uint16_t address =
                    uint16_t(start + i);

                  generic_map_update(
                    1,
                    slave,
                    address,
                    reg_s(address)
                  );
                }


                // =============================================================
                // SLAVE 0x1E
                // Outdoor unit / compressor live data
                //
                // FC04 start 0x0000
                //
                // 0000 condenser inlet          x0.1 °C
                // 0001 condenser outlet         x0.1 °C
                // 0008 high pressure            x0.1 bar
                // 000A requested temperature    x0.1 °C
                // 000B compressor frequency     Hz
                // 000D compressor current       x0.1 A
                // 000E outdoor fan              rpm
                // 0010 expansion valve          steps
                // =============================================================

                if (
                  slave == 0x1E &&
                  start == 0x0000 &&
                  count >= 17
                ) {

                  // -----------------------------------------------------------
                  // Mapper: slave 0x1E FC04 block 0x0000..0x0015
                  // -----------------------------------------------------------

                  if (count >= 0x16) {
                    for (uint16_t addr = 0x0000; addr <= 0x0015; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr);

                      if (mapper_initialized) {
                        log_change(
                          "S1E_FC04",
                          addr,
                          prev_1e_fc04_block[idx],
                          v
                        );
                      }

                      prev_1e_fc04_block[idx] = v;
                    }
                  }

                  const float condenser_in =
                    float(reg_s(0x0000)) / 10.0f;

                  const float condenser_out =
                    float(reg_s(0x0001)) / 10.0f;

                  const float refrigerant_temperature_1 =
                    float(reg_s(0x0002)) / 10.0f;

                  const float discharge_gas_temperature =
                    float(reg_s(0x0003)) / 10.0f;

                  const float refrigerant_temperature_2 =
                    float(reg_s(0x0004)) / 10.0f;

                  const float average_outdoor_temperature =
                    float(reg_s(0x0005)) / 10.0f;

                  const float compressor_temperature =
                    float(reg_s(0x0006)) / 10.0f;

                  const float high_pressure =
                    float(reg_u(0x0008)) / 10.0f;

                  const float target_temperature =
                    float(reg_s(0x000A)) / 10.0f;

                  const float compressor_frequency =
                    float(reg_u(0x000B));

                  const float compressor_current =
                    float(reg_u(0x000D)) / 10.0f;

                  const float fan_speed =
                    float(reg_u(0x000E));

                  const float valve_steps =
                    float(reg_u(0x0010));


                  if (
                    condenser_in > -50.0f &&
                    condenser_in < 150.0f
                  ) {

                    publish_float_if_changed(id(thermia_condenser_in), condenser_in, 0.05f);
                  }


                  if (
                    condenser_out > -50.0f &&
                    condenser_out < 150.0f
                  ) {

                    publish_float_if_changed(id(thermia_condenser_out), condenser_out, 0.05f);
                  }


                  if (
                    condenser_in > -50.0f &&
                    condenser_in < 150.0f &&
                    condenser_out > -50.0f &&
                    condenser_out < 150.0f
                  ) {

                    publish_float_if_changed(
                      id(thermia_condenser_delta_t),
                      condenser_out - condenser_in,
                      0.05f
                    );
                  }


                  if (refrigerant_temperature_1 > -80.0f &&
                      refrigerant_temperature_1 < 200.0f) {
                    publish_float_if_changed(id(thermia_refrigerant_temperature_1), refrigerant_temperature_1, 0.05f);
                  }

                  if (discharge_gas_temperature > -80.0f &&
                      discharge_gas_temperature < 250.0f) {
                    publish_float_if_changed(id(thermia_discharge_gas_temperature), discharge_gas_temperature, 0.05f);
                  }

                  if (refrigerant_temperature_2 > -80.0f &&
                      refrigerant_temperature_2 < 200.0f) {
                    publish_float_if_changed(id(thermia_refrigerant_temperature_2), refrigerant_temperature_2, 0.05f);
                  }

                  if (average_outdoor_temperature > -80.0f &&
                      average_outdoor_temperature < 100.0f) {
                    publish_float_if_changed(id(thermia_average_outdoor_temperature), average_outdoor_temperature, 0.05f);
                  }

                  if (compressor_temperature > -80.0f &&
                      compressor_temperature < 200.0f) {
                    publish_float_if_changed(id(thermia_compressor_temperature), compressor_temperature, 0.05f);
                  }


                  if (
                    high_pressure >= 0.0f &&
                    high_pressure < 100.0f
                  ) {

                    publish_float_if_changed(id(thermia_high_pressure), high_pressure, 0.05f);
                  }


                  if (
                    target_temperature > -50.0f &&
                    target_temperature < 150.0f
                  ) {

                    publish_float_if_changed(id(thermia_target_temperature), target_temperature, 0.05f);
                  }


                  if (
                    compressor_frequency >= 0.0f &&
                    compressor_frequency < 200.0f
                  ) {

                    publish_float_if_changed(id(thermia_compressor_frequency), compressor_frequency, 0.5f);
                  }


                  if (
                    compressor_current >= 0.0f &&
                    compressor_current < 100.0f
                  ) {

                    publish_float_if_changed(id(thermia_compressor_current), compressor_current, 0.05f);
                  }


                  if (
                    fan_speed >= 0.0f &&
                    fan_speed < 5000.0f
                  ) {

                    publish_float_if_changed(id(thermia_fan_speed), fan_speed, 1.0f);
                  }


                  if (
                    valve_steps >= 0.0f &&
                    valve_steps < 10000.0f
                  ) {

                    publish_float_if_changed(id(thermia_expansion_valve_steps), valve_steps, 1.0f);
                  }


                  const bool compressor_running = compressor_frequency > 0.0f;
                  const bool compressor_starting =
                    compressor_frequency > 0.0f && compressor_current < 0.2f;
                  const bool fan_running = fan_speed > 0.0f;


                  // Track real observed compressor 0 Hz -> >0 Hz transitions.
                  // The counter is runtime-only and resets on ESP reboot. If the
                  // ESP boots while the compressor is already running, that
                  // in-progress run is not counted as a new start.
                  if (!id(thermia_compressor_state_initialized)) {
                    id(thermia_compressor_state_initialized) = true;
                    id(thermia_compressor_last_running) = compressor_running;
                    if (compressor_running) id(thermia_compressor_run_start_ms) = millis();
                  } else {
                    if (compressor_running && !id(thermia_compressor_last_running)) {
                      id(thermia_compressor_start_count)++;
                      id(thermia_compressor_run_start_ms) = millis();
                    } else if (!compressor_running && id(thermia_compressor_last_running)) {
                      id(thermia_compressor_run_start_ms) = 0;
                    }
                    id(thermia_compressor_last_running) = compressor_running;
                  }

                  publish_bool_if_changed(
                    id(thermia_compressor_running),
                    compressor_running
                  );

                  // Heuristic only: during the captured start sequence the
                  // frequency rises before the current register leaves 0.0 A.
                  // Useful diagnostically, but do not treat as a hard fault rule.
                  publish_bool_if_changed(
                    id(thermia_compressor_starting),
                    compressor_starting
                  );

                  publish_bool_if_changed(
                    id(thermia_outdoor_fan_running),
                    fan_running
                  );

                  if (count > 0x0015) {
                    const uint16_t operating_state = reg_u(0x0014);
                    const uint16_t status_flags = reg_u(0x0015);

                    // Status flag map from captured operation:
                    //   0x0020 = heating context
                    //   0x0040 = DHW / high-temperature context
                    //   0x0080 = cooling context
                    //   0x0200 = outdoor-unit run-enable acknowledged
                    //
                    // Observed examples:
                    //   0x021 (33)  = heating context, run-enable inactive
                    //   0x041 (65)  = DHW context, run-enable inactive
                    //   0x081 (129) = cooling context, run-enable inactive
                    //   0x221 (545) = heating + run-enable acknowledged
                    //   0x241 (577) = DHW + run-enable acknowledged
                    //   0x281 (641) = cooling + run-enable acknowledged
                    const bool heating_context = (status_flags & 0x0020U) != 0;
                    const bool dhw_context = (status_flags & 0x0040U) != 0;
                    const bool cooling_context = (status_flags & 0x0080U) != 0;
                    const bool run_enable_acknowledged = (status_flags & 0x0200U) != 0;


                    publish_float_if_changed(
                      id(thermia_outdoor_unit_operating_state_raw),
                      float(operating_state),
                      0.5f
                    );

                    publish_float_if_changed(
                      id(thermia_outdoor_unit_status_flags),
                      float(status_flags),
                      0.5f
                    );

                    publish_bool_if_changed(id(thermia_heating_context), heating_context);
                    publish_bool_if_changed(id(thermia_dhw_context), dhw_context);
                    publish_bool_if_changed(id(thermia_cooling_context), cooling_context);

                    // "Context" says which mode is selected/requested.
                    //
                    // "Active" requires:
                    //   - matching mode context from 0015,
                    //   - physical compressor operation (000B > 0 Hz),
                    //   - FC10 0007 overall outdoor-unit cycle request,
                    //   - FC10 0008 immediate outdoor-unit run enable.
                    //
                    // Requiring 0007 + 0008 avoids false mode-active states during
                    // heating <-> DHW handovers and during autonomous recovery
                    // sequences where the compressor can briefly run independently.
                    const bool cycle_request_active =
                      id(thermia_outdoor_unit_command_0007).has_state() &&
                      id(thermia_outdoor_unit_command_0007).state;

                    const bool run_enable_command_active =
                      id(thermia_outdoor_unit_command_0008).has_state() &&
                      id(thermia_outdoor_unit_command_0008).state;

                    publish_bool_if_changed(
                      id(thermia_heating_active),
                      heating_context &&
                      compressor_running &&
                      cycle_request_active &&
                      run_enable_command_active
                    );
                    publish_bool_if_changed(
                      id(thermia_dhw_active),
                      dhw_context &&
                      compressor_running &&
                      cycle_request_active &&
                      run_enable_command_active
                    );
                    publish_bool_if_changed(
                      id(thermia_cooling_active),
                      cooling_context &&
                      compressor_running &&
                      cycle_request_active &&
                      run_enable_command_active
                    );

                    // Keep the existing ESPHome id for compatibility, but give the
                    // entity its corrected meaning in Home Assistant.
                    publish_bool_if_changed(
                      id(thermia_outdoor_unit_enabled),
                      run_enable_acknowledged
                    );

                    // 0014 is an internal outdoor-unit sequence/state machine.
                    // IMPORTANT: it is NOT a direct compressor-running indicator.
                    // Physical compressor running remains FC04 000B > 0 Hz.
                    //
                    // Extended captures show:
                    //   16 = idle
                    //   18 = late shutdown / final transition (exact subfunction tentative)
                    //   20 = recovery / autonomous outdoor-unit sequence (purpose tentative)
                    //   24 = common transition / sequence stage
                    //   25 = heating/DHW shutdown / fan-stop stage
                    //   26 = cooling shutdown stage
                    //   27 = cooling shutdown / fan-stop stage
                    //   28 = heating/DHW transition/ramp; compressor may already run
                    //   29 = heating/DHW established sequence; can persist after compressor stops
                    //   30 = cooling transition/ramp; compressor may already run
                    //   31 = cooling established sequence
                    const char *unit_state = "Unknown";
                    switch (operating_state) {
                      case 16:
                        unit_state = "Idle";
                        break;
                      case 18:
                        unit_state = "Late shutdown / final transition";
                        break;
                      case 20:
                        unit_state = "Recovery / autonomous sequence";
                        break;
                      case 24:
                        unit_state = "Transition / sequence";
                        break;
                      case 25:
                        unit_state = "Heating/DHW shutdown / fan stop";
                        break;
                      case 26:
                        unit_state = "Cooling shutdown stage 2";
                        break;
                      case 27:
                        unit_state = "Cooling shutdown / fan stop";
                        break;
                      case 28:
                        unit_state = "Heating/DHW transition / ramp";
                        break;
                      case 29:
                        unit_state = "Heating/DHW established sequence";
                        break;
                      case 30:
                        unit_state = "Cooling transition / ramp";
                        break;
                      case 31:
                        unit_state = "Cooling established sequence";
                        break;
                      default:
                        unit_state = "Unknown";
                        break;
                    }

                    publish_text_if_changed(
                      id(thermia_outdoor_unit_state),
                      unit_state
                    );

                    const char *status_mode = "Unknown";
                    if (cooling_context) {
                      status_mode = "Cooling";
                    } else if (dhw_context) {
                      status_mode = "DHW / high temperature";
                    } else if (heating_context) {
                      status_mode = "Heating";
                    }

                    publish_text_if_changed(
                      id(thermia_operating_mode),
                      status_mode
                    );
                  }
                }


                fc04_pending[slave] = false;
                return;
              }


              // ===============================================================
              // FC10
              // Write Multiple Registers
              //
              // These frames are transmitted BY THERMIA.
              // The ESP only listens.
              // ===============================================================

              if (
                fc == 0x10 &&
                bytes.size() >= 9
              ) {

                const uint16_t start =
                  u16(bytes, 2);

                const uint16_t count =
                  u16(bytes, 4);

                const uint8_t byte_count =
                  bytes[6];


                if (
                  bytes.size() !=
                  size_t(byte_count) + 9
                ) {

                  return;
                }


                if (
                  byte_count !=
                  count * 2
                ) {

                  return;
                }


                auto reg_s =
                  [&](uint16_t address) -> int16_t {

                    const size_t offset =
                      size_t(address - start);

                    const size_t pos =
                      7 + offset * 2;

                    return s16(bytes, pos);
                  };


                // Generic mapper: scan complete FC10 write block.
                for (uint16_t i = 0; i < count; i++) {

                  const uint16_t address =
                    uint16_t(start + i);

                  generic_map_update(
                    2,
                    slave,
                    address,
                    reg_s(address)
                  );
                }



                // Outdoor-unit FC10 command block sent by the Thermia controller.
                //
                // Current functional map:
                //   0001 = commanded/live target temperature x0.1 °C
                //   0004 = operating/request mode: 1 heating, 2 DHW, 3 cooling
                //   0006 = periodic 0/1/2 state/counter; ~2 h steps observed, purpose unknown
                //   0007 = overall outdoor-unit cycle / sequence request; can stay ON across mode handovers
                //   0008 = immediate outdoor-unit run enable; can toggle OFF/ON during a heating<->DHW handover
                if (slave == 0x1E) {
                  if (start <= 0x0001 && (uint32_t(start) + uint32_t(count)) > 0x0001) {
                    const float commanded_target = float(reg_s(0x0001)) / 10.0f;
                    if (commanded_target > -50.0f && commanded_target < 150.0f) {
                      publish_float_if_changed(
                        id(thermia_commanded_target_temperature),
                        commanded_target,
                        0.05f
                      );
                    }
                  }

                  if (start <= 0x0004 && (uint32_t(start) + uint32_t(count)) > 0x0004) {
                    const int16_t mode_raw = reg_s(0x0004);

                    publish_float_if_changed(
                      id(thermia_mode_request_raw),
                      float(mode_raw),
                      0.5f
                    );

                    const char *mode_text = "Unknown";
                    if (mode_raw == 1) {
                      mode_text = "Heating";
                    } else if (mode_raw == 2) {
                      mode_text = "DHW / high temperature";
                    } else if (mode_raw == 3) {
                      mode_text = "Cooling";
                    }

                    publish_text_if_changed(
                      id(thermia_mode_request),
                      mode_text
                    );
                  }

                  if (start <= 0x0007 && (uint32_t(start) + uint32_t(count)) > 0x0007) {
                    publish_bool_if_changed(
                      id(thermia_outdoor_unit_command_0007),
                      reg_s(0x0007) != 0
                    );
                  }

                  if (start <= 0x0008 && (uint32_t(start) + uint32_t(count)) > 0x0008) {
                    publish_bool_if_changed(
                      id(thermia_outdoor_unit_command_0008),
                      reg_s(0x0008) != 0
                    );
                  }
                }


                // =============================================================
                // SLAVE 0x0F
                // Heating configuration block
                //
                // 03E8 Heating curve
                // 03E9 Heating MIN
                // 03EA Heating MAX
                // 03EB Curve +5
                // 03EC Curve 0
                // 03ED Curve -5
                // 03EE Heating stop
                // 03EF Reduced temperature
                // 03F0 Room factor
                // 03F4 Room setpoint mirror
                // =============================================================

                if (
                  slave == 0x0F &&
                  start == 0x03E8 &&
                  count >= 13
                ) {

                  // -----------------------------------------------------------
                  // Mapper: slave 0x0F FC10 block 0x03E8..0x03F5
                  // -----------------------------------------------------------

                  if (count >= 0x0E) {
                    for (uint16_t addr = 0x03E8; addr <= 0x03F5; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr - 0x03E8);

                      if (mapper_initialized) {
                        log_change(
                          "S0F_FC10",
                          addr,
                          prev_03e8_block[idx],
                          v
                        );
                      }

                      prev_03e8_block[idx] = v;
                    }
                  }

                  const float heating_curve = float(reg_s(0x03E8));
                  const float heating_min = float(reg_s(0x03E9));
                  const float heating_max = float(reg_s(0x03EA));
                  const float curve_plus5 = float(reg_s(0x03EB));
                  const float curve_zero = float(reg_s(0x03EC));
                  const float curve_minus5 = float(reg_s(0x03ED));
                  const float heating_stop = float(reg_s(0x03EE));
                  const float reduced_temperature = float(reg_s(0x03EF));
                  const float room_factor = float(reg_s(0x03F0));
                  const float room_setpoint_mirror = float(reg_s(0x03F4));

                  // Persist only values received from the real Thermia settings block.
                  // Avoid marking restored globals dirty when a repeated block contains
                  // exactly the same values; this reduces unnecessary flash commits.
                  if (id(thermia_heating_curve_saved) != heating_curve) id(thermia_heating_curve_saved) = heating_curve;
                  if (id(thermia_heating_min_saved) != heating_min) id(thermia_heating_min_saved) = heating_min;
                  if (id(thermia_heating_max_saved) != heating_max) id(thermia_heating_max_saved) = heating_max;
                  if (id(thermia_curve_plus5_saved) != curve_plus5) id(thermia_curve_plus5_saved) = curve_plus5;
                  if (id(thermia_curve_zero_saved) != curve_zero) id(thermia_curve_zero_saved) = curve_zero;
                  if (id(thermia_curve_minus5_saved) != curve_minus5) id(thermia_curve_minus5_saved) = curve_minus5;
                  if (id(thermia_heating_stop_saved) != heating_stop) id(thermia_heating_stop_saved) = heating_stop;
                  if (id(thermia_reduced_temperature_saved) != reduced_temperature) id(thermia_reduced_temperature_saved) = reduced_temperature;
                  if (id(thermia_room_factor_saved) != room_factor) id(thermia_room_factor_saved) = room_factor;
                  if (id(thermia_room_setpoint_mirror_saved) != room_setpoint_mirror) id(thermia_room_setpoint_mirror_saved) = room_setpoint_mirror;
                  if (!id(thermia_settings_cache_valid)) id(thermia_settings_cache_valid) = true;
                  id(thermia_settings_live_since_boot) = true;

                  publish_float_if_changed(id(thermia_heating_curve), heating_curve, 0.5f);
                  publish_float_if_changed(id(thermia_heating_min), heating_min, 0.5f);
                  publish_float_if_changed(id(thermia_heating_max), heating_max, 0.5f);

                  // Confirmed heating-curve correction points.
                  publish_float_if_changed(id(thermia_curve_plus5), curve_plus5, 0.5f);
                  publish_float_if_changed(id(thermia_curve_zero), curve_zero, 0.5f);
                  publish_float_if_changed(id(thermia_curve_minus5), curve_minus5, 0.5f);

                  publish_float_if_changed(id(thermia_heating_stop), heating_stop, 0.5f);
                  publish_float_if_changed(id(thermia_reduced_temperature), reduced_temperature, 0.5f);
                  publish_float_if_changed(id(thermia_room_factor), room_factor, 0.5f);

                  // 03F4 follows the room setpoint. Keep a separate diagnostic
                  // mirror because it comes from the settings block rather than
                  // from the room-sensor block.
                  publish_float_if_changed(id(thermia_room_setpoint_mirror), room_setpoint_mirror, 0.5f);
                }

                return;
              }


              // ===============================================================
              // FC17 REQUEST
              // Read / Write Multiple Registers
              // ===============================================================

              if (
                fc == 0x17 &&
                bytes.size() >= 13
              ) {

                const uint16_t read_start =
                  u16(bytes, 2);

                const uint16_t read_count =
                  u16(bytes, 4);

                const uint16_t write_start =
                  u16(bytes, 6);

                const uint16_t write_count =
                  u16(bytes, 8);

                const uint8_t byte_count =
                  bytes[10];

                const size_t expected_size =
                  size_t(byte_count) + 13;


                if (
                  bytes.size() == expected_size &&
                  byte_count == write_count * 2
                ) {

                  fc17_start[slave] =
                    read_start;

                  fc17_count[slave] =
                    read_count;

                  fc17_pending[slave] =
                    true;


                  auto write_reg_s =
                    [&](uint16_t address) -> int16_t {

                      const size_t offset =
                        size_t(address - write_start);

                      const size_t pos =
                        11 + offset * 2;

                      return s16(bytes, pos);
                    };




                  // Generic mapper: scan complete FC17 write part.
                  for (uint16_t i = 0; i < write_count; i++) {

                    const uint16_t address =
                      uint16_t(write_start + i);

                    generic_map_update(
                      3,
                      slave,
                      address,
                      write_reg_s(address)
                    );
                  }


                  // ===========================================================
                  // MAPPER: FC17 write blocks
                  // ===========================================================

                  if (
                    slave == 0x0A &&
                    write_start <= 0xB3C4 &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) >= 0xB3C7
                  ) {

                    for (uint16_t addr = 0xB3C4; addr <= 0xB3C6; addr++) {
                      const int16_t v = write_reg_s(addr);
                      const size_t idx = size_t(addr - 0xB3C4);

                      if (mapper_initialized) {
                        log_change(
                          "S0A_FC17W",
                          addr,
                          prev_b3c4_block[idx],
                          v
                        );
                      }

                      prev_b3c4_block[idx] = v;
                    }

                    // B3C6 is an unresolved room-sensor control/status word.
                    // Values 0 / 2 have been observed, but "boost/enhanced" is
                    // not sufficiently proven. Keep the binary entity diagnostic
                    // and neutral: ON only means B3C6 is non-zero.
                    publish_bool_if_changed(
                      id(thermia_room_boost_request),
                      write_reg_s(0xB3C6) != 0
                    );
                  }


                  if (
                    slave == 0x02 &&
                    write_start <= 0xA80C &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) >= 0xA813
                  ) {

                    for (uint16_t addr = 0xA80C; addr <= 0xA812; addr++) {
                      const int16_t v = write_reg_s(addr);
                      const size_t idx = size_t(addr - 0xA80C);

                      if (mapper_initialized) {
                        log_change(
                          "S02_FC17W",
                          addr,
                          prev_a80c_block[idx],
                          v
                        );
                      }

                      prev_a80c_block[idx] = v;
                    }

                    const uint16_t a80c = uint16_t(write_reg_s(0xA80C));
                    const uint16_t a80e = uint16_t(write_reg_s(0xA80E));

                    publish_float_if_changed(
                      id(thermia_controller_state_a80c),
                      float(a80c),
                      0.5f
                    );

                    const char *controller_context = "Unknown";
                    switch (a80c) {
                      case 64:
                        controller_context = "Normal / baseline";
                        break;
                      case 65:
                        controller_context = "DHW / high temperature";
                        break;
                      case 66:
                        controller_context = "Cooling context / available";
                        break;
                      case 112:
                        controller_context = "Controller housekeeping / transition";
                        break;
                      case 193:
                        controller_context = "Compound / unknown";
                        break;
                      default:
                        controller_context = "Unknown";
                        break;
                    }
                    publish_text_if_changed(
                      id(thermia_controller_context),
                      controller_context
                    );

                    publish_float_if_changed(
                      id(thermia_controller_state_a80e),
                      float(a80e),
                      0.5f
                    );

                    // Keep these raw bit sensors neutral. A80C is primarily
                    // treated as a controller context/sequence value, while A80E
                    // behaves as a controller/accessory status bitfield.
                    publish_bool_if_changed(id(thermia_a80c_flag_0x10), (a80c & 0x0010U) != 0);
                    publish_bool_if_changed(id(thermia_a80c_flag_0x20), (a80c & 0x0020U) != 0);
                    publish_bool_if_changed(id(thermia_a80e_flag_0x08), (a80e & 0x0008U) != 0);
                    publish_bool_if_changed(id(thermia_a80e_flag_0x20), (a80e & 0x0020U) != 0);
                  }


                  // ===========================================================
                  // SLAVE 0x02 - controller sequence value (A80F)
                  //
                  // A80F takes values such as 5, 10, 50 and 75..100.
                  // Heating captures show 10->50 before a cycle, 50->80 at
                  // cycle start and 80->79->...->75 while established. A DHW
                  // capture showed 80->...->100, then 100->80->5->10 on stop.
                  // This strongly ties A80F to controller sequencing/control,
                  // but its exact internal semantics remain unknown.
                  //
                  // IMPORTANT: A80F is NOT compressor frequency, compressor
                  // power, a percentage, or a simple linear heat-demand value.
                  // ===========================================================

                  if (
                    slave == 0x02 &&
                    write_start <= 0xA80F &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) > 0xA80F
                  ) {
                    publish_float_if_changed(id(thermia_demand_raw), float(write_reg_s(0xA80F)), 0.5f);
                  }


                  // ===========================================================
                  // SLAVE 0x0A
                  //
                  // B3C5 = controller-propagated / confirmed room setpoint
                  // ===========================================================

                  if (
                    slave == 0x0A &&
                    write_start <= 0xB3C5 &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) > 0xB3C5
                  ) {

                    const float room_setpoint =
                      float(
                        write_reg_s(0xB3C5)
                      );


                    if (
                      room_setpoint >= 5.0f &&
                      room_setpoint <= 40.0f
                    ) {

                      publish_float_if_changed(id(thermia_room_setpoint), room_setpoint, 0.5f);
                    }
                  }

                  return;
                }
              }


              // ===============================================================
              // FC17 RESPONSE
              // ===============================================================

              if (
                fc == 0x17 &&
                fc17_pending[slave] &&
                bytes.size() >= 5 &&
                bytes.size() ==
                  size_t(bytes[2]) + 5
              ) {

                const uint16_t start =
                  fc17_start[slave];

                const uint16_t count =
                  fc17_count[slave];

                const uint8_t byte_count =
                  bytes[2];


                if (
                  byte_count !=
                  count * 2
                ) {

                  fc17_pending[slave] = false;
                  return;
                }


                auto reg_s =
                  [&](uint16_t address) -> int16_t {

                    const size_t offset =
                      size_t(address - start);

                    const size_t pos =
                      3 + offset * 2;

                    return s16(bytes, pos);
                  };


                // Generic mapper: scan complete FC17 read response block.
                for (uint16_t i = 0; i < count; i++) {

                  const uint16_t address =
                    uint16_t(start + i);

                  generic_map_update(
                    4,
                    slave,
                    address,
                    reg_s(address)
                  );
                }


                // =============================================================
                // SLAVE 0x02
                //
                // A7F8 Supply temperature
                // A7FB DHW upper
                // A7FC DHW main
                // A7FD SG discriminator 1
                // A802 Outdoor temperature
                // A803 SG discriminator 2
                // =============================================================

                if (
                  slave == 0x02 &&
                  start == 0xA7F8 &&
                  count >= 15
                ) {

                  // -----------------------------------------------------------
                  // Mapper: slave 0x02 FC17 read block 0xA7F8..0xA806
                  // -----------------------------------------------------------

                  if (count >= 0x0F) {
                    for (uint16_t addr = 0xA7F8; addr <= 0xA806; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr - 0xA7F8);

                      if (mapper_initialized) {
                        log_change(
                          "S02_FC17R",
                          addr,
                          prev_a7f8_block[idx],
                          v
                        );
                      }

                      prev_a7f8_block[idx] = v;
                    }
                  }

                  const int16_t supply =
                    reg_s(0xA7F8);

                  const int16_t dhw_upper =
                    reg_s(0xA7FB);

                  const int16_t dhw =
                    reg_s(0xA7FC);

                  const int16_t outdoor =
                    reg_s(0xA802);

                  const int16_t sg_a =
                    reg_s(0xA7FD);

                  const int16_t sg_b =
                    reg_s(0xA803);


                  // ===========================================================
                  // DIAGNOSTIC: complete A7F8 block
                  // Useful to verify whether A7F8 really changes with supply.
                  // ===========================================================

                  ESP_LOGI(
                    "thermia_a7f8",
                    "A7F8=%d A7F9=%d A7FA=%d A7FB=%d A7FC=%d A7FD=%d "
                    "A7FE=%d A7FF=%d A800=%d A801=%d A802=%d A803=%d "
                    "A804=%d A805=%d A806=%d",
                    reg_s(0xA7F8),
                    reg_s(0xA7F9),
                    reg_s(0xA7FA),
                    reg_s(0xA7FB),
                    reg_s(0xA7FC),
                    reg_s(0xA7FD),
                    reg_s(0xA7FE),
                    reg_s(0xA7FF),
                    reg_s(0xA800),
                    reg_s(0xA801),
                    reg_s(0xA802),
                    reg_s(0xA803),
                    reg_s(0xA804),
                    reg_s(0xA805),
                    reg_s(0xA806)
                  );

                  ESP_LOGI(
                    "thermia_supply",
                    "Supply candidate A7F8 raw=%d -> %.1f C",
                    supply,
                    float(supply)
                  );


                  if (
                    supply != -1000 &&
                    supply > -50 &&
                    supply < 150
                  ) {

                    publish_float_if_changed(id(thermia_supply_temperature), float(supply), 0.5f);
                  }


                  if (
                    dhw_upper != -1000 &&
                    dhw_upper > 0 &&
                    dhw_upper < 100
                  ) {

                    publish_float_if_changed(id(thermia_dhw_upper_temperature), float(dhw_upper), 0.5f);
                  }


                  if (
                    dhw != -1000 &&
                    dhw > 0 &&
                    dhw < 100
                  ) {

                    publish_float_if_changed(id(thermia_dhw_temperature), float(dhw), 0.5f);
                  }


                  if (
                    outdoor != -1000 &&
                    outdoor > -50 &&
                    outdoor < 70
                  ) {

                    publish_float_if_changed(id(thermia_outdoor_temperature), float(outdoor), 0.5f);
                  }


                  if (
                    dhw_upper != -1000 &&
                    dhw != -1000
                  ) {

                    publish_float_if_changed(
                      id(thermia_dhw_delta_t),
                      float(dhw_upper - dhw),
                      0.5f
                    );
                  }


                  // ===========================================================
                  // SG MODE
                  //
                  // Controlled tests:
                  //
                  // A7FD    A803     SG input state from controlled tests
                  //
                  // -1000   232      Blocked  (SG 1-0)
                  //  1000   224      Normal   (SG 0-0)
                  //  1000   232      Enhanced (SG 0-1)
                  // -1000   224      Peak     (SG 1-1)
                  // ===========================================================

                  ESP_LOGI(
                    "thermia_sg",
                    "SG discriminators: A7FD=%d A803=%d",
                    sg_a,
                    sg_b
                  );


                  // Corrected from repeated physical SG1/SG2 test:
                  // 00 -> A7FD=-1000, A803=224 -> Normal
                  // 10 -> A7FD=-1000, A803=232 -> Blocked
                  // 01 -> A7FD= 1000, A803=224 -> Enhanced
                  // 11 -> A7FD= 1000, A803=232 -> Peak
                  //
                  // Intermediate A7FD values are treated as transitions.

                  if (
                    sg_a == -1000 &&
                    sg_b == 224
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Normal (0-0)");
                  }

                  else if (
                    sg_a == -1000 &&
                    sg_b == 232
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Blocked (1-0)");
                  }

                  else if (
                    sg_a == 1000 &&
                    sg_b == 224
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Enhanced (0-1)");
                  }

                  else if (
                    sg_a == 1000 &&
                    sg_b == 232
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Peak (1-1)");
                  }

                  else {

                    // Hold the last valid state during the short transition.
                    // Do not publish a misleading fifth SG mode.
                  }
                }


                // =============================================================
                // SLAVE 0x0A
                //
                // B3B0 = room temperature x0.1 °C
                // =============================================================

                if (
                  slave == 0x0A &&
                  start == 0xB3B0 &&
                  count >= 1
                ) {

                  // -----------------------------------------------------------
                  // Mapper: slave 0x0A FC17 read block 0xB3B0..0xB3B2
                  // -----------------------------------------------------------

                  if (count >= 3) {
                    for (uint16_t addr = 0xB3B0; addr <= 0xB3B2; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr - 0xB3B0);

                      if (mapper_initialized) {
                        log_change(
                          "S0A_FC17R",
                          addr,
                          prev_b3b0_block[idx],
                          v
                        );
                      }

                      prev_b3b0_block[idx] = v;
                    }
                  }

                  mapper_initialized = true;

                  const float room_temperature =
                    float(
                      reg_s(0xB3B0)
                    ) / 10.0f;


                  if (
                    room_temperature > -20.0f &&
                    room_temperature < 60.0f
                  ) {

                    publish_float_if_changed(id(thermia_room_temperature), room_temperature, 0.05f);
                  }
                }


                fc17_pending[slave] = false;
                return;
              }

          };

          while (true) {
            if (pending.size() < 5) break;

            uint8_t slave = pending[0];
            uint8_t fn = pending[1];
            bool known_fn =
              fn == 0x01 || fn == 0x02 || fn == 0x03 || fn == 0x04 ||
              fn == 0x05 || fn == 0x06 || fn == 0x08 || fn == 0x0F ||
              fn == 0x10 || fn == 0x16 || fn == 0x17 || (fn & 0x80);
            if (!known_slave(slave) || !known_fn) {
              pending.erase(pending.begin());
              continue;
            }

            std::vector<size_t> candidates;
            if (fn & 0x80) candidates.push_back(5);
            if (fn == 0x01 || fn == 0x02) {
              candidates.push_back(8);  // read request
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2])); // read response
            }
            if (fn == 0x05 || fn == 0x06 || fn == 0x08) {
              candidates.push_back(8);
            }
            if (fn == 0x0F) {
              candidates.push_back(8);  // write-multiple-coils response
              if (pending.size() >= 7 && pending[6] <= 240)
                candidates.push_back(9 + size_t(pending[6]));
            }
            if (fn == 0x16) {
              candidates.push_back(10); // mask-write-register request/response
            }
            if (fn == 0x03) {
              candidates.push_back(8);
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2]));
            }
            if (fn == 0x04) {
              candidates.push_back(8);
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2]));
            }
            if (fn == 0x10) {
              candidates.push_back(8);
              if (pending.size() >= 7 && pending[6] <= 240)
                candidates.push_back(9 + size_t(pending[6]));
            }
            if (fn == 0x17) {
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2]));
              if (pending.size() >= 11 && pending[10] <= 240)
                candidates.push_back(13 + size_t(pending[10]));
            }

            std::sort(candidates.begin(), candidates.end());
            candidates.erase(std::unique(candidates.begin(), candidates.end()), candidates.end());

            size_t matched = 0;
            bool waiting = false;
            for (size_t len : candidates) {
              if (len < 5 || len > 256) continue;
              if (pending.size() < len) { waiting = true; continue; }
              if (valid_crc(len)) { matched = len; break; }
            }

            if (matched) {
              std::vector<uint8_t> frame(pending.begin(), pending.begin() + matched);
              pending.erase(pending.begin(), pending.begin() + matched);
              process_frame(frame);
              continue;
            }

            if (waiting) break;

            id(thermia_parser_resync_count)++;
            ESP_LOGW("thermia_stream", "CRC resync at 0x%02X 0x%02X", slave, fn);
            pending.erase(pending.begin());
          }

          if (pending.size() > 512) {
            id(thermia_rx_buffer_drop_count)++;
            ESP_LOGW("thermia_stream", "Dropping pending buffer (%u bytes)",
                     (unsigned) pending.size());
            pending.clear();
          }

# =============================================================================
# HOME ASSISTANT SENSORS
# =============================================================================

sensor:

  # ===========================================================================
  # ESP DIAGNOSTICS
  # ===========================================================================

  - platform: uptime
    name: "Thermia ESP Uptime"
    entity_category: diagnostic
    update_interval: 30s

  - platform: wifi_signal
    name: "Thermia WiFi Signal"
    entity_category: diagnostic
    update_interval: 30s

  # ===========================================================================
  # BUS / PARSER HEALTH
  # ===========================================================================

  - platform: template
    name: "Bus Last Valid Frame Age"
    unit_of_measurement: "s"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      const uint32_t last = id(thermia_last_valid_frame_ms);
      if (last == 0) return NAN;
      return float(millis() - last) / 1000.0f;

  - platform: template
    name: "Valid Frames Since Boot"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 30s
    lambda: |-
      return float(id(thermia_valid_frame_count));

  - platform: template
    name: "Parser Resyncs Since Boot"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 30s
    lambda: |-
      return float(id(thermia_parser_resync_count));

  - platform: template
    name: "RX Buffer Drops Since Boot"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 30s
    lambda: |-
      return float(id(thermia_rx_buffer_drop_count));

  - platform: template
    name: "Compressor Starts Since Boot"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 30s
    lambda: |-
      return float(id(thermia_compressor_start_count));

  - platform: template
    name: "Observed Compressor Run Duration"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 10s
    lambda: |-
      const uint32_t start = id(thermia_compressor_run_start_ms);
      if (start == 0 || !id(thermia_compressor_last_running)) return 0.0f;
      return float(millis() - start) / 1000.0f;

  - platform: template
    name: "Controller 0x02 Frame Age"
    unit_of_measurement: "s"
    accuracy_decimals: 1
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 5s
    lambda: |-
      const uint32_t last = id(thermia_last_s02_ms);
      if (last == 0) return NAN;
      return float(millis() - last) / 1000.0f;

  - platform: template
    name: "Online Slot 0x06 Poll Age"
    unit_of_measurement: "s"
    accuracy_decimals: 1
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 5s
    lambda: |-
      const uint32_t last = id(thermia_last_s06_ms);
      if (last == 0) return NAN;
      return float(millis() - last) / 1000.0f;

  - platform: template
    name: "Room Sensor 0x0A Frame Age"
    unit_of_measurement: "s"
    accuracy_decimals: 1
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 5s
    lambda: |-
      const uint32_t last = id(thermia_last_s0a_ms);
      if (last == 0) return NAN;
      return float(millis() - last) / 1000.0f;

  - platform: template
    name: "Outdoor Unit 0x1E Frame Age"
    unit_of_measurement: "s"
    accuracy_decimals: 1
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 5s
    lambda: |-
      const uint32_t last = id(thermia_last_s1e_ms);
      if (last == 0) return NAN;
      return float(millis() - last) / 1000.0f;

  - platform: debug
    free:
      name: "Thermia ESP Heap Free"
      entity_category: diagnostic
      disabled_by_default: true
    min_free:
      name: "Thermia ESP Heap Min Free"
      entity_category: diagnostic
      disabled_by_default: true
    fragmentation:
      name: "Thermia ESP Heap Fragmentation"
      entity_category: diagnostic
      disabled_by_default: true
    loop_time:
      name: "Thermia ESP Loop Time"
      entity_category: diagnostic
      disabled_by_default: true


  # ===========================================================================
  # REVERSE-ENGINEERING / CONTROL DIAGNOSTICS
  # ===========================================================================

  - platform: template
    id: thermia_demand_raw
    name: "Controller Sequence Value Raw"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  - platform: template
    id: thermia_controller_state_a80c
    name: "Controller Context Raw A80C"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  - platform: template
    id: thermia_controller_state_a80e
    name: "Controller Accessory Status Raw A80E"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  - platform: template
    id: thermia_outdoor_unit_operating_state_raw
    name: "Outdoor Unit Operating State Raw"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

