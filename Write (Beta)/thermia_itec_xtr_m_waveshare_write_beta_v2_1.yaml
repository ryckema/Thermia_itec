  - platform: template
    id: thermia_write_desired_room_setpoint
    name: "Thermia Desired Room Setpoint"
    entity_category: config
    disabled_by_default: true
    icon: mdi:thermometer
    unit_of_measurement: "°C"
    min_value: 10
    max_value: 30
    step: 1
    mode: box
    optimistic: true
    restore_value: false
    initial_value: 21

button:
  - platform: template
    name: "Thermia Apply Room Setpoint"
    entity_category: config
    icon: mdi:thermometer-check
    on_press:
      - lambda: |-
          id(waveshare_rs485_direction).turn_off();
          const uint32_t now=millis();
          const uint32_t rt_age=id(exp352_runtime_enter_ms)?now-id(exp352_runtime_enter_ms):0;
          const uint32_t cache_age=id(exp352_page_cache_ms)?now-id(exp352_page_cache_ms):0xFFFFFFFFUL;
          const uint16_t current=id(exp352_page_w12);
          const float requested_f=id(thermia_write_desired_room_setpoint).state;
          const int requested_i=int(lroundf(requested_f));

          if (!id(exp352_active) || id(exp352_stage)!=40) {
            id(thermia_write_last_event)->publish_state("WRITE REFUSED: persistent stage 40 not active");
            ESP_LOGW("thermia_write","\033[31m[WRITE] ===== WRITE_REFUSED reason=stage40_inactive stage=%u DE=LOW =====\033[0m",unsigned(id(exp352_stage)));
            return;
          }
          if (id(exp352_write_state)!=0 && id(exp352_write_state)!=4) {
            id(thermia_write_last_event)->publish_state("WRITE REFUSED: transaction pending or semantic control disabled");
            ESP_LOGW("thermia_write","\033[31m[WRITE] ===== WRITE_REFUSED reason=state writeState=%u semanticResponses=%u confirmedWrites=%u DE=LOW =====\033[0m",
              unsigned(id(exp352_write_state)),unsigned(id(exp352_semantic_response_count)),
              unsigned(id(exp352_confirmed_write_count)));
            return;
          }
          const uint32_t resync_delta=id(thermia_parser_resync_count)-id(exp352_resync_baseline);
          const uint32_t drop_delta=id(thermia_rx_buffer_drop_count)-id(exp352_drop_baseline);
          const bool retained_qualified = id(exp352_runtime_qualified) &&
            id(exp352_runtime_fc16_ack_count)>=1 && id(exp352_runtime_0708_reply_count)>=1 &&
            id(exp352_runtime_unknown_fc16_count)==0 && id(exp352_runtime_unknown_fc03_count)==0 &&
            id(exp352_peer_fc17_count)==0 && id(exp352_peer_fc16_ack_count)==0 && resync_delta==0 && drop_delta==0;
          if (!retained_qualified) {
            id(thermia_write_last_event)->publish_state("WRITE REFUSED: retained runtime not cleanly qualified yet");
            ESP_LOGW("thermia_write","\033[31m[WRITE] ===== WRITE_REFUSED reason=retained_not_qualified runtimeFC16ACK=%u idle0708=%u unknown16=%u unknown03=%u peer17=%u peer16ack=%u resync=%u drops=%u DE=LOW =====\033[0m",
              unsigned(id(exp352_runtime_fc16_ack_count)),unsigned(id(exp352_runtime_0708_reply_count)),
              unsigned(id(exp352_runtime_unknown_fc16_count)),unsigned(id(exp352_runtime_unknown_fc03_count)),
              unsigned(id(exp352_peer_fc17_count)),unsigned(id(exp352_peer_fc16_ack_count)),unsigned(resync_delta),unsigned(drop_delta));
            return;
          }
          if (rt_age<10000UL) {
            id(thermia_write_last_event)->publish_state("WRITE REFUSED: stage-40 runtime younger than 10 s");
            ESP_LOGW("thermia_write","\033[31m[WRITE] ===== WRITE_REFUSED reason=runtime_age runtimeAge=%ums DE=LOW =====\033[0m",unsigned(rt_age));
            return;
          }
          if (!std::isfinite(requested_f) || requested_i<10 || requested_i>30 || std::fabs(requested_f-float(requested_i))>0.01f) {
            id(thermia_write_last_event)->publish_state("WRITE REFUSED: requested setpoint invalid/outside 10..30");
            ESP_LOGW("thermia_write","\033[31m[WRITE] ===== WRITE_REFUSED reason=request_guard requested=%.3f rounded=%d allowed=10..30_integer DE=LOW =====\033[0m",
              requested_f, requested_i);
            return;
          }

          // New Thermia DCM pre-flight: no fresh controller page => request one.
          if (!id(exp352_page_cache_valid) || cache_age>300000UL) {
            id(exp352_target_03f4)=uint16_t(requested_i);
            id(exp352_original_03f4)=id(exp352_page_cache_valid)?current:0;
            id(thermia_write_write_confirmed_sensor)->publish_state(false);
            id(exp352_write_arm_ms)=now; id(exp352_selector_ms)=0; id(exp352_desired_ms)=0; id(exp352_refresh_request_ms)=0;
            id(exp352_write_state)=5;
            id(thermia_write_status)->publish_state("RUNNING / cache refresh queued / wait next exact 0708");
            id(thermia_write_last_event)->publish_state("CACHE_REFRESH_ARM: target latched; no semantic page TX");
            ESP_LOGI("thermia_write","\033[31m[WRITE] ===== CACHE_REFRESH_ARM cacheValid=%u cacheAge=%ums staleCached03F4=%u requested03F4=%u refreshCount=%u wait=0708 NO_SEMANTIC_TX DE=LOW =====\033[0m",
              unsigned(id(exp352_page_cache_valid)),unsigned(cache_age),unsigned(current),
              unsigned(id(exp352_target_03f4)),unsigned(id(exp352_refresh_request_count)));
            return;
          }

          // Proven fresh-cache write path from EXP349/350.
          if (current<10 || current>30) {
            id(thermia_write_last_event)->publish_state("WRITE REFUSED: current fresh 03F4 outside native 10..30 guard");
            ESP_LOGW("thermia_write","\033[31m[WRITE] ===== WRITE_REFUSED reason=current_03F4_guard current03F4=%u allowed=10..30 DE=LOW =====\033[0m",unsigned(current));
            return;
          }
          if (requested_i==int(current)) {
            id(thermia_write_last_event)->publish_state("WRITE REFUSED: requested setpoint already current value");
            ESP_LOGW("thermia_write","\033[31m[WRITE] ===== WRITE_REFUSED reason=noop current03F4=%u requested03F4=%d DE=LOW =====\033[0m",
              unsigned(current), requested_i);
            return;
          }
          id(exp352_original_03f4)=current;
          id(exp352_target_03f4)=uint16_t(requested_i);
          id(thermia_write_write_confirmed_sensor)->publish_state(false);
          id(exp352_write_arm_ms)=now; id(exp352_selector_ms)=0; id(exp352_desired_ms)=0; id(exp352_refresh_request_ms)=0;
          id(exp352_write_state)=1;
          id(thermia_write_status)->publish_state("RUNNING / fresh-cache reusable setpoint write queued / wait next exact 0708");
          id(thermia_write_last_event)->publish_state("WRITE_ARM: user-selected 03F4 target latched from fresh controller page");
          ESP_LOGI("thermia_write","\033[31m[WRITE] ===== WRITE_ARM current03F4=%u requested03F4=%u delta=%d cacheAge=%ums runtimeAge=%ums semanticResponses=%u wait=0708 DE=LOW =====\033[0m",
            unsigned(id(exp352_original_03f4)),unsigned(id(exp352_target_03f4)),
            int(id(exp352_target_03f4))-int(id(exp352_original_03f4)),unsigned(cache_age),unsigned(rt_age),
            unsigned(id(exp352_semantic_response_count)));

interval:
  - interval: 250ms
    then:
      - lambda: |-
          if (!id(exp352_active)) return;
          const uint32_t now=millis(), last=id(thermia_last_valid_frame_ms);
          if (id(exp352_stage)==40 &&
              !id(exp352_runtime_qualified) &&
              (id(exp352_recovery_in_progress) || id(exp352_semantic_response_count)==0) &&
              id(exp352_write_state)==0 &&
              (now-id(exp352_arm_ms))>=15000UL) {
            id(waveshare_rs485_direction).turn_off(); id(exp352_active)=false; id(exp352_stage)=99; id(exp352_runtime_qualified)=false; id(thermia_write_runtime_active_sensor)->publish_state(false);
            id(thermia_write_active)->publish_state(false); id(thermia_write_runtime_active_sensor)->publish_state(false);
            if (id(exp352_recovery_in_progress)) {
              id(thermia_write_status)->publish_state("STOPPED / recovered session reached stage40 but did not re-qualify within 15 s");
              id(thermia_write_last_event)->publish_state("post-recovery need >=1 known runtime FC16 ACK and >=1 0708 W5=0006 reply");
            } else {
              id(thermia_write_status)->publish_state("STOPPED / retained runtime did not qualify within 15 s");
              id(thermia_write_last_event)->publish_state("need >=1 known runtime FC16 ACK and >=1 0708 W5=0006 reply after OTA");
            }
            id(thermia_write_stage_text)->publish_state("stage 99 / stopped / DE LOW");
            ESP_LOGW("thermia_write","\033[31m[WRITE] ===== RUNTIME_QUALIFY_TIMEOUT runtimeFC16ACK=%u idle0708=%u unknown16=%u unknown03=%u recovery=%u DE=LOW =====\033[0m",
              unsigned(id(exp352_runtime_fc16_ack_count)),unsigned(id(exp352_runtime_0708_reply_count)),
              unsigned(id(exp352_runtime_unknown_fc16_count)),unsigned(id(exp352_runtime_unknown_fc03_count)),
              unsigned(id(exp352_recovery_in_progress)));
            return;
          }

          // Controller cold-reboot recovery, locally proven by EXP355.
          // The detector itself never transmits. It only re-enters the already-proven
          // fresh-session state machine after a clean, qualified, idle stage40 session
          // has experienced >=5 s complete valid-bus silence.
          if (id(exp352_stage)==40 && last && (now-last)>=5000UL) {
            const uint8_t ws=id(exp352_write_state);
            const bool runtime_qualified=
              id(exp352_runtime_qualified) &&
              id(exp352_runtime_fc16_ack_count)>=1 &&
              id(exp352_runtime_0708_reply_count)>=1 &&
              id(exp352_runtime_unknown_fc16_count)==0 &&
              id(exp352_runtime_unknown_fc03_count)==0 &&
              id(exp352_peer_fc17_count)==0 &&
              id(exp352_peer_fc16_ack_count)==0 &&
              (id(thermia_parser_resync_count)-id(exp352_resync_baseline))==0 &&
              (id(thermia_rx_buffer_drop_count)-id(exp352_drop_baseline))==0;
            const bool semantic_idle=(ws==0 || ws==4);

            if (id(exp352_recovery_attempted)) {
              id(waveshare_rs485_direction).turn_off();
              id(exp352_active)=false; id(exp352_stage)=99; id(exp352_runtime_qualified)=false; id(thermia_write_runtime_active_sensor)->publish_state(false);
              id(thermia_write_active)->publish_state(false);
              id(thermia_write_runtime_active_sensor)->publish_state(false);
              id(thermia_write_status)->publish_state("STOPPED / second controller bus-loss event requires ESP restart");
              id(thermia_write_stage_text)->publish_state("stage 99 / stopped / DE LOW");
              id(thermia_write_last_event)->publish_state("second >=5 s silence; only one automatic recovery attempt is locally proven per ESP boot");
              ESP_LOGW("thermia_write","\033[31m[WRITE] ===== SECOND_BUS_LOSS_STOP recoverySuccess=%u TX=0 DE=LOW =====\033[0m",
                unsigned(id(exp352_recovery_success_count)));
              return;
            }

            if (!runtime_qualified || !semantic_idle) {
              id(waveshare_rs485_direction).turn_off();
              id(exp352_active)=false; id(exp352_stage)=99; id(exp352_runtime_qualified)=false; id(thermia_write_runtime_active_sensor)->publish_state(false);
              id(thermia_write_active)->publish_state(false);
              id(thermia_write_runtime_active_sensor)->publish_state(false);
              id(thermia_write_status)->publish_state("STOPPED / bus loss outside clean qualified idle runtime");
              id(thermia_write_stage_text)->publish_state("stage 99 / stopped / DE LOW");
              id(thermia_write_last_event)->publish_state(">=5 s silence but runtime not cleanly qualified or semantic transaction active");
              ESP_LOGW("thermia_write","\033[31m[WRITE] ===== RECOVERY_REFUSED runtimeQualified=%u writeState=%u TX=0 DE=LOW =====\033[0m",
                unsigned(runtime_qualified),unsigned(ws));
              return;
            }

            // Latch before changing state; no TX occurs here.
            id(waveshare_rs485_direction).turn_off();
            id(exp352_recovery_attempted)=true;
            id(exp352_recovery_in_progress)=true;
            id(exp352_runtime_qualified)=false;
            id(exp352_soak_15m_passed)=false;
            id(thermia_write_soak_15m_passed_sensor)->publish_state(false);
            id(thermia_write_session_state)->publish_state("controller recovery / wait boot return");
            id(thermia_write_last_recovery_result)->publish_state("RUNNING");

            // Re-enter the existing fresh-session chain. The silence condition is
            // already satisfied; the first valid frame after controller return promotes
            // stage1 -> stage2.
            id(exp352_stage)=1;
            id(exp352_arm_ms)=now;
            id(exp352_boot_ms)=0;
            id(exp352_tx_ms)=0;
            id(exp352_silence_seen)=true;
            id(exp352_tx_used)=false;
            id(exp352_first_challenge_crc)=0;
            id(exp352_challenge_count)=0;
            id(exp352_post_tx_challenge_count)=0;
            id(exp352_a80e_known)=false; id(exp352_a80f_known)=false;
            id(exp352_a80e)=0; id(exp352_a80f)=0;

            id(exp352_ack_used)=false; id(exp352_ack_ms)=0;
            id(exp352_03fc_ack_used)=false; id(exp352_03fc_ack_ms)=0;
            id(exp352_0410_ack_used)=false; id(exp352_0410_ack_ms)=0;
            id(exp352_042e_ack_used)=false; id(exp352_042e_ack_ms)=0;
            id(exp352_0442_ack_used)=false; id(exp352_0442_ack_ms)=0;
            id(exp352_0456_ack_used)=false; id(exp352_0456_ack_ms)=0;
            id(exp352_046a_ack_used)=false; id(exp352_046a_ack_ms)=0;
            id(exp352_047e_ack_used)=false; id(exp352_047e_ack_ms)=0;
            id(exp352_0492_ack_used)=false; id(exp352_0492_ack_ms)=0;
            id(exp352_04a6_ack_used)=false; id(exp352_04a6_ack_ms)=0;
            id(exp352_04ba_ack_used)=false; id(exp352_04ba_ack_ms)=0;
            id(exp352_04d8_ack_used)=false; id(exp352_04d8_ack_ms)=0;
            id(exp352_04f6_ack_used)=false; id(exp352_04f6_ack_ms)=0;
            id(exp352_050a_ack_used)=false; id(exp352_050a_ack_ms)=0;
            id(exp352_051e_ack_used)=false; id(exp352_051e_ack_ms)=0;
            id(exp352_0532_ack_used)=false; id(exp352_0532_ack_ms)=0;
            id(exp352_0546_ack_used)=false; id(exp352_0546_ack_ms)=0;
            id(exp352_055a_ack_used)=false; id(exp352_055a_ack_ms)=0;
            id(exp352_057b_ack_used)=false; id(exp352_057b_ack_ms)=0;
            id(exp352_059c_ack_used)=false; id(exp352_059c_ack_ms)=0;
            id(exp352_05bd_ack_used)=false; id(exp352_05bd_ack_ms)=0;
            id(exp352_05de_ack_used)=false; id(exp352_05de_ack_ms)=0;
            id(exp352_05ff_ack_used)=false; id(exp352_05ff_ack_ms)=0;
            id(exp352_0620_ack_used)=false; id(exp352_0620_ack_ms)=0;
            id(exp352_0641_ack_used)=false; id(exp352_0641_ack_ms)=0;
            id(exp352_0662_ack_used)=false; id(exp352_0662_ack_ms)=0;
            id(exp352_0683_ack_used)=false; id(exp352_0683_ack_ms)=0;
            id(exp352_06a4_ack_used)=false; id(exp352_06a4_ack_ms)=0;
            id(exp352_06c5_ack_used)=false; id(exp352_06c5_ack_ms)=0;
            id(exp352_06ea_ack_used)=false; id(exp352_06ea_ack_ms)=0;
            id(exp352_06f1_ack_used)=false; id(exp352_06f1_ack_ms)=0;
            id(exp352_06f4_ack_used)=false; id(exp352_06f4_ack_ms)=0;

            // Never carry semantic page provenance across controller reboot.
            id(exp352_page_cache_valid)=false; id(exp352_page_cache_ms)=0;
            id(exp352_page_w00)=0; id(exp352_page_w01)=0; id(exp352_page_w02)=0; id(exp352_page_w03)=0;
            id(exp352_page_w04)=0; id(exp352_page_w05)=0; id(exp352_page_w06)=0; id(exp352_page_w07)=0;
            id(exp352_page_w08)=0; id(exp352_page_w09)=0; id(exp352_page_w10)=0; id(exp352_page_w11)=0;
            id(exp352_page_w12)=0; id(exp352_page_w13)=0;
            id(exp352_write_state)=0; id(exp352_original_03f4)=0; id(exp352_target_03f4)=0;
            id(exp352_write_arm_ms)=0; id(exp352_selector_ms)=0; id(exp352_desired_ms)=0; id(exp352_refresh_request_ms)=0;

            // Session-local runtime and collision diagnostics must be earned again.
            id(exp352_runtime_enter_ms)=0; id(exp352_runtime_last_service_ms)=0;
            id(exp352_runtime_fc16_ack_count)=0; id(exp352_runtime_0708_reply_count)=0;
            id(exp352_runtime_unknown_fc16_count)=0; id(exp352_runtime_unknown_fc03_count)=0;
            id(exp352_runtime_last_ack_ms)=0; id(exp352_runtime_last_ack_start)=0; id(exp352_runtime_last_ack_count)=0;
            id(exp352_runtime_self_echo_ack_count)=0; id(exp352_runtime_085f_acked)=0; id(exp352_runtime_04a6_acked)=0;
            id(exp352_fc16_seen)=0; id(exp352_03e8_seen)=0; id(exp352_03fc_seen)=0; id(exp352_0410_seen)=0; id(exp352_042e_seen)=0;
            id(exp352_same_03e8_after_ack)=0; id(exp352_same_03fc_after_ack)=0; id(exp352_same_0410_after_ack)=0;
            id(exp352_peer_fc17_count)=0; id(exp352_peer_fc16_ack_count)=0;
            id(exp352_self_echo_count)=0; id(exp352_self_echo_ack_count)=0; id(exp352_self_echo_03fc_ack_count)=0; id(exp352_self_echo_0410_ack_count)=0;
            id(exp352_resync_baseline)=id(thermia_parser_resync_count);
            id(exp352_drop_baseline)=id(thermia_rx_buffer_drop_count);

            id(thermia_write_runtime_active_sensor)->publish_state(false);
            id(thermia_write_runtime_fc16_ack_sensor)->publish_state(0);
            id(thermia_write_runtime_0708_reply_sensor)->publish_state(0);
            id(thermia_write_runtime_unknown_fc16_sensor)->publish_state(0);
            id(thermia_write_runtime_unknown_fc03_sensor)->publish_state(0);
            id(thermia_write_runtime_self_echo_sensor)->publish_state(0);
            id(thermia_write_tx_used_sensor)->publish_state(false);
            id(thermia_write_write_confirmed_sensor)->publish_state(false);

            id(thermia_write_status)->publish_state("RUNNING / controller power-loss detected / wait boot return");
            id(thermia_write_stage_text)->publish_state("stage 1 / recovery armed / DE LOW");
            id(thermia_write_last_event)->publish_state(">=5 s qualified idle bus silence; semantic cache invalidated; NO TX; wait first valid frame");
            ESP_LOGW("thermia_write","\033[31m[WRITE] ===== RECOVERY_ARMED silenceAge=%ums runtimeQualified=1 writeState=%u cacheInvalidated=1 TX=0 DE=LOW =====\033[0m",
              unsigned(now-last),unsigned(ws));
            return;
          }

          if (id(exp352_stage)==1) {
            if (last && (now-last)>=5000UL && !id(exp352_silence_seen)) {
              id(exp352_silence_seen)=true;
              id(thermia_write_status)->publish_state("REBOOT SILENCE DETECTED / wait bus return");
              id(thermia_write_last_event)->publish_state(">=5 s bus silence detected");
              ESP_LOGD("thermia_write","\033[31m[WRITE] ===== REBOOT_SILENCE_DETECTED age=%ums TX=0 DE=LOW =====\033[0m",unsigned(now-last));
            }
            if ((now-id(exp352_arm_ms))>=120000UL && !id(exp352_silence_seen)) {
