              // Do NOT disarm the native-session state machine merely because
              // the Thermia controller is still booting when this ESP reaches
              // its 5-second startup check.
              //
              // Enter the existing passive stage-1 cold-start wait instead.
              // No TX occurs here; DE stays LOW. Stage 1 requires >=5 s bus
              // silence before the first returning valid frame can promote the
              // state machine to stage 2 and wait for the exact 071C/0730
