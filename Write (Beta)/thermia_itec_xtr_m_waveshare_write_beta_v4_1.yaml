uart:
  id: thermia_uart

  tx_pin:
    number: GPIO17
    inverted: false

  rx_pin:
    number: GPIO18
    inverted: false

  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

  rx_buffer_size: 2048

  # Prevent ESP-IDF from splitting Modbus RTU frames into ~7-byte chunks.
  rx_full_threshold: 120
  rx_timeout: 2

  debug:
    direction: RX
    dummy_receiver: true
    debug_prefix: "[THERMIA] "

    after:
      timeout: 5ms

    sequence:
      - lambda: |-

          // Robust Modbus RTU stream assembler. ESPHome may split long
          // frames across callbacks, so retain bytes until structure + CRC
          // prove a complete frame. Multiple frames per callback are OK.
          static std::vector<uint8_t> pending;
          if (pending.capacity() == 0) {
            pending.reserve(512);
          }
          pending.insert(pending.end(), bytes.begin(), bytes.end());

          if (pending.size() > 4096) {
            ESP_LOGW(
              "thermia",
              "RX stream buffer exceeded 4096 bytes; clearing buffer to recover."
            );
            id(thermia_rx_buffer_drop_count)++;
            pending.clear();
            return;
          }

          auto stream_crc16 = [](const uint8_t *data, size_t len) -> uint16_t {
            uint16_t crc = 0xFFFF;
            for (size_t i = 0; i < len; i++) {
              crc ^= data[i];
              for (uint8_t bit = 0; bit < 8; bit++)
                crc = (crc & 1) ? ((crc >> 1) ^ 0xA001) : (crc >> 1);
            }
            return crc;
          };

          auto valid_crc = [&](size_t len) -> bool {
            if (len < 5 || pending.size() < len) return false;
            uint16_t got = uint16_t(pending[len-2]) | (uint16_t(pending[len-1]) << 8);
            return stream_crc16(pending.data(), len - 2) == got;
          };

          auto known_slave = [](uint8_t s) -> bool {
            // Broad passive recognizer inherited from the latest known-good RX-only base.
            // This only affects frame parsing/logging; no TX path exists.
            return s == 0x01 || s == 0x02 || s == 0x03 || s == 0x04 ||
                   s == 0x05 || s == 0x06 || s == 0x0A || s == 0x0F ||
                   s == 0x14 || s == 0x1E || s == 0xA4 || s == 0xA5 ||
                   s == 0xC8;
          };

          auto process_frame = [&](const std::vector<uint8_t> &bytes) {
              // ===============================================================
              // THERMIA ITEC LEGACY PASSIVE MODBUS RTU DECODER
              // ===============================================================

              if (bytes.size() < 5) {
                ESP_LOGW(
                  "thermia",
                  "Chunk too short for Modbus RTU: %u bytes",
                  (unsigned) bytes.size()
                );
                return;
              }


              // ===============================================================
              // HELPERS
              // ===============================================================

              auto crc16_modbus =
                [](const uint8_t *data, size_t len) -> uint16_t {

                  uint16_t crc = 0xFFFF;

                  for (size_t i = 0; i < len; i++) {

                    crc ^= data[i];

                    for (uint8_t bit = 0; bit < 8; bit++) {

                      if (crc & 0x0001) {
                        crc = (crc >> 1) ^ 0xA001;
                      } else {
                        crc >>= 1;
                      }
                    }
                  }

                  return crc;
                };


              auto u16 =
                [](const std::vector<uint8_t> &b, size_t pos) -> uint16_t {

                  return
                    (uint16_t(b[pos]) << 8) |
                    uint16_t(b[pos + 1]);
                };


              auto s16 =
                [](const std::vector<uint8_t> &b, size_t pos) -> int16_t {

                  return int16_t(
                    (uint16_t(b[pos]) << 8) |
                    uint16_t(b[pos + 1])
                  );
                };


              // ===============================================================
              // CHANGE-ONLY PUBLISH HELPERS
              //
              // The Thermia bus repeats many identical values every second.
              // Only forwarding actual changes keeps the ESPHome native API
              // queue small and prevents Home Assistant entities going
              // temporarily unavailable under heavy bus traffic.              // ===============================================================

              auto publish_float_if_changed =
                [](auto *sensor, float value, float epsilon = 0.001f) {
                  if (!sensor->has_state() ||
                      isnan(sensor->state) ||
                      fabsf(sensor->state - value) >= epsilon) {
                    sensor->publish_state(value);
                  }
                };

              auto publish_bool_if_changed =
                [](auto *sensor, bool value) {
                  if (!sensor->has_state() || sensor->state != value) {
                    sensor->publish_state(value);
                  }
                };

              auto publish_text_if_changed =
                [](auto *sensor, const char *value) {
                  if (!sensor->has_state() || sensor->state != value) {
                    sensor->publish_state(value);
                  }
                };


              // ===============================================================
              // CRC VALIDATION
              // ===============================================================

              const uint16_t received_crc =
                uint16_t(bytes[bytes.size() - 2]) |
                (uint16_t(bytes[bytes.size() - 1]) << 8);

              const uint16_t calculated_crc =
                crc16_modbus(
                  bytes.data(),
                  bytes.size() - 2
                );


              if (received_crc != calculated_crc) {

                ESP_LOGW(
                  "thermia",
                  "CRC FAIL (%u bytes): received=0x%04X calculated=0x%04X",
                  (unsigned) bytes.size(),
                  received_crc,
                  calculated_crc
                );

                return;
              }


              const uint8_t slave = bytes[0];
              const uint8_t fc = bytes[1];

              const uint32_t now_ms = millis();
              id(thermia_last_valid_frame_ms) = now_ms;
              id(thermia_valid_frame_count)++;
              if (slave == 0x02) id(thermia_last_s02_ms) = now_ms;
              if (slave == 0x06) id(thermia_last_s06_ms) = now_ms;
              if (slave == 0x0A) id(thermia_last_s0a_ms) = now_ms;
              if (slave == 0x1E) id(thermia_last_s1e_ms) = now_ms;
              publish_bool_if_changed(id(thermia_bus_healthy), true);

              ESP_LOGD(
                "thermia",
                "CRC OK: slave=0x%02X function=0x%02X length=%u",
                slave,
                fc,
                (unsigned) bytes.size()
              );

              // ===============================================================
              // Thermia Write - RETAINED STAGE40 + ONE GUARDED FRESH-SESSION RECOVERY PATH
              // stage 1: armed, wait >=5 s controller reboot silence
              // stage 2: boot returned; FIRST exact challenge -> ONE proven R1 response
              //          under known-good A80E=0000 / A80F=0005 guard
              // stage 3: R1 sent; first FC16 must be 03E8/count14
              // stage 4..34: locally proven ordered initial-sync ACK chain
              // ===============================================================
              if (id(write_active)) {
                auto write_hex=[](const std::vector<uint8_t> &f,char *out,size_t cap) {
                  static const char h[]="0123456789ABCDEF";
                  if (cap==0) return; size_t p=0;
                  for (size_t i=0;i<f.size() && (p+2)<cap;i++) {
                    out[p++]=h[(f[i]>>4)&0x0F]; out[p++]=h[f[i]&0x0F];
                  }
                  out[p]='\0';
                };
                char raw325[360]; write_hex(bytes,raw325,sizeof(raw325));

                if (id(write_stage)==1 && id(write_silence_seen)) {
                  id(write_stage)=2; id(write_boot_ms)=now_ms;
                  id(write_resync_baseline)=id(thermia_parser_resync_count);
                  id(write_drop_baseline)=id(thermia_rx_buffer_drop_count);
                  id(thermia_write_status)->publish_state("RUNNING / fresh boot detected / wait first exact 071C-0730 challenge");
                  id(thermia_write_stage_text)->publish_state("stage 2 / boot returned / first exact challenge gets one R1");
                  id(thermia_write_last_event)->publish_state("first valid frame after >=5 s reboot silence");
                  ESP_LOGE("thermia_write","\033[31m[WRITE] ===== BOOT_RETURN RAW=%s =====\033[0m",raw325);
                }

                const uint32_t resync_delta=(id(write_stage)>=2)?id(thermia_parser_resync_count)-id(write_resync_baseline):0;
                const uint32_t drop_delta=(id(write_stage)>=2)?id(thermia_rx_buffer_drop_count)-id(write_drop_baseline):0;
                auto write_stop=[&](const char *status,const char *event) {
                  id(waveshare_rs485_direction).turn_off(); id(write_active)=false; id(write_stage)=99;
                  id(write_pending_valid)=false; id(write_pending_generation)=0; id(write_queue_not_before_ms)=0; id(write_dirty_mask)=0;
                  id(thermia_write_active)->publish_state(false);
                  id(thermia_write_runtime_active_sensor)->publish_state(false);
                  id(thermia_write_status)->publish_state(status);
                  id(thermia_write_stage_text)->publish_state("stage 99 / stopped / DE LOW"); id(thermia_write_last_event)->publish_state(event);
                  id(thermia_write_challenges)->publish_state(float(id(write_challenge_count)));
                  id(thermia_write_post_tx_challenges)->publish_state(float(id(write_post_tx_challenge_count)));
                  id(thermia_write_fc16_seen_sensor)->publish_state(float(id(write_fc16_seen)));
                  id(thermia_write_03e8_seen_sensor)->publish_state(float(id(write_03e8_seen)));
                  id(thermia_write_03fc_seen_sensor)->publish_state(float(id(write_03fc_seen)));
                  id(thermia_write_0410_seen_sensor)->publish_state(float(id(write_0410_seen)));
                  id(thermia_write_042e_seen_sensor)->publish_state(float(id(write_042e_seen)));
                  id(thermia_write_same_0410_after_ack_sensor)->publish_state(float(id(write_same_0410_after_ack)));
                  id(thermia_write_same_03fc_after_ack_sensor)->publish_state(float(id(write_same_03fc_after_ack)));
                  id(thermia_write_same_03e8_after_ack_sensor)->publish_state(float(id(write_same_03e8_after_ack)));
                  id(thermia_write_peer_fc17)->publish_state(float(id(write_peer_fc17_count)));
                  id(thermia_write_peer_fc16_ack)->publish_state(float(id(write_peer_fc16_ack_count)));
                  ESP_LOGE("thermia_write","\033[31m[WRITE] ===== STOP status=%s event=%s challenges=%u postR1=%u r1Used=%u initFC16=%u runtimeFC16ACK=%u idle0708=%u rt085F=%u rt04A6=%u unknown16=%u unknown03=%u peer17=%u peer16ack=%u runtimeEcho=%u resync=%u drops=%u DE=LOW =====\033[0m",
                    status,event,unsigned(id(write_challenge_count)),unsigned(id(write_post_tx_challenge_count)),unsigned(id(write_tx_used)),
                    unsigned(id(write_fc16_seen)),unsigned(id(write_runtime_fc16_ack_count)),unsigned(id(write_runtime_0708_reply_count)),
                    unsigned(id(write_runtime_085f_acked)),unsigned(id(write_runtime_04a6_acked)),
                    unsigned(id(write_runtime_unknown_fc16_count)),unsigned(id(write_runtime_unknown_fc03_count)),
                    unsigned(id(write_peer_fc17_count)),unsigned(id(write_peer_fc16_ack_count)),
                    unsigned(id(write_runtime_self_echo_ack_count)),unsigned(resync_delta),unsigned(drop_delta));
                };

                if (id(write_stage)>=2 && (resync_delta || drop_delta)) {
                  write_stop("ABORTED / parser-RX integrity delta","integrity changed after boot return");
                } else {
                  // Same cold-boot state guard used by the earlier successful
                  // one-shot replay family: A80E=0000 and A80F=0005.
                  if (slave==0x02 && fc==0x17 && bytes.size()==27 &&
                      bytes[2]==0xA7 && bytes[3]==0xF8 && bytes[4]==0x00 && bytes[5]==0x0F &&
                      bytes[6]==0xA8 && bytes[7]==0x0C && bytes[8]==0x00 && bytes[9]==0x07 && bytes[10]==0x0E) {
                    id(write_a80e)=uint16_t(bytes[15])<<8 | bytes[16];
                    id(write_a80f)=uint16_t(bytes[17])<<8 | bytes[18];
                    id(write_a80e_known)=true; id(write_a80f_known)=true;
                    ESP_LOGE("thermia_write","\033[38;5;130m[WRITE] STATE_GUARD A80E=%04X A80F=%04X bootAge=%ums\033[0m",
                      unsigned(id(write_a80e)),unsigned(id(write_a80f)),unsigned(id(write_boot_ms)?now_ms-id(write_boot_ms):0));
                  }

                  if (slave==0x0F && id(write_stage)>=2) {
                  // Exact 071C/0730 challenge shape.
                  if (fc==0x17 && bytes.size()==29 &&
                      bytes[2]==0x07 && bytes[3]==0x30 && bytes[4]==0x00 && bytes[5]==0x08 &&
                      bytes[6]==0x07 && bytes[7]==0x1C && bytes[8]==0x00 && bytes[9]==0x08 && bytes[10]==0x10) {
                    id(write_challenge_count)++;
                    id(thermia_write_challenges)->publish_state(float(id(write_challenge_count)));
                    if (id(write_hot_rejoin_in_progress) || id(write_hot_rejoin_wait_runtime)) {
                      ESP_LOGE("thermia_write","\033[31m[WRITE] ===== HOT_REJOIN_ABORT_CHALLENGE n=%u NO_R1 NO_TX DE=LOW RAW=%s =====\033[0m",
                        unsigned(id(write_challenge_count)),raw325);
                      id(write_hot_rejoin_in_progress)=false;
                      id(write_hot_rejoin_wait_runtime)=false;
                      write_stop("COMPLETE / INCONCLUSIVE / challenge appeared during hot-rejoin",
                                  "challenge captured during hot-rejoin; R1 deliberately withheld");
                    } else if (id(write_stage)==40) {
                      // v4.0 DCM-start fix:
                      // Stage 40 is entered optimistically after ESP boot so an already
                      // retained controller/DCM runtime can continue without replaying R1.
                      // If that runtime has NOT actually qualified yet and the controller
                      // presents the exact native 071C/0730 challenge, allow the same
                      // guarded one-shot cold-start R1 path that is already proven below.
                      //
                      // If runtime IS already qualified, preserve the existing fail-closed
                      // behavior: a later challenge is treated as a session restart and no
                      // R1 is sent automatically.
                      const bool retained_runtime_qualified =
                        id(write_runtime_fc16_ack_count)>=1 &&
                        id(write_runtime_0708_reply_count)>=1 &&
                        id(write_runtime_unknown_fc16_count)==0 &&
                        id(write_runtime_unknown_fc03_count)==0 &&
                        id(write_peer_fc17_count)==0 &&
                        id(write_peer_fc16_ack_count)==0 &&
                        (id(thermia_parser_resync_count)-id(write_resync_baseline))==0 &&
                        (id(thermia_rx_buffer_drop_count)-id(write_drop_baseline))==0;
                      const bool semantic_idle =
                        id(write_write_state)==0 || id(write_write_state)==4;

                      if (!retained_runtime_qualified && semantic_idle &&
                          !id(write_tx_used)) {
                        if (id(write_first_challenge_crc)==0) id(write_first_challenge_crc)=received_crc;
                        const bool state_ok=id(write_a80e_known) && id(write_a80f_known) &&
                          id(write_a80e)==0x0000 && id(write_a80f)==0x0005;

                        if (!state_ok) {
                          // DCM guard-wait-all-challenges fix:
                          // Every exact challenge while stage40 is still unqualified
                          // and semantic-idle is capture-only unless the proven
                          // cold-start guard is currently true. Challenge #2, #3, ...
                          // must not kill the session engine.
                          //
                          // Safety is unchanged: NO R1 unless both A80E=0000 and
                          // A80F=0005 are known. Remaining in stage40 allows a later
                          // >=5 s controller bus-loss to enter the existing stage1 ->
                          // stage2 cold-start recovery path.
                          ESP_LOGE("thermia_write","\033[31m[WRITE] ===== DCM_START_GUARD_WAIT challenge=%u state_ok=0 A80E_known=%u A80E=%04X A80F_known=%u A80F=%04X NO_TX KEEP_STAGE40=1 DE=LOW RAW=%s =====\033[0m",
                            unsigned(id(write_challenge_count)),
                            unsigned(id(write_a80e_known)),unsigned(id(write_a80e)),
                            unsigned(id(write_a80f_known)),unsigned(id(write_a80f)),raw325);
                          id(thermia_write_status)->publish_state("RUNNING / stage40 challenge ignored / wait valid cold-start guard or bus-loss recovery");
                          id(thermia_write_stage_text)->publish_state("stage 40 / guard mismatch / NO R1 / continue listening");
                          id(thermia_write_last_event)->publish_state("071C/0730 challenge outside proven A80E=0000/A80F=0005 guard; NO TX; stage40 retained");
                        } else {
                          // Reuse the exact already-proven R1 frame and the existing
                          // stage-3 -> ordered FC16 ACK chain. No new payload is introduced.
                          id(write_tx_used)=true; id(write_tx_ms)=millis(); id(write_stage)=3;
                          id(thermia_write_tx_used_sensor)->publish_state(true);
                          id(thermia_write_status)->publish_state("RUNNING / DCM start fallback R1 sent / wait exact 03E8-count14");
                          id(thermia_write_stage_text)->publish_state("stage 3 / DCM start fallback / wait exact 03E8-count14");
                          id(thermia_write_last_event)->publish_state("unqualified stage40 received exact challenge under proven guard; guarded R1 replay sent");
                          ESP_LOGE("thermia_write","\033[31m[WRITE] ===== DCM_START_FALLBACK_TX_INTENT challenge=%u runtimeQualified=0 state_ok=1 A80E=0000 A80F=0005 latch=CLOSED R1=1691A5F3F8E8D58738924416E8E6A3D5 RAW_REQUEST=%s =====\033[0m",
                            unsigned(id(write_challenge_count)),raw325);

                          static const uint8_t r1_stage40_start[21]={
                            0x0F,0x17,0x10,
                            0x16,0x91,0xA5,0xF3,0xF8,0xE8,0xD5,0x87,
                            0x38,0x92,0x44,0x16,0xE8,0xE6,0xA3,0xD5,
                            0xE2,0x27
                          };
                          id(waveshare_rs485_direction).turn_on(); delay_microseconds_safe(1000);
                          id(thermia_uart).write_array(r1_stage40_start,sizeof(r1_stage40_start)); id(thermia_uart).flush();
                          delay_microseconds_safe(1000); id(waveshare_rs485_direction).turn_off();
                          ESP_LOGE("thermia_write","\033[31m[WRITE] ===== DCM_START_FALLBACK_TX_EXECUTED frame=0F17101691A5F3F8E8D58738924416E8E6A3D5E227 DE=LOW latch=CLOSED =====\033[0m");
                        }
                      } else {
                        ESP_LOGE("thermia_write","\033[31m[WRITE] ===== RETAINED_SESSION_RESTART_DETECTED exact_071C_0730_challenge n=%u runtimeQualified=%u semanticIdle=%u NO_R1 NO_TX DE=LOW RAW=%s =====\033[0m",
                          unsigned(id(write_challenge_count)),
                          unsigned(retained_runtime_qualified),unsigned(semantic_idle),raw325);
                        write_stop("COMPLETE / INCONCLUSIVE / retained session restart detected",
                                   "exact 071C/0730 challenge appeared after qualified/unsafe stage40; no automatic R1");
                      }
                    } else if (!id(write_tx_used) && id(write_challenge_count)==1) {
                      id(write_first_challenge_crc)=received_crc;
                      const bool state_ok=id(write_a80e_known) && id(write_a80f_known) &&
                        id(write_a80e)==0x0000 && id(write_a80f)==0x0005;
                      if (!state_ok) {
                        ESP_LOGE("thermia_write","\033[31m[WRITE] ===== TX_REFUSED challenge=1 state_ok=0 A80E_known=%u A80E=%04X A80F_known=%u A80F=%04X RAW=%s =====\033[0m",
                          unsigned(id(write_a80e_known)),unsigned(id(write_a80e)),unsigned(id(write_a80f_known)),unsigned(id(write_a80f)),raw325);
                        write_stop("COMPLETE / INCONCLUSIVE / first challenge seen but cold-boot state guard not met","R1 not transmitted; A80E/A80F guard failed");
                      } else {
                        // Latch CLOSED before driver enable: no second R1 possible.
                        id(write_tx_used)=true; id(write_tx_ms)=millis(); id(write_stage)=3;
                        id(thermia_write_tx_used_sensor)->publish_state(true);
                        id(thermia_write_status)->publish_state("RUNNING / R1 sent / first post-R1 FC16 must be exact 03E8-count14");
                        id(thermia_write_stage_text)->publish_state("stage 3 / R1 sent / wait exact first 03E8-count14");
                        id(thermia_write_last_event)->publish_state("one-shot R1 transmitted on first challenge");
                        ESP_LOGE("thermia_write","\033[31m[WRITE] ===== TX_INTENT challenge=1 crc=%04X state_ok=1 A80E=0000 A80F=0005 latch=CLOSED R1=1691A5F3F8E8D58738924416E8E6A3D5 RAW_REQUEST=%s =====\033[0m",
                          unsigned(received_crc),raw325);

                        static const uint8_t r1[21]={
                          0x0F,0x17,0x10,
                          0x16,0x91,0xA5,0xF3,0xF8,0xE8,0xD5,0x87,
                          0x38,0x92,0x44,0x16,0xE8,0xE6,0xA3,0xD5,
                          0xE2,0x27
                        };
                        id(waveshare_rs485_direction).turn_on(); delay_microseconds_safe(1000);
                        id(thermia_uart).write_array(r1,sizeof(r1)); id(thermia_uart).flush();
                        delay_microseconds_safe(1000); id(waveshare_rs485_direction).turn_off();
                        ESP_LOGE("thermia_write","\033[31m[WRITE] ===== TX_EXECUTED ONE-SHOT R1 frame=0F17101691A5F3F8E8D58738924416E8E6A3D5E227 DE=LOW latch=CLOSED =====\033[0m");
                      }
                    } else if (id(write_tx_used)) {
                      id(write_post_tx_challenge_count)++;
                      id(thermia_write_post_tx_challenges)->publish_state(float(id(write_post_tx_challenge_count)));
                      ESP_LOGE("thermia_write","\033[38;5;130m[WRITE] POST_TX_CHALLENGE n=%u total=%u after=%ums NO_TX RAW=%s\033[0m",
                        unsigned(id(write_post_tx_challenge_count)),unsigned(id(write_challenge_count)),unsigned(millis()-id(write_tx_ms)),raw325);
                    }
                  }

                  // Response-shaped peer frame. Allow only our immediate local echo.
                  if (fc==0x17 && bytes.size()==21 && bytes[2]==0x10) {
                    if (id(write_tx_used) && id(write_tx_ms) && (now_ms-id(write_tx_ms))<100UL) {
                      id(write_self_echo_count)++;
                      ESP_LOGE("thermia_write","\033[38;5;130m[WRITE] SELF_ECHO_CANDIDATE n=%u after=%ums RAW=%s\033[0m",
                        unsigned(id(write_self_echo_count)),unsigned(now_ms-id(write_tx_ms)),raw325);
                    } else {
                      id(write_peer_fc17_count)++; id(thermia_write_peer_fc17)->publish_state(float(id(write_peer_fc17_count)));
                      ESP_LOGE("thermia_write","\033[31m[WRITE] ===== ABORT external 0F FC17 16-byte response RAW=%s =====\033[0m",raw325);
                      write_stop("ABORTED / external 0x0F FC17 responder detected","peer FC17 response-shaped frame");
                    }
                  }

                  // FC16 ACK-shaped frame: allow only immediate echo of our own
                  // 03E8 or 03FC ACK. Anything else means another responder.
                  if (fc==0x10 && bytes.size()==8) {
                    const bool echo03e8 =
                      id(write_ack_used) && id(write_ack_ms) &&
                      (now_ms-id(write_ack_ms))<100UL &&
                      bytes[2]==0x03 && bytes[3]==0xE8 &&
                      bytes[4]==0x00 && bytes[5]==0x0E;
                    const bool echo03fc =
                      id(write_03fc_ack_used) && id(write_03fc_ack_ms) &&
                      (now_ms-id(write_03fc_ack_ms))<100UL &&
                      bytes[2]==0x03 && bytes[3]==0xFC &&
