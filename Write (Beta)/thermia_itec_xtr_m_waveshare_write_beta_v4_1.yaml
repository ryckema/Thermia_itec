            } else {
              const uint16_t mask=id(write_dirty_mask);
              uint8_t wi=0xFF;
              if      (mask & (1u<<0))  wi=0;
              else if (mask & (1u<<1))  wi=1;
              else if (mask & (1u<<2))  wi=2;
              else if (mask & (1u<<3))  wi=3;
              else if (mask & (1u<<4))  wi=4;
              else if (mask & (1u<<5))  wi=5;
              else if (mask & (1u<<6))  wi=6;
              else if (mask & (1u<<7))  wi=7;
              else if (mask & (1u<<8))  wi=8;
              else if (mask & (1u<<12)) wi=12;

              if (wi!=0xFF) {
                uint16_t target=0;
                if      (wi==0)  target=id(write_dirty_w00);
                else if (wi==1)  target=id(write_dirty_w01);
                else if (wi==2)  target=id(write_dirty_w02);
                else if (wi==3)  target=id(write_dirty_w03);
                else if (wi==4)  target=id(write_dirty_w04);
                else if (wi==5)  target=id(write_dirty_w05);
                else if (wi==6)  target=id(write_dirty_w06);
                else if (wi==7)  target=id(write_dirty_w07);
                else if (wi==8)  target=id(write_dirty_w08);
                else if (wi==12) target=id(write_dirty_w12);

                // Immutable transaction latch.
                id(write_write_word_index)=wi;
                id(write_write_register)=uint16_t(0x03E8u+wi);
                id(write_requested_target)=target;
                id(write_target_value)=target;

                // Per-transaction guards/counters.
                id(write_semantic_response_count)=0;
                id(thermia_write_semantic_response_count_sensor)->publish_state(0);
                id(write_extra_delta_words)=0;
                id(write_original_value)=0;
                id(thermia_write_write_confirmed_sensor)->publish_state(false);

                // Every dirty-set transaction starts with a fresh authoritative page.
                id(write_page_cache_valid)=false;
                id(write_page_cache_ms)=0;
                id(write_write_arm_ms)=now;
                id(write_selector_ms)=0;
                id(write_desired_ms)=0;
                id(write_refresh_request_ms)=0;
                id(write_delayed_refresh_pending)=false;

                // Latch active state BEFORE removing the dirty bit. No async race.
                id(write_write_state)=5;
                id(write_dirty_mask)&=~uint16_t(1u<<wi);

                id(thermia_write_status)->publish_state(
                  "RUNNING / dirty-queue item latched / fresh 03E8 required");
                id(thermia_write_last_event)->publish_state(
                  "DIRTY_QUEUE_DISPATCH_LATCHED: wait next 0708 for fresh-page refresh");
                ESP_LOGE("thermia_write",
                  "\033[31m[WRITE] ===== DIRTY_QUEUE_DISPATCH_LATCHED reg=%04X word=%u target=%u remainingMask=%04X runtimeAge=%ums FRESH_PAGE_REQUIRED=1 writeState=5 =====\033[0m",
                  unsigned(id(write_write_register)),unsigned(wi),unsigned(target),
                  unsigned(id(write_dirty_mask)),unsigned(rt_age));
              }
            }
          }
          // Thermia Write does not arm the old stalled-export probe. The following legacy
          // branch is unreachable because no Thermia Write UI/action sets resume_started;
          // retained only to avoid touching unrelated recovery/parser scaffolding.
          if (id(write_stage)==40 && id(write_resume_started) && !id(write_resume_done)) {
            const uint32_t rd=id(thermia_parser_resync_count)-id(write_resync_baseline);
            const uint32_t dd=id(thermia_rx_buffer_drop_count)-id(write_drop_baseline);
            const bool clean = id(write_runtime_unknown_fc16_count)==0 && id(write_runtime_unknown_fc03_count)==0 &&
              id(write_peer_fc17_count)==0 && id(write_peer_fc16_ack_count)==0 && rd==0 && dd==0 &&
              id(write_challenge_count)==0 && !id(write_tx_used);
            if ((now-id(write_resume_start_ms))>=60000UL) {
              id(write_resume_done)=true;
              if (clean) {
                id(thermia_write_status)->publish_state("COMPLETE / NEGATIVE / resumed export did not reach 06F4 within 60 s");
                id(thermia_write_last_event)->publish_state("EXPORT_RESUME_NEGATIVE: clean timeout before final 06F4/count19");
                ESP_LOGE("thermia_write","\033[31m[WRITE] ===== EXPORT_RESUME_NEGATIVE pagesAfter04A6=%u expectedIndex=%u runtimeInterleaves=%u idle0708=%u DE=LOW =====\033[0m",unsigned(id(write_resume_pages_acked)),unsigned(id(write_resume_expected_index)),unsigned(id(write_resume_runtime_interleaves)),unsigned(id(write_runtime_0708_reply_count)));
              } else {
                id(thermia_write_status)->publish_state("COMPLETE / INCONCLUSIVE / resume window contaminated before 06F4");
                id(thermia_write_last_event)->publish_state("export resume timeout with challenge/unknown/peer/integrity delta; inspect capture");
              }
            }
          }
          // ===============================================================
          // Thermia Write CONTROLLED CHANGE:
          // Qualified retained stage40 -> existing fresh-session stage1 after
          // >=5 s COMPLETE valid-bus silence. This block itself NEVER transmits.
          // ===============================================================
          if (id(write_stage)==40 && last && (now-last)>=5000UL) {
            const uint8_t ws=id(write_write_state);
            const uint8_t s378=id(exp378_state);
            const uint8_t s379=id(exp379_state);
            const uint8_t s380=id(exp380_state);
            const bool runtime_qualified=
              id(write_runtime_fc16_ack_count)>=1 &&
              id(write_runtime_0708_reply_count)>=1;

            // EXP388 session-stability classification.
            // Recoverable means no setting-value page is in flight.
            //
            // Main 03E8 engine:
            //   0 idle
            //   1 queued/wait 0708 (no selector TX yet)
            //   4 already confirmed
            //   5 wait 0708 for current-page refresh (no semantic TX)
            //   6 current-page refresh sent (no setting value)
            //   7 EXP387 parked before semantic TX
            // States 2/3 remain fail-closed because the desired-page transaction
            // has crossed the semantic selector boundary.
            const bool prod_recovery_safe =
              (ws==0 || ws==1 || ws==4 || ws==5 || ws==6 || ws==7);

            // 042E / 0442 / 0546 engines:
            // states 1/2 are pre-selector, 6 is current-refresh-only, 7 is startup
            // sync, 0/5 are idle/disabled. States 3/4 are semantic selector/page
            // in-flight and therefore remain fail-closed.
            const bool exp378_recovery_safe =
              (s378==0 || s378==1 || s378==2 || s378==5 || s378==6 || s378==7);
            const bool exp379_recovery_safe =
              (s379==0 || s379==1 || s379==2 || s379==5 || s379==6 || s379==7);
            const bool exp380_recovery_safe =
              (s380==0 || s380==1 || s380==2 || s380==5 || s380==6 || s380==7);

            const bool recovery_safe =
              prod_recovery_safe &&
              exp378_recovery_safe &&
              exp379_recovery_safe &&
              exp380_recovery_safe;

            if (id(write_recovery_attempted)) {
              id(waveshare_rs485_direction).turn_off();
              id(write_active)=false;
              id(write_stage)=99;
              id(thermia_write_active)->publish_state(false);
              id(thermia_write_runtime_active_sensor)->publish_state(false);
              id(thermia_write_status)->publish_state("COMPLETE / INCONCLUSIVE / second bus-loss event outside Thermia Write scope");
              id(thermia_write_stage_text)->publish_state("stage 99 / stopped / DE LOW");
              id(thermia_write_last_event)->publish_state("second >=5 s silence; no second recovery attempt permitted");
              ESP_LOGE("thermia_write","\033[31m[WRITE] ===== SECOND_BUS_LOSS_STOP recoverySuccess=%u TX=0 DE=LOW =====\033[0m",
                unsigned(id(write_recovery_success_count)));
              return;
            }

            // EXP388:
            // Recover only when every semantic engine is still before its
            // setting-value transmission boundary. If any engine has a
            // selector/page transaction in flight, fail closed because the
            // controller may have applied an unknown partial semantic action.
            if (!recovery_safe) {
              id(waveshare_rs485_direction).turn_off();
              id(write_active)=false;
              id(write_stage)=99;
              id(thermia_write_active)->publish_state(false);
              id(thermia_write_runtime_active_sensor)->publish_state(false);
              id(thermia_write_status)->publish_state("COMPLETE / INCONCLUSIVE / bus loss during semantic transaction");
              id(thermia_write_stage_text)->publish_state("stage 99 / stopped / DE LOW");
              id(thermia_write_last_event)->publish_state(">=5 s silence with semantic selector/page in flight; recovery refused");
              ESP_LOGE("thermia_write","\033[31m[WRITE] ===== RECOVERY_REFUSED_SEMANTIC runtimeQualified=%u writeState=%u s378=%u s379=%u s380=%u TX=0 DE=LOW =====\033[0m",
                unsigned(runtime_qualified),unsigned(ws),unsigned(s378),unsigned(s379),unsigned(s380));
              return;
            }

            // Latch recovery before changing state. No TX here.
            id(waveshare_rs485_direction).turn_off();
            id(write_recovery_attempted)=true;
            id(write_recovery_in_progress)=true;

            // EXP388 safety rule:
            // A genuine controller restart is an authority boundary. Anything
            // selected/queued but not already controller-confirmed is CANCELLED,
            // never replayed automatically after the new session comes up.
            //
            // Main 03E8 queue / transaction intent.
            const uint16_t cancelled_prod_mask=id(write_dirty_mask);
            const bool cancelled_prod_pending=id(write_pending_valid);
            id(write_pending_valid)=false;
            id(write_pending_word_index)=0;
            id(write_pending_register)=0x03E8;
            id(write_pending_target)=0;
            id(write_pending_generation)=0;
            id(write_request_word_index)=0;
            id(write_request_register)=0x03E8;
            id(write_request_target)=0;
            id(write_request_generation)=0;
            id(write_queue_not_before_ms)=0;
            id(write_dirty_mask)=0;
            id(write_semantic_response_count)=0;
            id(write_extra_delta_words)=0;

            // 042E semantic engine: discard unconfirmed NW and require fresh sync.
            const uint16_t cancelled_378_mask=id(exp378_dirty_mask);
            id(exp378_dirty_mask)=0;
            id(exp378_state)=7;
            id(exp378_sync_valid)=false;
            id(exp378_refresh_for_write)=false;
            id(exp378_target_word)=0;
            id(exp378_target_value)=0;
            id(exp378_original_value)=0;
            id(exp378_arm_ms)=0;
            id(exp378_selector_ms)=0;
            id(exp378_desired_ms)=0;
            id(exp378_cache_ms)=0;
            id(exp378_semantic_responses)=0;
            id(exp378_status)->publish_state("CANCELLED / controller restart / wait fresh 042E sync");

            // 0442 semantic engine: discard unconfirmed NW and require fresh sync.
            const uint16_t cancelled_379_mask=id(exp379_dirty_mask);
            id(exp379_dirty_mask)=0;
            id(exp379_state)=7;
            id(exp379_sync_valid)=false;
            id(exp379_refresh_for_write)=false;
            id(exp379_target_word)=0;
            id(exp379_target_value)=0;
            id(exp379_original_value)=0;
            id(exp379_arm_ms)=0;
            id(exp379_selector_ms)=0;
            id(exp379_desired_ms)=0;
            id(exp379_cache_ms)=0;
            id(exp379_semantic_responses)=0;
            id(exp379_status)->publish_state("CANCELLED / controller restart / wait fresh 0442 sync");

            // 0546 semantic engine, including EXP383 Link Integration candidate.
            const bool cancelled_380_dirty=id(exp380_dirty);
            const bool cancelled_link_dirty=id(exp383_link_dirty);
            id(exp380_dirty)=false;
            id(exp383_link_dirty)=false;
            id(exp380_state)=7;
            id(exp380_sync_valid)=false;
            id(exp380_refresh_for_write)=false;
            id(exp380_target_word)=13;
            id(exp380_target_value)=0;
            id(exp380_original_value)=0;
            id(exp380_arm_ms)=0;
            id(exp380_selector_ms)=0;
            id(exp380_desired_ms)=0;
            id(exp380_cache_ms)=0;
            id(exp380_semantic_responses)=0;
