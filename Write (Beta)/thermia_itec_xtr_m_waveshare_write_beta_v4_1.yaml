esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# ESP32-S3R8 provides 8 MB octal PSRAM. Explicit PSRAM configuration is
# required by current ESPHome releases for ESP32-S3.
psram:
  mode: octal
  speed: 80MHz

# Batch preference writes. The persisted Thermia settings change rarely.
preferences:
  flash_write_interval: 1min

api:
  encryption:
    key: !secret thermia_api_encryption_key
  # Do not reboot merely because Home Assistant/API is temporarily unreachable.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret thermia_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # This controller is continuously powered: prefer reliability over Wi-Fi power saving.
  power_save_mode: none

  # Keep a network-stack recovery watchdog, but make it much less aggressive
  # than the ESPHome default. No access-point BSSID is hard-coded.
  reboot_timeout: 30min

  ap:
    ssid: "Thermia Fallback Hotspot"
    password: !secret thermia_fallback_password

captive_portal:


# Publish reset/heap/loop diagnostics so Wi-Fi loss can be separated from
# brownouts, watchdog resets, API loss and parser/resource problems.
debug:
  update_interval: 30s


# =============================================================================
# LOGGING
# =============================================================================

logger:
  # Production logging stays quiet; Thermia Write emits only write lifecycle events.
  level: WARN
  baud_rate: 0
  logs:
    thermia: WARN
    thermia_persist: WARN
    thermia_write: WARN
    thermia_exp383: WARN



# =============================================================================
# THERMIA UART
#
# Confirmed bus settings: 9600 baud, 8E1, Modbus RTU CRC16.
#
# Waveshare ESP32-S3-RS485-CAN:
# - GPIO18 = RX
# - GPIO17 = TX (Thermia Write transmits only guarded proven frames)
# - GPIO21 = DE/direction; LOW except during a guarded write TX frame.
#
# EXP322 is strict passive-only; no experimental response is transmitted.
# No semantic reverse-page response is permitted in this build.
# =============================================================================

# =============================================================================
# WAVESHARE RS485 DIRECTION
# =============================================================================

# SP3485 DE and /RE are controlled by GPIO21 on this board.
# ALWAYS_OFF => GPIO21 LOW => receiver enabled, driver disabled at boot.
# Thermia Write raises DE only for the guarded proven response frames.
# This switch is internal and is not exposed to Home Assistant.
switch:
  - platform: gpio
    id: waveshare_rs485_direction
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO21
      inverted: false

  - platform: template
    id: exp378_sww_enabled_control
    name: "03 Hot Water | 01 Enabled"
    entity_category: config
    icon: mdi:water-boiler
    optimistic: false
    turn_on_action:
      - lambda: |-
          const uint16_t target=1, bit=uint16_t(1u<<0);
          if (!id(exp378_sync_valid) || !id(write_active) || id(write_stage)!=40 || id(exp378_state)==5) {
            if (id(exp378_sync_valid)) id(exp378_sww_enabled_control).publish_state(id(exp378_confirmed_w00)==1);
            id(exp378_status)->publish_state("BLOCKED / Hot Water control unavailable / authoritative value restored");
            return;
          }
          id(exp378_sww_enabled_control).publish_state(true);
          id(exp378_desired_w00)=target; id(exp378_dirty_mask)|=bit;
          id(exp378_status)->publish_state("QUEUED / desired SWW Enabled retained until safe dispatch");
          ESP_LOGE("thermia_exp378","\033[38;5;130m[EXP378] ===== UI_DESIRED_QUEUE reg=042E word=0 target=1 dirtyMask=%04X activeState=%u prodWriteState=%u prodDirty=%04X UI_NW_RETAINED=1 =====\033[0m",
            unsigned(id(exp378_dirty_mask)),unsigned(id(exp378_state)),unsigned(id(write_write_state)),unsigned(id(write_dirty_mask)));
    turn_off_action:
      - lambda: |-
          const uint16_t target=0, bit=uint16_t(1u<<0);
          if (!id(exp378_sync_valid) || !id(write_active) || id(write_stage)!=40 || id(exp378_state)==5) {
            if (id(exp378_sync_valid)) id(exp378_sww_enabled_control).publish_state(id(exp378_confirmed_w00)==1);
            id(exp378_status)->publish_state("BLOCKED / Hot Water control unavailable / authoritative value restored");
            return;
          }
          id(exp378_sww_enabled_control).publish_state(false);
          id(exp378_desired_w00)=target; id(exp378_dirty_mask)|=bit;
          id(exp378_status)->publish_state("QUEUED / desired SWW Enabled retained until safe dispatch");
          ESP_LOGE("thermia_exp378","\033[38;5;130m[EXP378] ===== UI_DESIRED_QUEUE reg=042E word=0 target=0 dirtyMask=%04X activeState=%u prodWriteState=%u prodDirty=%04X UI_NW_RETAINED=1 =====\033[0m",
            unsigned(id(exp378_dirty_mask)),unsigned(id(exp378_state)),unsigned(id(write_write_state)),unsigned(id(write_dirty_mask)));


  - platform: template
    id: exp383_topup_control
    name: "03 Hot Water | 03 TEST Top-up"
    entity_category: config
    icon: mdi:water-boiler-alert
    optimistic: false
    turn_on_action:
      - lambda: |-
          const uint16_t target=1, bit=uint16_t(1u<<2);
          if (!id(exp378_sync_valid) || !id(write_active) || id(write_stage)!=40 || id(exp378_state)==5) {
            if (id(exp378_sync_valid)) id(exp383_topup_control).publish_state(id(exp378_confirmed_w02)==1);
            id(exp378_status)->publish_state("BLOCKED / TEST Top-up unavailable / authoritative value restored");
            return;
          }
          id(exp383_topup_control).publish_state(true);
