# =============================================================================
# THERMIA iTec XTR M — Write Beta v4.1 — EXP387 semantic re-arm + EXP388 session stability hardening
#
# EXP383 — staged candidate controls from EXP382 offline gap analysis
#
# SESSION STATUS:
# - EXP386 COMPLETE / POSITIVE — guarded controller-restart recovery locally confirmed end-to-end.
# - EXP387 COMPLETE / POSITIVE — delayed 0708 semantic re-arm locally confirmed with Room Setpoint write.
# - EXP388 RUNNING / PARTIAL — repeated controller-restart recovery locally confirmed twice without ESP reboot;
#   pre-semantic/refresh-only controller-loss cancellation branches remain not independently live-exercised.
#
# v4.1 keeps the proven R1 guard, ordered initial-sync chain, semantic page machinery and CRC/payload set.
# New stability behavior:
# - delayed pre-TX semantic work is parked until a genuine 0708 can reacquire a fresh authoritative page;
# - after RECOVERY_POSITIVE the controller-restart recovery latch is re-armed for a later independent restart;
# - recoverable pre-semantic / refresh-only bus-loss states cancel unconfirmed intents and invalidate semantic caches;
# - selector/page-in-flight semantic states remain fail-closed.
#
# BASELINE: EXP381B COMPLETE / POSITIVE
# OFFLINE BASIS: EXP382 COMPLETE / POSITIVE
# EXP383 STATUS: PREPARED / NOT RUN — TEST controls are not promoted by EXP386/387/388
#
# Hypothesis
# ----------
# The STRONGLY SUPPORTED EXP382 mappings can use the already-proven native
# desired-page machinery of pages 042E/count15, 0442/count13 and 0546/count20.
#
# IMPORTANT TEST DISCIPLINE
# -------------------------
# All candidate controls are present and functional, but they MUST be tested
# ONE AT A TIME. Their Home Assistant display names contain "TEST".
# No candidate is promoted to PROVEN until its own local write/rollback result
# is supplied.
#
# New candidate targets:
#   0430 w02  TEST Hot Water TOP_UP                  (0/1)
#   0444 w02  TEST Cooling Hysteresis               (raw x10, 0.0..12.0 K)
#   0446 w04  TEST Cooling Configuration            (0/1/2)
#   0448 w06  TEST Cooling STOP threshold           (0..100 raw)
#   044A w08  TEST Cooling Max Start Temperature    (°C)
#   044B w09  TEST Cooling Min Stop Temperature     (°C)
#   0559 w19  TEST Link Integration                 (0 LIGHT / 1 SYSTEM)
#
# Existing proven page selectors, current-refresh frames, CRC logic, ACK logic,
# timing and runtime/session machinery are retained.
#
# Safety / abort
# --------------
# - test only one new candidate at a time;
# - use the smallest reversible change possible;
# - stop on parser/RX/peer/session fault, timeout, unexpected page/count,
#   extraDeltaWords != 0, or controller behavior not matching the expected field;
# - do not automatically retry a failed semantic transaction;
# - 0559 Link Integration is the highest-risk candidate and should be tested last.
#
# ESPHome compile verification is NOT claimed unless actually compiled.
# =============================================================================

substitutions:
  device_name: "thermia-itec-xtr-m"
  friendly_name: "Thermia iTec XTR M"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - delay: 1s
        - lambda: |-
            // Restore cached settings only after this device has previously
            // observed a genuine Thermia 0x0F FC10 03E8..03F5 frame.
            if (id(thermia_settings_cache_valid)) {
              id(thermia_heating_curve)->publish_state(id(thermia_heating_curve_saved));
              id(thermia_heating_min)->publish_state(id(thermia_heating_min_saved));
              id(thermia_heating_max)->publish_state(id(thermia_heating_max_saved));
              id(thermia_curve_plus5)->publish_state(id(thermia_curve_plus5_saved));
              id(thermia_curve_zero)->publish_state(id(thermia_curve_zero_saved));
              id(thermia_curve_minus5)->publish_state(id(thermia_curve_minus5_saved));
              id(thermia_heating_stop)->publish_state(id(thermia_heating_stop_saved));
              id(thermia_reduced_temperature)->publish_state(id(thermia_reduced_temperature_saved));
              id(thermia_room_factor)->publish_state(id(thermia_room_factor_saved));
              id(thermia_room_setpoint_mirror)->publish_state(id(thermia_room_setpoint_mirror_saved));

              ESP_LOGI(
                "thermia_persist",
                "Restored validated settings cache: curve=%.0f min=%.0f max=%.0f corr=[%.0f,%.0f,%.0f] stop=%.0f reduced=%.0f room_factor=%.0f room_setpoint=%.0f",
                id(thermia_heating_curve_saved),
                id(thermia_heating_min_saved),
                id(thermia_heating_max_saved),
                id(thermia_curve_plus5_saved),
                id(thermia_curve_zero_saved),
                id(thermia_curve_minus5_saved),
                id(thermia_heating_stop_saved),
                id(thermia_reduced_temperature_saved),
