  - id: write_page_w10
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: write_page_w11
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: write_page_w12
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: write_page_w13
    type: uint16_t
    restore_value: no
    initial_value: '0'
  # 0 idle before first write; 1 fresh-cache write queued/wait 0708;
  # 2 semantic selector sent/wait FC03 03E8;
  # 3 desired page sent/wait exact FC16 03E8 republish;
  # 4 last write confirmed / one-shot complete;
  # 5 stale/missing-cache refresh queued/wait 0708;
  # 6 refresh-only W3 bit0 sent/wait controller FC16 03E8;
  # 7 semantic control parked/disabled after a pre-TX mailbox wait or refresh-path failure.
  - id: write_write_state
    type: uint8_t
    restore_value: no
    initial_value: '0'
  # EXP387: true only when state 7 was entered BEFORE any semantic selector/page TX
  # because no controller 0708 mailbox request arrived within the original 30 s window.
  # The next genuine controller 0708 may then re-arm the EXISTING fresh-page refresh path.
  - id: write_delayed_refresh_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: write_original_value
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: write_target_value
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: write_requested_target
    type: uint16_t
    restore_value: no
    initial_value: '0'
  # Selected word inside 03E8/count14:
  # 0=03E8 Curve, 1=03E9 Min, 2=03EA Max, 3=03EB Corr+5, 4=03EC Corr0,
  # 5=03ED Corr-5, 6=03EE Heating Stop, 7=03EF Reduced Temp, 8=03F0 Room Factor, 12=03F4 Room Setpoint.
  - id: write_write_word_index
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: write_write_register
    type: uint16_t
    restore_value: no
    initial_value: '0x03E8'
  - id: write_write_arm_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: write_selector_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: write_desired_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: write_refresh_request_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: write_refresh_request_count
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: write_refresh_confirmed_count
