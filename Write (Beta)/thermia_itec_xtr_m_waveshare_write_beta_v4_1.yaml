                      } else if (id(write_stage)==32) {
                        if (st==0x06C5 && ct==33) {
                          write_stop("COMPLETE / INCONCLUSIVE / 06C5 retry after ACK","06EA ACK withheld");
                        } else if (st==0x06EA && ct==7 && bc==14 && bytes.size()==23 &&
                                   !id(write_06ea_ack_used) && id(write_06c5_ack_ms) &&
                                   (now_ms-id(write_06c5_ack_ms))<=5000UL) {
                          id(write_06ea_ack_used)=true; id(write_06ea_ack_ms)=millis(); id(write_stage)=33;
                          id(thermia_write_06ea_ack_used_sensor)->publish_state(true);
                          id(thermia_write_status)->publish_state("RUNNING / 06EA ACK sent / wait exact 06F1-count3");
                          id(thermia_write_stage_text)->publish_state("stage 33 / 06EA ACK sent / wait 06F1");
                          ESP_LOGE("thermia_write","\033[31m[WRITE] ===== 06EA_ACK_TX_INTENT frame=0F1006EA0007A199 latch=CLOSED RAW=%s =====\033[0m",raw325);
                          static const uint8_t a06ea[8]={0x0F,0x10,0x06,0xEA,0x00,0x07,0xA1,0x99};
                          id(waveshare_rs485_direction).turn_on(); delay_microseconds_safe(1000);
                          id(thermia_uart).write_array(a06ea,sizeof(a06ea)); id(thermia_uart).flush();
                          delay_microseconds_safe(1000); id(waveshare_rs485_direction).turn_off();
                          ESP_LOGE("thermia_write","\033[31m[WRITE] ===== 06EA_ACK_TX_EXECUTED DE=LOW =====\033[0m");
                        } else {
                          write_stop("COMPLETE / INCONCLUSIVE / expected exact 06EA not obtained","06EA ACK withheld");
                        }

                      } else if (id(write_stage)==33) {
                        if (st==0x06EA && ct==7) {
                          write_stop("COMPLETE / INCONCLUSIVE / 06EA retry after ACK","06F1 ACK withheld");
                        } else if (st==0x06F1 && ct==3 && bc==6 && bytes.size()==15 &&
                                   !id(write_06f1_ack_used) && id(write_06ea_ack_ms) &&
                                   (now_ms-id(write_06ea_ack_ms))<=5000UL) {
                          id(write_06f1_ack_used)=true; id(write_06f1_ack_ms)=millis();
                          id(thermia_write_06f1_ack_used_sensor)->publish_state(true);
                          ESP_LOGE("thermia_write","\033[31m[WRITE] ===== 06F1_ACK_TX_INTENT frame=0F1006F10003D05D latch=CLOSED RAW=%s =====\033[0m",raw325);
                          static const uint8_t a06f1[8]={0x0F,0x10,0x06,0xF1,0x00,0x03,0xD0,0x5D};
                          id(waveshare_rs485_direction).turn_on(); delay_microseconds_safe(1000);
                          id(thermia_uart).write_array(a06f1,sizeof(a06f1)); id(thermia_uart).flush();
                          delay_microseconds_safe(1000); id(waveshare_rs485_direction).turn_off();
                          ESP_LOGE("thermia_write","\033[31m[WRITE] ===== 06F1_ACK_TX_EXECUTED DE=LOW =====\033[0m");

                          if (id(write_hot_rejoin_in_progress)) {
                            id(write_hot_rejoin_in_progress)=false;
                            id(write_hot_rejoin_export_complete)=true;
                            id(write_hot_rejoin_wait_runtime)=true;
                            id(write_hot_rejoin_complete_ms)=millis();
                            id(write_stage)=40;
                            id(write_runtime_enter_ms)=millis();
                            id(write_runtime_last_service_ms)=0;
                            id(write_runtime_fc16_ack_count)=0; id(write_runtime_0708_reply_count)=0;
                            id(write_runtime_unknown_fc16_count)=0; id(write_runtime_unknown_fc03_count)=0;
                            id(write_runtime_self_echo_ack_count)=0; id(write_runtime_last_ack_ms)=0;
                            id(write_resync_baseline)=id(thermia_parser_resync_count);
                            id(write_drop_baseline)=id(thermia_rx_buffer_drop_count);
                            id(thermia_write_runtime_fc16_ack_sensor)->publish_state(0);
                            id(thermia_write_runtime_0708_reply_sensor)->publish_state(0);
                            id(thermia_write_runtime_unknown_fc16_sensor)->publish_state(0);
                            id(thermia_write_runtime_unknown_fc03_sensor)->publish_state(0);
                            id(thermia_write_runtime_self_echo_sensor)->publish_state(0);
                            id(thermia_write_runtime_active_sensor)->publish_state(false);
                            id(thermia_write_status)->publish_state("RUNNING / 31 requested pages exported through 06F1 / requalifying runtime");
                            id(thermia_write_stage_text)->publish_state("stage 40 / post-hot-rejoin runtime qualification");
                            id(thermia_write_last_event)->publish_state("HOT_REJOIN_EXPORT_COMPLETE: 03E8..06F1; wait fresh runtime FC16 + 0708");
                            ESP_LOGE("thermia_write","\033[31m[WRITE] ===== HOT_REJOIN_EXPORT_COMPLETE requestedPages=31 final=06F1 noR1=%u ENTER_STAGE40=1 NEXT=fresh_runtime_FC16_plus_0708 DE=LOW =====\033[0m",
                              unsigned(!id(write_tx_used)));
                          } else {
                            id(write_stage)=34;
                            id(thermia_write_status)->publish_state("RUNNING / 06F1 ACK sent / wait exact 06F4-count19");
                            id(thermia_write_stage_text)->publish_state("stage 34 / 06F1 ACK sent / wait 06F4");
                          }
                        } else {
                          write_stop("COMPLETE / INCONCLUSIVE / expected exact 06F1 not obtained","06F1 ACK withheld");
                        }

                      } else if (id(write_stage)==34) {
                        if (st==0x06F1 && ct==3) {
                          write_stop("COMPLETE / INCONCLUSIVE / 06F1 retry after ACK","06F4 ACK withheld");
                        } else if (st==0x06F4 && ct==19 && bc==38 && bytes.size()==47 &&
                                   !id(write_06f4_ack_used) && id(write_06f1_ack_ms) &&
                                   (now_ms-id(write_06f1_ack_ms))<=5000UL) {
                          id(write_06f4_ack_used)=true; id(write_06f4_ack_ms)=millis();
                          id(write_runtime_enter_ms)=id(write_06f4_ack_ms);
                          id(write_runtime_last_service_ms)=id(write_06f4_ack_ms);
                          id(write_stage)=40;
                          if (id(write_recovery_in_progress)) {
                            // Fresh 15 s window for POST-recovery runtime qualification.
                            id(write_arm_ms)=millis();
                          }
                          id(thermia_write_06f4_ack_used_sensor)->publish_state(true);
                          id(thermia_write_runtime_active_sensor)->publish_state(true);
                          if (id(write_recovery_in_progress)) {
                            id(thermia_write_status)->publish_state("RUNNING / Thermia Write initial sync complete / wait fresh runtime FC16 + 0708");
                            id(thermia_write_stage_text)->publish_state("stage 40 / recovery runtime qualification");
                            id(thermia_write_last_event)->publish_state("06F4/count19 ACK complete; pre-reboot page cache remains invalid until new controller data arrives");
                            ESP_LOGE("thermia_write","\033[31m[WRITE] ===== INITIAL_SYNC_COMPLETE final=06F4/count19 ENTER_STAGE40=1 cacheValid=%u NEXT=fresh_runtime_qualification =====\033[0m",
                              unsigned(id(write_page_cache_valid)));
                          } else {
                            id(thermia_write_status)->publish_state("RUNNING / persistent DCM runtime active / 0708 W5=0006 / Heating Curve generic target READY");
                            id(thermia_write_stage_text)->publish_state("stage 40 / persistent runtime service");
                          }
                          ESP_LOGE("thermia_write","\033[31m[WRITE] ===== 06F4_ACK_TX_INTENT frame=0F1006F40013C190 latch=CLOSED RAW=%s =====\033[0m",raw325);
                          static const uint8_t a06f4[8]={0x0F,0x10,0x06,0xF4,0x00,0x13,0xC1,0x90};
                          id(waveshare_rs485_direction).turn_on(); delay_microseconds_safe(1000);
                          id(thermia_uart).write_array(a06f4,sizeof(a06f4)); id(thermia_uart).flush();
                          delay_microseconds_safe(1000); id(waveshare_rs485_direction).turn_off();
                          ESP_LOGE("thermia_write","\033[31m[WRITE] ===== 06F4_ACK_TX_EXECUTED DE=LOW ENTER_PERSISTENT_RUNTIME_SERVICE =====\033[0m");
                        } else {
                          write_stop("COMPLETE / INCONCLUSIVE / expected exact 06F4 not obtained","06F4 ACK withheld");
                        }

                      } else if (id(write_stage)==40) {
                        // Guarded Thermia Write selected-word republish verification / cache refresh.
                        if (st==0x03E8 && ct==14 && bc==28 && bytes.size()==37) {
                          uint16_t got[14];
                          for (uint8_t i=0;i<14;i++) got[i]=u16(bytes,7+size_t(i)*2);
                          const uint8_t ws=id(write_write_state);
                          const uint8_t wi=id(write_write_word_index);
                          const uint16_t reg=id(write_write_register);
                          auto cache_page = [&]() {
                            id(write_page_w00)=got[0]; id(write_page_w01)=got[1]; id(write_page_w02)=got[2]; id(write_page_w03)=got[3];
                            id(write_page_w04)=got[4]; id(write_page_w05)=got[5]; id(write_page_w06)=got[6]; id(write_page_w07)=got[7];
                            id(write_page_w08)=got[8]; id(write_page_w09)=got[9]; id(write_page_w10)=got[10]; id(write_page_w11)=got[11];
                            id(write_page_w12)=got[12]; id(write_page_w13)=got[13];
                            id(write_page_cache_valid)=true; id(write_page_cache_ms)=now_ms;
                            // Controller FC16 remains authoritative for the SOURCE CACHE.
                            // The Configuration UI, however, represents EFFECTIVE USER INTENT:
                            // active transaction target > pending dirty target > controller value.
                            // publish_state() changes HA presentation only and never calls set_action.
                            const uint8_t active_ws=id(write_write_state);
                            const uint8_t active_wi=id(write_write_word_index);
                            const bool active_semantic =
                              active_ws==1 || active_ws==2 || active_ws==3 ||
                              active_ws==5 || active_ws==6;

                            auto effective_u16 = [&](uint8_t word, uint16_t controller, uint16_t dirty)->uint16_t {
                              if (active_semantic && active_wi==word) return id(write_requested_target);
                              if (id(write_dirty_mask) & uint16_t(1u<<word)) return dirty;
                              return controller;
                            };

                            const uint16_t ui_w00=effective_u16(0,got[0],id(write_dirty_w00));
                            const uint16_t ui_w01=effective_u16(1,got[1],id(write_dirty_w01));
                            const uint16_t ui_w02=effective_u16(2,got[2],id(write_dirty_w02));
                            const uint16_t ui_w03=effective_u16(3,got[3],id(write_dirty_w03));
                            const uint16_t ui_w04=effective_u16(4,got[4],id(write_dirty_w04));
                            const uint16_t ui_w05=effective_u16(5,got[5],id(write_dirty_w05));
                            const uint16_t ui_w06=effective_u16(6,got[6],id(write_dirty_w06));
                            const uint16_t ui_w07=effective_u16(7,got[7],id(write_dirty_w07));
                            const uint16_t ui_w08=effective_u16(8,got[8],id(write_dirty_w08));
                            const uint16_t ui_w12=effective_u16(12,got[12],id(write_dirty_w12));

                            id(thermia_write_heating_curve_target_control).publish_state(float(ui_w00));
                            id(thermia_write_heating_min_target_control).publish_state(float(ui_w01));
                            id(thermia_write_heating_max_target_control).publish_state(float(ui_w02));
                            id(thermia_write_curve_plus5_target_control).publish_state(float(int16_t(ui_w03)));
                            id(thermia_write_curve_zero_target_control).publish_state(float(int16_t(ui_w04)));
                            id(thermia_write_curve_minus5_target_control).publish_state(float(int16_t(ui_w05)));
                            id(thermia_write_heating_stop_target_control).publish_state(float(ui_w06));
                            id(thermia_write_reduced_temperature_target_control).publish_state(float(ui_w07));
                            id(thermia_write_room_factor_target_control).publish_state(float(ui_w08));
                            id(thermia_write_room_setpoint_target_control).publish_state(float(ui_w12));
                            id(write_config_synced)=true;

                            ESP_LOGE("thermia_write",
                              "\033[38;5;130m[WRITE] UI_EFFECTIVE_INTENT activeState=%u activeWord=%u dirtyMask=%04X "
                              "controllerCorr=[%d,%d,%d] uiCorr=[%d,%d,%d] NO_TX\033[0m",
                              unsigned(active_ws),unsigned(active_wi),unsigned(id(write_dirty_mask)),
                              int(int16_t(got[3])),int(int16_t(got[4])),int(int16_t(got[5])),
                              int(int16_t(ui_w03)),int(int16_t(ui_w04)),int(int16_t(ui_w05)));
                            ESP_LOGE("thermia_write","\033[38;5;130m[WRITE] ===== CONFIG_SYNCED source=controller_FC16_03E8 curve=%u min=%u max=%u corrP5=%d corr0=%d corrM5=%d stop=%u reduced=%u roomFactor=%u room=%u writeState=%u =====\033[0m",
                              unsigned(got[0]),unsigned(got[1]),unsigned(got[2]),
                              int(int16_t(got[3])),int(int16_t(got[4])),int(int16_t(got[5])),
                              unsigned(got[6]),unsigned(got[7]),unsigned(got[8]),unsigned(got[12]),unsigned(id(write_write_state)));
                          };
                          auto selected_valid = [&](uint16_t current, uint16_t target)->bool {
                            if (wi==0) return current>=22 && current<=56 && target>=22 && target<=56;
                            if (wi==12) return current>=10 && current<=30 && target>=10 && target<=30;
                            if (wi==1) return current>=20 && current<=40 && target>=20 && target<=40;
                            if (wi==2) return current>=40 && current<=85 && target>=40 && target<=85;
                            if (wi==3 || wi==4 || wi==5) {
                              const int16_t cs=int16_t(current);
                              const int16_t ts=int16_t(target);
                              return cs>=-5 && cs<=5 && ts>=-5 && ts<=5;
                            }
                            if (wi==6) return current<=22 && target<=22;
                            if (wi==7) return current>=10 && current<=30 && target>=10 && target<=30;
                            if (wi==8) return current<=4 && target<=4;
                            return false;
                          };

                          if (ws==1 || ws==5 || ws==6) {
                            cache_page();
                            if (wi>=14 || !(wi==0 || wi==1 || wi==2 || wi==3 || wi==4 || wi==5 || wi==6 || wi==7 || wi==8 || wi==12)) {
                              write_stop("COMPLETE / INCONCLUSIVE / invalid selected 03E8-page word", "selected write index invalid; no semantic TX");
                              return;
                            }
                            id(write_original_value)=got[wi];
                            const uint16_t derived_target=id(write_requested_target);
                            id(write_target_value)=derived_target;
                            if (!selected_valid(got[wi],id(write_target_value))) {
                              write_stop("COMPLETE / INCONCLUSIVE / selected value guard failed", "source/target bounds guard failed; no semantic TX");
                              return;
                            }
                            if (ws==6) {
                              id(write_refresh_confirmed_count)++;
                              id(thermia_write_refresh_confirmed_count_sensor)->publish_state(float(id(write_refresh_confirmed_count)));
                              const uint32_t refresh_latency=id(write_refresh_request_ms)?now_ms-id(write_refresh_request_ms):0;
                              id(write_refresh_request_ms)=0;
                              ESP_LOGE("thermia_write","\033[31m[WRITE] ===== REFRESH_CONFIRMED refreshNo=%u reg=%04X word=%u current=%u target=%u latency=%ums source=controller_FC16_03E8_14 NO_DESIRED_PULL=1 CACHE_FRESH=1 =====\033[0m",
                                unsigned(id(write_refresh_confirmed_count)),unsigned(reg),unsigned(wi),unsigned(got[wi]),unsigned(id(write_target_value)),unsigned(refresh_latency));
                            } else if (ws==5) {
                              id(write_refresh_request_ms)=0;
                              ESP_LOGE("thermia_write","\033[38;5;130m[WRITE] ===== CACHE_RESOLVED_PASSIVELY reg=%04X word=%u current=%u target=%u NO_REFRESH_TX =====\033[0m",
                                unsigned(reg),unsigned(wi),unsigned(got[wi]),unsigned(id(write_target_value)));
                            } else {
                              ESP_LOGE("thermia_write","\033[38;5;130m[WRITE] WRITE_ARM_CACHE_REFRESH reg=%04X word=%u current=%u target=%u source=fresh_controller_FC16 beforeSelector=1\033[0m",
                                unsigned(reg),unsigned(wi),unsigned(got[wi]),unsigned(id(write_target_value)));
                            }
                            id(write_delayed_refresh_pending)=false;
                            if (id(write_target_value)==got[wi]) {
                              id(write_write_state)=0;
                              id(write_last_confirm_ms)=now_ms;
                              id(write_queue_not_before_ms)=now_ms+2000UL;
                              id(thermia_write_write_confirmed_sensor)->publish_state(true);
                              id(thermia_write_status)->publish_state("READY / selected value already current / no semantic TX required");
                              id(thermia_write_last_event)->publish_state("WRITE NOT NEEDED: fresh controller page already equals slider target; READY");
                            } else {
                              id(write_write_state)=1;
                              id(write_write_arm_ms)=now_ms;
                              id(thermia_write_status)->publish_state("RUNNING / fresh 03E8 cached / selected one-word write queued");
                              id(thermia_write_last_event)->publish_state("fresh page confirmed; wait next 0708 for semantic selector");
                            }
                          } else if (ws==3) {
                            const uint16_t target=id(write_target_value);
                            const uint16_t cached[14]={
                              id(write_page_w00),id(write_page_w01),id(write_page_w02),id(write_page_w03),
                              id(write_page_w04),id(write_page_w05),id(write_page_w06),id(write_page_w07),
                              id(write_page_w08),id(write_page_w09),id(write_page_w10),id(write_page_w11),
                              id(write_page_w12),id(write_page_w13)
                            };
                            uint8_t extra=0; bool expected_match=true;
                            for (uint8_t i=0;i<14;i++) {
                              const uint16_t exp=(i==wi)?target:cached[i];
                              if (got[i]!=exp) { expected_match=false; if (i!=wi) extra++; }
                            }
                            id(write_extra_delta_words)=extra;
                            if (expected_match && extra==0) {
                              cache_page();
                              id(write_confirmed_write_count)++;
                              id(write_delayed_refresh_pending)=false;
                              id(write_write_state)=0;
                              id(write_last_confirm_ms)=now_ms;
                              id(write_queue_not_before_ms)=now_ms+2000UL;
                              id(thermia_write_write_confirmed_sensor)->publish_state(true);
                              id(thermia_write_confirmed_write_count_sensor)->publish_state(float(id(write_confirmed_write_count)));
                              if (wi==0) id(thermia_write_heating_curve_target_control).publish_state(got[wi]);
                              else if (wi==1) id(thermia_write_heating_min_target_control).publish_state(got[wi]);
                              else if (wi==2) id(thermia_write_heating_max_target_control).publish_state(got[wi]);
                              else if (wi==3) id(thermia_write_curve_plus5_target_control).publish_state(float(int16_t(got[wi])));
                              else if (wi==4) id(thermia_write_curve_zero_target_control).publish_state(float(int16_t(got[wi])));
                              else if (wi==5) id(thermia_write_curve_minus5_target_control).publish_state(float(int16_t(got[wi])));
                              else if (wi==6) id(thermia_write_heating_stop_target_control).publish_state(got[wi]);
                              else if (wi==7) id(thermia_write_reduced_temperature_target_control).publish_state(got[wi]);
                              else if (wi==8) id(thermia_write_room_factor_target_control).publish_state(got[wi]);
                              else if (wi==12) id(thermia_write_room_setpoint_target_control).publish_state(got[wi]);
                              id(thermia_write_status)->publish_state("READY / last selected one-word write confirmed / reusable");
                              id(thermia_write_last_event)->publish_state("WRITE_CONFIRMED exact 03E8 republish; transaction closed; READY");
                              ESP_LOGE("thermia_write","\033[31m[WRITE] ===== WRITE_CONFIRMED writeNo=%u reg=%04X word=%u original=%u target=%u observed=%u extraDeltaWords=0 semanticResponsesThisTx=%u TRANSACTION_CLOSED_READY=1 =====\033[0m",
                                unsigned(id(write_confirmed_write_count)),unsigned(reg),unsigned(wi),unsigned(id(write_original_value)),unsigned(target),unsigned(got[wi]),unsigned(id(write_semantic_response_count)));
                            } else {
                              id(write_pending_valid)=false; id(write_pending_generation)=0; id(write_queue_not_before_ms)=0; id(write_dirty_mask)=0;
                              ESP_LOGE("thermia_write","\033[31m[WRITE] ===== REPUBLISH_MISMATCH reg=%04X word=%u expected=%u observed=%u original=%u extraDeltaWords=%u NO_MORE_SEMANTIC_TX RAW=%s =====\033[0m",
                                unsigned(reg),unsigned(wi),unsigned(target),unsigned(got[wi]),unsigned(id(write_original_value)),unsigned(extra),raw325);
                              if (extra==0 && got[wi]==id(write_original_value)) {
                                write_stop("COMPLETE / NEGATIVE / selected desired value not applied", "controller republished original selected value unchanged");
                              } else {
                                write_stop("COMPLETE / INCONCLUSIVE / 03E8 republish mismatch or extra delta", "semantic republish did not exactly match desired page");
                              }
                              return;
                            }
                          } else if (ws==0 || ws==4 || ws==7 || ws==8) {
                            cache_page();
                            if (ws==8) {
                              // Dedicated autosync state. Never enters semantic selected-word logic.
                              // Close directly to READY after authoritative controller page.
                              id(write_refresh_confirmed_count)++;
                              id(thermia_write_refresh_confirmed_count_sensor)->publish_state(float(id(write_refresh_confirmed_count)));
                              id(write_refresh_request_ms)=0;
                              id(write_write_state)=0;
                              id(write_queue_not_before_ms)=now_ms+2000UL;
                              id(thermia_write_status)->publish_state("READY / Configuration synchronized from controller / writes enabled");
                              id(thermia_write_last_event)->publish_state("CONFIG_AUTOSYNC_CONFIRMED: authoritative 03E8 page published to all controls");
                              ESP_LOGE("thermia_write","\033[31m[WRITE] ===== CONFIG_AUTOSYNC_CONFIRMED refreshOK=%u curve=%u min=%u max=%u corrP5=%d corr0=%d corrM5=%d stop=%u reduced=%u roomFactor=%u room=%u writeState=0 READY=1 =====\033[0m",
                                unsigned(id(write_refresh_confirmed_count)),
                                unsigned(got[0]),unsigned(got[1]),unsigned(got[2]),
                                int(int16_t(got[3])),int(int16_t(got[4])),int(int16_t(got[5])),
                                unsigned(got[6]),unsigned(got[7]),unsigned(got[8]),unsigned(got[12]));
                            } else if (ws==0) {
                              id(thermia_write_status)->publish_state("READY / Configuration synchronized from controller");
                              id(thermia_write_last_event)->publish_state("CONFIG_SYNCED: authoritative controller 03E8 page published to all controls");
                            }
                            ESP_LOGE("thermia_write","\033[38;5;130m[WRITE] 03E8_CACHE_REFRESH curve=%u min=%u max=%u room=%u source=runtime_controller_FC16\033[0m",
                              unsigned(got[0]),unsigned(got[1]),unsigned(got[2]),unsigned(got[12]));
                          }
                        }

                        // ===============================================================
                        // EXP378 — persistent multi-control 0x042E/count15 semantic write.
                        // Same proven page path as EXP377; exactly one word per transaction.
                        // ===============================================================
                        if (st==0x042E && ct==15 && bc==30 && bytes.size()==39) {
                          uint16_t e378[15];
                          for (uint8_t i=0;i<15;i++) e378[i]=u16(bytes,7+size_t(i)*2);
                          id(exp378_sync_valid)=true;
                          // Always retain newest authoritative controller values as OW.
                          if (e378[0]<=1) id(exp378_confirmed_w00)=e378[0];
                          if (e378[1]<=2) id(exp378_confirmed_w01)=e378[1];
