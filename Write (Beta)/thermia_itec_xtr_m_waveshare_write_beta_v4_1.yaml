  - platform: template
    id: exp380_operation_mode_control
    name: "01 Operation | 01 Mode"
    entity_category: config
    icon: mdi:heat-pump
    optimistic: false
    restore_value: false
    options:
      - "Uit"
      - "Auto"
      - "Compressor"
      - "Bijverwarmer"
      - "Warmwater"
    set_action:
      - lambda: |-
          uint16_t target=0xFFFF;
          if (x=="Uit") target=0;
          else if (x=="Auto") target=1;
          else if (x=="Compressor") target=2;
          else if (x=="Bijverwarmer") target=3;
          else if (x=="Warmwater") target=4;
          else return;

          auto publish_confirmed=[&]() {
            if (!id(exp380_sync_valid)) return;
            if (id(exp380_confirmed_mode)==0) id(exp380_operation_mode_control).publish_state("Uit");
            else if (id(exp380_confirmed_mode)==1) id(exp380_operation_mode_control).publish_state("Auto");
            else if (id(exp380_confirmed_mode)==2) id(exp380_operation_mode_control).publish_state("Compressor");
            else if (id(exp380_confirmed_mode)==3) id(exp380_operation_mode_control).publish_state("Bijverwarmer");
            else if (id(exp380_confirmed_mode)==4) id(exp380_operation_mode_control).publish_state("Warmwater");
          };

          if (!id(exp380_sync_valid) || !id(write_config_synced) || !id(write_active) || id(write_stage)!=40 || id(exp380_state)==5) {
            publish_confirmed();
            id(exp380_status)->publish_state("BLOCKED / Operation Mode control unavailable / authoritative value restored");
            return;
          }

          // Uniform desired-state UI: show NW immediately and keep it visible while queued/in-flight.
          id(exp380_operation_mode_control).publish_state(x);
          id(exp380_desired_mode)=target;
          id(exp380_dirty)=true;
          id(exp380_status)->publish_state("QUEUED / desired Operation Mode retained until safe dispatch");
          ESP_LOGE("thermia_exp380","\033[38;5;130m[EXP380] ===== UI_DESIRED_QUEUE reg=0553 word=13 target=%u dirty=1 activeState=%u prodWriteState=%u prodDirty=%04X UI_NW_RETAINED=1 =====\033[0m",
            unsigned(target),unsigned(id(exp380_state)),unsigned(id(write_write_state)),unsigned(id(write_dirty_mask)));

interval:
  - interval: 250ms
    then:
      - lambda: |-
          if (!id(write_active)) return;
          const uint32_t now=millis(), last=id(thermia_last_valid_frame_ms);


          // EXP380 fail-closed integrity and timeout guard. No retries.
          if ((id(exp380_state)>=1 && id(exp380_state)<=4) || id(exp380_state)==6) {
            const uint32_t er=id(thermia_parser_resync_count)-id(exp380_resync_baseline);
            const uint32_t ed=id(thermia_rx_buffer_drop_count)-id(exp380_drop_baseline);
            const uint32_t ep17=id(write_peer_fc17_count)-id(exp380_peer17_baseline);
            const uint32_t ep16=id(write_peer_fc16_ack_count)-id(exp380_peer16ack_baseline);
            const uint8_t es=id(exp380_state);
            const uint32_t age = es==1 ? (id(exp380_arm_ms)?now-id(exp380_arm_ms):0) :
                                 es==2 ? (id(exp380_cache_ms)?now-id(exp380_cache_ms):0) :
                                 es==3 ? (id(exp380_selector_ms)?now-id(exp380_selector_ms):0) :
                                 es==4 ? (id(exp380_desired_ms)?now-id(exp380_desired_ms):0) :
                                         (id(exp380_selector_ms)?now-id(exp380_selector_ms):0);
            const uint32_t limit = (es==1 || es==2) ? 15000UL : 5000UL;
            if (id(write_stage)!=40 || er || ed || ep17 || ep16 || age>limit) {
              id(exp380_state)=5; id(exp380_dirty)=false; id(exp383_link_dirty)=false; id(exp380_refresh_for_write)=false;
              if (id(exp380_sync_valid)) {
                if (id(exp380_confirmed_mode)==0) id(exp380_operation_mode_control).publish_state("Uit");
                else if (id(exp380_confirmed_mode)==1) id(exp380_operation_mode_control).publish_state("Auto");
                else if (id(exp380_confirmed_mode)==2) id(exp380_operation_mode_control).publish_state("Compressor");
                else if (id(exp380_confirmed_mode)==3) id(exp380_operation_mode_control).publish_state("Bijverwarmer");
                else if (id(exp380_confirmed_mode)==4) id(exp380_operation_mode_control).publish_state("Warmwater");
                if (id(exp383_confirmed_link)<=1) id(exp383_link_integration_control).publish_state(id(exp383_confirmed_link)==1 ? "System" : "Light");
              }
              id(exp380_status)->publish_state("COMPLETE / INCONCLUSIVE / EXP380 guard or timeout / disabled until reboot");
              ESP_LOGE("thermia_exp380","\033[31m[EXP380] ===== ABORT state=%u age=%ums limit=%ums stage=%u resyncDelta=%u dropDelta=%u peer17Delta=%u peer16ackDelta=%u NO_RETRY EXP380_DISABLED DE=LOW =====\033[0m",
                unsigned(es),unsigned(age),unsigned(limit),unsigned(id(write_stage)),unsigned(er),unsigned(ed),unsigned(ep17),unsigned(ep16));
            }
          }

          // EXP380/EXP383 0546 dirty dispatcher.
          // Operation Mode (word13) retains priority; TEST Link Integration (word19)
          // is dispatched only after all existing write engines are idle.
          if (id(write_stage)==40 && id(write_active) && id(exp380_sync_valid) && id(exp380_state)==0 &&
              (id(exp380_dirty) || id(exp383_link_dirty)) &&
              id(write_write_state)==0 && (id(exp378_state)==0 || id(exp378_state)==5) && (id(exp379_state)==0 || id(exp379_state)==5)) {
            const uint32_t rt_age=id(write_runtime_enter_ms)?now-id(write_runtime_enter_ms):0;
            const uint32_t resync_delta=id(thermia_parser_resync_count)-id(write_resync_baseline);
            const uint32_t drop_delta=id(thermia_rx_buffer_drop_count)-id(write_drop_baseline);
            const bool runtime_qualified=
              id(write_runtime_fc16_ack_count)>=1 && id(write_runtime_0708_reply_count)>=1 &&
              id(write_runtime_unknown_fc16_count)==0 && id(write_runtime_unknown_fc03_count)==0 &&
              id(write_peer_fc17_count)==0 && id(write_peer_fc16_ack_count)==0 &&
              resync_delta==0 && drop_delta==0 && rt_age>=10000UL;
            if (runtime_qualified) {
              if (id(exp380_dirty)) {
                id(exp380_target_word)=13;
                id(exp380_target_value)=id(exp380_desired_mode);
                id(exp380_dirty)=false;
              } else {
                id(exp380_target_word)=19;
                id(exp380_target_value)=id(exp383_desired_link);
                id(exp383_link_dirty)=false;
              }
              id(exp380_original_value)=0xFFFF;
              id(exp380_arm_ms)=now; id(exp380_selector_ms)=0; id(exp380_desired_ms)=0; id(exp380_cache_ms)=0;
              id(exp380_semantic_responses)=0; id(exp380_refresh_for_write)=true;
              id(exp380_resync_baseline)=id(thermia_parser_resync_count);
              id(exp380_drop_baseline)=id(thermia_rx_buffer_drop_count);
              id(exp380_peer17_baseline)=id(write_peer_fc17_count);
              id(exp380_peer16ack_baseline)=id(write_peer_fc16_ack_count);
              id(exp380_state)=1;
              id(exp380_status)->publish_state(id(exp380_target_word)==19 ?
                "RUNNING / TEST Link Integration latched / wait fresh current 0546" :
                "RUNNING / queued Operation Mode latched / wait fresh current 0546");
              ESP_LOGE(id(exp380_target_word)==19 ? "thermia_exp383" : "thermia_exp380",
                "\033[31m[EXP383] ===== DIRTY_QUEUE_DISPATCH_LATCHED reg=%04X word=%u target=%u wait=0708_W2_CURRENT_REFRESH =====\033[0m",
                unsigned(0x0546+id(exp380_target_word)),unsigned(id(exp380_target_word)),unsigned(id(exp380_target_value)));
            } else {
              id(exp380_status)->publish_state("QUEUED / 0546 desired value retained / waiting clean runtime qualification");
            }
          }

          // EXP379 fail-closed integrity and timeout guard. No retries.
          if ((id(exp379_state)>=1 && id(exp379_state)<=4) || id(exp379_state)==6) {
            const uint32_t er=id(thermia_parser_resync_count)-id(exp379_resync_baseline);
            const uint32_t ed=id(thermia_rx_buffer_drop_count)-id(exp379_drop_baseline);
            const uint32_t ep17=id(write_peer_fc17_count)-id(exp379_peer17_baseline);
            const uint32_t ep16=id(write_peer_fc16_ack_count)-id(exp379_peer16ack_baseline);
            const uint8_t es=id(exp379_state);
            const uint32_t age = es==1 ? (id(exp379_arm_ms)?now-id(exp379_arm_ms):0) : es==2 ? (id(exp379_cache_ms)?now-id(exp379_cache_ms):0) : es==3 ? (id(exp379_selector_ms)?now-id(exp379_selector_ms):0) : es==4 ? (id(exp379_desired_ms)?now-id(exp379_desired_ms):0) : (id(exp379_selector_ms)?now-id(exp379_selector_ms):0);
            const uint32_t limit = es==1 ? 15000UL : es==2 ? 15000UL : 5000UL;
            if (id(write_stage)!=40 || er || ed || ep17 || ep16 || age>limit) {
              id(exp379_state)=5; id(exp379_dirty_mask)=0; id(exp379_refresh_for_write)=false;
              if (id(exp379_sync_valid)) {
                id(exp379_cooling_enabled_control).publish_state(id(exp379_confirmed_w00)==1);
                id(exp379_cooling_temp_control).publish_state(float(id(exp379_confirmed_w01)));
                id(exp383_cooling_hysteresis_control).publish_state(float(id(exp379_confirmed_w02))/10.0f);
                if (id(exp379_confirmed_w04)==0) id(exp383_cooling_configuration_control).publish_state("Uit");
                else if (id(exp379_confirmed_w04)==1) id(exp383_cooling_configuration_control).publish_state("Actieve koeling");
                else if (id(exp379_confirmed_w04)==2) id(exp383_cooling_configuration_control).publish_state("Geïntegreerd in WP");
                id(exp379_cooling_active_control).publish_state(float(id(exp379_confirmed_w03)));
                id(exp383_cooling_stop_control).publish_state(float(id(exp379_confirmed_w06)));
                id(exp379_cooling_time_control).publish_state(float(id(exp379_confirmed_w07)));
                id(exp383_cooling_max_start_control).publish_state(float(id(exp379_confirmed_w08)));
                id(exp383_cooling_min_stop_control).publish_state(float(id(exp379_confirmed_w09)));
                id(exp379_room_sensor_control).publish_state(id(exp379_confirmed_w10)==1);
                id(exp379_hyst_low_control).publish_state(float(id(exp379_confirmed_w11))/10.0f);
                id(exp379_hyst_high_control).publish_state(float(id(exp379_confirmed_w12))/10.0f);
              }
              id(exp379_status)->publish_state("COMPLETE / INCONCLUSIVE / EXP379 guard or timeout / disabled until reboot");
              ESP_LOGE("thermia_exp379","\033[31m[EXP379] ===== ABORT state=%u age=%ums limit=%ums stage=%u resyncDelta=%u dropDelta=%u peer17Delta=%u peer16ackDelta=%u NO_RETRY EXP379_DISABLED DE=LOW =====\033[0m",
                unsigned(es),unsigned(age),unsigned(limit),unsigned(id(write_stage)),unsigned(er),unsigned(ed),unsigned(ep17),unsigned(ep16));
            }
          }

          // EXP379/383 mapped-cooling dirty-set dispatcher. Existing EXP378 and production
          // writes remain serialized. NW stays visible while queued.
          if (id(write_stage)==40 && id(write_active) && id(exp379_sync_valid) && id(exp379_state)==0 && id(exp379_dirty_mask)!=0 &&
              id(write_write_state)==0 && (id(exp378_state)==0 || id(exp378_state)==5) && (id(exp380_state)==0 || id(exp380_state)==5)) {
            const uint32_t rt_age=id(write_runtime_enter_ms)?now-id(write_runtime_enter_ms):0;
            const uint32_t resync_delta=id(thermia_parser_resync_count)-id(write_resync_baseline);
            const uint32_t drop_delta=id(thermia_rx_buffer_drop_count)-id(write_drop_baseline);
            const bool runtime_qualified=id(write_runtime_fc16_ack_count)>=1 && id(write_runtime_0708_reply_count)>=1 && id(write_runtime_unknown_fc16_count)==0 && id(write_runtime_unknown_fc03_count)==0 && id(write_peer_fc17_count)==0 && id(write_peer_fc16_ack_count)==0 && resync_delta==0 && drop_delta==0 && rt_age>=10000UL;
            if (runtime_qualified) {
              const uint16_t mask=id(exp379_dirty_mask); uint8_t wi=0xFF; uint16_t target=0;
              if      (mask&(1u<<0))  { wi=0; target=id(exp379_desired_w00); }
              else if (mask&(1u<<1))  { wi=1; target=id(exp379_desired_w01); }
              else if (mask&(1u<<2))  { wi=2; target=id(exp379_desired_w02); }
              else if (mask&(1u<<3))  { wi=3; target=id(exp379_desired_w03); }
              else if (mask&(1u<<4))  { wi=4; target=id(exp379_desired_w04); }
              else if (mask&(1u<<6))  { wi=6; target=id(exp379_desired_w06); }
              else if (mask&(1u<<7))  { wi=7; target=id(exp379_desired_w07); }
              else if (mask&(1u<<8))  { wi=8; target=id(exp379_desired_w08); }
              else if (mask&(1u<<9))  { wi=9; target=id(exp379_desired_w09); }
              else if (mask&(1u<<10)) { wi=10; target=id(exp379_desired_w10); }
              else if (mask&(1u<<11)) { wi=11; target=id(exp379_desired_w11); }
              else if (mask&(1u<<12)) { wi=12; target=id(exp379_desired_w12); }
              if (wi!=0xFF) {
                id(exp379_target_word)=wi; id(exp379_target_value)=target; id(exp379_original_value)=0xFFFF;
                id(exp379_arm_ms)=now; id(exp379_selector_ms)=0; id(exp379_desired_ms)=0; id(exp379_cache_ms)=0; id(exp379_semantic_responses)=0; id(exp379_refresh_for_write)=true;
                id(exp379_resync_baseline)=id(thermia_parser_resync_count); id(exp379_drop_baseline)=id(thermia_rx_buffer_drop_count); id(exp379_peer17_baseline)=id(write_peer_fc17_count); id(exp379_peer16ack_baseline)=id(write_peer_fc16_ack_count);
                id(exp379_state)=1; id(exp379_dirty_mask)&=~uint16_t(1u<<wi);
                id(exp379_status)->publish_state("RUNNING / queued EXP379 cooling item latched / wait fresh current 0442");
                ESP_LOGE("thermia_exp379","\033[31m[EXP379] ===== DIRTY_QUEUE_DISPATCH_LATCHED reg=%04X word=%u target=%u remainingMask=%04X UI_NW_RETAINED=1 wait=0708_W3_CURRENT_REFRESH =====\033[0m",
                  unsigned(0x0442 + wi),unsigned(wi),unsigned(target),unsigned(id(exp379_dirty_mask)));
              }
            } else id(exp379_status)->publish_state("QUEUED / desired cooling values retained / waiting clean runtime qualification");
          }

          // EXP378 fail-closed integrity and timeout guard. No retries.
          if ((id(exp378_state)>=1 && id(exp378_state)<=4) || id(exp378_state)==6) {
            const uint32_t er=id(thermia_parser_resync_count)-id(exp378_resync_baseline);
            const uint32_t ed=id(thermia_rx_buffer_drop_count)-id(exp378_drop_baseline);
            const uint32_t ep17=id(write_peer_fc17_count)-id(exp378_peer17_baseline);
            const uint32_t ep16=id(write_peer_fc16_ack_count)-id(exp378_peer16ack_baseline);
            const uint8_t es=id(exp378_state);
            const uint32_t age = es==1 ? (id(exp378_arm_ms)?now-id(exp378_arm_ms):0) :
                                 es==2 ? (id(exp378_cache_ms)?now-id(exp378_cache_ms):0) :
                                 es==3 ? (id(exp378_selector_ms)?now-id(exp378_selector_ms):0) :
                                 es==4 ? (id(exp378_desired_ms)?now-id(exp378_desired_ms):0) :
                                         (id(exp378_selector_ms)?now-id(exp378_selector_ms):0);
            const uint32_t limit = es==1 ? 15000UL : es==2 ? 15000UL : es==3 ? 5000UL : es==4 ? 5000UL : 5000UL;
            if (id(write_stage)!=40 || er || ed || ep17 || ep16 || age>limit) {
              id(exp378_state)=5;
              id(exp378_dirty_mask)=0;
              if (id(exp378_sync_valid)) {
                id(exp378_sww_enabled_control).publish_state(id(exp378_confirmed_w00)==1);
                if (id(exp378_confirmed_w01)==0) id(exp378_sww_mode_control).publish_state("Comfort");
                else if (id(exp378_confirmed_w01)==1) id(exp378_sww_mode_control).publish_state("Eco");
                else if (id(exp378_confirmed_w01)==2) id(exp378_sww_mode_control).publish_state("Vakantie Eco");
                if (id(exp378_confirmed_w02)<=1) id(exp383_topup_control).publish_state(id(exp378_confirmed_w02)==1);
                id(exp378_opstart_ht_control).publish_state(float(id(exp378_confirmed_w05)));
                id(exp378_verwarmingstijd_control).publish_state(float(id(exp378_confirmed_w06)));
              }
              id(exp378_refresh_for_write)=false;
              id(exp378_status)->publish_state("COMPLETE / INCONCLUSIVE / EXP378 guard or timeout / disabled until reboot");
              ESP_LOGE("thermia_exp378","\033[31m[EXP378] ===== ABORT state=%u age=%ums limit=%ums stage=%u resyncDelta=%u dropDelta=%u peer17Delta=%u peer16ackDelta=%u NO_RETRY EXP378_DISABLED DE=LOW =====\033[0m",
                unsigned(es),unsigned(age),unsigned(limit),unsigned(id(write_stage)),unsigned(er),unsigned(ed),unsigned(ep17),unsigned(ep16));
            }
          }

          // EXP378/383 five-field dirty-set dispatcher. NW stays visible while queued.
          // Production 03E8 traffic remains serialized; EXP378 dispatches only when it is clear.
          if (id(write_stage)==40 && id(write_active) && id(exp378_sync_valid) && id(exp378_state)==0 &&
              id(exp378_dirty_mask)!=0 && id(write_write_state)==0 && (id(exp379_state)==0 || id(exp379_state)==5) && (id(exp380_state)==0 || id(exp380_state)==5)) {
            const uint32_t rt_age=id(write_runtime_enter_ms)?now-id(write_runtime_enter_ms):0;
            const uint32_t resync_delta=id(thermia_parser_resync_count)-id(write_resync_baseline);
            const uint32_t drop_delta=id(thermia_rx_buffer_drop_count)-id(write_drop_baseline);
            const bool runtime_qualified=
              id(write_runtime_fc16_ack_count)>=1 && id(write_runtime_0708_reply_count)>=1 &&
              id(write_runtime_unknown_fc16_count)==0 && id(write_runtime_unknown_fc03_count)==0 &&
              id(write_peer_fc17_count)==0 && id(write_peer_fc16_ack_count)==0 &&
              resync_delta==0 && drop_delta==0 && rt_age>=10000UL;
            if (runtime_qualified) {
              const uint16_t mask=id(exp378_dirty_mask);
              uint8_t wi=0xFF; uint16_t target=0;
              if      (mask&(1u<<0)) { wi=0; target=id(exp378_desired_w00); }
              else if (mask&(1u<<1)) { wi=1; target=id(exp378_desired_w01); }
              else if (mask&(1u<<2)) { wi=2; target=id(exp378_desired_w02); }
              else if (mask&(1u<<5)) { wi=5; target=id(exp378_desired_w05); }
              else if (mask&(1u<<6)) { wi=6; target=id(exp378_desired_w06); }
              if (wi!=0xFF) {
                id(exp378_target_word)=wi; id(exp378_target_value)=target; id(exp378_original_value)=0xFFFF;
                id(exp378_arm_ms)=now; id(exp378_selector_ms)=0; id(exp378_desired_ms)=0; id(exp378_cache_ms)=0;
                id(exp378_semantic_responses)=0; id(exp378_refresh_for_write)=true;
                id(exp378_resync_baseline)=id(thermia_parser_resync_count);
                id(exp378_drop_baseline)=id(thermia_rx_buffer_drop_count);
                id(exp378_peer17_baseline)=id(write_peer_fc17_count);
                id(exp378_peer16ack_baseline)=id(write_peer_fc16_ack_count);
                id(exp378_state)=1;
                id(exp378_dirty_mask)&=~uint16_t(1u<<wi);
                id(exp378_status)->publish_state("RUNNING / queued EXP378 item latched / wait fresh current 042E");
                ESP_LOGE("thermia_exp378","\033[31m[EXP378] ===== DIRTY_QUEUE_DISPATCH_LATCHED reg=%04X word=%u target=%u remainingMask=%04X UI_NW_RETAINED=1 wait=0708_W3_CURRENT_REFRESH =====\033[0m",
                  unsigned(0x042E + wi),unsigned(wi),unsigned(target),unsigned(id(exp378_dirty_mask)));
              }
            } else {
              id(exp378_status)->publish_state("QUEUED / desired EXP378 values retained / waiting clean runtime qualification");
            }
          }

          // Thermia Write v4c per-register dirty-set dispatcher.
          // IMPORTANT: do not remove a dirty bit until every eligibility guard
          // has passed and the semantic transaction is synchronously latched.
          if (id(write_stage)==40 && id(write_active) && id(write_config_synced) &&
              id(write_write_state)==0 && id(exp378_state)==0 && id(exp378_dirty_mask)==0 &&
              (id(exp379_state)==0 || id(exp379_state)==5) && id(exp379_dirty_mask)==0 && (id(exp380_state)==0 || id(exp380_state)==5) && !id(exp380_dirty) && !id(exp383_link_dirty) && id(write_dirty_mask)!=0 &&
              (id(write_queue_not_before_ms)==0 || int32_t(now-id(write_queue_not_before_ms))>=0)) {

            const uint32_t rt_age=id(write_runtime_enter_ms)?now-id(write_runtime_enter_ms):0;
            const uint32_t resync_delta=id(thermia_parser_resync_count)-id(write_resync_baseline);
            const uint32_t drop_delta=id(thermia_rx_buffer_drop_count)-id(write_drop_baseline);
            const bool runtime_qualified=
              id(write_runtime_fc16_ack_count)>=1 &&
              id(write_runtime_0708_reply_count)>=1 &&
              id(write_runtime_unknown_fc16_count)==0 &&
              id(write_runtime_unknown_fc03_count)==0 &&
              id(write_peer_fc17_count)==0 &&
              id(write_peer_fc16_ack_count)==0 &&
              resync_delta==0 && drop_delta==0;

            if (!runtime_qualified || rt_age<10000UL) {
              // Keep every dirty bit intact. This is a queue wait, not a refusal.
