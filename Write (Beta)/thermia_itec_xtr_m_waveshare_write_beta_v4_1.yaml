                          ESP_LOGE("thermia_exp379","\033[31m[EXP379] ===== DESIRED_PAGE_TX_INTENT page=0442 count=13 reg=%04X word=%u original=%u desired=%u deltaWords=1 semanticResponseThisTx=%u/1 crc=%04X frame=%s RAWREQ=%s =====\033[0m",
                            unsigned(0x0442 + tw),unsigned(tw),unsigned(original),unsigned(id(exp379_target_value)),unsigned(id(exp379_semantic_responses)),unsigned(crc),rsphex,raw325);
                          id(waveshare_rs485_direction).turn_on(); delay_microseconds_safe(1000); id(thermia_uart).write_array(rsp,sizeof(rsp)); id(thermia_uart).flush(); delay_microseconds_safe(1000); id(waveshare_rs485_direction).turn_off();
                          ESP_LOGE("thermia_exp379","\033[31m[EXP379] ===== DESIRED_PAGE_TX_EXECUTED page=0442 reg=%04X word=%u desired=%u DE=LOW wait=FC16_0442_13_REPUBLISH =====\033[0m",
                            unsigned(0x0442 + tw),unsigned(tw),unsigned(id(exp379_target_value)));
                        }

                      } else if (st==0x0546 && ct==20 && id(exp380_state)==3) {
                        const uint32_t cache_age=id(exp380_cache_ms)?now_ms-id(exp380_cache_ms):0xFFFFFFFFUL;
                        if (cache_age>15000UL || id(exp380_semantic_responses)>=1 || id(write_write_state)!=0 || id(write_dirty_mask)!=0 ||
                            !((id(exp378_state)==0)||(id(exp378_state)==5)) || !((id(exp379_state)==0)||(id(exp379_state)==5))) {
                          id(exp380_state)=5; id(exp380_dirty)=false; id(exp383_link_dirty)=false;
                          if (id(exp380_sync_valid)) {
                            if (id(exp380_confirmed_mode)==0) id(exp380_operation_mode_control).publish_state("Uit");
                            else if (id(exp380_confirmed_mode)==1) id(exp380_operation_mode_control).publish_state("Auto");
                            else if (id(exp380_confirmed_mode)==2) id(exp380_operation_mode_control).publish_state("Compressor");
                            else if (id(exp380_confirmed_mode)==3) id(exp380_operation_mode_control).publish_state("Bijverwarmer");
                            else if (id(exp380_confirmed_mode)==4) id(exp380_operation_mode_control).publish_state("Warmwater");
                          }
                          id(exp380_status)->publish_state("COMPLETE / INCONCLUSIVE / desired-page guard failed / EXP380 disabled");
                          ESP_LOGE("thermia_exp380","\033[31m[EXP380] ===== DESIRED_PAGE_REFUSED page=0546 cacheAge=%ums semanticResponses=%u writeState=%u prodDirty=%04X NO_TX =====\033[0m",
                            unsigned(cache_age),unsigned(id(exp380_semantic_responses)),unsigned(id(write_write_state)),unsigned(id(write_dirty_mask)));
                        } else {
                          uint16_t words[20]={
                            id(exp380_w00),id(exp380_w01),id(exp380_w02),id(exp380_w03),id(exp380_w04),
                            id(exp380_w05),id(exp380_w06),id(exp380_w07),id(exp380_w08),id(exp380_w09),
                            id(exp380_w10),id(exp380_w11),id(exp380_w12),id(exp380_w13),id(exp380_w14),
                            id(exp380_w15),id(exp380_w16),id(exp380_w17),id(exp380_w18),id(exp380_w19)
                          };
                          const uint8_t tw=id(exp380_target_word);
                          if (!(tw==13 || tw==19)) {
                            id(exp380_state)=5; id(exp380_dirty)=false; id(exp383_link_dirty)=false;
                            if (id(exp380_sync_valid)) {
                              if (id(exp380_confirmed_mode)==0) id(exp380_operation_mode_control).publish_state("Uit");
                              else if (id(exp380_confirmed_mode)==1) id(exp380_operation_mode_control).publish_state("Auto");
                              else if (id(exp380_confirmed_mode)==2) id(exp380_operation_mode_control).publish_state("Compressor");
                              else if (id(exp380_confirmed_mode)==3) id(exp380_operation_mode_control).publish_state("Bijverwarmer");
                              else if (id(exp380_confirmed_mode)==4) id(exp380_operation_mode_control).publish_state("Warmwater");
                              if (id(exp383_confirmed_link)<=1) id(exp383_link_integration_control).publish_state(id(exp383_confirmed_link)==1 ? "System" : "Light");
                            }
                            id(exp380_status)->publish_state("COMPLETE / INCONCLUSIVE / invalid 0546 target word");
                            return;
                          }
                          const uint16_t original=words[tw];
                          words[tw]=id(exp380_target_value);

                          uint8_t rsp[45]={0x0F,0x03,0x28};
                          for (uint8_t i=0;i<20;i++) {
                            rsp[3+i*2]=uint8_t((words[i]>>8)&0xFF);
                            rsp[4+i*2]=uint8_t(words[i]&0xFF);
                          }
                          uint16_t crc=0xFFFF;
                          for (size_t i=0;i<43;i++) {
                            crc ^= rsp[i];
                            for (uint8_t b=0;b<8;b++) crc=(crc&1)?uint16_t((crc>>1)^0xA001):uint16_t(crc>>1);
                          }
                          rsp[43]=uint8_t(crc&0xFF); rsp[44]=uint8_t((crc>>8)&0xFF);
                          char rsphex[100]; size_t hp=0; static const char hx380[]="0123456789ABCDEF";
                          for (size_t i=0;i<sizeof(rsp) && hp+2<sizeof(rsphex);i++) {
                            rsphex[hp++]=hx380[(rsp[i]>>4)&0x0F]; rsphex[hp++]=hx380[rsp[i]&0x0F];
                          }
                          rsphex[hp]='\0';

                          id(exp380_semantic_responses)++;
                          id(exp380_desired_ms)=millis();
                          id(exp380_state)=4;
                          ESP_LOGE(tw==19 ? "thermia_exp383" : "thermia_exp380","\033[31m[EXP383] ===== DESIRED_PAGE_TX_INTENT page=0546 count=20 reg=%04X word=%u original=%u desired=%u deltaWords=1 semanticResponseThisTx=%u/1 crc=%04X frame=%s RAWREQ=%s =====\033[0m",
                            unsigned(0x0546+tw),unsigned(tw),unsigned(original),unsigned(id(exp380_target_value)),unsigned(id(exp380_semantic_responses)),unsigned(crc),rsphex,raw325);
                          id(waveshare_rs485_direction).turn_on(); delay_microseconds_safe(1000);
                          id(thermia_uart).write_array(rsp,sizeof(rsp)); id(thermia_uart).flush();
                          delay_microseconds_safe(1000); id(waveshare_rs485_direction).turn_off();
                          ESP_LOGE(tw==19 ? "thermia_exp383" : "thermia_exp380","\033[31m[EXP383] ===== DESIRED_PAGE_TX_EXECUTED page=0546 reg=%04X word=%u desired=%u DE=LOW wait=FC16_0546_20_REPUBLISH =====\033[0m",
                            unsigned(0x0546+tw),unsigned(tw),unsigned(id(exp380_target_value)));
                        }
                      } else if (st==0x03E8 && ct==14 && ws==6) {
                        ESP_LOGE("thermia_write","\033[31m[WRITE] ===== REFRESH_UNEXPECTED_FC03_PULL start=03E8 count=14 W1_was_0000 W3bit0_was_1 NO_PAGE_RESPONSE semanticTX=DISABLED runtimeService=CONTINUE RAW=%s =====\033[0m",raw325);
                        id(write_write_state)=7;
                        id(write_refresh_request_ms)=0;
                        id(write_pending_valid)=false; id(write_pending_generation)=0; id(write_queue_not_before_ms)=0; id(write_dirty_mask)=0;
                        id(thermia_write_status)->publish_state("COMPLETE / INCONCLUSIVE / refresh-only produced unexpected FC03 pull / runtime-only");
                        id(thermia_write_last_event)->publish_state("W3-only refresh unexpectedly produced FC03 03E8; page response withheld; semantic TX disabled");
                        return;
                      } else if (st==0x03E8 && ct==14 && ws==2) {
                        const uint32_t cache_age=id(write_page_cache_ms)?now_ms-id(write_page_cache_ms):0xFFFFFFFFUL;
                        const uint8_t wi=id(write_write_word_index);
                        if (!id(write_page_cache_valid) || cache_age>300000UL || id(write_semantic_response_count)>=1 ||
                            !(wi==0 || wi==1 || wi==2 || wi==3 || wi==4 || wi==5 || wi==6 || wi==7 || wi==8 || wi==12)) {
                          ESP_LOGE("thermia_write","\033[31m[WRITE] ===== DESIRED_PAGE_REFUSED cacheValid=%u cacheAge=%ums semanticResponses=%u word=%u NO_TX =====\033[0m",
                            unsigned(id(write_page_cache_valid)),unsigned(cache_age),unsigned(id(write_semantic_response_count)),unsigned(wi));
                          write_stop("COMPLETE / INCONCLUSIVE / desired-page response guard failed", "cache invalid/stale, selected word invalid, or semantic response budget exhausted");
                        } else {
                          uint16_t words[14]={
                            id(write_page_w00),id(write_page_w01),id(write_page_w02),id(write_page_w03),
                            id(write_page_w04),id(write_page_w05),id(write_page_w06),id(write_page_w07),
                            id(write_page_w08),id(write_page_w09),id(write_page_w10),id(write_page_w11),
                            id(write_page_w12),id(write_page_w13)
                          };
                          const uint16_t original=words[wi];
                          words[wi]=id(write_target_value);
                          uint8_t rsp[33]={0x0F,0x03,0x1C};
                          for (uint8_t i=0;i<14;i++) { rsp[3+i*2]=uint8_t((words[i]>>8)&0xFF); rsp[4+i*2]=uint8_t(words[i]&0xFF); }
                          uint16_t crc=0xFFFF;
                          for (size_t i=0;i<31;i++) { crc ^= rsp[i]; for (uint8_t b=0;b<8;b++) crc=(crc&1)?uint16_t((crc>>1)^0xA001):uint16_t(crc>>1); }
                          rsp[31]=uint8_t(crc&0xFF); rsp[32]=uint8_t((crc>>8)&0xFF);
                          char rsphex[80]; size_t hp=0; static const char hx[]="0123456789ABCDEF";
                          for (size_t i=0;i<sizeof(rsp) && hp+2<sizeof(rsphex);i++) { rsphex[hp++]=hx[(rsp[i]>>4)&0x0F]; rsphex[hp++]=hx[rsp[i]&0x0F]; }
                          rsphex[hp]='\0';
                          id(write_semantic_response_count)++; id(write_desired_ms)=millis(); id(write_write_state)=3;
                          id(thermia_write_semantic_response_count_sensor)->publish_state(float(id(write_semantic_response_count)));
                          ESP_LOGE("thermia_write","\033[31m[WRITE] ===== DESIRED_PAGE_TX_INTENT reg=%04X word=%u original=%u desired=%u deltaWords=1 semanticResponseThisTx=%u/1 crc=%04X frame=%s RAWREQ=%s =====\033[0m",
                            unsigned(id(write_write_register)),unsigned(wi),unsigned(original),unsigned(id(write_target_value)),unsigned(id(write_semantic_response_count)),unsigned(crc),rsphex,raw325);
                          id(waveshare_rs485_direction).turn_on(); delay_microseconds_safe(1000);
                          id(thermia_uart).write_array(rsp,sizeof(rsp)); id(thermia_uart).flush();
                          delay_microseconds_safe(1000); id(waveshare_rs485_direction).turn_off();
                          ESP_LOGE("thermia_write","\033[31m[WRITE] ===== DESIRED_PAGE_TX_EXECUTED reg=%04X word=%u desired=%u DE=LOW wait=FC16_03E8_14_REPUBLISH =====\033[0m",
                            unsigned(id(write_write_register)),unsigned(wi),unsigned(id(write_target_value)));
                        }

                      } else {
                        id(write_runtime_unknown_fc03_count)++;
                        id(thermia_write_runtime_unknown_fc03_sensor)->publish_state(float(id(write_runtime_unknown_fc03_count)));
                        ESP_LOGE("thermia_write","\033[31m[WRITE] ===== RUNTIME_UNEXPECTED_FC03 start=%04X count=%u writeState=%u NO_TX RAW=%s =====\033[0m",
                          unsigned(st),unsigned(ct),unsigned(ws),raw325);
                        write_stop("COMPLETE / INCONCLUSIVE / unexpected runtime FC03",
                                    "unexpected FC03 captured; no response");
                      }
                    } else {
                      ESP_LOGE("thermia_write","\033[31m[WRITE] ===== EARLY_FC03 stage=%u start=%04X count=%u NO_TX RAW=%s =====\033[0m",
                        unsigned(id(write_stage)),unsigned(st),unsigned(ct),raw325);
                      write_stop("COMPLETE / INCONCLUSIVE / FC03 before full tail completion","early FC03 captured; no response");
