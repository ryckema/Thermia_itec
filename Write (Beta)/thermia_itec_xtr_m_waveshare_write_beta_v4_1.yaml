sensor:
  - platform: template
    id: thermia_write_dirty_mask_sensor
    name: "Thermia Write Dirty Queue Mask"
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      return float(id(write_dirty_mask));

  - platform: template
    id: thermia_write_pending_write_count_sensor
    name: "Thermia Write Pending Write Count"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      uint16_t m=id(write_dirty_mask);
      uint8_t n=0;
      while (m) {
        n += (m & 1u);
        m >>= 1;
      }
      // Include the currently active semantic transaction as work in progress.
      const uint8_t ws=id(write_write_state);
      if (ws==1 || ws==2 || ws==3 || ws==5 || ws==6) n++;
      return float(n);


