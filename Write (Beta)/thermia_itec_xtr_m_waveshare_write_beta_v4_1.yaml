script:
  # Legacy helper retained but v4c dispatcher no longer calls it.
  - id: write_start_selected_write
    mode: single
    then:
      - lambda: |-
          id(waveshare_rs485_direction).turn_off();
          const uint32_t now=millis();
          const uint32_t rt_age=id(write_runtime_enter_ms)?now-id(write_runtime_enter_ms):0;
          const uint8_t wi=id(write_write_word_index);
          if (!id(write_active) || id(write_stage)!=40) {
            id(thermia_write_last_event)->publish_state("WRITE REFUSED: persistent stage 40 not active"); return;
          }
          if (id(write_write_state)!=0) {
            id(thermia_write_last_event)->publish_state("WRITE REFUSED: transaction already active; selection latch unchanged"); return;
          }
          if (!id(write_config_synced)) {
            id(thermia_write_status)->publish_state("BLOCKED / Configuration not synchronized from controller");
            id(thermia_write_last_event)->publish_state("WRITE REFUSED: CONFIG_NOT_SYNCED; wait authoritative controller FC16 03E8/count14");
            ESP_LOGE("thermia_write","\033[31m[WRITE] ===== WRITE_REFUSED CONFIG_NOT_SYNCED reg=%04X word=%u target=%u NO_TX DE=LOW =====\033[0m",
              unsigned(id(write_write_register)),unsigned(wi),unsigned(id(write_requested_target)));
            return;
          }
          const uint32_t resync_delta=id(thermia_parser_resync_count)-id(write_resync_baseline);
          const uint32_t drop_delta=id(thermia_rx_buffer_drop_count)-id(write_drop_baseline);
          const bool runtime_qualified=id(write_runtime_fc16_ack_count)>=1 && id(write_runtime_0708_reply_count)>=1 &&
            id(write_runtime_unknown_fc16_count)==0 && id(write_runtime_unknown_fc03_count)==0 && id(write_peer_fc17_count)==0 &&
            id(write_peer_fc16_ack_count)==0 && resync_delta==0 && drop_delta==0;
          if (!runtime_qualified || rt_age<10000UL || !(wi==0 || wi==1 || wi==2 || wi==3 || wi==4 || wi==5 || wi==6 || wi==7 || wi==8 || wi==12)) {
            id(thermia_write_last_event)->publish_state("WRITE REFUSED: runtime/word guard not satisfied"); return;
          }
          // Thermia Write: each slider transaction starts from a fresh controller page.
          // Thermia Write supports words 0..8 and 12 with per-setting bounds; no +/-1 or one-shot write limit.
          // Counters used as per-transaction guards are reset here; confirmedWrites stays cumulative.
          id(write_semantic_response_count)=0;
          id(thermia_write_semantic_response_count_sensor)->publish_state(0);
          id(write_extra_delta_words)=0;
          id(write_original_value)=0;
          id(write_target_value)=id(write_requested_target);
          id(thermia_write_write_confirmed_sensor)->publish_state(false);
          id(write_page_cache_valid)=false;
          id(write_page_cache_ms)=0;
          id(write_write_arm_ms)=now; id(write_selector_ms)=0; id(write_desired_ms)=0; id(write_refresh_request_ms)=0;
          id(write_write_state)=5;
          id(thermia_write_status)->publish_state("RUNNING / fresh 03E8 requested / slider transaction latched");
          id(thermia_write_last_event)->publish_state("CACHE_REFRESH_ARM: fresh controller page required before semantic TX");
          ESP_LOGE("thermia_write","\033[31m[WRITE] ===== SLIDER_WRITE_ARM reg=%04X word=%u requested=%u ALWAYS_FRESH=1 wait=0708 NO_SEMANTIC_TX =====\033[0m",
            unsigned(id(write_write_register)),unsigned(wi),unsigned(id(write_requested_target)));


number:
  # EXP379 cooling controls. UI shows NW immediately; bus stays serialized.
  - platform: template
    id: exp383_cooling_hysteresis_control
    name: "04 Cooling | 08 TEST Hysteresis"
    entity_category: config
    icon: mdi:swap-vertical
    min_value: 0.0
    max_value: 12.0
    step: 0.1
    unit_of_measurement: "K"
    optimistic: false
    restore_value: false
    set_action:
      - lambda: |-
          const uint16_t target=uint16_t(lroundf(x*10.0f)), bit=uint16_t(1u<<2);
          if (!id(exp379_sync_valid) || !id(write_config_synced) || !id(write_active) || id(write_stage)!=40 || id(exp379_state)==5) {
            if (id(exp379_sync_valid)) id(exp383_cooling_hysteresis_control).publish_state(float(id(exp379_confirmed_w02))/10.0f);
            id(exp379_status)->publish_state("BLOCKED / TEST Cooling Hysteresis unavailable");
            return;
          }
          id(exp383_cooling_hysteresis_control).publish_state(float(target)/10.0f);
          id(exp379_desired_w02)=target; id(exp379_dirty_mask)|=bit;
          id(exp379_status)->publish_state("QUEUED / TEST 0444 Cooling Hysteresis");
          ESP_LOGE("thermia_exp383","\033[38;5;130m[EXP383] ===== TEST_QUEUE reg=0444 word=2 candidate=COOLING_HYST targetRaw=%u =====\033[0m",unsigned(target));

  - platform: template
    id: exp383_cooling_stop_control
    name: "04 Cooling | 10 TEST Stop Threshold"
    entity_category: config
    icon: mdi:stop-circle-outline
    min_value: 0
    max_value: 100
    step: 1
    optimistic: false
    restore_value: false
    set_action:
      - lambda: |-
          const uint16_t target=uint16_t(lroundf(x)), bit=uint16_t(1u<<6);
          if (!id(exp379_sync_valid) || !id(write_config_synced) || !id(write_active) || id(write_stage)!=40 || id(exp379_state)==5) {
            if (id(exp379_sync_valid)) id(exp383_cooling_stop_control).publish_state(float(id(exp379_confirmed_w06)));
            id(exp379_status)->publish_state("BLOCKED / TEST Cooling STOP unavailable");
            return;
          }
          id(exp383_cooling_stop_control).publish_state(float(target));
          id(exp379_desired_w06)=target; id(exp379_dirty_mask)|=bit;
          id(exp379_status)->publish_state("QUEUED / TEST 0448 Cooling STOP threshold");
          ESP_LOGE("thermia_exp383","\033[38;5;130m[EXP383] ===== TEST_QUEUE reg=0448 word=6 candidate=COOLING_STOP target=%u =====\033[0m",unsigned(target));

  - platform: template
    id: exp383_cooling_max_start_control
    name: "04 Cooling | 11 TEST Max Start Temperature"
    entity_category: config
    icon: mdi:thermometer-chevron-up
    min_value: 5
    max_value: 55
    step: 1
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: false
    restore_value: false
    set_action:
      - lambda: |-
          const uint16_t target=uint16_t(lroundf(x)), bit=uint16_t(1u<<8);
          const uint16_t min_stop=id(exp379_confirmed_w09);
          if (target<min_stop || !id(exp379_sync_valid) || !id(write_config_synced) || !id(write_active) || id(write_stage)!=40 || id(exp379_state)==5) {
            if (id(exp379_sync_valid)) id(exp383_cooling_max_start_control).publish_state(float(id(exp379_confirmed_w08)));
            id(exp379_status)->publish_state("BLOCKED / TEST Max Start must be >= current Min Stop");
            return;
          }
          id(exp383_cooling_max_start_control).publish_state(float(target));
          id(exp379_desired_w08)=target; id(exp379_dirty_mask)|=bit;
          id(exp379_status)->publish_state("QUEUED / TEST 044A Max Start Temperature");
          ESP_LOGE("thermia_exp383","\033[38;5;130m[EXP383] ===== TEST_QUEUE reg=044A word=8 candidate=MAX_START_TEMP target=%u minStop=%u =====\033[0m",unsigned(target),unsigned(min_stop));

  - platform: template
    id: exp383_cooling_min_stop_control
    name: "04 Cooling | 12 TEST Min Stop Temperature"
    entity_category: config
    icon: mdi:thermometer-chevron-down
    min_value: 5
    max_value: 55
    step: 1
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: false
    restore_value: false
    set_action:
      - lambda: |-
          const uint16_t target=uint16_t(lroundf(x)), bit=uint16_t(1u<<9);
          const uint16_t max_start=id(exp379_confirmed_w08);
          if (target>max_start || !id(exp379_sync_valid) || !id(write_config_synced) || !id(write_active) || id(write_stage)!=40 || id(exp379_state)==5) {
            if (id(exp379_sync_valid)) id(exp383_cooling_min_stop_control).publish_state(float(id(exp379_confirmed_w09)));
            id(exp379_status)->publish_state("BLOCKED / TEST Min Stop must be <= current Max Start");
            return;
          }
          id(exp383_cooling_min_stop_control).publish_state(float(target));
          id(exp379_desired_w09)=target; id(exp379_dirty_mask)|=bit;
          id(exp379_status)->publish_state("QUEUED / TEST 044B Min Stop Temperature");
          ESP_LOGE("thermia_exp383","\033[38;5;130m[EXP383] ===== TEST_QUEUE reg=044B word=9 candidate=MIN_STOP_TEMP target=%u maxStart=%u =====\033[0m",unsigned(target),unsigned(max_start));

  - platform: template
    id: exp379_cooling_temp_control
    name: "04 Cooling | 02 Desired Temperature"
    entity_category: config
    icon: mdi:snowflake-thermometer
    unit_of_measurement: "°C"
    optimistic: false
    restore_value: false
    initial_value: 18
    min_value: 7
    max_value: 40
    step: 1
    mode: slider
    set_action:
      - lambda: |-
