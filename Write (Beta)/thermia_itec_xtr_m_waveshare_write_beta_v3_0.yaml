# ==============================================================================
# THERMIA iTec XTR M - WRITE (BETA) v3.0
# ==============================================================================
#
# PURPOSE
# - Production-oriented Write (Beta) build derived from the locally validated
#   EXP374 v4d multi-setting engine.
# - Preserves the full Thermia monitoring integration and enables guarded native
#   semantic control of the locally confirmed settings in controller page
#   0x03E8/count14.
#
# LOCALLY CONFIRMED WRITABLE SETTINGS ON THIS XTR M
# - 0x03E8 Heating Curve
# - 0x03E9 Heating Minimum
# - 0x03EA Heating Maximum
# - 0x03EB Curve Correction +5
# - 0x03EC Curve Correction 0
# - 0x03ED Curve Correction -5
# - 0x03EE Heating Stop
# - 0x03EF Reduced Temperature
# - 0x03F0 Room Factor
# - 0x03F4 Room Setpoint
#
# WRITE MODEL
# - Every semantic transaction starts from a fresh controller-originated
#   FC16 0x03E8/count14 page.
# - W3-bit0 requests the current page.
# - W1-bit0 + W3-bit0 advertises the desired 0x03E8 page.
# - The controller pulls FC03 0x03E8/count14.
# - The ESP returns the full fresh page with exactly ONE selected word changed.
# - Success requires exact controller FC16 republish with the requested selected
#   word and zero additional changed words.
#
# QUEUE / HOME ASSISTANT
# - One semantic transaction is active at a time.
# - Per-register dirty-set queue: one pending desired value per supported setting.
# - Same-register latest value wins; different register requests are preserved.
# - Every queued item gets a new fresh controller page and a 2 s settle interval.
# - Configuration controls show effective user intent:
#     active target > queued target > controller value.
# - Ordinary read sensors remain controller-authoritative.
#
# SAFETY
# - Writes remain blocked until Configuration is synchronized from an
#   authoritative controller FC16 0x03E8/count14 page.
# - Values are bounded per setting.
# - No unknown write target or broad register write is enabled.
# - Parser/RX integrity deltas, peer traffic, unexpected protocol shapes,
#   timeout or republish mismatch fail closed and clear pending writes.
# - DE is LOW outside explicit guarded transmissions.
# - Controller-session recovery retains the locally tested guarded path.
# - The fixed challenge replay is local-XTR evidence only; the genuine
#   Thermia/Danfoss challenge transform remains unknown.
#
# PROMOTION EVIDENCE
# - EXP370: reusable serialized writes.
# - EXP373: extended 03E8 settings.
# - EXP374: autosync, multi-register dirty queue and desired-UI preservation.
# - EXP375A: 03E9 Heating Minimum locally confirmed writable.
# - EXP375B: 03F0 Room Factor locally confirmed writable.
# - 03EB and 03EC were also locally confirmed through the multi-setting queue.
#
# STATUS
# - Production-oriented Write (Beta) v3.0 for the tested Thermia iTec XTR M.
# - Active write support remains higher risk than the Read-only build.
# ==============================================================================
substitutions:
  device_name: "thermia-itec-xtr-m"
  friendly_name: "Thermia iTec XTR M"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - delay: 1s
        - lambda: |-
            // Restore cached settings only after this device has previously
            // observed a genuine Thermia 0x0F FC10 03E8..03F5 frame.
            if (id(thermia_settings_cache_valid)) {
              id(thermia_heating_curve)->publish_state(id(thermia_heating_curve_saved));
              id(thermia_heating_min)->publish_state(id(thermia_heating_min_saved));
              id(thermia_heating_max)->publish_state(id(thermia_heating_max_saved));
              id(thermia_curve_plus5)->publish_state(id(thermia_curve_plus5_saved));
              id(thermia_curve_zero)->publish_state(id(thermia_curve_zero_saved));
              id(thermia_curve_minus5)->publish_state(id(thermia_curve_minus5_saved));
              id(thermia_heating_stop)->publish_state(id(thermia_heating_stop_saved));
              id(thermia_reduced_temperature)->publish_state(id(thermia_reduced_temperature_saved));
              id(thermia_room_factor)->publish_state(id(thermia_room_factor_saved));
              id(thermia_room_setpoint_mirror)->publish_state(id(thermia_room_setpoint_mirror_saved));

              ESP_LOGI(
                "thermia_persist",
                "Restored validated settings cache: curve=%.0f min=%.0f max=%.0f corr=[%.0f,%.0f,%.0f] stop=%.0f reduced=%.0f room_factor=%.0f room_setpoint=%.0f",
                id(thermia_heating_curve_saved),
                id(thermia_heating_min_saved),
                id(thermia_heating_max_saved),
                id(thermia_curve_plus5_saved),
                id(thermia_curve_zero_saved),
                id(thermia_curve_minus5_saved),
