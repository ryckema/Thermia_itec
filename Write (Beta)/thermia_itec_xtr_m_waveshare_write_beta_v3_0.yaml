    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: write_requested_target
    type: uint16_t
    restore_value: no
    initial_value: '0'
  # Selected word inside 03E8/count14:
  # 0=03E8 Curve, 1=03E9 Min, 2=03EA Max, 3=03EB Corr+5, 4=03EC Corr0,
  # 5=03ED Corr-5, 6=03EE Heating Stop, 7=03EF Reduced Temp, 8=03F0 Room Factor, 12=03F4 Room Setpoint.
  - id: write_write_word_index
