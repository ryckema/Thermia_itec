    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: write_page_w13
    type: uint16_t
    restore_value: no
    initial_value: '0'
  # 0 idle before first write; 1 fresh-cache write queued/wait 0708;
  # 2 semantic selector sent/wait FC03 03E8;
  # 3 desired page sent/wait exact FC16 03E8 republish;
  # 4 last write confirmed / one-shot complete;
  # 5 stale/missing-cache refresh queued/wait 0708;
  # 6 refresh-only W3 bit0 sent/wait controller FC16 03E8;
  # 7 semantic control disabled after refresh-path failure; runtime-only.
  - id: write_write_state
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: write_original_value
    type: uint16_t
    restore_value: no
    initial_value: '0'
