  # ==========================================================================
  # Thermia Write - guarded native desired-page transaction state
  # ==========================================================================
  - id: write_page_cache_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  # True only after an authoritative controller-originated FC16 03E8/count14
  # page has been accepted and published to every Thermia Write Configuration slider.
  # Unlike page_cache_valid, this remains true while a transaction deliberately
  # invalidates the page cache to force a fresh-page acquisition.
  - id: write_config_synced
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: write_page_cache_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
