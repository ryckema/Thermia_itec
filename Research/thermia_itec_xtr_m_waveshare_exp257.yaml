# =============================================================================
# THERMIA iTec XTR M - EXP257 ONE-SHOT R1 + SINGLE 03E8/14 ACK + NEXT-STAGE CAPTURE
# Prepared 2026-09-27
#
# EXP257 HYPOTHESIS:
# - EXP256 proved that one exact R1 response terminates the local 071C/0730
#   approval retry loop and immediately enters controller -> 0x0F synchronization
#   at FC16 03E8/count14.
# - If that 03E8/count14 block is the first acknowledged sync stage, then ONE
#   standard Modbus FC16 ACK for the first exact post-R1 03E8/count14 request
#   should advance the controller to a subsequent FC16 or FC03 stage.
# - Complete genuine Eco5 capture now predicts 03FC/count11 as the immediate
#   next stage after the 03E8/count14 ACK. Prior local EXP137 had observed
#   0410/count22 later after a 03E8 ACK. EXP257 does NOT assume either result:
#   the first different post-ACK request is captured and NEVER acknowledged.
#
# ACTIVE VALUE / PROVENANCE:
# - Same externally reported genuine Eco5 R1 already used in EXP252 + EXP256:
#   1691 A5F3 F8E8 D587 3892 4416 E8E6 A3D5
# - R1 response frame:
#   0F 17 10 1691A5F3F8E8D58738924416E8E6A3D5 E227
#
# NEW WRITE TARGET IN EXP257:
# - Trigger request: slave 0x0F FC16 start=03E8 count=14 bytecount=28 len=37.
# - Response is the standard FC16 ACK only; it echoes start/count and carries
#   NO register-value payload:
#   0F 10 03 E8 00 0E C0 93
# - CRC16 over 0F1003E8000E = 0x93C0, sent little-endian C0 93.
# - New external evidence: in TWO successful genuine Eco5 approval cycles,
#   03E8/count14 was ACKed and the immediate next block was 03FC/count11;
#   0410/count22 followed after 03FC was ACKed.
# - Prior local EXP137 reached 0410/count22 after a 03E8 ACK but did not prove
#   that no 03FC/count11 block intervened. The ACK itself carries no value.
# - Possible effect here: advance the incomplete Online/Link sync state. A later
#   COMM. ERR ONLINE/LINK remains possible until the controller is rebooted.
#
# ONLY EXPERIMENTAL CHANGE VS EXP256:
# - after the already-tested one-shot R1, permit ONE additional TX:
#   the exact FC16 ACK above, and only for the FIRST post-R1 FC16 request if
#   that first request is exactly 03E8/count14.
# - capture the first different post-ACK FC16 or FC03 request and stop.
#
# NO DOWNSTREAM CHAIN EMULATION:
# - no ACK for 03FC, 0410 or any other subsequent FC16 block
# - no second 03E8 ACK
# - no FC03 response
# - no second FC17/R1 response
# - no mailbox response
# - no desired-page response
#
# FAIL-CLOSED ACK GUARDS:
# - R1 must already have been sent exactly once.
# - no approval retry after R1.
# - the FIRST post-R1 FC16 request must be exactly 03E8/count14/bytecount28/len37.
# - that request must arrive <=5 s after R1.
# - parser resync and RX-drop counters must remain unchanged since BUS_RETURN.
# - ACK latch closes before DE is enabled.
#
# PROCEDURE:
# 1. Recover from EXP256 first: controller rebooted, no COMM. ERR ONLINE/LINK,
#    DHW-side "0" cleared, then wait >=15 s healthy normal traffic.
# 2. Flash EXP257.
# 3. HA -> Configuration -> "EXP257 Arm R1 + One 03E8 ACK".
# 4. Within 60 s power-cycle ONLY the Thermia controller.
# 5. Do not change Thermia settings.
# 6. Wait for either NEXT_STAGE_CAPTURED or SUMMARY POST_ACK_TIMEOUT.
#    The post-ACK observation ceiling is 15 s.
# 7. Immediately reboot the Thermia controller once after the EXP257 summary.
# 8. Return the full log from ARM through SUMMARY/NEXT_STAGE_CAPTURED and note
#    whether the DHW-side "0" or COMM. ERR ONLINE/LINK appeared.
#
# PRIMARY POSITIVE DISCRIMINATOR:
# - after the single 03E8 ACK, a DIFFERENT 0x0F FC16 block or an FC03 request
#   appears. Genuine Eco5 reference predicts 03FC/count11; this is not required.
#
# NEGATIVE / STOP DISCRIMINATORS:
# - first post-R1 FC16 is not exact 03E8/count14 -> NO ACK, stop.
# - parser/drop guard fails -> NO ACK, stop.
# - only 03E8 retries continue for 15 s after our one ACK -> stop and record.
#
# SAFETY:
# - exactly one previously-tested R1 plus at most one proven-shape FC16 ACK.
# - no register-value payload is introduced by the ACK.
# - no broad ACK whitelist, scan, guessed register write or downstream emulation.
# - production functionality and bus-health bookkeeping remain unchanged.
# =============================================================================

# =============================================================================
# ESP
# =============================================================================

# Board: Waveshare ESP32-S3-RS485-CAN
# MCU: ESP32-S3R8, external 16 MB flash, 8 MB octal PSRAM

substitutions:
  device_name: "thermia-itec-xtr-m"
  friendly_name: "Thermia iTec XTR M"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - delay: 1s
        - lambda: |-
            // Restore cached settings only after this device has previously
            // observed a genuine Thermia 0x0F FC10 03E8..03F5 frame.
            if (id(thermia_settings_cache_valid)) {
              id(thermia_heating_curve)->publish_state(id(thermia_heating_curve_saved));
              id(thermia_heating_min)->publish_state(id(thermia_heating_min_saved));
              id(thermia_heating_max)->publish_state(id(thermia_heating_max_saved));
              id(thermia_curve_plus5)->publish_state(id(thermia_curve_plus5_saved));
              id(thermia_curve_zero)->publish_state(id(thermia_curve_zero_saved));
              id(thermia_curve_minus5)->publish_state(id(thermia_curve_minus5_saved));
              id(thermia_heating_stop)->publish_state(id(thermia_heating_stop_saved));
              id(thermia_reduced_temperature)->publish_state(id(thermia_reduced_temperature_saved));
              id(thermia_room_factor)->publish_state(id(thermia_room_factor_saved));
              id(thermia_room_setpoint_mirror)->publish_state(id(thermia_room_setpoint_mirror_saved));

              ESP_LOGI(
                "thermia_persist",
                "Restored validated settings cache: curve=%.0f min=%.0f max=%.0f corr=[%.0f,%.0f,%.0f] stop=%.0f reduced=%.0f room_factor=%.0f room_setpoint=%.0f",
                id(thermia_heating_curve_saved),
                id(thermia_heating_min_saved),
                id(thermia_heating_max_saved),
                id(thermia_curve_plus5_saved),
                id(thermia_curve_zero_saved),
                id(thermia_curve_minus5_saved),
                id(thermia_heating_stop_saved),
                id(thermia_reduced_temperature_saved),
                id(thermia_room_factor_saved),
                id(thermia_room_setpoint_mirror_saved)
              );
            } else {
              ESP_LOGI(
                "thermia_persist",
                "No validated settings cache yet; waiting for a live 0x0F FC10 03E8..03F5 frame."
              );
            }

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# ESP32-S3R8 provides 8 MB octal PSRAM. Explicit PSRAM configuration is
# required by current ESPHome releases for ESP32-S3.
psram:
  mode: octal
  speed: 80MHz

# Batch preference writes. The persisted Thermia settings change rarely.
preferences:
  flash_write_interval: 1min

api:
  encryption:
    key: !secret thermia_api_encryption_key
  # Do not reboot merely because Home Assistant/API is temporarily unreachable.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret thermia_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # This controller is continuously powered: prefer reliability over Wi-Fi power saving.
  power_save_mode: none

  # Keep a network-stack recovery watchdog, but make it much less aggressive
  # than the ESPHome default. No access-point BSSID is hard-coded.
  reboot_timeout: 30min

  ap:
    ssid: "Thermia Fallback Hotspot"
    password: !secret thermia_fallback_password

captive_portal:


# Publish reset/heap/loop diagnostics so Wi-Fi loss can be separated from
# brownouts, watchdog resets, API loss and parser/resource problems.
debug:
  update_interval: 30s


# =============================================================================
# LOGGING
# =============================================================================

logger:
  # Production logging stays quiet; EXP257 trace markers are emitted at WARN.
  level: WARN
  baud_rate: 0
  logs:
    thermia: WARN
    thermia_persist: WARN



# =============================================================================
# THERMIA UART
#
# Confirmed bus settings: 9600 baud, 8E1, Modbus RTU CRC16.
#
# Waveshare ESP32-S3-RS485-CAN:
# - GPIO18 = RX
# - GPIO17 = TX (EXP257: one R1 + at most one 03E8 FC16 ACK)
# - GPIO21 = DE/direction; LOW except during the single guarded TX frame.
#
# EXP257 is normally receive-only and can transmit at most two tightly guarded frames.
# =============================================================================

# =============================================================================
# WAVESHARE RS485 DIRECTION
# =============================================================================

# SP3485 DE and /RE are controlled by GPIO21 on this board.
# ALWAYS_OFF => GPIO21 LOW => receiver enabled, driver disabled at boot.
# EXP257 may raise it only inside the two guarded transmit scripts.
# This switch is internal and is not exposed to Home Assistant.
switch:
  - platform: gpio
    id: waveshare_rs485_direction
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO21
      inverted: false


# =============================================================================
# BUS HEALTH
# =============================================================================

globals:
  - id: thermia_last_valid_frame_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Runtime-only parser / freshness diagnostics. These are intentionally
  # not persisted; they describe the current ESP boot only.
  - id: thermia_valid_frame_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # EXP257 local experiment state.
  # phase:
  #   0 = idle
  #   1 = armed / waiting cold-boot bus gap
  #   2 = waiting first exact approval request
  #   3 = R1 sent / waiting first post-R1 FC16
  #   4 = one 03E8 ACK sent / observing first different next stage
  #   5 = complete
  - id: exp257_armed
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: exp257_phase
    type: uint8_t
    restore_value: no
    initial_value: '0'

