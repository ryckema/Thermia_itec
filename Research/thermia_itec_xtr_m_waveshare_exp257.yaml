uart:
  id: thermia_uart

  tx_pin:
    number: GPIO17
    inverted: false

  rx_pin:
    number: GPIO18
    inverted: false

  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

  rx_buffer_size: 2048

  # Prevent ESP-IDF from splitting Modbus RTU frames into ~7-byte chunks.
  rx_full_threshold: 120
  rx_timeout: 2

  debug:
    direction: RX
    dummy_receiver: true
    debug_prefix: "[THERMIA] "

    after:
      timeout: 5ms

    sequence:
      - lambda: |-

          // Robust Modbus RTU stream assembler. ESPHome may split long
          // frames across callbacks, so retain bytes until structure + CRC
          // prove a complete frame. Multiple frames per callback are OK.
          static std::vector<uint8_t> pending;
          if (pending.capacity() == 0) {
            pending.reserve(512);
          }
          pending.insert(pending.end(), bytes.begin(), bytes.end());

          if (pending.size() > 4096) {
            ESP_LOGW(
              "thermia",
              "RX stream buffer exceeded 4096 bytes; clearing buffer to recover."
            );
            id(thermia_rx_buffer_drop_count)++;
            pending.clear();
            return;
          }

          auto stream_crc16 = [](const uint8_t *data, size_t len) -> uint16_t {
            uint16_t crc = 0xFFFF;
            for (size_t i = 0; i < len; i++) {
              crc ^= data[i];
              for (uint8_t bit = 0; bit < 8; bit++)
                crc = (crc & 1) ? ((crc >> 1) ^ 0xA001) : (crc >> 1);
            }
            return crc;
          };

          auto valid_crc = [&](size_t len) -> bool {
            if (len < 5 || pending.size() < len) return false;
            uint16_t got = uint16_t(pending[len-2]) | (uint16_t(pending[len-1]) << 8);
            return stream_crc16(pending.data(), len - 2) == got;
          };

          auto known_slave = [](uint8_t s) -> bool {
            // Broad passive recognizer inherited from the latest known-good RX-only base.
            // This only affects frame parsing/logging; no TX path exists.
            return s == 0x01 || s == 0x02 || s == 0x03 || s == 0x04 ||
                   s == 0x05 || s == 0x06 || s == 0x0A || s == 0x0F ||
                   s == 0x14 || s == 0x1E || s == 0xA4 || s == 0xA5 ||
                   s == 0xC8;
          };

          auto process_frame = [&](const std::vector<uint8_t> &bytes) {
              // ===============================================================
              // THERMIA ITEC LEGACY PASSIVE MODBUS RTU DECODER
              // ===============================================================

              if (bytes.size() < 5) {
                ESP_LOGW(
                  "thermia",
                  "Chunk too short for Modbus RTU: %u bytes",
                  (unsigned) bytes.size()
                );
                return;
              }


              // ===============================================================
              // HELPERS
              // ===============================================================

              auto crc16_modbus =
                [](const uint8_t *data, size_t len) -> uint16_t {

                  uint16_t crc = 0xFFFF;

                  for (size_t i = 0; i < len; i++) {

                    crc ^= data[i];

                    for (uint8_t bit = 0; bit < 8; bit++) {

                      if (crc & 0x0001) {
                        crc = (crc >> 1) ^ 0xA001;
                      } else {
                        crc >>= 1;
                      }
                    }
                  }

                  return crc;
                };


              auto u16 =
                [](const std::vector<uint8_t> &b, size_t pos) -> uint16_t {

                  return
                    (uint16_t(b[pos]) << 8) |
                    uint16_t(b[pos + 1]);
                };


              auto s16 =
                [](const std::vector<uint8_t> &b, size_t pos) -> int16_t {

                  return int16_t(
                    (uint16_t(b[pos]) << 8) |
                    uint16_t(b[pos + 1])
                  );
                };


              // ===============================================================
              // CHANGE-ONLY PUBLISH HELPERS
              //
              // The Thermia bus repeats many identical values every second.
              // Only forwarding actual changes keeps the ESPHome native API
              // queue small and prevents Home Assistant entities going
              // temporarily unavailable under heavy bus traffic.
              // ===============================================================

              auto publish_float_if_changed =
                [](auto *sensor, float value, float epsilon = 0.001f) {
                  if (!sensor->has_state() ||
                      isnan(sensor->state) ||
                      fabsf(sensor->state - value) >= epsilon) {
                    sensor->publish_state(value);
                  }
                };

              auto publish_bool_if_changed =
                [](auto *sensor, bool value) {
                  if (!sensor->has_state() || sensor->state != value) {
                    sensor->publish_state(value);
                  }
                };

              auto publish_text_if_changed =
                [](auto *sensor, const char *value) {
                  if (!sensor->has_state() || sensor->state != value) {
                    sensor->publish_state(value);
                  }
                };


              // ===============================================================
              // CRC VALIDATION
              // ===============================================================

              const uint16_t received_crc =
                uint16_t(bytes[bytes.size() - 2]) |
                (uint16_t(bytes[bytes.size() - 1]) << 8);

              const uint16_t calculated_crc =
                crc16_modbus(
                  bytes.data(),
                  bytes.size() - 2
                );


              if (received_crc != calculated_crc) {

                ESP_LOGW(
                  "thermia",
                  "CRC FAIL (%u bytes): received=0x%04X calculated=0x%04X",
                  (unsigned) bytes.size(),
                  received_crc,
                  calculated_crc
                );

                return;
              }


              const uint8_t slave = bytes[0];
              const uint8_t fc = bytes[1];

              const uint32_t now_ms = millis();
              id(thermia_last_valid_frame_ms) = now_ms;
              id(thermia_valid_frame_count)++;
              if (slave == 0x02) id(thermia_last_s02_ms) = now_ms;
              if (slave == 0x06) id(thermia_last_s06_ms) = now_ms;
              if (slave == 0x0A) id(thermia_last_s0a_ms) = now_ms;
              if (slave == 0x1E) id(thermia_last_s1e_ms) = now_ms;
              publish_bool_if_changed(id(thermia_bus_healthy), true);

              ESP_LOGD(
                "thermia",
                "CRC OK: slave=0x%02X function=0x%02X length=%u",
                slave,
                fc,
                (unsigned) bytes.size()
              );

              // ===============================================================
              // EXP257 - ONE-SHOT R1 + ONE EXACT 03E8/14 ACK
              // ===============================================================
              if (id(exp257_armed)) {
                auto exp257_hex = [&](const std::vector<uint8_t> &v, char *out, size_t out_len) {
                  static const char hex[] = "0123456789ABCDEF";
                  const size_t max_bytes = (out_len > 1) ? (out_len - 1) / 2 : 0;
                  const size_t n = (v.size() < max_bytes) ? v.size() : max_bytes;
                  for (size_t i = 0; i < n; i++) {
                    out[i*2] = hex[(v[i] >> 4) & 0x0F];
                    out[i*2+1] = hex[v[i] & 0x0F];
                  }
                  out[n*2] = '\0';
                };

                auto exp257_complete = [&](const char *status, const char *reason) {
                  id(waveshare_rs485_direction).turn_off();
                  id(exp257_armed) = false;
                  id(exp257_phase) = 5;
                  id(thermia_exp257_status)->publish_state(status);
                  ESP_LOGE(
                    "thermia_exp257",
                    "\033[31m[EXP257] ===== SUMMARY %s r1=%u ack03e8=%u approvals=%u approval_after_r1=%u post_r1_fc16=%u same03e8_after_ack=%u peer17=%u unexpected_peer_ack=%u self_echo_r1=%u self_echo_ack=%u resync_postreturn=%u drop_postreturn=%u DE=LOW =====\033[0m",
                    reason,
                    unsigned(id(exp257_r1_tx_used)),
                    unsigned(id(exp257_ack_tx_used)),
                    unsigned(id(exp257_approval_count)),
                    unsigned(id(exp257_approval_after_r1_count)),
                    unsigned(id(exp257_post_r1_fc16_count)),
                    unsigned(id(exp257_same_03e8_after_ack_count)),
                    unsigned(id(exp257_peer_fc17_16b_count)),
                    unsigned(id(exp257_unexpected_peer_ack_count)),
                    unsigned(id(exp257_self_echo_r1_count)),
                    unsigned(id(exp257_self_echo_ack_count)),
                    unsigned(id(thermia_parser_resync_count)-id(exp257_resync_at_return)),
                    unsigned(id(thermia_rx_buffer_drop_count)-id(exp257_drop_at_return))
                  );
                };

                // First CRC-valid frame after >=6 s gap = bus/controller return.
                if (id(exp257_saw_bus_gap) && id(exp257_bus_return_ms) == 0) {
                  id(exp257_bus_return_ms) = now_ms;
                  id(exp257_phase) = 2;
                  id(exp257_resync_at_return) = id(thermia_parser_resync_count);
                  id(exp257_drop_at_return) = id(thermia_rx_buffer_drop_count);
                  id(thermia_exp257_status)->publish_state(
                    "2 - waiting first approval / R1 armed"
                  );
                  ESP_LOGE(
                    "thermia_exp257",
                    "\033[31m[EXP257] ===== BUS_RETURN t=%ums; waiting exact first 071C/0730 approval =====\033[0m",
                    unsigned(now_ms-id(exp257_arm_ms))
                  );
                }

                // Minimal controller-state snapshot used only for the proven
                // EXP252/EXP256 R1 guard.
                if (slave == 0x02 && fc == 0x17 && bytes.size() == 27 &&
                    u16(bytes,2) == 0xA7F8 && u16(bytes,4) == 0x000F &&
                    u16(bytes,6) == 0xA80C && u16(bytes,8) == 0x0007 &&
                    bytes[10] == 0x0E) {
                  const uint16_t a80e = u16(bytes,15);
                  const uint16_t a80f = u16(bytes,17);
                  if (!id(exp257_a80e_known) || a80e != id(exp257_a80e)) {
                    const uint16_t old = id(exp257_a80e);
                    id(exp257_a80e) = a80e;
                    id(exp257_a80e_known) = true;
                    ESP_LOGW(
                      "thermia_exp257",
                      "\033[38;5;130m[EXP257] STATE A80E %04X->%04X since_return=%ums\033[0m",
                      unsigned(old), unsigned(a80e),
                      unsigned(id(exp257_bus_return_ms) ? now_ms-id(exp257_bus_return_ms) : 0)
                    );
                  }
                  if (!id(exp257_a80f_known) || a80f != id(exp257_a80f)) {
                    const uint16_t old = id(exp257_a80f);
                    id(exp257_a80f) = a80f;
                    id(exp257_a80f_known) = true;
                    ESP_LOGW(
                      "thermia_exp257",
                      "\033[38;5;130m[EXP257] STATE A80F %04X->%04X since_return=%ums\033[0m",
                      unsigned(old), unsigned(a80f),
                      unsigned(id(exp257_bus_return_ms) ? now_ms-id(exp257_bus_return_ms) : 0)
                    );
                  }
                }

                // Exact local approval/service request.
                if (slave == 0x0F && fc == 0x17 && bytes.size() == 29 &&
                    u16(bytes,2) == 0x0730 && u16(bytes,4) == 0x0008 &&
                    u16(bytes,6) == 0x071C && u16(bytes,8) == 0x0008 &&
                    bytes[10] == 0x10 && id(exp257_bus_return_ms) != 0) {

                  id(exp257_approval_count)++;
                  const uint8_t *p = &bytes[11];

                  char wbuf[33];
                  static const char hex[] = "0123456789ABCDEF";
                  for (int i = 0; i < 16; i++) {
                    wbuf[i*2] = hex[(p[i] >> 4) & 0x0F];
                    wbuf[i*2+1] = hex[p[i] & 0x0F];
                  }
                  wbuf[32] = '\0';

                  // Retain the exact serializer/shape guard already exercised
                  // by EXP252/EXP256. This is a shape guard, not a semantic RTC claim.
                  const bool sec_even = (p[3] & 0x01) == 0;
                  const uint8_t sec = p[3] / 2;
                  const bool shape_ok =
                    sec_even &&
                    p[2] == 0x45 &&
                    p[5] == uint8_t(~p[4]) &&
                    p[6] == uint8_t(sec / 2) &&
                    p[7] == 0xAC &&
                    p[8] == 0xDC &&
                    p[10] == 0xC5 &&
                    (p[11] % 4) == 0 &&
                    p[12] == 0x00 &&
                    p[14] == 0x8F &&
                    p[15] == uint8_t(4 * sec);

                  static const uint8_t eco_c1[16] = {
                    0x63,0xCE,0xFB,0x32,0xC6,0xF4,0x13,0x82,
                    0x08,0x79,0x92,0x37,0x0C,0xAC,0xEE,0xBA
                  };
                  bool equals_c1 = true;
                  unsigned hd1 = 0;
                  for (int i = 0; i < 16; i++) {
                    if (p[i] != eco_c1[i]) equals_c1 = false;
                    hd1 += __builtin_popcount(unsigned(p[i] ^ eco_c1[i]));
                  }

                  id(thermia_exp257_approval_count)->publish_state(
                    float(id(exp257_approval_count))
                  );
                  id(thermia_exp257_last_071c)->publish_state(wbuf);

                  ESP_LOGW(
                    "thermia_exp257",
                    "\033[38;5;130m[EXP257] APPROVAL_REQ n=%u since_return=%ums W071C=%s SHAPE=%s hd_to_C1=%u r1_used=%u ack_used=%u\033[0m",
                    unsigned(id(exp257_approval_count)),
                    unsigned(now_ms-id(exp257_bus_return_ms)),
                    wbuf, shape_ok ? "OK" : "NO", hd1,
                    unsigned(id(exp257_r1_tx_used)),
                    unsigned(id(exp257_ack_tx_used))
                  );

                  if (id(exp257_phase) == 2 &&
                      id(exp257_approval_count) == 1 &&
                      !id(exp257_r1_tx_used)) {
                    const bool state_ok =
                      id(exp257_a80e_known) && id(exp257_a80e) == 0x0000 &&
                      id(exp257_a80f_known) && id(exp257_a80f) == 0x0005;
                    const bool parser_clean =
                      id(thermia_parser_resync_count) == id(exp257_resync_at_return) &&
                      id(thermia_rx_buffer_drop_count) == id(exp257_drop_at_return);
                    const bool no_peer = id(exp257_peer_fc17_16b_count) == 0;

                    if (!shape_ok || equals_c1 || !state_ok ||
                        !parser_clean || !no_peer) {
                      ESP_LOGE(
                        "thermia_exp257",
                        "\033[31m[EXP257] ===== R1_TX_REFUSED shape_ok=%u equals_C1=%u state_ok=%u parser_clean=%u no_peer=%u A80E=%04X A80F=%04X =====\033[0m",
                        unsigned(shape_ok), unsigned(equals_c1),
                        unsigned(state_ok), unsigned(parser_clean),
                        unsigned(no_peer), unsigned(id(exp257_a80e)),
                        unsigned(id(exp257_a80f))
                      );
                      exp257_complete("5 - complete / R1 refused / no TX", "R1_REFUSED");
                    } else {
                      id(exp257_r1_tx_used) = true;   // latch first
                      id(exp257_r1_tx_ms) = now_ms;
                      id(exp257_phase) = 3;
                      id(thermia_exp257_r1_tx_used_sensor)->publish_state(true);
                      id(thermia_exp257_status)->publish_state(
                        "3 - R1 sent / waiting first post-R1 FC16"
                      );
                      ESP_LOGE(
                        "thermia_exp257",
                        "\033[31m[EXP257] ===== R1_TX_INTENT approval#1 W071C=%s; R1 latch CLOSED before DE =====\033[0m",
                        wbuf
                      );
                      id(exp257_send_r1_once).execute();
                    }
                  } else if (id(exp257_r1_tx_used)) {
                    id(exp257_approval_after_r1_count)++;
                    id(thermia_exp257_after_r1_count)->publish_state(
                      float(id(exp257_approval_after_r1_count))
                    );
                    ESP_LOGE(
                      "thermia_exp257",
                      "\033[31m[EXP257] ===== UNEXPECTED APPROVAL RETRY after_R1=%u since_r1=%ums; no 03E8 ACK will be sent =====\033[0m",
                      unsigned(id(exp257_approval_after_r1_count)),
                      unsigned(now_ms-id(exp257_r1_tx_ms))
                    );
                    if (!id(exp257_ack_tx_used)) {
                      exp257_complete(
                        "5 - complete / approval retry after R1 / ACK withheld",
                        "APPROVAL_RETRY_AFTER_R1"
                      );
                    }
                  }
                }

                // 16-byte FC17 response-shaped frame. Ignore local R1 echo.
                if (id(exp257_armed) && slave == 0x0F && fc == 0x17 &&
                    bytes.size() == 21 && bytes[2] == 0x10 &&
                    id(exp257_bus_return_ms) != 0) {
                  if (id(exp257_r1_tx_used) && id(exp257_r1_tx_ms) != 0 &&
                      (now_ms-id(exp257_r1_tx_ms)) < 100UL) {
                    id(exp257_self_echo_r1_count)++;
                    ESP_LOGW(
                      "thermia_exp257",
                      "\033[38;5;130m[EXP257] R1_SELF_ECHO count=%u within=%ums\033[0m",
                      unsigned(id(exp257_self_echo_r1_count)),
                      unsigned(now_ms-id(exp257_r1_tx_ms))
                    );
                  } else {
                    id(exp257_peer_fc17_16b_count)++;
                    ESP_LOGE(
                      "thermia_exp257",
                      "\033[31m[EXP257] ===== UNEXPECTED PEER FC17 16B count=%u =====\033[0m",
                      unsigned(id(exp257_peer_fc17_16b_count))
                    );
                    if (!id(exp257_ack_tx_used)) {
                      exp257_complete(
                        "5 - complete / unexpected peer FC17 / ACK withheld",
                        "UNEXPECTED_PEER_FC17"
                      );
                    }
                  }
                }

                // FC16 ACK-shaped frame. Our own exact ACK may loop back.
                if (id(exp257_armed) && slave == 0x0F && fc == 0x10 &&
                    bytes.size() == 8 && id(exp257_bus_return_ms) != 0) {
                  const uint16_t a_start = u16(bytes,2);
                  const uint16_t a_count = u16(bytes,4);
                  if (id(exp257_ack_tx_used) && id(exp257_ack_tx_ms) != 0 &&
                      (now_ms-id(exp257_ack_tx_ms)) < 100UL &&
                      a_start == 0x03E8 && a_count == 0x000E) {
                    id(exp257_self_echo_ack_count)++;
                    ESP_LOGW(
                      "thermia_exp257",
                      "\033[38;5;130m[EXP257] ACK_SELF_ECHO count=%u within=%ums start=%04X count=%u\033[0m",
                      unsigned(id(exp257_self_echo_ack_count)),
                      unsigned(now_ms-id(exp257_ack_tx_ms)),
                      unsigned(a_start), unsigned(a_count)
                    );
                  } else {
                    id(exp257_unexpected_peer_ack_count)++;
                    ESP_LOGE(
                      "thermia_exp257",
                      "\033[31m[EXP257] ===== UNEXPECTED PEER FC16_ACK count=%u start=%04X words=%u =====\033[0m",
                      unsigned(id(exp257_unexpected_peer_ack_count)),
                      unsigned(a_start), unsigned(a_count)
                    );
                  }
                }

                // Controller FC16 request.
                if (id(exp257_armed) && slave == 0x0F && fc == 0x10 &&
                    bytes.size() >= 11 && id(exp257_bus_return_ms) != 0) {
                  const uint16_t f16_start = u16(bytes,2);
                  const uint16_t f16_count = u16(bytes,4);
                  const uint8_t f16_bc = bytes[6];

                  ESP_LOGW(
                    "thermia_exp257",
                    "\033[38;5;130m[EXP257] FC16_REQ since_return=%ums since_r1=%ums since_ack=%ums start=%04X count=%u bytecount=%u len=%u phase=%u\033[0m",
                    unsigned(now_ms-id(exp257_bus_return_ms)),
                    unsigned(id(exp257_r1_tx_ms) ? now_ms-id(exp257_r1_tx_ms) : 0),
                    unsigned(id(exp257_ack_tx_ms) ? now_ms-id(exp257_ack_tx_ms) : 0),
                    unsigned(f16_start), unsigned(f16_count),
                    unsigned(f16_bc), unsigned(bytes.size()),
                    unsigned(id(exp257_phase))
                  );

                  if (id(exp257_phase) == 3 && id(exp257_r1_tx_used) &&
                      !id(exp257_ack_tx_used)) {
                    id(exp257_post_r1_fc16_count)++;

                    const bool exact_03e8 =
                      f16_start == 0x03E8 &&
                      f16_count == 0x000E &&
                      f16_bc == 0x1C &&
                      bytes.size() == 37;
                    const bool is_first =
                      id(exp257_post_r1_fc16_count) == 1;
                    const bool timely =