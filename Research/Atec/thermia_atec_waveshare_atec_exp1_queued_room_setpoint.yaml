uart:
  id: thermia_uart

  tx_pin:
    number: GPIO17
    inverted: false

  rx_pin:
    number: GPIO18
    inverted: false

  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

  rx_buffer_size: 2048

  # Prevent ESP-IDF from splitting Modbus RTU frames into ~7-byte chunks.
  rx_full_threshold: 120
  rx_timeout: 2

  debug:
    direction: RX
    dummy_receiver: true
    debug_prefix: "[THERMIA] "

    after:
      timeout: 5ms

    sequence:
      - lambda: |-

          // Robust Modbus RTU stream assembler. ESPHome may split long
          // frames across callbacks, so retain bytes until structure + CRC
          // prove a complete frame. Multiple frames per callback are OK.
          static std::vector<uint8_t> pending;
          if (pending.capacity() == 0) {
            pending.reserve(512);
          }
          pending.insert(pending.end(), bytes.begin(), bytes.end());

          if (pending.size() > 4096) {
            ESP_LOGW(
              "thermia",
              "RX stream buffer exceeded 4096 bytes; clearing buffer to recover."
            );
            pending.clear();
            return;
          }

          auto stream_crc16 = [](const uint8_t *data, size_t len) -> uint16_t {
            uint16_t crc = 0xFFFF;
            for (size_t i = 0; i < len; i++) {
              crc ^= data[i];
              for (uint8_t bit = 0; bit < 8; bit++)
                crc = (crc & 1) ? ((crc >> 1) ^ 0xA001) : (crc >> 1);
            }
            return crc;
          };

          auto valid_crc = [&](size_t len) -> bool {
            if (len < 5 || pending.size() < len) return false;
            uint16_t got = uint16_t(pending[len-2]) | (uint16_t(pending[len-1]) << 8);
            return stream_crc16(pending.data(), len - 2) == got;
          };

          auto known_slave = [](uint8_t s) -> bool {
            // DHP-AQ adds slave 0x05 to the public-v27 observed topology.
            return s == 0x02 || s == 0x04 || s == 0x05 || s == 0x06 ||
                   s == 0x0A || s == 0x0F || s == 0x14 || s == 0x1E ||
                   s == 0xA4 || s == 0xA5 || s == 0xC8;
          };

          auto process_frame = [&](const std::vector<uint8_t> &bytes) {
              // ===============================================================
              // THERMIA ITEC LEGACY PASSIVE MODBUS RTU DECODER
              // ===============================================================

              if (bytes.size() < 5) {
                ESP_LOGW(
                  "thermia",
                  "Chunk too short for Modbus RTU: %u bytes",
                  (unsigned) bytes.size()
                );
                return;
              }


              // ===============================================================
              // HELPERS
              // ===============================================================

              auto crc16_modbus =
                [](const uint8_t *data, size_t len) -> uint16_t {

                  uint16_t crc = 0xFFFF;

                  for (size_t i = 0; i < len; i++) {

                    crc ^= data[i];

                    for (uint8_t bit = 0; bit < 8; bit++) {

                      if (crc & 0x0001) {
                        crc = (crc >> 1) ^ 0xA001;
                      } else {
                        crc >>= 1;
                      }
                    }
                  }

                  return crc;
                };


              auto u16 =
                [](const std::vector<uint8_t> &b, size_t pos) -> uint16_t {

                  return
                    (uint16_t(b[pos]) << 8) |
                    uint16_t(b[pos + 1]);
                };


              auto s16 =
                [](const std::vector<uint8_t> &b, size_t pos) -> int16_t {

                  return int16_t(
                    (uint16_t(b[pos]) << 8) |
                    uint16_t(b[pos + 1])
                  );
                };


              // ===============================================================
              // CHANGE-ONLY PUBLISH HELPERS
              //
              // The Thermia bus repeats many identical values every second.
              // Only forwarding actual changes keeps the ESPHome native API
              // queue small and prevents Home Assistant entities going
              // temporarily unavailable under heavy bus traffic.
              // ===============================================================

              auto publish_float_if_changed =
                [](auto *sensor, float value, float epsilon = 0.001f) {
                  if (!sensor->has_state() ||
                      isnan(sensor->state) ||
                      fabsf(sensor->state - value) >= epsilon) {
                    sensor->publish_state(value);
                  }
                };

              auto publish_bool_if_changed =
                [](auto *sensor, bool value) {
                  if (!sensor->has_state() || sensor->state != value) {
                    sensor->publish_state(value);
                  }
                };

              auto publish_text_if_changed =
                [](auto *sensor, const char *value) {
                  if (!sensor->has_state() || sensor->state != value) {
                    sensor->publish_state(value);
                  }
                };


              // ===============================================================
              // CRC VALIDATION
              // ===============================================================

              const uint16_t received_crc =
                uint16_t(bytes[bytes.size() - 2]) |
                (uint16_t(bytes[bytes.size() - 1]) << 8);

              const uint16_t calculated_crc =
                crc16_modbus(
                  bytes.data(),
                  bytes.size() - 2
                );


              if (received_crc != calculated_crc) {

                ESP_LOGW(
                  "thermia",
                  "CRC FAIL (%u bytes): received=0x%04X calculated=0x%04X",
                  (unsigned) bytes.size(),
                  received_crc,
                  calculated_crc
                );

                return;
              }


              const uint8_t slave = bytes[0];
              const uint8_t fc = bytes[1];

              id(thermia_last_valid_frame_ms) = millis();
              id(thermia_valid_frame_count)++;
              publish_bool_if_changed(id(thermia_bus_healthy), true);

              ESP_LOGD(
                "thermia",
                "CRC OK: slave=0x%02X function=0x%02X length=%u",
                slave,
                fc,
                (unsigned) bytes.size()
              );


              // ===============================================================
              // DHP-AQ 120-SECOND USER LOG CAPTURE
              //
              // Home Assistant button -> temporary WARN-level raw output.
              // Only complete CRC-valid frames reach this point.
              // No bus transmission, polling or register access is performed.
              // ===============================================================

              if (id(dhpaq_capture_active)) {
                std::string capture_hex;
                capture_hex.reserve(bytes.size() * 3);
                char capture_byte[4];

                for (size_t i = 0; i < bytes.size(); i++) {
                  if (i) capture_hex += " ";
                  snprintf(
                    capture_byte,
                    sizeof(capture_byte),
                    "%02X",
                    bytes[i]
                  );
                  capture_hex += capture_byte;
                }

                id(dhpaq_capture_frame_count)++;
                const uint32_t elapsed_ms =
                  millis() - id(dhpaq_capture_started_ms);

                ESP_LOGW(
                  "dhpaq_capture",
                  "ATEC-CAPTURE RAW t=%lu ms frame=%lu len=%u: %s",
                  (unsigned long) elapsed_ms,
                  (unsigned long) id(dhpaq_capture_frame_count),
                  (unsigned) bytes.size(),
                  capture_hex.c_str()
                );
              }


              // ===============================================================
              // ATEC-EXP1 ACTIVE 0x0F SERVICE
              //
              // Only exact capture-backed shapes are answered. Non-0x0F traffic
              // falls through into the full passive decoder below.
              // ===============================================================

              auto atec_send_bytes =
                [&](const uint8_t *data, size_t len, uint16_t tx_crc) {
                  id(atec_last_tx_ms) = millis();
                  id(atec_last_tx_fc) = data[1];
                  id(atec_last_tx_len) = uint16_t(len);
                  id(atec_last_tx_crc) = tx_crc;

                  id(waveshare_rs485_direction).turn_on();
                  delay_microseconds_safe(1000);
                  id(thermia_uart).write_array(data, len);
                  id(thermia_uart).flush();
                  delay_microseconds_safe(1000);
                  id(waveshare_rs485_direction).turn_off();
                };

              auto atec_is_self_echo = [&]() -> bool {
                return id(atec_last_tx_ms) &&
                       (millis() - id(atec_last_tx_ms)) < 120UL &&
                       fc == id(atec_last_tx_fc) &&
                       bytes.size() == id(atec_last_tx_len) &&
                       received_crc == id(atec_last_tx_crc);
              };

              auto atec_stop =
                [&](const char *status, const char *event) {
                  id(waveshare_rs485_direction).turn_off();
                  id(atec_active) = false;
                  id(atec_stage) = 99;
                  id(atec_write_enabled) = false;
                  id(atec_write_state) = 7;
                  id(atec_pending_valid) = false;
                  id(atec_pending_generation) = 0;
                  id(atec_sync_requested) = false;
                  id(atec_sync_in_progress) = false;
                  id(thermia_atec_runtime_active)->publish_state(false);
                  id(thermia_atec_runtime_qualified)->publish_state(false);
                  id(thermia_atec_status)->publish_state(status);
                  id(thermia_atec_stage_text)->publish_state("stage 99 / stopped / DE LOW");
                  id(thermia_atec_last_event)->publish_state(event);
                };

              auto atec_send_fc16_ack =
                [&](uint16_t st, uint16_t ct, const char *why) {
                  uint8_t a[8] = {
                    0x0F, 0x10,
                    uint8_t(st >> 8), uint8_t(st & 0xFF),
                    uint8_t(ct >> 8), uint8_t(ct & 0xFF),
                    0, 0
                  };
                  const uint16_t c = crc16_modbus(a, 6);
                  a[6] = uint8_t(c & 0xFF);
                  a[7] = uint8_t(c >> 8);

                  ESP_LOGE(
                    "thermia_atec1",
                    "\033[31m[ATEC-EXP1] FC16_ACK_TX reason=%s start=%04X count=%u crc=%04X\033[0m",
                    why, unsigned(st), unsigned(ct), unsigned(c)
                  );

                  atec_send_bytes(a, sizeof(a), c);
                  id(atec_runtime_fc16_ack_count)++;
                  id(atec_runtime_last_service_ms) = millis();
                  id(thermia_atec_runtime_fc16_acks)->publish_state(
                    float(id(atec_runtime_fc16_ack_count))
                  );
                };

              if (slave == 0x0F) {
                bool response_shaped = false;
                if (fc == 0x10 && bytes.size() == 8) response_shaped = true;
                if (fc == 0x17 && bytes.size() == 21 && bytes[2] == 0x10) response_shaped = true;
                if (fc == 0x03 && bytes.size() >= 5 && bytes[2] <= 240 &&
                    bytes.size() == size_t(5 + bytes[2])) response_shaped = true;

                if (response_shaped) {
                  if (atec_is_self_echo()) {
                    id(atec_self_echo_count)++;
                    id(thermia_atec_self_echoes)->publish_state(
                      float(id(atec_self_echo_count))
                    );
                    return;
                  }

                  id(atec_peer_count)++;
                  id(thermia_atec_peer_responses)->publish_state(
                    float(id(atec_peer_count))
                  );
                  atec_stop(
                    "STOPPED / another 0x0F responder detected / TX disabled",
                    "peer 0x0F response/ACK observed; no bus competition permitted"
                  );
                  ESP_LOGE(
                    "thermia_atec1",
                    "\033[31m[ATEC-EXP1] ===== PEER_RESPONDER_STOP fc=%02X len=%u crc=%04X DE=LOW =====\033[0m",
                    unsigned(fc), unsigned(bytes.size()), unsigned(received_crc)
                  );
                  return;
                }

                // FC17 challenge/session traffic remains capture-only.
                if (fc == 0x17 && bytes.size() >= 13) {
                  const uint16_t read_start = u16(bytes, 2);
                  const uint16_t read_count = u16(bytes, 4);
                  const uint16_t write_start = u16(bytes, 6);
                  const uint16_t write_count = u16(bytes, 8);

                  if (read_start == 0x0730 && read_count == 8 &&
                      write_start == 0x071C && write_count == 8) {
                    id(atec_fc17_challenge_count)++;
                    id(thermia_atec_fc17_challenges)->publish_state(
                      float(id(atec_fc17_challenge_count))
                    );
                    ESP_LOGE(
                      "thermia_atec1",
                      "\033[38;5;130m[ATEC-EXP1] 0F_FC17_CAPTURE_ONLY challenge=%u NO_TX\033[0m",
                      unsigned(id(atec_fc17_challenge_count))
                    );
                    return;
                  }
                }

                // During stage0/99 never respond to 0x0F FC03 mailbox requests.
                if ((!id(atec_active) || id(atec_stage) != 40) &&
                    fc == 0x03 && bytes.size() == 8) {
                  return;
                }

                if (id(atec_active) && id(atec_stage) == 40) {
                  const uint32_t resync_delta =
                    id(thermia_parser_resync_count) - id(atec_resync_baseline);
                  const uint32_t drop_delta =
                    id(thermia_rx_buffer_drop_count) - id(atec_drop_baseline);

                  if (resync_delta || drop_delta) {
                    atec_stop(
                      "STOPPED / parser-RX integrity delta / TX disabled",
                      "parser resync/drop changed after runtime activation"
                    );
                    ESP_LOGE(
                      "thermia_atec1",
                      "\033[31m[ATEC-EXP1] ===== INTEGRITY_STOP resync=%u drops=%u DE=LOW =====\033[0m",
                      unsigned(resync_delta), unsigned(drop_delta)
                    );
                    return;
                  }

                  // -----------------------------------------------------------
                  // Controller FC16 pages -> gateway. ACK only exact whitelist.
                  // -----------------------------------------------------------
                  if (fc == 0x10 && bytes.size() >= 9) {
                    const uint16_t st = u16(bytes, 2);
                    const uint16_t ct = u16(bytes, 4);
                    const uint8_t bc = bytes[6];
                    const bool shape =
                      bc == ct * 2 && bytes.size() == size_t(9 + bc);

                    if (shape) {
                      auto page_u16 = [&](uint8_t wi) -> uint16_t {
                        const size_t p = 7 + size_t(wi) * 2;
                        return u16(bytes, p);
                      };

                      auto cache_03e8 = [&]() {
                        id(atec_page_w00)=page_u16(0);  id(atec_page_w01)=page_u16(1);
                        id(atec_page_w02)=page_u16(2);  id(atec_page_w03)=page_u16(3);
                        id(atec_page_w04)=page_u16(4);  id(atec_page_w05)=page_u16(5);
                        id(atec_page_w06)=page_u16(6);  id(atec_page_w07)=page_u16(7);
                        id(atec_page_w08)=page_u16(8);  id(atec_page_w09)=page_u16(9);
                        id(atec_page_w10)=page_u16(10); id(atec_page_w11)=page_u16(11);
                        id(atec_page_w12)=page_u16(12); id(atec_page_w13)=page_u16(13);
                        id(atec_page_cache_valid)=true;
                        id(atec_page_cache_ms)=millis();
                        id(thermia_atec_cache_valid)->publish_state(true);
                        id(thermia_atec_room_setpoint_current)->publish_state(
                          float(id(atec_page_w12))
                        );
                        if (id(atec_write_state)==0 && !id(atec_pending_valid)) {
                          id(thermia_atec_room_setpoint_target_control).publish_state(
                            float(id(atec_page_w12))
                          );
                        }
                      };

                      if (st == 0x03E8 && ct == 14 && bc == 28 &&
                          bytes.size() == 37) {
                        if (id(atec_write_state) == 3) {
                          const uint16_t before[14] = {
                            id(atec_page_w00),id(atec_page_w01),id(atec_page_w02),id(atec_page_w03),
                            id(atec_page_w04),id(atec_page_w05),id(atec_page_w06),id(atec_page_w07),
                            id(atec_page_w08),id(atec_page_w09),id(atec_page_w10),id(atec_page_w11),
                            id(atec_page_w12),id(atec_page_w13)
                          };

                          uint8_t extra=0;
                          for (uint8_t i=0;i<14;i++) {
                            if (i==12) continue;
                            if (page_u16(i) != before[i]) extra++;
                          }

                          const uint16_t observed=page_u16(12);
                          id(atec_extra_delta_words)=extra;
                          id(atec_semantic_response_count)++;
                          id(thermia_atec_semantic_responses)->publish_state(
                            float(id(atec_semantic_response_count))
                          );

                          atec_send_fc16_ack(st,ct,"SEMANTIC_03E8_REPUBLISH");

                          const bool positive =
                            extra==0 && observed==id(atec_target_room_setpoint);
                          const bool unchanged =
                            extra==0 && observed==id(atec_original_room_setpoint);

                          if (positive) {
                            cache_03e8();
                            id(atec_write_state)=0;
                            id(atec_write_confirmed_count)++;
                            id(atec_queue_not_before_ms)=millis()+2000UL;
                            id(thermia_atec_write_confirmed)->publish_state(true);
                            id(thermia_atec_confirmed_writes)->publish_state(
                              float(id(atec_write_confirmed_count))
                            );
                            id(thermia_atec_status)->publish_state(
                              "READY / exact 03F4 room-setpoint republish confirmed"
                            );
                            id(thermia_atec_last_event)->publish_state(
                              "WRITE_CONFIRMED: only 03F4 changed; queue settle 2 s"
                            );
                            id(thermia_atec_room_setpoint_target_control).publish_state(
                              float(observed)
                            );
                            ESP_LOGE(
                              "thermia_atec1",
                              "\033[31m[ATEC-EXP1] ===== WRITE_CONFIRMED reg=03F4 original=%u target=%u observed=%u extraDeltaWords=0 =====\033[0m",
                              unsigned(id(atec_original_room_setpoint)),
                              unsigned(id(atec_target_room_setpoint)),
                              unsigned(observed)
                            );
                          } else {
                            id(atec_write_state)=7;
                            id(atec_write_enabled)=false;
                            id(atec_pending_valid)=false;
                            id(atec_queue_not_before_ms)=0;
                            id(thermia_atec_room_setpoint_target_control).publish_state(
                              float(observed)
                            );

                            if (unchanged) {
                              id(thermia_atec_status)->publish_state(
                                "COMPLETE / NEGATIVE / controller kept original 03F4 value"
                              );
                              id(thermia_atec_last_event)->publish_state(
                                "negative semantic result; runtime remains active, writes disabled"
                              );
                            } else {
                              id(thermia_atec_status)->publish_state(
                                "COMPLETE / INCONCLUSIVE / 03E8 republish mismatch"
                              );
                              id(thermia_atec_last_event)->publish_state(
                                "extra page delta or unexpected 03F4 value; runtime only"
                              );
                            }

                            ESP_LOGE(
                              "thermia_atec1",
                              "\033[31m[ATEC-EXP1] ===== REPUBLISH_MISMATCH original=%u target=%u observed=%u extraDeltaWords=%u semanticWrites=DISABLED =====\033[0m",
                              unsigned(id(atec_original_room_setpoint)),
                              unsigned(id(atec_target_room_setpoint)),
                              unsigned(observed),unsigned(extra)
                            );
                          }
                        } else {
                          cache_03e8();
                          atec_send_fc16_ack(
                            st,ct,id(atec_sync_in_progress) ? "SNAPSHOT_03E8" : "RUNTIME_03E8"
                          );
                        }

                        // Let passive decoder below publish the full heating page.
                      } else {
                        bool handled=false;

                        // Exact 26-page set selected by captured FFFF:867F bitmap.
                        if (id(atec_sync_in_progress)) {
                          static const uint16_t sync_st[26] = {
                            0x03E8,0x03FC,0x0410,0x042E,0x0442,0x0456,0x046A,
                            0x04A6,0x04BA,0x0532,
                            0x0546,0x055A,0x057B,0x059C,0x05BD,0x05DE,0x05FF,
                            0x0620,0x0641,0x0662,0x0683,0x06A4,0x06C5,0x06EA,
                            0x06F1,0x06F4
                          };
                          static const uint16_t sync_ct[26] = {
                            14,11,22,15,13,12,18,
                            13,22,18,
                            20,33,33,33,33,33,33,
                            33,33,33,33,33,33,7,
                            3,19
                          };

                          const uint8_t ix=id(atec_sync_index);
                          if (ix<26 && st==sync_st[ix] && ct==sync_ct[ix]) {
                            atec_send_fc16_ack(st,ct,"SETTINGS_SNAPSHOT");
                            id(atec_sync_index)++;
                            id(atec_sync_retries)=0;
                            handled=true;

                            if (id(atec_sync_index)>=26) {
                              id(atec_sync_in_progress)=false;
                              id(atec_sync_start_ms)=0;
                              id(atec_config_synced)=true;
                              id(thermia_atec_config_synced_sensor)->publish_state(true);
                              id(thermia_atec_status)->publish_state(
                                "READY / 26-page ATEC settings snapshot complete"
                              );
                              id(thermia_atec_last_event)->publish_state(
                                "SETTINGS_SNAPSHOT_COMPLETE: reached 06F4; 03E8 cache authoritative"
                              );
                              ESP_LOGE(
                                "thermia_atec1",
                                "\033[31m[ATEC-EXP1] ===== SETTINGS_SNAPSHOT_COMPLETE pages=26 cacheValid=%u room=%u =====\033[0m",
                                unsigned(id(atec_page_cache_valid)),
                                unsigned(id(atec_page_w12))
                              );
                            }
                          } else if (ix>0 && st==sync_st[ix-1] && ct==sync_ct[ix-1] &&
                                     id(atec_sync_retries)<3) {
                            id(atec_sync_retries)++;
                            atec_send_fc16_ack(st,ct,"SETTINGS_SNAPSHOT_RETRY");
                            handled=true;
                          }
                        }

                        if (!handled) {
                          bool runtime_known =
                            (st==0x07D0 && ct==19) ||
                            (st==0x07E4 && ct==17) ||
                            (st==0x07F8 && ct==17) ||
                            (st==0x080C && ct==18) ||
                            (st==0x0820 && ct==18) ||
                            (st==0x0834 && ct==18) ||
                            (st==0x0848 && ct==23) ||
                            (st==0x0864 && ct==4)  ||
                            (st==0x0870 && ct==17) ||
                            (st==0x0884 && ct==60);

                          if (st==0x085F && ct==5 && bc==10 && bytes.size()==19) {
                            runtime_known =
                              page_u16(0)==0 && page_u16(1)==0 && page_u16(2)==0 &&
                              page_u16(3)==0 && page_u16(4)==0;
                          }

                          if (runtime_known) {
                            atec_send_fc16_ack(st,ct,"ATEC_RUNTIME");
                            handled=true;
                          }
                        }

                        // 04A6/count13 is recurrent but remains capture-only
                        // outside the exact snapshot-selected position.
                        if (!handled && st==0x04A6 && ct==13) {
                          ESP_LOGE(
                            "thermia_atec1",
                            "\033[38;5;130m[ATEC-EXP1] 04A6_CAPTURE_ONLY count=13 sync=%u NO_ACK\033[0m",
                            unsigned(id(atec_sync_in_progress))
                          );
                          handled=true;
                        }

                        if (!handled) {
                          id(atec_unknown_fc16_count)++;
                          id(thermia_atec_unknown_fc16)->publish_state(
                            float(id(atec_unknown_fc16_count))
                          );
                          ESP_LOGE(
                            "thermia_atec1",
                            "\033[38;5;130m[ATEC-EXP1] UNKNOWN_0F_FC16_CAPTURE_ONLY start=%04X count=%u NO_ACK\033[0m",
                            unsigned(st),unsigned(ct)
                          );
                        }
                      }
                    }
                    // Continue into passive FC10 decoder for sensor publication.
                  }

                  // -----------------------------------------------------------
                  // Controller FC03 mailbox / desired-page reads.
                  // -----------------------------------------------------------
                  if (fc == 0x03 && bytes.size() == 8) {
                    const uint16_t st=u16(bytes,2);
                    const uint16_t ct=u16(bytes,4);

                    if (st==0x0708 && ct==6) {
                      if (id(atec_sync_requested) && !id(atec_sync_in_progress) &&
                          id(atec_write_state)==0) {
                        static const uint8_t sync_rsp[17] = {
                          0x0F,0x03,0x0C,
                          0x00,0x00, 0x00,0x00, 0xFF,0xFF,
                          0x86,0x7F, 0x03,0xDF, 0x00,0x00,
                          0x66,0xAD
                        };
                        id(atec_sync_requested)=false;
                        id(atec_sync_in_progress)=true;
                        id(atec_sync_index)=0;
                        id(atec_sync_retries)=0;
                        id(atec_sync_start_ms)=millis();
                        id(atec_config_synced)=false;
                        id(thermia_atec_config_synced_sensor)->publish_state(false);
                        id(thermia_atec_status)->publish_state(
                          "RUNNING / exact 26-page settings refresh requested"
                        );
                        id(thermia_atec_last_event)->publish_state(
                          "captured FFFF:867F refresh bitmap transmitted"
                        );
                        ESP_LOGE(
                          "thermia_atec1",
                          "\033[31m[ATEC-EXP1] ===== SETTINGS_SNAPSHOT_BITMAP_TX pages=26 frame=0F030C00000000FFFF867F03DF000066AD =====\033[0m"
                        );
                        atec_send_bytes(sync_rsp,sizeof(sync_rsp),0xAD66);
                      } else if (id(atec_write_state)==1 && id(atec_write_enabled) &&
                                 !id(atec_sync_in_progress)) {
                        static const uint8_t selector_rsp[17] = {
                          0x0F,0x03,0x0C,
                          0x00,0x00, 0x00,0x01, 0x00,0x00,
                          0x00,0x01, 0x00,0x00, 0x00,0x00,
                          0x2D,0x24
                        };
                        id(atec_write_state)=2;
                        id(atec_write_start_ms)=millis();
                        id(thermia_atec_status)->publish_state(
                          "RUNNING / 03E8 selector sent / wait controller FC03 pull"
                        );
                        id(thermia_atec_last_event)->publish_state(
                          "selector 0000,0001,0000,0001,0000,0000 sent"
                        );
                        ESP_LOGE(
                          "thermia_atec1",
                          "\033[31m[ATEC-EXP1] ===== 0708_SELECTOR_TX target03F4=%u frame=0F030C0000000100000001000000002D24 =====\033[0m",
                          unsigned(id(atec_target_room_setpoint))
                        );
                        atec_send_bytes(selector_rsp,sizeof(selector_rsp),0x242D);
                      } else {
                        static const uint8_t idle_rsp[17] = {
                          0x0F,0x03,0x0C,
                          0x00,0x00, 0x00,0x00, 0x00,0x00,
                          0x00,0x00, 0x00,0x00, 0x00,0x00,
                          0x1D,0x74
                        };
                        atec_send_bytes(idle_rsp,sizeof(idle_rsp),0x741D);
                      }

                      id(atec_runtime_0708_reply_count)++;
                      id(atec_runtime_last_service_ms)=millis();
                      id(thermia_atec_runtime_0708_replies)->publish_state(
                        float(id(atec_runtime_0708_reply_count))
                      );
                      return;
                    }

                    if (st==0x03E8 && ct==14 && id(atec_write_state)==2 &&
                        id(atec_write_enabled)) {
                      const uint32_t cache_age =
                        id(atec_page_cache_ms) ?
                          millis()-id(atec_page_cache_ms) : 0xFFFFFFFFUL;

                      if (!id(atec_page_cache_valid) || cache_age>60000UL) {
                        id(atec_write_state)=7;
                        id(atec_write_enabled)=false;
                        id(atec_pending_valid)=false;
                        id(thermia_atec_status)->publish_state(
                          "COMPLETE / INCONCLUSIVE / desired-page pull but cache stale"
                        );
                        id(thermia_atec_last_event)->publish_state(
                          "03E8 response withheld; semantic writes disabled"
                        );
                        return;
                      }

                      uint16_t words[14] = {
                        id(atec_page_w00),id(atec_page_w01),id(atec_page_w02),id(atec_page_w03),
                        id(atec_page_w04),id(atec_page_w05),id(atec_page_w06),id(atec_page_w07),
                        id(atec_page_w08),id(atec_page_w09),id(atec_page_w10),id(atec_page_w11),
                        id(atec_page_w12),id(atec_page_w13)
                      };

                      id(atec_original_room_setpoint)=words[12];
                      words[12]=id(atec_target_room_setpoint);

                      uint8_t rsp[33] = {0x0F,0x03,0x1C};
                      for (uint8_t i=0;i<14;i++) {
                        rsp[3+i*2]=uint8_t(words[i]>>8);
                        rsp[4+i*2]=uint8_t(words[i]&0xFF);
                      }
                      const uint16_t c=crc16_modbus(rsp,31);
                      rsp[31]=uint8_t(c&0xFF);
                      rsp[32]=uint8_t(c>>8);

                      id(atec_write_state)=3;
                      id(atec_write_start_ms)=millis();
                      id(atec_semantic_response_count)++;
                      id(thermia_atec_semantic_responses)->publish_state(
                        float(id(atec_semantic_response_count))
                      );
                      id(thermia_atec_status)->publish_state(
                        "RUNNING / desired 03E8 page sent / wait exact FC16 republish"
                      );
                      id(thermia_atec_last_event)->publish_state(
                        "desired page transmitted with only 03F4 changed"
                      );
                      ESP_LOGE(
                        "thermia_atec1",
                        "\033[31m[ATEC-EXP1] ===== DESIRED_PAGE_TX reg=03F4 original=%u desired=%u deltaWords=1 crc=%04X =====\033[0m",
                        unsigned(id(atec_original_room_setpoint)),
                        unsigned(id(atec_target_room_setpoint)),unsigned(c)
                      );
                      atec_send_bytes(rsp,sizeof(rsp),c);
                      return;
                    }

                    id(atec_unknown_fc03_count)++;
                    id(thermia_atec_unknown_fc03)->publish_state(
                      float(id(atec_unknown_fc03_count))
                    );
                    ESP_LOGE(
                      "thermia_atec1",
                      "\033[38;5;130m[ATEC-EXP1] UNKNOWN_0F_FC03_CAPTURE_ONLY start=%04X count=%u NO_TX\033[0m",
                      unsigned(st),unsigned(ct)
                    );
                    return;
                  }
                }
              }


              // ===============================================================
              // REQUEST CONTEXT
              //
              // Responses to FC04/FC17 do not contain the original register
              // address. Remember the request so the response can be decoded.
              // ===============================================================

              static uint16_t fc03_start[256] = {};
              static uint16_t fc03_count[256] = {};
              static bool fc03_pending[256] = {};

              static uint16_t fc04_start[256] = {};
              static uint16_t fc04_count[256] = {};
              static bool fc04_pending[256] = {};

              static uint16_t fc17_start[256] = {};
              static uint16_t fc17_count[256] = {};
              static bool fc17_pending[256] = {};

              // ===============================================================
              // MAPPER STATE
              // Change-only logging for selected register blocks.
              // ===============================================================

              static bool mapper_initialized = false;

              static int16_t prev_a7f8_block[0x0F] = {};
              static int16_t prev_a80c_block[0x07] = {};
              static int16_t prev_b3b0_block[0x03] = {};
              static int16_t prev_b3c4_block[0x03] = {};
              static int16_t prev_03e8_block[0x0E] = {};
              static int16_t prev_1e_fc04_block[0x16] = {};

              auto log_change =
                [&](const char *group,
                    uint16_t address,
                    int16_t old_value,
                    int16_t new_value) {

                  if (old_value == new_value) {
                    return;
                  }

                  ESP_LOGI(
                    "thermia_map",
                    "%s 0x%04X: %d -> %d",
                    group,
                    address,
                    old_value,
                    new_value
                  );
                };


              // ===============================================================
              // MINIMAL AUXILIARY MAPPING
              //
              // The public build intentionally omits the generic reverse-
              // engineering register database and its raw Home Assistant
              // entities. Keep only the few useful auxiliary values that are
              // sourced through generic_map_update call sites.
              // ===============================================================

              auto generic_map_update =
                [&](uint8_t source,
                    uint8_t slave_id,
                    uint16_t address,
                    int16_t value) {

                  if (source == 3 && slave_id == 0x0A && address == 0xB3C4) {
                    publish_float_if_changed(
                      id(thermia_room_bus_outdoor_temperature),
                      float(value),
                      0.5f
                    );
                    return;
                  }

                  if (source == 3 && slave_id == 0x06 && address == 0xAFDC) {
                    publish_float_if_changed(
                      id(thermia_dcm_status_afdc),
                      float(value),
                      0.5f
                    );
                    return;
                  }

                  if (source == 3 && slave_id == 0x06 && address == 0xAFE0) {
                    // MAP03: DHP-AQ supplied 0x050D (1293) here while the
                    // actual outdoor path carried 13. Keep the full word raw;
                    // do not publish 1293 as degrees Celsius.
                    publish_float_if_changed(
                      id(thermia_dcm_outdoor_temperature),
                      float(uint16_t(value)),
                      0.5f
                    );
                    return;
                  }
                };


              // ===============================================================
              // DHP-AQ FC03 REQUEST / RESPONSE
              //
              // Passive only. The DHP-AQ capture polls slave 0xA5 at
              // 0x0000/count 18. The semantic labels below are CANDIDATES.
              // ===============================================================

              if (
                fc == 0x03 &&
                bytes.size() == 8
              ) {
                fc03_start[slave] = u16(bytes, 2);
                fc03_count[slave] = u16(bytes, 4);
                fc03_pending[slave] = true;
                return;
              }

              if (
                fc == 0x03 &&
                fc03_pending[slave] &&
                bytes.size() >= 5 &&
                bytes.size() == size_t(bytes[2]) + 5
              ) {
                const uint16_t start = fc03_start[slave];
                const uint16_t count = fc03_count[slave];
                const uint8_t byte_count = bytes[2];

                if (byte_count == count * 2) {
                  auto reg_s =
                    [&](uint16_t address) -> int16_t {
                      const size_t offset = size_t(address - start);
                      const size_t pos = 3 + offset * 2;
                      return s16(bytes, pos);
                    };

                  if (
                    slave == 0xA5 &&
                    start == 0x0000 &&
                    count >= 0x0012
                  ) {
                    const int16_t pressure_like_raw =
                      reg_s(0x0000);
                    const float suction_gas_temperature =
                      float(reg_s(0x0001)) / 10.0f;
                    const float evaporation_temperature =
                      float(reg_s(0x0005)) / 10.0f;
                    const float superheat_target =
                      float(reg_s(0x0006)) / 10.0f;
                    const float superheat =
                      float(reg_s(0x0007)) / 10.0f;
                    const int16_t refrigerant_control_output =
                      reg_s(0x0008);
                    const int16_t a5_state =
                      reg_s(0x0004);
                    const bool a5_active =
                      reg_s(0x000A) != 0;
                    const bool a5_context_0x02 =
                      (uint16_t(a5_state) & 0x0002U) != 0;

                    // MAP03: 0000 is strongly pressure-like and closely tied
                    // to 0005, but the physical unit and scaling are NOT proven.
                    publish_float_if_changed(
                      id(thermia_dhp_aq_evaporation_pressure),
                      float(pressure_like_raw),
                      0.5f
                    );

                    // VERY STRONG CANDIDATE: 0001 - 0005 reproduces 0007
                    // across both IDLE and DHW captures. The superheat semantic
                    // interpretation remains candidate until service-screen
                    // confirmation, but the arithmetic relationship is real.
                    if (
                      suction_gas_temperature > -80.0f &&
                      suction_gas_temperature < 150.0f
                    ) {
                      publish_float_if_changed(
                        id(thermia_refrigerant_temperature_1),
                        suction_gas_temperature,
                        0.05f
                      );
                    }

                    if (
                      evaporation_temperature > -80.0f &&
                      evaporation_temperature < 100.0f
                    ) {
                      publish_float_if_changed(
                        id(thermia_refrigerant_temperature_2),
                        evaporation_temperature,
                        0.05f
                      );
                    }

                    if (
                      superheat_target > -20.0f &&
                      superheat_target < 50.0f
                    ) {
                      publish_float_if_changed(
                        id(thermia_dhp_aq_superheat_target),
                        superheat_target,
                        0.05f
                      );
                    }

                    if (
                      superheat > -30.0f &&
                      superheat < 80.0f
                    ) {
                      publish_float_if_changed(
                        id(thermia_dhp_aq_superheat),
                        superheat,
                        0.05f
                      );
                    }

                    // MAP03: 0008 is definitely an active control/load-like
                    // output in the DHW capture (0 idle, ~45..53 active), but
                    // EXV percentage is not yet proven. Keep the raw value.
                    publish_float_if_changed(
                      id(thermia_dhp_aq_exv_opening),
                      float(refrigerant_control_output),
                      0.5f
                    );

                    publish_float_if_changed(
                      id(thermia_dhp_aq_a5_state_raw),
                      float(a5_state),
                      0.5f
                    );

                    publish_bool_if_changed(
                      id(thermia_dhp_aq_a5_context_0x02),
                      a5_context_0x02
                    );

                    publish_bool_if_changed(
                      id(thermia_dhp_aq_a5_active),
                      a5_active
                    );
                  }

                  // A5:0023 is polled separately. In the supplied DHW capture
                  // it was observed at 1 and then cleared to 0 by FC06.
                  // Treat it as an event/latch/handshake candidate, not a sensor.
                  if (
                    slave == 0xA5 &&
                    start == 0x0023 &&
                    count >= 1
                  ) {
                    const int16_t latch_0023 =
                      s16(bytes, 3);
                    publish_float_if_changed(
                      id(thermia_dhp_aq_a5_latch_0023_raw),
                      float(latch_0023),
                      0.5f
                    );
                  }
                }

                fc03_pending[slave] = false;
                return;
              }


              // ===============================================================
              // FC06 - PASSIVE OBSERVATION ONLY
              //
              // The ESP does not emit FC06. Request/echo frames are identical
              // at this level, so both may be observed. MAP03 saw A5:0023
              // cleared from 1 to 0 using this function.
              // ===============================================================

              if (
                fc == 0x06 &&
                bytes.size() == 8
              ) {
                const uint16_t address =
                  u16(bytes, 2);
                const int16_t value =
                  s16(bytes, 4);

                if (
                  slave == 0xA5 &&
                  address == 0x0023
                ) {
                  publish_float_if_changed(
                    id(thermia_dhp_aq_a5_latch_0023_raw),
                    float(value),
                    0.5f
                  );
                }

                return;
              }


              // ===============================================================
              // FC04 REQUEST
              // Read Input Registers
              // ===============================================================

              if (
                fc == 0x04 &&
                bytes.size() == 8
              ) {

                fc04_start[slave] =
                  u16(bytes, 2);

                fc04_count[slave] =
                  u16(bytes, 4);

                fc04_pending[slave] = true;

                return;
              }


              // ===============================================================
              // FC04 RESPONSE
              // ===============================================================

              if (
                fc == 0x04 &&
                fc04_pending[slave] &&
                bytes.size() >= 5 &&
                bytes.size() == size_t(bytes[2]) + 5
              ) {

                const uint16_t start =
                  fc04_start[slave];

                const uint16_t count =
                  fc04_count[slave];

                const uint8_t byte_count =
                  bytes[2];


                if (byte_count != count * 2) {

                  fc04_pending[slave] = false;
                  return;
                }


                auto reg_u =
                  [&](uint16_t address) -> uint16_t {

                    const size_t offset =
                      size_t(address - start);

                    const size_t pos =
                      3 + offset * 2;

                    return u16(bytes, pos);
                  };


                auto reg_s =
                  [&](uint16_t address) -> int16_t {

                    const size_t offset =
                      size_t(address - start);

                    const size_t pos =
                      3 + offset * 2;

                    return s16(bytes, pos);
                  };


                // Generic mapper: scan complete FC04 response block.
                for (uint16_t i = 0; i < count; i++) {

                  const uint16_t address =
                    uint16_t(start + i);

                  generic_map_update(
                    1,
                    slave,
                    address,
                    reg_s(address)
                  );
                }


                // =============================================================
                // SLAVE 0x1E
                // Outdoor unit / compressor live data
                //
                // FC04 start 0x0000
                //
                // 0000 condenser inlet          x0.1 °C
                // 0001 condenser outlet         x0.1 °C
                // 0008 high pressure            x0.1 bar
                // 000A requested temperature    x0.1 °C
                // 000B compressor frequency     Hz
                // 000D compressor current       x0.1 A
                // 000E outdoor fan              rpm
                // 0010 expansion valve          steps
                // =============================================================

                if (
                  slave == 0x1E &&
                  start == 0x0000 &&
                  count >= 17
                ) {

                  // -----------------------------------------------------------
                  // Mapper: slave 0x1E FC04 block 0x0000..0x0015
                  // -----------------------------------------------------------

                  if (count >= 0x16) {
                    for (uint16_t addr = 0x0000; addr <= 0x0015; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr);

                      if (mapper_initialized) {
                        log_change(
                          "S1E_FC04",
                          addr,
                          prev_1e_fc04_block[idx],
                          v
                        );
                      }

                      prev_1e_fc04_block[idx] = v;
                    }
                  }

                  const float condenser_in =
                    float(reg_s(0x0000)) / 10.0f;

                  const float condenser_out =
                    float(reg_s(0x0001)) / 10.0f;

                  const float refrigerant_temperature_1 =
                    float(reg_s(0x0002)) / 10.0f;

                  const float discharge_gas_temperature =
                    float(reg_s(0x0003)) / 10.0f;

                  const float refrigerant_temperature_2 =
                    float(reg_s(0x0004)) / 10.0f;

                  const float average_outdoor_temperature =
                    float(reg_s(0x0005)) / 10.0f;

                  const float compressor_temperature =
                    float(reg_s(0x0006)) / 10.0f;

                  const float high_pressure =
                    float(reg_u(0x0008)) / 10.0f;

                  const float target_temperature =
                    float(reg_s(0x000A)) / 10.0f;

                  const float compressor_frequency =
                    float(reg_u(0x000B));

                  const float compressor_current =
                    float(reg_u(0x000D)) / 10.0f;

                  const float fan_speed =
                    float(reg_u(0x000E));

                  const float valve_steps =
                    float(reg_u(0x0010));


                  if (
                    condenser_in > -50.0f &&
                    condenser_in < 150.0f
                  ) {

                    publish_float_if_changed(id(thermia_condenser_in), condenser_in, 0.05f);
                  }


                  if (
                    condenser_out > -50.0f &&
                    condenser_out < 150.0f
                  ) {

                    publish_float_if_changed(id(thermia_condenser_out), condenser_out, 0.05f);
                  }


                  if (
                    condenser_in > -50.0f &&
                    condenser_in < 150.0f &&
                    condenser_out > -50.0f &&
                    condenser_out < 150.0f
                  ) {

                    publish_float_if_changed(
                      id(thermia_condenser_delta_t),
                      condenser_out - condenser_in,
                      0.05f
                    );
                  }


                  if (refrigerant_temperature_1 > -80.0f &&
                      refrigerant_temperature_1 < 200.0f) {
                    publish_float_if_changed(id(thermia_refrigerant_temperature_1), refrigerant_temperature_1, 0.05f);
                  }

                  if (discharge_gas_temperature > -80.0f &&
                      discharge_gas_temperature < 250.0f) {
                    publish_float_if_changed(id(thermia_discharge_gas_temperature), discharge_gas_temperature, 0.05f);
                  }

                  if (refrigerant_temperature_2 > -80.0f &&
                      refrigerant_temperature_2 < 200.0f) {
                    publish_float_if_changed(id(thermia_refrigerant_temperature_2), refrigerant_temperature_2, 0.05f);
                  }

                  if (average_outdoor_temperature > -80.0f &&
                      average_outdoor_temperature < 100.0f) {
                    publish_float_if_changed(id(thermia_average_outdoor_temperature), average_outdoor_temperature, 0.05f);
                  }

                  if (compressor_temperature > -80.0f &&
                      compressor_temperature < 200.0f) {
                    publish_float_if_changed(id(thermia_compressor_temperature), compressor_temperature, 0.05f);
                  }


                  if (
                    high_pressure >= 0.0f &&
                    high_pressure < 100.0f
                  ) {

                    publish_float_if_changed(id(thermia_high_pressure), high_pressure, 0.05f);
                  }


                  if (
                    target_temperature > -50.0f &&
                    target_temperature < 150.0f
                  ) {

                    publish_float_if_changed(id(thermia_target_temperature), target_temperature, 0.05f);
                  }


                  if (
                    compressor_frequency >= 0.0f &&
                    compressor_frequency < 200.0f
                  ) {

                    publish_float_if_changed(id(thermia_compressor_frequency), compressor_frequency, 0.5f);
                  }


                  if (
                    compressor_current >= 0.0f &&
                    compressor_current < 100.0f
                  ) {

                    publish_float_if_changed(id(thermia_compressor_current), compressor_current, 0.05f);
                  }


                  if (
                    fan_speed >= 0.0f &&
                    fan_speed < 5000.0f
                  ) {

                    publish_float_if_changed(id(thermia_fan_speed), fan_speed, 1.0f);
                  }


                  if (
                    valve_steps >= 0.0f &&
                    valve_steps < 10000.0f
                  ) {

                    publish_float_if_changed(id(thermia_expansion_valve_steps), valve_steps, 1.0f);
                  }


                  const bool compressor_running = compressor_frequency > 0.0f;
                  const bool compressor_starting =
                    compressor_frequency > 0.0f && compressor_current < 0.2f;
                  const bool fan_running = fan_speed > 0.0f;

                  publish_bool_if_changed(
                    id(thermia_compressor_running),
                    compressor_running
                  );

                  // Heuristic only: during the captured start sequence the
                  // frequency rises before the current register leaves 0.0 A.
                  // Useful diagnostically, but do not treat as a hard fault rule.
                  publish_bool_if_changed(
                    id(thermia_compressor_starting),
                    compressor_starting
                  );

                  publish_bool_if_changed(
                    id(thermia_outdoor_fan_running),
                    fan_running
                  );

                  if (count > 0x0015) {
                    const uint16_t operating_state = reg_u(0x0014);
                    const uint16_t status_flags = reg_u(0x0015);

                    // Status flag map from captured operation:
                    //   0x0020 = heating context
                    //   0x0040 = DHW / high-temperature context
                    //   0x0080 = cooling context
                    //   0x0200 = outdoor-unit run-enable acknowledged
                    //
                    // Observed examples:
                    //   0x021 (33)  = heating context, run-enable inactive
                    //   0x041 (65)  = DHW context, run-enable inactive
                    //   0x081 (129) = cooling context, run-enable inactive
                    //   0x221 (545) = heating + run-enable acknowledged
                    //   0x241 (577) = DHW + run-enable acknowledged
                    //   0x281 (641) = cooling + run-enable acknowledged
                    const bool heating_context = (status_flags & 0x0020U) != 0;
                    const bool dhw_context = (status_flags & 0x0040U) != 0;
                    const bool cooling_context = (status_flags & 0x0080U) != 0;
                    const bool run_enable_acknowledged = (status_flags & 0x0200U) != 0;

                    publish_float_if_changed(
                      id(thermia_outdoor_unit_operating_state_raw),
                      float(operating_state),
                      0.5f
                    );

                    publish_float_if_changed(
                      id(thermia_outdoor_unit_status_flags),
                      float(status_flags),
                      0.5f
                    );

                    publish_bool_if_changed(id(thermia_heating_context), heating_context);
                    publish_bool_if_changed(id(thermia_dhw_context), dhw_context);
                    publish_bool_if_changed(id(thermia_cooling_context), cooling_context);

                    // "Context" says which mode is selected/requested.
                    //
                    // "Active" requires:
                    //   - matching mode context from 0015,
                    //   - physical compressor operation (000B > 0 Hz),
                    //   - FC10 0007 overall outdoor-unit cycle request,
                    //   - FC10 0008 immediate outdoor-unit run enable.
                    //
                    // Requiring 0007 + 0008 avoids false mode-active states during
                    // heating <-> DHW handovers and during autonomous recovery
                    // sequences where the compressor can briefly run independently.
                    const bool cycle_request_active =
                      id(thermia_outdoor_unit_command_0007).has_state() &&
                      id(thermia_outdoor_unit_command_0007).state;

                    const bool run_enable_command_active =
                      id(thermia_outdoor_unit_command_0008).has_state() &&
                      id(thermia_outdoor_unit_command_0008).state;

                    publish_bool_if_changed(
                      id(thermia_heating_active),
                      heating_context &&
                      compressor_running &&
                      cycle_request_active &&
                      run_enable_command_active
                    );
                    publish_bool_if_changed(
                      id(thermia_dhw_active),
                      dhw_context &&
                      compressor_running &&
                      cycle_request_active &&
                      run_enable_command_active
                    );
                    publish_bool_if_changed(
                      id(thermia_cooling_active),
                      cooling_context &&
                      compressor_running &&
                      cycle_request_active &&
                      run_enable_command_active
                    );

                    // Keep the existing ESPHome id for compatibility, but give the
                    // entity its corrected meaning in Home Assistant.
                    publish_bool_if_changed(
                      id(thermia_outdoor_unit_enabled),
                      run_enable_acknowledged
                    );

                    // 0014 is an internal outdoor-unit sequence/state machine.
                    // IMPORTANT: it is NOT a direct compressor-running indicator.
                    // Physical compressor running remains FC04 000B > 0 Hz.
                    //
                    // Extended captures show:
                    //   16 = idle
                    //   18 = late shutdown / final transition (exact subfunction tentative)
                    //   20 = recovery / autonomous outdoor-unit sequence (purpose tentative)
                    //   24 = common transition / sequence stage
                    //   25 = heating/DHW shutdown / fan-stop stage
                    //   26 = cooling shutdown stage
                    //   27 = cooling shutdown / fan-stop stage
                    //   28 = heating/DHW transition/ramp; compressor may already run
                    //   29 = heating/DHW established sequence; can persist after compressor stops
                    //   30 = cooling transition/ramp; compressor may already run
                    //   31 = cooling established sequence
                    const char *unit_state = "Unknown";
                    switch (operating_state) {
                      case 16:
                        unit_state = "Idle";
                        break;
                      case 18:
                        unit_state = "Late shutdown / final transition";
                        break;
                      case 20:
                        unit_state = "Recovery / autonomous sequence";
                        break;
                      case 24:
                        unit_state = "Transition / sequence";
                        break;
                      case 25:
                        unit_state = "Heating/DHW shutdown / fan stop";
                        break;
                      case 26:
                        unit_state = "Cooling shutdown stage 2";
                        break;
                      case 27:
                        unit_state = "Cooling shutdown / fan stop";
                        break;
                      case 28:
                        unit_state = "Heating/DHW transition / ramp";
                        break;
                      case 29:
                        unit_state = "Heating/DHW established sequence";
                        break;
                      case 30:
                        unit_state = "Cooling transition / ramp";
                        break;
                      case 31:
                        unit_state = "Cooling established sequence";
                        break;
                      default:
                        unit_state = "Unknown";
                        break;
                    }

                    publish_text_if_changed(
                      id(thermia_outdoor_unit_state),
                      unit_state
                    );

                    const char *status_mode = "Unknown";
                    if (cooling_context) {
                      status_mode = "Cooling";
                    } else if (dhw_context) {
                      status_mode = "DHW / high temperature";
                    } else if (heating_context) {
                      status_mode = "Heating";
                    }

                    publish_text_if_changed(
                      id(thermia_operating_mode),
                      status_mode
                    );
                  }
                }


                fc04_pending[slave] = false;
                return;
              }


              // ===============================================================
              // FC10
              // Write Multiple Registers
              //
              // These frames are transmitted BY THERMIA.
              // The ESP only listens.
              // ===============================================================

              if (
                fc == 0x10 &&
                bytes.size() >= 9
              ) {

                const uint16_t start =
                  u16(bytes, 2);

                const uint16_t count =
                  u16(bytes, 4);

                const uint8_t byte_count =
                  bytes[6];


                if (
                  bytes.size() !=
                  size_t(byte_count) + 9
                ) {

                  return;
                }


                if (
                  byte_count !=
                  count * 2
                ) {

                  return;
                }


                auto reg_s =
                  [&](uint16_t address) -> int16_t {

                    const size_t offset =
                      size_t(address - start);

                    const size_t pos =
                      7 + offset * 2;

                    return s16(bytes, pos);
                  };


                // Generic mapper: scan complete FC10 write block.
                for (uint16_t i = 0; i < count; i++) {

                  const uint16_t address =
                    uint16_t(start + i);

                  generic_map_update(
                    2,
                    slave,
                    address,
                    reg_s(address)
                  );
                }

                // Outdoor-unit FC10 command block sent by the Thermia controller.
                //
                // Current functional map:
                //   0001 = commanded/live target temperature x0.1 °C
                //   0004 = operating/request mode: 1 heating, 2 DHW, 3 cooling
                //   0006 = periodic 0/1/2 state/counter; ~2 h steps observed, purpose unknown
                //   0007 = overall outdoor-unit cycle / sequence request; can stay ON across mode handovers
                //   0008 = immediate outdoor-unit run enable; can toggle OFF/ON during a heating<->DHW handover
                if (slave == 0x1E) {
                  if (start <= 0x0001 && (uint32_t(start) + uint32_t(count)) > 0x0001) {
                    const float commanded_target = float(reg_s(0x0001)) / 10.0f;
                    if (commanded_target > -50.0f && commanded_target < 150.0f) {
                      publish_float_if_changed(
                        id(thermia_commanded_target_temperature),
                        commanded_target,
                        0.05f
                      );
                    }
                  }

                  if (start <= 0x0004 && (uint32_t(start) + uint32_t(count)) > 0x0004) {
                    const int16_t mode_raw = reg_s(0x0004);
                    publish_float_if_changed(
                      id(thermia_mode_request_raw),
                      float(mode_raw),
                      0.5f
                    );

                    const char *mode_text = "Unknown";
                    if (mode_raw == 1) {
                      mode_text = "Heating";
                    } else if (mode_raw == 2) {
                      mode_text = "DHW / high temperature";
                    } else if (mode_raw == 3) {
                      mode_text = "Cooling";
                    }

                    publish_text_if_changed(
                      id(thermia_mode_request),
                      mode_text
                    );
                  }

                  if (start <= 0x0007 && (uint32_t(start) + uint32_t(count)) > 0x0007) {
                    publish_bool_if_changed(
                      id(thermia_outdoor_unit_command_0007),
                      reg_s(0x0007) != 0
                    );
                  }

                  if (start <= 0x0008 && (uint32_t(start) + uint32_t(count)) > 0x0008) {
                    publish_bool_if_changed(
                      id(thermia_outdoor_unit_command_0008),
                      reg_s(0x0008) != 0
                    );
                  }
                }


                // =============================================================
                // SLAVE 0x0F
                // Heating configuration block
                //
                // 03E8 Heating curve
                // 03E9 Heating MIN
                // 03EA Heating MAX
                // 03EB Curve +5
                // 03EC Curve 0
                // 03ED Curve -5
                // 03EE Heating stop
                // 03EF Reduced temperature
                // 03F0 Room factor
                // 03F4 Room setpoint mirror
                // =============================================================

                if (
                  slave == 0x0F &&
                  start == 0x03E8 &&
                  count >= 13
                ) {

                  // -----------------------------------------------------------
                  // Mapper: slave 0x0F FC10 block 0x03E8..0x03F5
                  // -----------------------------------------------------------

                  if (count >= 0x0E) {
                    for (uint16_t addr = 0x03E8; addr <= 0x03F5; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr - 0x03E8);

                      if (mapper_initialized) {
                        log_change(
                          "S0F_FC10",
                          addr,
                          prev_03e8_block[idx],
                          v
                        );
                      }

                      prev_03e8_block[idx] = v;
                    }
                  }

                  const float heating_curve = float(reg_s(0x03E8));
                  const float heating_min = float(reg_s(0x03E9));
                  const float heating_max = float(reg_s(0x03EA));
                  const float curve_plus5 = float(reg_s(0x03EB));
                  const float curve_zero = float(reg_s(0x03EC));
                  const float curve_minus5 = float(reg_s(0x03ED));
                  const float heating_stop = float(reg_s(0x03EE));
                  const float reduced_temperature = float(reg_s(0x03EF));
                  const float room_factor = float(reg_s(0x03F0));
                  const float room_setpoint_mirror = float(reg_s(0x03F4));

                  // Persist only values received from the real Thermia settings block.
                  id(thermia_heating_curve_saved) = heating_curve;
                  id(thermia_heating_min_saved) = heating_min;
                  id(thermia_heating_max_saved) = heating_max;
                  id(thermia_curve_plus5_saved) = curve_plus5;
                  id(thermia_curve_zero_saved) = curve_zero;
                  id(thermia_curve_minus5_saved) = curve_minus5;
                  id(thermia_heating_stop_saved) = heating_stop;
                  id(thermia_reduced_temperature_saved) = reduced_temperature;
                  id(thermia_room_factor_saved) = room_factor;
                  id(thermia_room_setpoint_mirror_saved) = room_setpoint_mirror;
                  id(thermia_settings_cache_valid) = true;

                  publish_float_if_changed(id(thermia_heating_curve), heating_curve, 0.5f);
                  publish_float_if_changed(id(thermia_heating_min), heating_min, 0.5f);
                  publish_float_if_changed(id(thermia_heating_max), heating_max, 0.5f);

                  // Confirmed heating-curve correction points.
                  publish_float_if_changed(id(thermia_curve_plus5), curve_plus5, 0.5f);
                  publish_float_if_changed(id(thermia_curve_zero), curve_zero, 0.5f);
                  publish_float_if_changed(id(thermia_curve_minus5), curve_minus5, 0.5f);

                  publish_float_if_changed(id(thermia_heating_stop), heating_stop, 0.5f);
                  publish_float_if_changed(id(thermia_reduced_temperature), reduced_temperature, 0.5f);
                  publish_float_if_changed(id(thermia_room_factor), room_factor, 0.5f);

                  // 03F4 follows the room setpoint. Keep a separate diagnostic
                  // mirror because it comes from the settings block rather than
                  // from the room-sensor block.
                  publish_float_if_changed(id(thermia_room_setpoint_mirror), room_setpoint_mirror, 0.5f);
                }

                // =============================================================
                // ATEC / DHP-AQ FAMILY SETTINGS PAGES — PASSIVE CANDIDATES
                // Exact page shapes are present in the supplied ATEC/Eco logs.
                // Semantics remain Candidate on the target ATEC until locally
                // correlated. This block NEVER transmits or ACKs.
                // =============================================================

                // 0410/count22: Discussion #143 maps decimal 1053 / 0x041D
                // to DHW start. Raw gateway captures repeatedly show 041D=39.
                if (slave == 0x0F && start == 0x0410 && count >= 22) {
                  const int16_t dhw_start = reg_s(0x041D);
                  if (dhw_start >= 0 && dhw_start <= 100)
                    publish_float_if_changed(id(thermia_atec_dhw_start_candidate), float(dhw_start), 0.5f);
                }

                // 042E/count15 occurs repeatedly in both gateway logs.
                // Later XTR-local proof supports the field positions below.
                if (slave == 0x0F && start == 0x042E && count >= 15) {
                  const int16_t enabled = reg_s(0x042E);
                  const int16_t mode = reg_s(0x042F);
                  const int16_t startup_ht = reg_s(0x0433);
                  const int16_t heating_time = reg_s(0x0434);

                  if (enabled == 0 || enabled == 1)
                    publish_bool_if_changed(id(thermia_atec_dhw_enabled_candidate), enabled == 1);

                  if (mode == 0)
                    publish_text_if_changed(id(thermia_atec_dhw_mode_candidate), "Comfort (candidate)");
                  else if (mode == 1)
                    publish_text_if_changed(id(thermia_atec_dhw_mode_candidate), "Eco (candidate)");
                  else if (mode == 2)
                    publish_text_if_changed(id(thermia_atec_dhw_mode_candidate), "Vacation Eco (candidate)");
                  else
                    publish_text_if_changed(id(thermia_atec_dhw_mode_candidate), "Unknown");

                  if (startup_ht >= 0 && startup_ht <= 120)
                    publish_float_if_changed(id(thermia_atec_startup_ht_candidate), float(startup_ht), 0.5f);
                  if (heating_time >= 0 && heating_time <= 180)
                    publish_float_if_changed(id(thermia_atec_heating_time_candidate), float(heating_time), 0.5f);
                }

                // 0442/count13 is present in both gateway logs.
                if (slave == 0x0F && start == 0x0442 && count >= 13) {
                  const int16_t enabled = reg_s(0x0442);
                  const int16_t desired_temp = reg_s(0x0443);
                  const int16_t active_above = reg_s(0x0445);
                  const int16_t cooling_time = reg_s(0x0449);
                  const int16_t room_sensor = reg_s(0x044C);
                  const int16_t hyst_low = reg_s(0x044D);
                  const int16_t hyst_high = reg_s(0x044E);

                  if (enabled == 0 || enabled == 1)
                    publish_bool_if_changed(id(thermia_atec_cooling_enabled_candidate), enabled == 1);
                  if (desired_temp >= -20 && desired_temp <= 80)
                    publish_float_if_changed(id(thermia_atec_cooling_desired_temperature_candidate), float(desired_temp), 0.5f);
                  if (active_above >= -20 && active_above <= 80)
                    publish_float_if_changed(id(thermia_atec_cooling_active_above_candidate), float(active_above), 0.5f);
                  if (cooling_time >= 0 && cooling_time <= 180)
                    publish_float_if_changed(id(thermia_atec_cooling_time_candidate), float(cooling_time), 0.5f);
                  if (room_sensor == 0 || room_sensor == 1)
                    publish_bool_if_changed(id(thermia_atec_cooling_room_sensor_candidate), room_sensor == 1);
                  if (hyst_low >= 0 && hyst_low <= 200)
                    publish_float_if_changed(id(thermia_atec_cooling_room_hyst_low_candidate), float(hyst_low) / 10.0f, 0.05f);
                  if (hyst_high >= 0 && hyst_high <= 200)
                    publish_float_if_changed(id(thermia_atec_cooling_room_hyst_high_candidate), float(hyst_high) / 10.0f, 0.05f);
                }

                // 0546/count20: raw ATEC/Eco captures repeatedly show
                // 0553=2 and 0559=0. Public Online/DCM evidence + XTR-local
                // work support Operation Mode and Link Integration respectively.
                if (slave == 0x0F && start == 0x0546 && count >= 20) {
                  const int16_t mode = reg_s(0x0553);
                  const int16_t link = reg_s(0x0559);

                  publish_float_if_changed(id(thermia_atec_operation_mode_raw_candidate), float(mode), 0.5f);
                  publish_float_if_changed(id(thermia_atec_link_integration_raw_candidate), float(link), 0.5f);

                  if (mode == 0) publish_text_if_changed(id(thermia_atec_operation_mode_candidate), "Off (candidate)");
                  else if (mode == 1) publish_text_if_changed(id(thermia_atec_operation_mode_candidate), "Auto (candidate)");
                  else if (mode == 2) publish_text_if_changed(id(thermia_atec_operation_mode_candidate), "Compressor (candidate)");
                  else if (mode == 3) publish_text_if_changed(id(thermia_atec_operation_mode_candidate), "Aux (candidate)");
                  else if (mode == 4) publish_text_if_changed(id(thermia_atec_operation_mode_candidate), "Hot water (candidate)");
                  else publish_text_if_changed(id(thermia_atec_operation_mode_candidate), "Unknown");

                  if (link == 0) publish_text_if_changed(id(thermia_atec_link_integration_candidate), "Light (candidate)");
                  else if (link == 1) publish_text_if_changed(id(thermia_atec_link_integration_candidate), "System (candidate)");
                  else publish_text_if_changed(id(thermia_atec_link_integration_candidate), "Unknown");
                }

                return;
              }


              // ===============================================================
              // FC17 REQUEST
              // Read / Write Multiple Registers
              // ===============================================================

              if (
                fc == 0x17 &&
                bytes.size() >= 13
              ) {

                const uint16_t read_start =
                  u16(bytes, 2);

                const uint16_t read_count =
                  u16(bytes, 4);

                const uint16_t write_start =
                  u16(bytes, 6);

                const uint16_t write_count =
                  u16(bytes, 8);

                const uint8_t byte_count =
                  bytes[10];

                const size_t expected_size =
                  size_t(byte_count) + 13;


                if (
                  bytes.size() == expected_size &&
                  byte_count == write_count * 2
                ) {

                  fc17_start[slave] =
                    read_start;

                  fc17_count[slave] =
                    read_count;

                  fc17_pending[slave] =
                    true;


                  auto write_reg_s =
                    [&](uint16_t address) -> int16_t {

                      const size_t offset =
                        size_t(address - write_start);

                      const size_t pos =
                        11 + offset * 2;

                      return s16(bytes, pos);
                    };


                  // Generic mapper: scan complete FC17 write part.
                  for (uint16_t i = 0; i < write_count; i++) {

                    const uint16_t address =
                      uint16_t(write_start + i);

                    generic_map_update(
                      3,
                      slave,
                      address,
                      write_reg_s(address)
                    );
                  }


                  // ===========================================================
                  // MAPPER: FC17 write blocks
                  // ===========================================================

                  if (
                    slave == 0x0A &&
                    write_start <= 0xB3C4 &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) >= 0xB3C7
                  ) {

                    for (uint16_t addr = 0xB3C4; addr <= 0xB3C6; addr++) {
                      const int16_t v = write_reg_s(addr);
                      const size_t idx = size_t(addr - 0xB3C4);

                      if (mapper_initialized) {
                        log_change(
                          "S0A_FC17W",
                          addr,
                          prev_b3c4_block[idx],
                          v
                        );
                      }

                      prev_b3c4_block[idx] = v;
                    }

                    // B3C6 is an unresolved room-sensor control/status word.
                    // Values 0 / 2 have been observed, but "boost/enhanced" is
                    // not sufficiently proven. Keep the binary entity diagnostic
                    // and neutral: ON only means B3C6 is non-zero.
                    publish_bool_if_changed(
                      id(thermia_room_boost_request),
                      write_reg_s(0xB3C6) != 0
                    );
                  }


                  if (
                    slave == 0x02 &&
                    write_start <= 0xA80C &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) >= 0xA813
                  ) {

                    for (uint16_t addr = 0xA80C; addr <= 0xA812; addr++) {
                      const int16_t v = write_reg_s(addr);
                      const size_t idx = size_t(addr - 0xA80C);

                      if (mapper_initialized) {
                        log_change(
                          "S02_FC17W",
                          addr,
                          prev_a80c_block[idx],
                          v
                        );
                      }

                      prev_a80c_block[idx] = v;
                    }

                    const uint16_t a80c = uint16_t(write_reg_s(0xA80C));
                    const uint16_t a80e = uint16_t(write_reg_s(0xA80E));

                    publish_float_if_changed(
                      id(thermia_controller_state_a80c),
                      float(a80c),
                      0.5f
                    );

                    const char *controller_context = "Unknown";
                    switch (a80c) {
                      case 64:
                        controller_context = "Normal / baseline";
                        break;
                      case 65:
                        controller_context = "DHW / high temperature";
                        break;
                      case 66:
                        controller_context = "Cooling context / available";
                        break;
                      case 112:
                        controller_context = "Controller housekeeping / transition";
                        break;
                      case 193:
                        controller_context = "Compound / unknown";
                        break;
                      default:
                        controller_context = "Unknown";
                        break;
                    }
                    publish_text_if_changed(
                      id(thermia_controller_context),
                      controller_context
                    );

                    publish_float_if_changed(
                      id(thermia_controller_state_a80e),
                      float(a80e),
                      0.5f
                    );

                    publish_float_if_changed(
                      id(thermia_dhp_aq_a812_raw),
                      float(write_reg_s(0xA812)),
                      0.5f
                    );

                    // DHP-AQ candidate interpretation.
                    // Cross-model DHP-AQ/iTec Eco traffic identifies:
                    //   A80C bit 0x40 = compressor running
                    //   A80C bit 0x01 = DHW request/context
                    // The supplied IDLE/DHW captures are consistent with both.
                    const bool dhp_compressor_running =
                      (a80c & 0x0040U) != 0;
                    const bool dhp_dhw_request =
                      (a80c & 0x0001U) != 0;

                    publish_bool_if_changed(
                      id(thermia_compressor_running),
                      dhp_compressor_running
                    );
                    publish_bool_if_changed(
                      id(thermia_dhw_context),
                      dhp_dhw_request
                    );
                    publish_bool_if_changed(
                      id(thermia_dhw_active),
                      dhp_dhw_request
                    );

                    const char *dhp_operating_mode =
                      "Idle / no compressor (candidate)";
                    if (dhp_dhw_request && dhp_compressor_running) {
                      dhp_operating_mode =
                        "DHW / high temperature (candidate)";
                    } else if (dhp_dhw_request) {
                      dhp_operating_mode =
                        "DHW request (candidate)";
                    } else if (dhp_compressor_running) {
                      dhp_operating_mode =
                        "Compressor active / non-DHW (candidate)";
                    }
                    publish_text_if_changed(
                      id(thermia_operating_mode),
                      dhp_operating_mode
                    );

                    const char *dhp_unit_state =
                      dhp_compressor_running
                        ? "Running (candidate)"
                        : "Idle (candidate)";
                    publish_text_if_changed(
                      id(thermia_outdoor_unit_state),
                      dhp_unit_state
                    );

                    // Keep these raw bit sensors neutral. A80C is primarily
                    // treated as a controller context/sequence value, while A80E
                    // behaves as a controller/accessory status bitfield.
                    publish_bool_if_changed(id(thermia_a80c_flag_0x10), (a80c & 0x0010U) != 0);
                    publish_bool_if_changed(id(thermia_a80c_flag_0x20), (a80c & 0x0020U) != 0);
                    publish_bool_if_changed(id(thermia_a80e_flag_0x08), (a80e & 0x0008U) != 0);
                    publish_bool_if_changed(id(thermia_a80e_flag_0x20), (a80e & 0x0020U) != 0);
                  }


                  // ===========================================================
                  // DHP-AQ SLAVE 0x04 - outdoor-unit command candidates
                  //
                  // Observed:
                  //   IDLE: ABF4=4, ABF6=0
                  //   DHW : ABF4=6, ABF6=63
                  //
                  // ABF4/ABF6 semantics are not service-screen confirmed.
                  // ===========================================================

                  if (
                    slave == 0x04 &&
                    write_start <= 0xABF4 &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) > 0xABF6
                  ) {
                    const int16_t abf4 =
                      write_reg_s(0xABF4);
                    const int16_t abf6 =
                      write_reg_s(0xABF6);
                    const int16_t abf7 =
                      write_reg_s(0xABF7);
                    const bool abf4_context_0x02 =
                      (uint16_t(abf4) & 0x0002U) != 0;

                    publish_float_if_changed(
                      id(thermia_dhp_aq_abf4_raw),
                      float(abf4),
                      0.5f
                    );
                    publish_float_if_changed(
                      id(thermia_dhp_aq_abf6_raw),
                      float(abf6),
                      0.5f
                    );
                    publish_float_if_changed(
                      id(thermia_dhp_aq_abf7_raw),
                      float(abf7),
                      0.5f
                    );
                    publish_float_if_changed(
                      id(thermia_mode_request_raw),
                      float(abf4),
                      0.5f
                    );
                    publish_bool_if_changed(
                      id(thermia_dhp_aq_abf4_context_0x02),
                      abf4_context_0x02
                    );

                    // MAP03: 4 -> 6 is better modelled as a shared 0x02
                    // context/status bit than as a proven mode enum.
                    const char *dhp_mode_request =
                      abf4_context_0x02
                        ? "Context bit 0x02 active (candidate)"
                        : "Context bit 0x02 clear (candidate)";
                    publish_text_if_changed(
                      id(thermia_mode_request),
                      dhp_mode_request
                    );

                    // ABF6 is intentionally kept RAW. The observed 0 -> 63
                    // transition may be a target, limit, percentage or mask;
                    // MAP03 does not justify publishing it as a temperature.
                  }


                  // ===========================================================
                  // DHP-AQ SLAVE 0x05 - packed/context word candidate
                  //
                  // AC29 carried the same 0x050D value observed at ABF7/AFE0
                  // in the supplied captures. Keep raw until field packing is
                  // proven.
                  // ===========================================================

                  if (
                    slave == 0x05 &&
                    write_start <= 0xAC29 &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) > 0xAC29
                  ) {
                    publish_float_if_changed(
                      id(thermia_dhp_aq_ac29_raw),
                      float(write_reg_s(0xAC29)),
                      0.5f
                    );
                  }


                  // ===========================================================
                  // SLAVE 0x02 - controller sequence value (A80F)
                  //
                  // A80F takes values such as 5, 10, 50 and 75..100.
                  // Heating captures show 10->50 before a cycle, 50->80 at
                  // cycle start and 80->79->...->75 while established. A DHW
                  // capture showed 80->...->100, then 100->80->5->10 on stop.
                  // This strongly ties A80F to controller sequencing/control,
                  // but its exact internal semantics remain unknown.
                  //
                  // IMPORTANT: A80F is NOT compressor frequency, compressor
                  // power, a percentage, or a simple linear heat-demand value.
                  // ===========================================================

                  if (
                    slave == 0x02 &&
                    write_start <= 0xA80F &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) > 0xA80F
                  ) {
                    publish_float_if_changed(id(thermia_demand_raw), float(write_reg_s(0xA80F)), 0.5f);
                  }


                  // ===========================================================
                  // SLAVE 0x0A
                  //
                  // B3C5 = controller-propagated / confirmed room setpoint
                  // ===========================================================

                  if (
                    slave == 0x0A &&
                    write_start <= 0xB3C5 &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) > 0xB3C5
                  ) {

                    const float room_setpoint =
                      float(
                        write_reg_s(0xB3C5)
                      );


                    if (
                      room_setpoint >= 5.0f &&
                      room_setpoint <= 40.0f
                    ) {

                      publish_float_if_changed(id(thermia_room_setpoint), room_setpoint, 0.5f);
                    }
                  }

                  return;
                }
              }


              // ===============================================================
              // FC17 RESPONSE
              // ===============================================================

              if (
                fc == 0x17 &&
                fc17_pending[slave] &&
                bytes.size() >= 5 &&
                bytes.size() ==
                  size_t(bytes[2]) + 5
              ) {

                const uint16_t start =
                  fc17_start[slave];

                const uint16_t count =
                  fc17_count[slave];

                const uint8_t byte_count =
                  bytes[2];


                if (
                  byte_count !=
                  count * 2
                ) {

                  fc17_pending[slave] = false;
                  return;
                }


                auto reg_s =
                  [&](uint16_t address) -> int16_t {

                    const size_t offset =
                      size_t(address - start);

                    const size_t pos =
                      3 + offset * 2;

                    return s16(bytes, pos);
                  };


                // Generic mapper: scan complete FC17 read response block.
                for (uint16_t i = 0; i < count; i++) {

                  const uint16_t address =
                    uint16_t(start + i);

                  generic_map_update(
                    4,
                    slave,
                    address,
                    reg_s(address)
                  );
                }


                // =============================================================
                // DHP-AQ SLAVE 0x02 - 13-word A7F8 response variant
                //
                // The supplied DHP-AQ captures request A7F8/count 13 rather
                // than the XTR public-v27 count 15 block. Decode only addresses
                // that are actually present. A7F9 is a RETURN candidate.
                // =============================================================

                if (
                  slave == 0x02 &&
                  start == 0xA7F8 &&
                  count >= 13 &&
                  count < 15
                ) {
                  const float supply =
                    float(reg_s(0xA7F8));
                  const float return_line =
                    float(reg_s(0xA7F9));
                  const float dhw_upper =
                    float(reg_s(0xA7FB));
                  const float dhw =
                    float(reg_s(0xA7FC));
                  const float outdoor =
                    float(reg_s(0xA802));

                  if (
                    supply > -50.0f &&
                    supply < 150.0f
                  ) {
                    publish_float_if_changed(
                      id(thermia_supply_temperature),
                      supply,
                      0.5f
                    );
                  }

                  if (
                    return_line > -50.0f &&
                    return_line < 150.0f
                  ) {
                    publish_float_if_changed(
                      id(thermia_return_temperature),
                      return_line,
                      0.5f
                    );
                  }

                  if (
                    dhw_upper > 0.0f &&
                    dhw_upper < 100.0f
                  ) {
                    publish_float_if_changed(
                      id(thermia_dhw_upper_temperature),
                      dhw_upper,
                      0.5f
                    );
                  }

                  if (
                    dhw > 0.0f &&
                    dhw < 100.0f
                  ) {
                    publish_float_if_changed(
                      id(thermia_dhw_temperature),
                      dhw,
                      0.5f
                    );
                  }

                  if (
                    outdoor > -50.0f &&
                    outdoor < 70.0f
                  ) {
                    publish_float_if_changed(
                      id(thermia_outdoor_temperature),
                      outdoor,
                      0.5f
                    );
                  }

                  if (
                    dhw_upper > -50.0f &&
                    dhw > -50.0f
                  ) {
                    publish_float_if_changed(
                      id(thermia_dhw_delta_t),
                      dhw_upper - dhw,
                      0.5f
                    );
                  }
                }


                // =============================================================
                // SLAVE 0x02
                //
                // A7F8 Supply temperature
                // A7FB DHW upper
                // A7FC DHW main
                // A7FD SG discriminator 1
                // A802 Outdoor temperature
                // A803 SG discriminator 2
                // =============================================================

                if (
                  slave == 0x02 &&
                  start == 0xA7F8 &&
                  count >= 15
                ) {

                  // -----------------------------------------------------------
                  // Mapper: slave 0x02 FC17 read block 0xA7F8..0xA806
                  // -----------------------------------------------------------

                  if (count >= 0x0F) {
                    for (uint16_t addr = 0xA7F8; addr <= 0xA806; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr - 0xA7F8);

                      if (mapper_initialized) {
                        log_change(
                          "S02_FC17R",
                          addr,
                          prev_a7f8_block[idx],
                          v
                        );
                      }

                      prev_a7f8_block[idx] = v;
                    }
                  }

                  const int16_t supply =
                    reg_s(0xA7F8);

                  const int16_t dhw_upper =
                    reg_s(0xA7FB);

                  const int16_t dhw =
                    reg_s(0xA7FC);

                  const int16_t outdoor =
                    reg_s(0xA802);

                  const int16_t sg_a =
                    reg_s(0xA7FD);

                  const int16_t sg_b =
                    reg_s(0xA803);


                  // ===========================================================
                  // DIAGNOSTIC: complete A7F8 block
                  // Useful to verify whether A7F8 really changes with supply.
                  // ===========================================================

                  ESP_LOGI(
                    "thermia_a7f8",
                    "A7F8=%d A7F9=%d A7FA=%d A7FB=%d A7FC=%d A7FD=%d "
                    "A7FE=%d A7FF=%d A800=%d A801=%d A802=%d A803=%d "
                    "A804=%d A805=%d A806=%d",
                    reg_s(0xA7F8),
                    reg_s(0xA7F9),
                    reg_s(0xA7FA),
                    reg_s(0xA7FB),
                    reg_s(0xA7FC),
                    reg_s(0xA7FD),
                    reg_s(0xA7FE),
                    reg_s(0xA7FF),
                    reg_s(0xA800),
                    reg_s(0xA801),
                    reg_s(0xA802),
                    reg_s(0xA803),
                    reg_s(0xA804),
                    reg_s(0xA805),
                    reg_s(0xA806)
                  );

                  ESP_LOGI(
                    "thermia_supply",
                    "Supply candidate A7F8 raw=%d -> %.1f C",
                    supply,
                    float(supply)
                  );


                  if (
                    supply != -1000 &&
                    supply > -50 &&
                    supply < 150
                  ) {

                    publish_float_if_changed(id(thermia_supply_temperature), float(supply), 0.5f);
                  }


                  if (
                    dhw_upper != -1000 &&
                    dhw_upper > 0 &&
                    dhw_upper < 100
                  ) {

                    publish_float_if_changed(id(thermia_dhw_upper_temperature), float(dhw_upper), 0.5f);
                  }


                  if (
                    dhw != -1000 &&
                    dhw > 0 &&
                    dhw < 100
                  ) {

                    publish_float_if_changed(id(thermia_dhw_temperature), float(dhw), 0.5f);
                  }


                  if (
                    outdoor != -1000 &&
                    outdoor > -50 &&
                    outdoor < 70
                  ) {

                    publish_float_if_changed(id(thermia_outdoor_temperature), float(outdoor), 0.5f);
                  }


                  if (
                    dhw_upper != -1000 &&
                    dhw != -1000
                  ) {

                    publish_float_if_changed(
                      id(thermia_dhw_delta_t),
                      float(dhw_upper - dhw),
                      0.5f
                    );
                  }


                  // ===========================================================
                  // SG MODE
                  //
                  // Controlled tests:
                  //
                  // A7FD    A803     SG input state from controlled tests
                  //
                  // -1000   232      Blocked  (SG 1-0)
                  //  1000   224      Normal   (SG 0-0)
                  //  1000   232      Enhanced (SG 0-1)
                  // -1000   224      Peak     (SG 1-1)
                  // ===========================================================

                  ESP_LOGI(
                    "thermia_sg",
                    "SG discriminators: A7FD=%d A803=%d",
                    sg_a,
                    sg_b
                  );


                  // Corrected from repeated physical SG1/SG2 test:
                  // 00 -> A7FD=-1000, A803=224 -> Normal
                  // 10 -> A7FD=-1000, A803=232 -> Blocked
                  // 01 -> A7FD= 1000, A803=224 -> Enhanced
                  // 11 -> A7FD= 1000, A803=232 -> Peak
                  //
                  // Intermediate A7FD values are treated as transitions.

                  if (
                    sg_a == -1000 &&
                    sg_b == 224
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Normal (0-0)");
                  }

                  else if (
                    sg_a == -1000 &&
                    sg_b == 232
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Blocked (1-0)");
                  }

                  else if (
                    sg_a == 1000 &&
                    sg_b == 224
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Enhanced (0-1)");
                  }

                  else if (
                    sg_a == 1000 &&
                    sg_b == 232
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Peak (1-1)");
                  }

                  else {

                    // Hold the last valid state during the short transition.
                    // Do not publish a misleading fifth SG mode.
                  }
                }


                // =============================================================
                // DHP-AQ SLAVE 0x04 - outdoor-unit read candidates
                //
                // ABE2 rises from ~17/20 to ~64 during the supplied DHW run
                // while ABF6 is held at 63. Treat ABE2 as a discharge-pipe
                // temperature CANDIDATE. Other words stay raw diagnostics.
                // =============================================================

                if (
                  slave == 0x04 &&
                  start == 0xABE0 &&
                  count >= 12
                ) {
                  const int16_t abe0 = reg_s(0xABE0);
                  const int16_t abe1 = reg_s(0xABE1);
                  const int16_t abe2 = reg_s(0xABE2);
                  const int16_t abe4 = reg_s(0xABE4);

                  publish_float_if_changed(
                    id(thermia_dhp_aq_abe0_raw),
                    float(abe0),
                    0.5f
                  );
                  publish_float_if_changed(
                    id(thermia_dhp_aq_abe1_raw),
                    float(abe1),
                    0.5f
                  );
                  publish_float_if_changed(
                    id(thermia_dhp_aq_abe2_raw),
                    float(abe2),
                    0.5f
                  );
                  publish_float_if_changed(
                    id(thermia_dhp_aq_abe4_raw),
                    float(abe4),
                    0.5f
                  );

                  if (abe2 > -50 && abe2 < 200) {
                    publish_float_if_changed(
                      id(thermia_discharge_gas_temperature),
                      float(abe2),
                      0.5f
                    );
                  }
                }


                // =============================================================
                // SLAVE 0x0A
                //
                // B3B0 = room temperature x0.1 °C
                // =============================================================

                if (
                  slave == 0x0A &&
                  start == 0xB3B0 &&
                  count >= 1
                ) {

                  // -----------------------------------------------------------
                  // Mapper: slave 0x0A FC17 read block 0xB3B0..0xB3B2
                  // -----------------------------------------------------------

                  if (count >= 3) {
                    for (uint16_t addr = 0xB3B0; addr <= 0xB3B2; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr - 0xB3B0);

                      if (mapper_initialized) {
                        log_change(
                          "S0A_FC17R",
                          addr,
                          prev_b3b0_block[idx],
                          v
                        );
                      }

                      prev_b3b0_block[idx] = v;
                    }
                  }

                  mapper_initialized = true;

                  const float room_temperature =
                    float(
                      reg_s(0xB3B0)
                    ) / 10.0f;


                  if (
                    room_temperature > -20.0f &&
                    room_temperature < 60.0f
                  ) {

                    publish_float_if_changed(id(thermia_room_temperature), room_temperature, 0.05f);
                  }
                }


                fc17_pending[slave] = false;
                return;
              }

          };

          while (true) {
            if (pending.size() < 5) break;

            uint8_t slave = pending[0];
            uint8_t fn = pending[1];
            bool known_fn =
              fn == 0x01 || fn == 0x02 || fn == 0x03 || fn == 0x04 ||
              fn == 0x05 || fn == 0x06 || fn == 0x08 || fn == 0x0F ||
              fn == 0x10 || fn == 0x16 || fn == 0x17 || (fn & 0x80);
            if (!known_slave(slave) || !known_fn) {
              pending.erase(pending.begin());
              continue;
            }

            std::vector<size_t> candidates;
            if (fn & 0x80) candidates.push_back(5);
            if (fn == 0x03) {
              candidates.push_back(8);
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2]));
            }
            if (fn == 0x04) {
              candidates.push_back(8);
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2]));
            }
            if (fn == 0x01 || fn == 0x02) {
              candidates.push_back(8);
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2]));
            }
            if (fn == 0x05 || fn == 0x06 || fn == 0x08) {
              candidates.push_back(8);
            }
            if (fn == 0x0F) {
              candidates.push_back(8);
              if (pending.size() >= 7 && pending[6] <= 240)
                candidates.push_back(9 + size_t(pending[6]));
            }
            if (fn == 0x16) candidates.push_back(10);
            if (fn == 0x10) {
              candidates.push_back(8);
              if (pending.size() >= 7 && pending[6] <= 240)
                candidates.push_back(9 + size_t(pending[6]));
            }
            if (fn == 0x17) {
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2]));
              if (pending.size() >= 11 && pending[10] <= 240)
                candidates.push_back(13 + size_t(pending[10]));
            }

            std::sort(candidates.begin(), candidates.end());
            candidates.erase(std::unique(candidates.begin(), candidates.end()), candidates.end());

            size_t matched = 0;
            bool waiting = false;
            for (size_t len : candidates) {
              if (len < 5 || len > 256) continue;
              if (pending.size() < len) { waiting = true; continue; }
              if (valid_crc(len)) { matched = len; break; }
            }

            if (matched) {
              std::vector<uint8_t> frame(pending.begin(), pending.begin() + matched);
              pending.erase(pending.begin(), pending.begin() + matched);
              process_frame(frame);
              continue;
            }

            if (waiting) break;

            id(thermia_parser_resync_count)++;
            ESP_LOGW("thermia_stream", "CRC resync at 0x%02X 0x%02X", slave, fn);
            pending.erase(pending.begin());
          }

          if (pending.size() > 512) {
            id(thermia_rx_buffer_drop_count)++;
            ESP_LOGW("thermia_stream", "Dropping pending buffer (%u bytes)",
                     (unsigned) pending.size());
            pending.clear();
          }

