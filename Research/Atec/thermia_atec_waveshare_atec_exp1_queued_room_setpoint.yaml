# =============================================================================
# THERMIA ATEC / DHP-AQ — ATEC-EXP1 integrated write candidate v0.2
# STATUS: PREPARED / NOT RUN
# IMPLEMENTATION REFRESH: 2026-10-02
#
# BASELINE
# - Previous ATEC-EXP1 was PREPARED / NOT RUN.
# - This revision brings the ATEC file to a production/diagnostic level similar
#   in structure to the XTR Write Beta v4.1 while preserving the ATEC evidence
#   boundary: only 03F4 / room setpoint is a semantic write target.
# - Passive decoding is based on Read-only/ATEC v01.
#
# HYPOTHESIS
# - With the native Online/DCM responder absent, the ATEC/DHP-AQ controller can
#   be serviced on logical endpoint 0x0F using exact capture-backed traffic.
# - A fresh controller-owned 03E8/count14 page can be returned as desired state
#   with exactly word12 / 03F4 changed, after which controller FC16 republish is
#   the semantic acceptance signal.
#
# CONTROLLED IMPLEMENTATION CHANGES VS PREVIOUS ATEC-EXP1
# 1. Merge the full passive ATEC/DHP-AQ decoder and Home Assistant telemetry.
# 2. Add v4.1-style runtime diagnostics, queue visibility, 15-minute soak marker,
#    capture tooling and fail-closed UI restoration.
# 3. Correct the manual settings-snapshot sequencer to the exact 26 pages selected
#    by captured bitmap W2:W3 = FFFF:867F. The transmitted bitmap itself is unchanged:
#      0000,0000,FFFF,867F,03DF,0000
#    Raw capture proves the resulting ordered config pages skip:
#      047E,0492,04D8,04F6,050A,051E
# 4. Tighten runtime qualification: semantic write dispatch requires no unknown
#    0x0F FC16/FC03 frames, no peer responder, and clean parser/RX counters.
#
# ACTIVE WIRE BEHAVIOR RETAINED
# - 0708 steady-state idle reply:
#     0000,0000,0000,0000,0000,0000
# - 03E8 desired-page selector:
#     0000,0001,0000,0001,0000,0000
# - complete desired 03E8/count14 response reconstructed from a fresh controller page;
# - only word12 / 03F4 may differ;
# - exact FC16 address/count ACKs for whitelisted runtime/config pages;
# - NO FC17 response/replay;
# - NO new semantic write targets;
# - NO broad register scans or direct arbitrary register writes.
#
# IMPORTANT CROSS-MODEL BOUNDARY
# - XTR v4.1 is an architectural reference only.
# - XTR EXP386/387/388 session recovery and R1 permission rules are NOT imported.
# - ATEC FC17 challenge/response transform remains unknown; FC17 is capture-only.
# - Candidate 041D/042E/0442/0546 field labels remain read-only until locally
#   confirmed on the target ATEC.
#
# SUCCESS
# - clean stage40 runtime qualification;
# - exact captured 03E8 selector -> controller FC03 03E8 pull;
# - desired page differs at 03F4 only;
# - controller republishes 03E8/count14 with target 03F4 and every other word equal;
# - extraDeltaWords=0, peer=0, unknown03=0, unknown16=0, resync=0, drops=0.
#
# NEGATIVE
# - controller cleanly republishes the original 03F4 value unchanged.
#
# INCONCLUSIVE / ABORT
# - peer responder, parser/RX fault, unknown 0x0F request/page, stale cache,
#   unexpected page/count, timeout, extra changed word, or ambiguous republish.
#
# ESPHome compile verification is NOT claimed unless actually compiled.
# =============================================================================


# =============================================================================
# ESP
# =============================================================================

# Board: Waveshare ESP32-S3-RS485-CAN
# MCU: ESP32-S3R8, external 16 MB flash, 8 MB octal PSRAM

substitutions:
  device_name: "thermia-atec-experimental"
  friendly_name: "Thermia ATEC Experimental"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - delay: 1s
        - lambda: |-
            // Restore cached settings only after this device has previously
            // observed a genuine Thermia 0x0F FC10 03E8..03F5 frame.
            if (id(thermia_settings_cache_valid)) {
              id(thermia_heating_curve)->publish_state(id(thermia_heating_curve_saved));
              id(thermia_heating_min)->publish_state(id(thermia_heating_min_saved));
              id(thermia_heating_max)->publish_state(id(thermia_heating_max_saved));
              id(thermia_curve_plus5)->publish_state(id(thermia_curve_plus5_saved));
              id(thermia_curve_zero)->publish_state(id(thermia_curve_zero_saved));
              id(thermia_curve_minus5)->publish_state(id(thermia_curve_minus5_saved));
              id(thermia_heating_stop)->publish_state(id(thermia_heating_stop_saved));
              id(thermia_reduced_temperature)->publish_state(id(thermia_reduced_temperature_saved));
              id(thermia_room_factor)->publish_state(id(thermia_room_factor_saved));
              id(thermia_room_setpoint_mirror)->publish_state(id(thermia_room_setpoint_mirror_saved));

              ESP_LOGI(
                "thermia_persist",
                "Restored validated settings cache: curve=%.0f min=%.0f max=%.0f corr=[%.0f,%.0f,%.0f] stop=%.0f reduced=%.0f room_factor=%.0f room_setpoint=%.0f",
                id(thermia_heating_curve_saved),
                id(thermia_heating_min_saved),
                id(thermia_heating_max_saved),
                id(thermia_curve_plus5_saved),
                id(thermia_curve_zero_saved),
                id(thermia_curve_minus5_saved),
                id(thermia_heating_stop_saved),
                id(thermia_reduced_temperature_saved),
                id(thermia_room_factor_saved),
                id(thermia_room_setpoint_mirror_saved)
              );
            } else {
              ESP_LOGI(
                "thermia_persist",
                "No validated settings cache yet; waiting for a live 0x0F FC10 03E8..03F5 frame."
              );
            }
    - priority: -200
      then:
        - delay: 500ms
        - lambda: |-
            id(waveshare_rs485_direction).turn_off();
            const uint32_t now = millis();

            id(atec_active) = true;
            id(atec_stage) = 0;
            id(atec_preflight_start_ms) = now;
            id(atec_runtime_enter_ms) = 0;
            id(atec_runtime_last_service_ms) = 0;
            id(atec_peer_count) = 0;
            id(atec_self_echo_count) = 0;
            id(atec_fc17_challenge_count) = 0;
            id(atec_unknown_fc16_count) = 0;
            id(atec_unknown_fc03_count) = 0;
            id(atec_runtime_fc16_ack_count) = 0;
            id(atec_runtime_0708_reply_count) = 0;
            id(atec_write_confirmed_count) = 0;
            id(atec_semantic_response_count) = 0;
            id(atec_extra_delta_words) = 0;
            id(atec_soak_15m_passed) = false;

            id(atec_sync_requested) = false;
            id(atec_sync_in_progress) = false;
            id(atec_sync_index) = 0;
            id(atec_sync_retries) = 0;
            id(atec_sync_start_ms) = 0;
            id(atec_config_synced) = false;

            id(atec_page_cache_valid) = false;
            id(atec_page_cache_ms) = 0;

            id(atec_write_enabled) = true;
            id(atec_write_state) = 0;
            id(atec_write_start_ms) = 0;
            id(atec_pending_valid) = false;
            id(atec_pending_generation) = 0;
            id(atec_queue_not_before_ms) = 0;

            id(atec_last_tx_ms) = 0;
            id(atec_last_tx_crc) = 0;
            id(atec_last_tx_len) = 0;
            id(atec_last_tx_fc) = 0;

            id(atec_resync_baseline) = id(thermia_parser_resync_count);
            id(atec_drop_baseline) = id(thermia_rx_buffer_drop_count);

            id(thermia_atec_runtime_active)->publish_state(false);
            id(thermia_atec_runtime_qualified)->publish_state(false);
            id(thermia_atec_write_confirmed)->publish_state(false);
            id(thermia_atec_cache_valid)->publish_state(false);
            id(thermia_atec_config_synced_sensor)->publish_state(false);
            id(thermia_atec_soak_15m_passed_sensor)->publish_state(false);

            id(thermia_atec_status)->publish_state(
              "PREPARED / passive 10 s peer qualification / TX=0"
            );
            id(thermia_atec_stage_text)->publish_state(
              "stage 0 / passive peer check / DE LOW"
            );
            id(thermia_atec_last_event)->publish_state(
              "ATEC-EXP1 v0.2 boot: passive decoder active; no TX for first 10 s"
            );

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# ESP32-S3R8 provides 8 MB octal PSRAM. Explicit PSRAM configuration is
# required by current ESPHome releases for ESP32-S3.
psram:
  mode: octal
  speed: 80MHz

# Batch preference writes. The persisted Thermia settings change rarely.
preferences:
  flash_write_interval: 1min

api:
  encryption:
    key: !secret thermia_api_encryption_key
  # Do not reboot merely because Home Assistant/API is temporarily unreachable.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret thermia_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # This controller is continuously powered: prefer reliability over Wi-Fi power saving.
  power_save_mode: none

  # Keep a network-stack recovery watchdog, but make it much less aggressive
  # than the ESPHome default. No access-point BSSID is hard-coded.
  reboot_timeout: 30min

  ap:
    ssid: "Thermia Fallback Hotspot"
    password: !secret thermia_fallback_password

captive_portal:


# Publish reset/heap/loop diagnostics so Wi-Fi loss can be separated from
# brownouts, watchdog resets, API loss and parser/resource problems.
debug:
  update_interval: 30s


# =============================================================================
# LOGGING
# =============================================================================

logger:
  # Keep routine decoder noise quiet. Experimental TX/status markers use
  # WARN/ERROR and remain visually obvious in the existing red/brown convention.
  level: WARN
  baud_rate: 0
  logs:
    thermia: WARN
    thermia_stream: WARN
    thermia_persist: WARN
    thermia_atec1: WARN
    dhpaq_capture: WARN



# =============================================================================
# THERMIA UART
#
# Confirmed bus settings: 9600 baud, 8E1, Modbus RTU CRC16.
#
# Waveshare ESP32-S3-RS485-CAN:
# - GPIO18 = RX
# - GPIO21 = DE/direction; held LOW for receive
# - GPIO17 TX is intentionally not configured in this build.
#
# This build is receive-only.
# =============================================================================

# =============================================================================
# WAVESHARE RS485 DIRECTION
# =============================================================================

# SP3485 DE and /RE are controlled by GPIO21 on this board.
# ALWAYS_OFF => GPIO21 LOW => receiver enabled, driver disabled.
# This switch is internal and is not exposed to Home Assistant.
switch:
  - platform: gpio
    id: waveshare_rs485_direction
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO21
      inverted: false


# =============================================================================
# BUS HEALTH
# =============================================================================

