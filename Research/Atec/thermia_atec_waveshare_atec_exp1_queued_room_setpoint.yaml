# =============================================================================
# TEMPORARY USER-REQUESTED RAW LOG CAPTURE
#
# "Log 120 Seconds" appears under Configuration in Home Assistant.
# It only enables WARN-level logging of already observed CRC-valid frames.
# The button does NOT transmit anything on RS485 and does NOT persist logs on
# the ESP. Open the ESPHome log stream before pressing it, then copy everything
# between ATEC-CAPTURE START and ATEC-CAPTURE END.
# =============================================================================

script:
  - id: atec_start_room_write
    mode: single
    then:
      - lambda: |-
          id(waveshare_rs485_direction).turn_off();
          const uint32_t now=millis();

          const uint32_t rd =
            id(thermia_parser_resync_count)-id(atec_resync_baseline);
          const uint32_t dd =
            id(thermia_rx_buffer_drop_count)-id(atec_drop_baseline);
          const bool runtime_qualified =
            id(atec_active) &&
            id(atec_stage)==40 &&
            id(atec_write_enabled) &&
            id(atec_runtime_fc16_ack_count)>=1 &&
            id(atec_runtime_0708_reply_count)>=1 &&
            id(atec_unknown_fc16_count)==0 &&
            id(atec_unknown_fc03_count)==0 &&
            id(atec_peer_count)==0 &&
            rd==0 && dd==0;

          if (!runtime_qualified) {
            if (id(atec_page_cache_valid)) {
              id(thermia_atec_room_setpoint_target_control).publish_state(
                float(id(atec_page_w12))
              );
            }
            id(thermia_atec_last_event)->publish_state(
              "WRITE REFUSED: clean qualified runtime not established"
            );
            return;
          }

          if (id(atec_write_state)!=0 || id(atec_sync_requested) ||
              id(atec_sync_in_progress)) {
            id(thermia_atec_last_event)->publish_state(
              "WRITE REFUSED: active transaction or settings snapshot"
            );
            return;
          }

          const uint32_t cache_age =
            id(atec_page_cache_ms) ?
              now-id(atec_page_cache_ms) : 0xFFFFFFFFUL;

          if (!id(atec_page_cache_valid) || cache_age>60000UL) {
            if (id(atec_page_cache_valid)) {
              id(thermia_atec_room_setpoint_target_control).publish_state(
                float(id(atec_page_w12))
              );
            }
            id(thermia_atec_status)->publish_state(
              "READY / fresh 03E8 required; request settings snapshot"
            );
            id(thermia_atec_last_event)->publish_state(
              "WRITE REFUSED: cache missing/stale; no semantic TX"
            );
            return;
          }

          const uint16_t target=id(atec_request_target);
          const uint16_t current=id(atec_page_w12);

          if (target<20 || target>30) {
            id(thermia_atec_room_setpoint_target_control).publish_state(float(current));
            id(thermia_atec_last_event)->publish_state(
              "WRITE REFUSED: target outside observed ATEC 20..30 guard"
            );
            return;
          }

          if (target==current) {
            id(atec_queue_not_before_ms)=now+2000UL;
            id(thermia_atec_write_confirmed)->publish_state(true);
            id(thermia_atec_status)->publish_state(
              "READY / target already current / no semantic TX"
            );
            id(thermia_atec_last_event)->publish_state(
              "no-op room-setpoint request; queue settle 2 s"
            );
            return;
          }

          id(atec_target_room_setpoint)=target;
          id(atec_original_room_setpoint)=current;
          id(atec_write_state)=1;
          id(atec_write_start_ms)=now;
          id(atec_extra_delta_words)=0;
          id(thermia_atec_write_confirmed)->publish_state(false);
          id(thermia_atec_status)->publish_state(
            "RUNNING / 03F4 target latched / wait next exact 0708"
          );
          id(thermia_atec_last_event)->publish_state(
            "ROOM_WRITE_ARM: no semantic TX until captured selector slot"
          );

          ESP_LOGE(
            "thermia_atec1",
            "\033[31m[ATEC-EXP1] ===== ROOM_WRITE_ARM reg=03F4 original=%u target=%u cacheAge=%ums wait=0708 =====\033[0m",
            unsigned(current),unsigned(target),unsigned(cache_age)
          );

  - id: atec_debounce_room_write
    mode: restart
    then:
      - delay: 1500ms
      - lambda: |-
          const uint32_t now=millis();
          const uint16_t target=id(atec_request_target);
          const uint32_t gen=id(atec_request_generation);

          if (!id(atec_active) || id(atec_stage)!=40 ||
              !id(atec_write_enabled)) {
            id(atec_pending_valid)=false;
            if (id(atec_page_cache_valid))
              id(thermia_atec_room_setpoint_target_control).publish_state(
                float(id(atec_page_w12))
              );
            id(thermia_atec_last_event)->publish_state(
              "QUEUE DROP: active runtime/write guard unavailable"
            );
            return;
          }

          const bool settle_wait =
            id(atec_queue_not_before_ms) &&
            int32_t(now-id(atec_queue_not_before_ms))<0;

          if (id(atec_write_state)!=0 || settle_wait ||
              id(atec_pending_valid)) {
            const bool replaced=id(atec_pending_valid);
            id(atec_pending_valid)=true;
            id(atec_pending_target)=target;
            id(atec_pending_generation)=gen;
            id(thermia_atec_queue_pending_sensor)->publish_state(true);
            id(thermia_atec_status)->publish_state(
              id(atec_write_state)!=0 ?
                "QUEUED / active room transaction must close first" :
                "QUEUED / 2 s settle before next room transaction"
            );
            id(thermia_atec_last_event)->publish_state(
              replaced ?
                "QUEUE REPLACED: latest room-setpoint intent retained" :
                "QUEUE STORED: latest room-setpoint intent retained"
            );
            return;
          }

          id(atec_start_room_write).execute();

  - id: dhpaq_log_120_seconds
    mode: restart
    then:
      - lambda: |-
          id(dhpaq_capture_active) = true;
          id(dhpaq_capture_started_ms) = millis();
          id(dhpaq_capture_frame_count) = 0;
          id(dhpaq_capture_active_sensor)->publish_state(true);
          id(dhpaq_capture_status)->publish_state("Recording 120 seconds");
          ESP_LOGW(
            "dhpaq_capture",
            "ATEC-CAPTURE START duration=120s - copy through the END marker"
          );

      - delay: 120s

      - lambda: |-
          id(dhpaq_capture_active) = false;
          id(dhpaq_capture_active_sensor)->publish_state(false);

          char capture_status[64];
          snprintf(
            capture_status,
            sizeof(capture_status),
            "Complete - %lu frames",
            (unsigned long) id(dhpaq_capture_frame_count)
          );
          id(dhpaq_capture_status)->publish_state(capture_status);

          ESP_LOGW(
            "dhpaq_capture",
            "ATEC-CAPTURE END duration=120s frames=%lu",
            (unsigned long) id(dhpaq_capture_frame_count)
          );


button:
  - platform: template
    name: "ATEC | Request Settings Snapshot"
    entity_category: config
    icon: mdi:database-refresh-outline
    on_press:
      - lambda: |-
          id(waveshare_rs485_direction).turn_off();

          if (!id(atec_active) || id(atec_stage)!=40 ||
              id(atec_peer_count)!=0 ||
              id(atec_write_state)!=0 ||
              id(atec_sync_requested) || id(atec_sync_in_progress)) {
            id(thermia_atec_last_event)->publish_state(
              "SNAPSHOT REFUSED: runtime/peer/write/snapshot guard not satisfied"
            );
            return;
          }

          id(atec_sync_requested)=true;
          id(atec_sync_index)=0;
          id(atec_sync_retries)=0;
          id(atec_config_synced)=false;
          id(thermia_atec_config_synced_sensor)->publish_state(false);
          id(thermia_atec_status)->publish_state(
            "ARMED / exact captured 26-page refresh on next 0708"
          );
          id(thermia_atec_last_event)->publish_state(
            "snapshot armed; no TX until exact controller 0708/count6"
          );
          ESP_LOGE(
            "thermia_atec1",
            "\033[31m[ATEC-EXP1] ===== SETTINGS_SNAPSHOT_ARMED bitmap=0000,0000,FFFF,867F,03DF,0000 pages=26 =====\033[0m"
          );

  - platform: template
    name: "ATEC | Abort Experimental TX"
    entity_category: config
    icon: mdi:stop-circle-outline
    on_press:
      - lambda: |-
          id(waveshare_rs485_direction).turn_off();
          id(atec_active)=false;
          id(atec_stage)=99;
          id(atec_pending_valid)=false;
          id(atec_pending_generation)=0;
          id(atec_sync_requested)=false;
          id(atec_sync_in_progress)=false;
          id(atec_write_state)=7;
          id(atec_write_enabled)=false;
          id(thermia_atec_runtime_active)->publish_state(false);
          id(thermia_atec_runtime_qualified)->publish_state(false);
          id(thermia_atec_queue_pending_sensor)->publish_state(false);
          id(thermia_atec_status)->publish_state(
            "ABORTED manually / experimental TX disabled / DE LOW"
          );
          id(thermia_atec_stage_text)->publish_state(
            "stage 99 / stopped / DE LOW"
          );
          id(thermia_atec_last_event)->publish_state("manual abort");
          ESP_LOGE(
            "thermia_atec1",
