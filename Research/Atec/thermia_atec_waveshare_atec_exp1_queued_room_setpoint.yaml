# =============================================================================
# ATEC-EXP1 — ATEC/DHP-AQ 0x0F RUNTIME + QUEUED ROOM-SETPOINT WRITE
# STATUS: PREPARED / NOT RUN
#
# Baseline / evidence
# - Derived from the XTR EXP374 queued-write safety architecture.
# - ATEC/Eco capture 2026-09-26 shows exact native/emulated mailbox transaction:
#     0F 03 0708 0006
#     -> 0F 03 response words 0000,0001,0000,0001,0000,0000
#     -> controller 0F 03 03E8 000E
#     -> 14-word 03E8 page response
#     -> controller republishes 0F 10 03E8 000E
# - The same capture shows 03F4 / word12 changing 20 -> 30 and being republished.
# - Discussion #143 independently labels decimal 1012 / 0x03F4 as room thermostat.
# - ATEC captures show the full 03E8..06F4 config-export page shape family and
#   runtime 0x0F FC16 pages including 0834/count18.
#
# Hypothesis
# - With the native Online/DCM responder absent, the ATEC/DHP-AQ controller can
#   be serviced safely on slave 0x0F using only frame shapes observed in the
#   supplied ATEC captures.
# - A fresh 03E8/count14 page can be modified at exactly word12 / 03F4 and
#   accepted by the controller through the captured 0708 -> FC03 03E8 ->
#   desired-page -> FC16 03E8 republish sequence.
#
# Exact controlled changes from XTR EXP374
# - REMOVE XTR-specific cold-boot/R1 replay, A80E/A80F guard, hot-rejoin and
#   XTR-only semantic write targets.
# - ADD 10 s passive peer-responder qualification before any TX.
# - USE ATEC idle 0708 response: 0000,0000,0000,0000,0000,0000.
# - USE exact ATEC 03E8 selector: 0000,0001,0000,0001,0000,0000.
# - ADD exact ATEC runtime FC16 0834/count18 ACK support.
# - KEEP 04A6 capture-only outside an explicitly requested settings snapshot.
# - ONLY expose semantic write target 03F4 / room setpoint.
# - KEEP one-slot LAST-INTENT-WINS queue and >=2 s post-confirm settle.
#
# Safety / abort
# - No TX at all during the first 10 s.
# - Any pre-existing 0x0F response/ACK during preflight => STOP, TX remains off.
# - Any later non-self 0x0F response/ACK => STOP, TX off.
# - Any parser resync or RX-buffer drop after activation => STOP, TX off.
# - Unknown 0x0F traffic is capture-only; never answered.
# - A semantic write requires a fresh controller 03E8/count14 cache <=60 s.
# - Only word12 may differ in the desired page.
# - Any republish mismatch disables semantic writes; runtime service can continue.
#
# Settings snapshot
# - "ATEC Request Settings Snapshot" sends ONE exact ATEC 0708 bitmap captured
#   in both supplied logs: 0000,0000,FFFF,867F,03DF,0000.
# - This requests a broad controller settings export. It does NOT inject setting
#   values. Only exact captured address/count pages are ACKed.
# - Snapshot is manual, never automatic.
#
# Success
# - Clean runtime service (known FC16 ACK + 0708 idle response), then:
#   fresh 03E8 cache -> selector -> FC03 03E8 pull -> one-word desired page ->
#   exact controller FC16 03E8 republish with only word12 changed.
# - resync=0, drops=0, peer=0, extraDeltaWords=0.
#
# Negative
# - Controller republishes the original 03F4 value unchanged.
#
# Inconclusive / abort
# - Peer responder, parser/RX fault, unknown desired-page pull, stale cache,
#   snapshot out-of-order/timeout, or extra changed words.
# =============================================================================

substitutions:
  device_name: "thermia-atec-experimental"
  friendly_name: "Thermia ATEC Experimental"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - delay: 500ms
        - lambda: |-
            id(waveshare_rs485_direction).turn_off();
            id(atec_stage) = 0;
            id(atec_preflight_start_ms) = millis();
            id(atec_peer_count) = 0;
            id(atec_active) = true;
            id(atec_write_enabled) = true;
            id(atec_sync_requested) = false;
            id(atec_sync_in_progress) = false;
            id(atec_sync_index) = 0;
            id(atec_sync_retries) = 0;
            id(atec_write_state) = 0;
            id(atec_pending_valid) = false;
            id(atec_queue_not_before_ms) = 0;
            id(atec_page_cache_valid) = false;
            id(atec_last_tx_ms) = 0;
            id(atec_last_tx_crc) = 0;
            id(atec_last_tx_len) = 0;
            id(atec_last_tx_fc) = 0;
            id(atec_resync_baseline) = id(thermia_parser_resync_count);
            id(atec_drop_baseline) = id(thermia_rx_buffer_drop_count);
            id(atec_runtime_fc16_ack_count) = 0;
            id(atec_runtime_0708_reply_count) = 0;
            id(atec_unknown_0f_count) = 0;
            id(atec_write_confirmed_count) = 0;
            id(atec_extra_delta_words) = 0;
            id(thermia_atec_runtime_active)->publish_state(false);
            id(thermia_atec_write_confirmed)->publish_state(false);
            id(thermia_atec_cache_valid)->publish_state(false);
            id(thermia_atec_status)->publish_state("PREPARED / passive 10 s peer qualification / TX=0");
            id(thermia_atec_stage_text)->publish_state("stage 0 / passive peer check / DE LOW");
            id(thermia_atec_last_event)->publish_state("ATEC-EXP1 boot: no TX for first 10 s");

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

api:
  encryption:
    key: !secret thermia_api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret thermia_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 30min
  ap:
    ssid: "Thermia ATEC Fallback"
    password: !secret thermia_fallback_password

captive_portal:

logger:
  level: WARN
  baud_rate: 0
  logs:
    thermia: WARN
    thermia_stream: WARN
    thermia_atec1: WARN

switch:
  - platform: gpio
    id: waveshare_rs485_direction
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO21
      inverted: false

globals:
  - id: thermia_last_valid_frame_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: thermia_valid_frame_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: thermia_parser_resync_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: thermia_rx_buffer_drop_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: atec_active
    type: bool
    restore_value: no
    initial_value: 'false'

  # 0=passive preflight, 40=active runtime, 99=stopped
  - id: atec_stage
    type: uint8_t
    restore_value: no
    initial_value: '0'

  - id: atec_preflight_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: atec_resync_baseline
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: atec_drop_baseline
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: atec_peer_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: atec_unknown_0f_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: atec_runtime_fc16_ack_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: atec_runtime_0708_reply_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: atec_last_tx_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: atec_last_tx_crc
    type: uint16_t
    restore_value: no
    initial_value: '0'

  - id: atec_last_tx_len
    type: uint16_t
    restore_value: no
    initial_value: '0'

  - id: atec_last_tx_fc
    type: uint8_t
    restore_value: no
