# =============================================================================
# PERIODIC BUS HEALTH CHECK
# =============================================================================

interval:
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t now=millis();
          const uint32_t last=id(thermia_last_valid_frame_ms);

          if (!id(atec_active)) return;

          if (id(atec_stage)==0) {
            const uint32_t age=now-id(atec_preflight_start_ms);

            if (id(atec_peer_count)>0) {
              id(waveshare_rs485_direction).turn_off();
              id(atec_active)=false;
              id(atec_stage)=99;
              id(thermia_atec_runtime_active)->publish_state(false);
              id(thermia_atec_runtime_qualified)->publish_state(false);
              id(thermia_atec_status)->publish_state(
                "STOPPED / peer responder seen during passive preflight"
              );
              id(thermia_atec_stage_text)->publish_state("stage 99 / DE LOW");
              return;
            }

            if (age>=10000UL && last && (now-last)<2000UL) {
              id(atec_stage)=40;
              id(atec_runtime_enter_ms)=now;
              id(atec_runtime_last_service_ms)=0;
              id(atec_resync_baseline)=id(thermia_parser_resync_count);
              id(atec_drop_baseline)=id(thermia_rx_buffer_drop_count);
              id(thermia_atec_runtime_active)->publish_state(true);
              id(thermia_atec_status)->publish_state(
                "RUNNING / captured ATEC 0x0F runtime / wait qualification"
              );
              id(thermia_atec_stage_text)->publish_state(
                "stage 40 / ATEC runtime service / FC17 capture-only"
              );
              id(thermia_atec_last_event)->publish_state(
                "PREFLIGHT_PASSED: full passive decoder retained; exact captured TX slots only"
              );
              ESP_LOGE(
                "thermia_atec1",
                "\033[31m[ATEC-EXP1] ===== PREFLIGHT_PASSED peer=0 busFresh=1 ENTER_STAGE40 DE=LOW =====\033[0m"
              );
              return;
            }

            if (age>=30000UL && (!last || (now-last)>=2000UL)) {
              id(waveshare_rs485_direction).turn_off();
              id(atec_active)=false;
              id(atec_stage)=99;
              id(thermia_atec_status)->publish_state(
                "STOPPED / no healthy bus during passive preflight"
              );
              id(thermia_atec_stage_text)->publish_state("stage 99 / DE LOW");
              id(thermia_atec_last_event)->publish_state(
                "30 s preflight timeout without fresh CRC-valid bus traffic"
              );
              return;
            }
          }

          if (id(atec_stage)!=40) return;

          const uint32_t rd=
            id(thermia_parser_resync_count)-id(atec_resync_baseline);
          const uint32_t dd=
            id(thermia_rx_buffer_drop_count)-id(atec_drop_baseline);

          if (rd || dd) {
            id(waveshare_rs485_direction).turn_off();
            id(atec_active)=false;
            id(atec_stage)=99;
            id(atec_write_state)=7;
            id(atec_write_enabled)=false;
            id(atec_pending_valid)=false;
            id(atec_sync_requested)=false;
            id(atec_sync_in_progress)=false;
            id(thermia_atec_runtime_active)->publish_state(false);
            id(thermia_atec_runtime_qualified)->publish_state(false);
            id(thermia_atec_status)->publish_state(
              "STOPPED / parser-RX integrity delta / TX disabled"
            );
            id(thermia_atec_stage_text)->publish_state("stage 99 / DE LOW");
            id(thermia_atec_last_event)->publish_state(
              "integrity counter changed during active runtime"
            );
            return;
          }

          const bool qualified =
            id(atec_runtime_fc16_ack_count)>=1 &&
            id(atec_runtime_0708_reply_count)>=1 &&
            id(atec_unknown_fc16_count)==0 &&
            id(atec_unknown_fc03_count)==0 &&
            id(atec_peer_count)==0;

          id(thermia_atec_runtime_qualified)->publish_state(qualified);

          if (id(atec_sync_in_progress) && id(atec_sync_start_ms) &&
              now-id(atec_sync_start_ms)>60000UL) {
            id(atec_sync_in_progress)=false;
            id(atec_sync_requested)=false;
            id(atec_config_synced)=false;
            id(thermia_atec_config_synced_sensor)->publish_state(false);
            id(thermia_atec_status)->publish_state(
              "COMPLETE / INCONCLUSIVE / 26-page snapshot timeout / runtime continues"
            );
            id(thermia_atec_last_event)->publish_state(
              "snapshot did not reach 06F4 within 60 s; no automatic retry"
            );
          }

          if (id(atec_write_state)>=1 && id(atec_write_state)<=3 &&
              id(atec_write_start_ms) &&
              now-id(atec_write_start_ms)>12000UL) {
            id(atec_write_state)=7;
            id(atec_write_enabled)=false;
            id(atec_pending_valid)=false;
            id(atec_queue_not_before_ms)=0;
            if (id(atec_page_cache_valid)) {
              id(thermia_atec_room_setpoint_target_control).publish_state(
                float(id(atec_page_w12))
              );
            }
            id(thermia_atec_status)->publish_state(
              "COMPLETE / INCONCLUSIVE / room-write timeout / runtime only"
            );
            id(thermia_atec_last_event)->publish_state(
              "semantic transaction timed out; no retry; writes disabled"
            );
          }

          if (id(atec_write_state)==0 && id(atec_pending_valid) &&
              id(atec_pending_generation)==id(atec_request_generation) &&
              (id(atec_queue_not_before_ms)==0 ||
               int32_t(now-id(atec_queue_not_before_ms))>=0)) {
            const uint16_t qtarget=id(atec_pending_target);
            id(atec_pending_valid)=false;
            id(atec_pending_generation)=0;
            id(atec_request_target)=qtarget;
            id(thermia_atec_queue_pending_sensor)->publish_state(false);
            id(atec_start_room_write).execute();
          }

          if (id(atec_runtime_enter_ms) &&
              !id(atec_soak_15m_passed) &&
              now-id(atec_runtime_enter_ms)>=900000UL) {
            id(atec_soak_15m_passed)=true;
            id(thermia_atec_soak_15m_passed_sensor)->publish_state(true);
            id(thermia_atec_last_event)->publish_state(
              "SOAK_15M_PASS: captured ATEC runtime service still active"
            );
            ESP_LOGE(
              "thermia_atec1",
              "\033[31m[ATEC-EXP1] ===== SOAK_15M_PASS fc16ACK=%u idle0708=%u unknown16=%u unknown03=%u peer=%u resync=%u drops=%u DE=LOW =====\033[0m",
              unsigned(id(atec_runtime_fc16_ack_count)),
              unsigned(id(atec_runtime_0708_reply_count)),
              unsigned(id(atec_unknown_fc16_count)),
              unsigned(id(atec_unknown_fc03_count)),
              unsigned(id(atec_peer_count)),unsigned(rd),unsigned(dd)
            );
          }

  - interval: 10s
    then:
      - lambda: |-
          if (!id(atec_active)) return;
          const uint32_t now=millis();
          const uint32_t rtAge=id(atec_runtime_enter_ms) ?
            now-id(atec_runtime_enter_ms) : 0;
          const uint32_t svcAge=id(atec_runtime_last_service_ms) ?
            now-id(atec_runtime_last_service_ms) : 0;
          const uint32_t cacheAge=id(atec_page_cache_ms) ?
            now-id(atec_page_cache_ms) : 0xFFFFFFFFUL;

          ESP_LOGE(
            "thermia_atec1",
            "\033[38;5;130m[ATEC-EXP1] HEARTBEAT stage=%u runtimeAge=%us serviceAge=%ums writeState=%u queue=%u cacheValid=%u cacheAge=%ums room=%u sync=%u/%u fc16ACK=%u idle0708=%u challenges=%u unknown16=%u unknown03=%u peer=%u selfEcho=%u resync=%u drops=%u DE=LOW\033[0m",
            unsigned(id(atec_stage)),unsigned(rtAge/1000UL),unsigned(svcAge),
            unsigned(id(atec_write_state)),unsigned(id(atec_pending_valid)),
            unsigned(id(atec_page_cache_valid)),unsigned(cacheAge),
            unsigned(id(atec_page_w12)),unsigned(id(atec_sync_index)),26u,
            unsigned(id(atec_runtime_fc16_ack_count)),
            unsigned(id(atec_runtime_0708_reply_count)),
            unsigned(id(atec_fc17_challenge_count)),
            unsigned(id(atec_unknown_fc16_count)),
            unsigned(id(atec_unknown_fc03_count)),
            unsigned(id(atec_peer_count)),unsigned(id(atec_self_echo_count)),
            unsigned(id(thermia_parser_resync_count)-id(atec_resync_baseline)),
            unsigned(id(thermia_rx_buffer_drop_count)-id(atec_drop_baseline))
          );

  - interval: 5s
    then:
      - lambda: |-
          const uint32_t last = id(thermia_last_valid_frame_ms);
          if (last == 0 || (millis() - last) > 10000UL) {
            if (!id(thermia_bus_healthy)->has_state() || id(thermia_bus_healthy)->state) {
              id(thermia_bus_healthy)->publish_state(false);
            }
          }

