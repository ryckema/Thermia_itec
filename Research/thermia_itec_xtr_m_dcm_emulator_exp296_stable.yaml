# =============================================================================
# THERMIA iTec XTR M - EXP296 OPERATIONAL TRANSITION: OPTIONAL POST-080C MAILBOX
# Status: PREPARED / NOT RUN
# Date: 2026-09-29
#
# EXPERIMENT 296 / HYPOTHESIS
# The Online/DCM steady-state runtime can omit the usual FC03 0708/6 mailbox
# poll after FC16 080C/18 during an operational state change. In that branch,
# FC16 0820/18 may follow 080C directly and should receive the already-proven
# normal FC16 address/count ACK.
#
# BASELINE / RESULT
# EXP295 is the baseline and is COMPLETE / INCONCLUSIVE overall, with a positive
# result for its controlled branch change:
# - steady-state entered normally and reached 8 runtime cycles / 101 serviced
#   runtime events before fail-closed;
# - direct 0884/60 -> 07D0/19 was exercised once and accepted successfully;
# - direct 07E4/17 -> 07F8/17 was exercised once and accepted successfully,
#   locally proving that the post-07E4 0708 mailbox poll is optional;
# - after that direct branch, 080C/18 was ACKed and the controller then sent
#   direct 0820/18 without the expected 0708;
# - EXP295 correctly failed closed on that new branch;
# - runtime 04A6/13 appeared 14 times with an unchanged payload and remained
#   capture-only / NO_TX as intended;
# - parser resync delta=0 and RX drops delta=0 at the fail-closed point;
# - no alarm marker was recorded in the supplied EXP295 log, so visual alarm
#   timing for that run remains unknown.
#
# EXACT CONTROLLED ACTIVE CHANGE VS EXP295
# ONE evidence-driven scheduler change only:
# - after an accepted runtime 080C/18, allow EITHER:
#     A) FC03 0708/6 -> exact proven runtime 0708 response -> 0820/18, OR
#     B) direct FC16 0820/18 -> normal proven FC16 address/count ACK.
# - no other runtime response, payload, page, register or write action changes.
#
# PASSIVE DIAGNOSTIC CHANGE (NO protocol effect)
# - add an explicit counter/log marker for direct post-080C 0820 branch hits.
# - retain EXP295-derived diagnostics for direct post-0884 07D0,
#   direct post-07E4 07F8, and runtime 04A6/13.
# - runtime 04A6/13 remains CAPTURE-ONLY / NO_TX in EXP296.
#
# ACTIVE FRAME / REGISTER SAFETY NOTE
# New scheduler target: slave 0x0F FC16 start 0820 count 18.
# - known current transition payload from EXP295 at the fail-closed point:
#   00D2 00D8 00CD 0110 00C8 00C4 011F 00BE 0000 0000 0000 0000
#   0000 07D0 0010 0081 0048 0000;
# - source: locally observed XTR runtime plus genuine Online/DCM capture evidence;
# - expected effect of EXP296: only acknowledge the already-observed direct
#   080C->0820 sequence and continue into the existing 0848 stage;
# - plausible unintended effect: accepting 0820 in a context not yet understood;
# - rollback: fail-closed/manual Abort, DE forced LOW; normal Thermia-controller
#   reboot if COMM. ERR ONLINE/LINK persists.
# This is still only a standard FC16 address/count ACK; EXP296 injects no values.
#
# ACTIVE FRAMES / REGISTERS
# No new transmitted frame type or payload is introduced.
# EXP296 reuses only already-proven actions from EXP295:
# - fixed historical R1 after exact 071C/0730 approval;
# - standard FC16 address/count ACKs for the already-whitelisted startup/config
#   and runtime family, including the already-proven 0820/18 ACK;
# - startup FC03 0708/6 response: 0000 0000 0000 0000 0080 0006;
# - runtime FC03 0708/6 response: 0000 0000 0000 0000 0000 0006.
# 0708 w1 remains 0000. FC03 03E8 remains forbidden.
#
# 04A6 SAFETY NOTE
# Address/page: 04A6, count 13. It is a known Thermia configuration page from
# startup/config sync and appears repeatedly during some operational transitions.
# EXP296 does NOT ACK, modify or interpret runtime 04A6. It remains capture-only
# so this experiment isolates the post-080C scheduler branch.
#
# SAFETY / FAIL-CLOSED
# - NO semantic setting write; NO 03F4 modification; NO reverse-page response.
# - strict CRC/slave/function/address/count/bytecount/length validation remains.
# - only already-local/genuine-evidenced runtime branches are actively serviced.
# - 0834 remains capture-only / unsupported for active ACK.
# - runtime 04A6/13 remains capture-only / NO_TX.
# - slave 0x0A remains passive monitor-only.
# - unexpected active-session events, runtime stall, parser resync delta or
#   RX-drop delta abort TX immediately and force GPIO21/DE LOW.
#
# SUCCESS / NEGATIVE / INCONCLUSIVE / ABORT
# SUCCESS: an operational transition exercises direct 080C->0820, EXP296 ACKs
# it, normal runtime continues through 0848 and later stages, and the session
# remains active without COMM. ERR ONLINE/LINK for at least 5 further minutes /
# several further cycles, with unexpected=0 and no parser/RX integrity delta.
# NEGATIVE: direct 080C->0820 is serviced correctly but COMM. ERR ONLINE/LINK
# still appears while EXP296 remains actively responding. Mark it immediately;
# unanswered runtime 04A6/13 then becomes a stronger follow-up discriminator.
# INCONCLUSIVE: the target branch is not exercised, a different unsupported
# branch appears, the controller resets/re-authenticates, transport integrity
# changes, or visual alarm timing is uncertain.
# ABORT: any fail-closed guard fires. Capture the log before recovery/re-arm.
#
# RUN / RECOVERY
# 1) Arm EXP296 and reboot the Thermia controller once for a clean session.
# 2) Wait for stable runtime, then cause/allow ONE normal operational transition.
#    Do not treat SG as special; heating/cooling/DHW/compressor/other normal
#    transitions are equally valid observation triggers.
# 3) If an alarm appears, press EXP296 Mark Alarm Visible immediately.
# 4) If fail-closed occurs, return the log before re-arming. If COMM. ERR remains,
#    use one normal Thermia-controller reboot for recovery.
#
# IMPORTANT: EXP296 remains PREPARED / NOT RUN until a real user result/log exists.
# =============================================================================

substitutions:
  device_name: "thermia-itec-xtr-m"
  friendly_name: "Thermia iTec XTR M"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - delay: 1s
        - lambda: |-
            // Restore cached settings only after this device has previously
            // observed a genuine Thermia 0x0F FC10 03E8..03F5 frame.
            if (id(thermia_settings_cache_valid)) {
              id(thermia_heating_curve)->publish_state(id(thermia_heating_curve_saved));
              id(thermia_heating_min)->publish_state(id(thermia_heating_min_saved));
              id(thermia_heating_max)->publish_state(id(thermia_heating_max_saved));
              id(thermia_curve_plus5)->publish_state(id(thermia_curve_plus5_saved));
              id(thermia_curve_zero)->publish_state(id(thermia_curve_zero_saved));
              id(thermia_curve_minus5)->publish_state(id(thermia_curve_minus5_saved));
              id(thermia_heating_stop)->publish_state(id(thermia_heating_stop_saved));
              id(thermia_reduced_temperature)->publish_state(id(thermia_reduced_temperature_saved));
              id(thermia_room_factor)->publish_state(id(thermia_room_factor_saved));
              id(thermia_room_setpoint_mirror)->publish_state(id(thermia_room_setpoint_mirror_saved));

              ESP_LOGI(
                "thermia_persist",
                "Restored validated settings cache: curve=%.0f min=%.0f max=%.0f corr=[%.0f,%.0f,%.0f] stop=%.0f reduced=%.0f room_factor=%.0f room_setpoint=%.0f",
                id(thermia_heating_curve_saved),
                id(thermia_heating_min_saved),
                id(thermia_heating_max_saved),
                id(thermia_curve_plus5_saved),
                id(thermia_curve_zero_saved),
                id(thermia_curve_minus5_saved),
                id(thermia_heating_stop_saved),
                id(thermia_reduced_temperature_saved),
                id(thermia_room_factor_saved),
                id(thermia_room_setpoint_mirror_saved)
              );
            } else {
              ESP_LOGI(
                "thermia_persist",
                "No validated settings cache yet; waiting for a live 0x0F FC10 03E8..03F5 frame."
              );
            }

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# ESP32-S3R8 provides 8 MB octal PSRAM. Explicit PSRAM configuration is
# required by current ESPHome releases for ESP32-S3.
psram:
  mode: octal
  speed: 80MHz

# Batch preference writes. The persisted Thermia settings change rarely.
preferences:
  flash_write_interval: 1min

api:
  encryption:
    key: !secret thermia_api_encryption_key
  # Do not reboot merely because Home Assistant/API is temporarily unreachable.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret thermia_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # This controller is continuously powered: prefer reliability over Wi-Fi power saving.
  power_save_mode: none

  # Keep a network-stack recovery watchdog, but make it much less aggressive
  # than the ESPHome default. No access-point BSSID is hard-coded.
  reboot_timeout: 30min

  ap:
    ssid: "Thermia Fallback Hotspot"
    password: !secret thermia_fallback_password

captive_portal:


# Publish reset/heap/loop diagnostics so Wi-Fi loss can be separated from
# brownouts, watchdog resets, API loss and parser/resource problems.
debug:
  update_interval: 30s


# =============================================================================
# LOGGING
# =============================================================================

logger:
  # Production logging stays quiet; EXP296 trace markers are emitted at WARN.
  level: WARN
  baud_rate: 0
  logs:
    thermia: WARN
    thermia_persist: WARN
    thermia_exp296: WARN



# =============================================================================
# THERMIA UART
#
# Confirmed bus settings: 9600 baud, 8E1, Modbus RTU CRC16.
#
# Waveshare ESP32-S3-RS485-CAN:
# - GPIO18 = RX
# - GPIO17 = TX (EXP296: guarded Online/DCM startup + steady-state transition responder)
# - GPIO21 = DE/direction; LOW except during a guarded experiment TX frame.
#
# EXP296 is receive-only except inside the explicitly whitelisted startup/runtime responses below.
# No semantic reverse-page response is permitted in this experiment.
# =============================================================================

# =============================================================================
# WAVESHARE RS485 DIRECTION
# =============================================================================

# SP3485 DE and /RE are controlled by GPIO21 on this board.
# ALWAYS_OFF => GPIO21 LOW => receiver enabled, driver disabled at boot.
# EXP296 may raise it only inside the guarded transmit scripts.
# This switch is internal and is not exposed to Home Assistant.
switch:
  - platform: gpio
    id: waveshare_rs485_direction
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO21
      inverted: false


# =============================================================================
# BUS HEALTH
# =============================================================================

globals:
  - id: thermia_last_valid_frame_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Runtime-only parser / freshness diagnostics. These are intentionally
  # not persisted; they describe the current ESP boot only.
  - id: thermia_valid_frame_count
    type: uint32_t
    restore_value: no
    initial_value: '0'


  # ==========================================================================
  # EXP296 - transport/session state (application state is kept separate)
  # session_state:
  #   0 idle
  #   1 armed / waiting controller bus gap+return
  #   2 waiting first exact 071C/0730 approval request
  #   3 ordered initial FC16 config synchronization
  #   4 waiting locally proven post-config all-zero 085F/5
  #   5 waiting startup FC03 0708/6
  #   6 steady-state runtime responder active
  #   9 aborted/faulted / TX disabled
  # ==========================================================================
  - id: exp296_armed
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: exp296_session_state
    type: uint8_t
    restore_value: no
    initial_value: '0'

  # Runtime event allow-mask; bits are internal scheduler events, not protocol
  # semantics. They merely make the responder fail-closed by declaring exactly
  # which already-evidenced event(s) may be actively serviced next.
  - id: exp296_runtime_allowed
    type: uint16_t
    restore_value: no
    initial_value: '0'

  # 0708 context: 0 none, 1 after 07E4, 2 after 080C, 3 after 0848,
  # 4 optional after 085F, 5 optional after 0864, 6 optional after 0884,
  # 7 optional after 0870 before 0884.
  - id: exp296_mailbox_context
    type: uint8_t
