script:
  # Fixed historical R1. This is the already-used local replay path; EXP296 does
  # not claim the genuine challenge algorithm is solved.
  - id: exp296_send_r1_once
    mode: single
    then:
      - switch.turn_on: waveshare_rs485_direction
      - delay: 1ms
      - lambda: |-
          static const uint8_t frame[] = {
            0x0F,0x17,0x10,
            0x16,0x91,0xA5,0xF3,0xF8,0xE8,0xD5,0x87,
            0x38,0x92,0x44,0x16,0xE8,0xE6,0xA3,0xD5,
            0xE2,0x27
          };
          id(thermia_uart).write_array(frame, sizeof(frame));
          id(thermia_uart).flush();
      - delay: 1ms
      - switch.turn_off: waveshare_rs485_direction

  # Generic standard FC16 address/count ACK, but callable only from the
  # whitelisted exact states in the EXP296 handler above. CRC is generated at
  # runtime over the exact ACK bytes to avoid stale hard-coded CRCs.
  - id: exp296_send_fc16_ack
    mode: queued
    parameters:
      start: int
      count: int
    then:
      - switch.turn_on: waveshare_rs485_direction
      - delay: 1ms
      - lambda: |-
          uint8_t frame[8] = {
            0x0F,0x10,
            uint8_t((start >> 8) & 0xFF), uint8_t(start & 0xFF),
            uint8_t((count >> 8) & 0xFF), uint8_t(count & 0xFF),
            0x00,0x00
          };
          uint16_t crc=0xFFFF;
          for (int i=0;i<6;i++) {
            crc ^= frame[i];
            for (int b=0;b<8;b++) crc=(crc&1)?((crc>>1)^0xA001):(crc>>1);
          }
          frame[6]=uint8_t(crc & 0xFF); frame[7]=uint8_t((crc>>8)&0xFF);
          id(thermia_uart).write_array(frame,sizeof(frame));
          id(thermia_uart).flush();
      - delay: 1ms
      - switch.turn_off: waveshare_rs485_direction

  # Locally proven startup mailbox response after the post-config 085F gate.
  # Words: 0000 0000 0000 0000 0080 0006. w1 remains 0000.
  - id: exp296_send_startup_0708
    mode: single
    then:
      - switch.turn_on: waveshare_rs485_direction
      - delay: 1ms
      - lambda: |-
          static const uint8_t frame[] = {
            0x0F,0x03,0x0C,0x00,0x00,0x00,0x00,0x00,0x00,
            0x00,0x00,0x00,0x80,0x00,0x06,0x9C,0x9E
          };
          id(thermia_uart).write_array(frame,sizeof(frame));
          id(thermia_uart).flush();
      - delay: 1ms
      - switch.turn_off: waveshare_rs485_direction

  # Locally proven steady-state mailbox response. Words:
  # 0000 0000 0000 0000 0000 0006. It cannot advertise reverse 03E8 data.
  - id: exp296_send_runtime_0708
    mode: single
    then:
      - switch.turn_on: waveshare_rs485_direction
      - delay: 1ms
      - lambda: |-
          static const uint8_t frame[] = {
            0x0F,0x03,0x0C,0x00,0x00,0x00,0x00,0x00,0x00,
            0x00,0x00,0x00,0x00,0x00,0x06,0x9D,0x76
          };
          id(thermia_uart).write_array(frame,sizeof(frame));
          id(thermia_uart).flush();
      - delay: 1ms
      - switch.turn_off: waveshare_rs485_direction

button:
