    on_press:
      - lambda: |-
          id(waveshare_rs485_direction).turn_off();
          id(exp296_runtime_allowed)=0;
          id(exp296_mailbox_context)=0;
          id(exp296_session_state)=9;
          id(exp296_armed)=false;
          id(thermia_exp296_active)->publish_state(false);
          id(thermia_exp296_status)->publish_state("ABORTED manually / DE LOW");
          id(thermia_exp296_runtime_state)->publish_state("TX disabled");
          id(thermia_exp296_last_event)->publish_state("manual abort");
          ESP_LOGE("thermia_exp296","\033[31m[EXP296] ===== MANUAL_ABORT DE=LOW =====\033[0m");

  - platform: template
    name: "EXP296 Mark Alarm Visible"
    entity_category: config
    on_press:
      - lambda: |-
          const uint32_t now=millis();
          id(exp296_alarm_last_mark_ms)=now;
          if (id(exp296_session_state)==6) id(exp296_alarm_seen_during_service)=true;
          char s[96];
          snprintf(s,sizeof(s),"VISIBLE state=%u active_service=%u",
                   unsigned(id(exp296_session_state)),
                   unsigned(id(exp296_alarm_seen_during_service)));
          id(thermia_exp296_alarm_observation)->publish_state(s);
          ESP_LOGE("thermia_exp296",
            "\033[31m[EXP296] ===== ALARM_MARK VISIBLE state=%u since_steady=%ums =====\033[0m",
            unsigned(id(exp296_session_state)),
            unsigned(id(exp296_steady_start_ms)?now-id(exp296_steady_start_ms):0));
  - platform: template
    name: "EXP296 Mark Alarm Clear"
    entity_category: config
    on_press:
      - lambda: |-
          const uint32_t now=millis();
          id(exp296_alarm_last_mark_ms)=now;
          char s[80]; snprintf(s,sizeof(s),"CLEAR/NOT VISIBLE state=%u",unsigned(id(exp296_session_state)));
          id(thermia_exp296_alarm_observation)->publish_state(s);
          ESP_LOGW("thermia_exp296",
            "\033[38;5;130m[EXP296] ALARM_MARK CLEAR state=%u since_steady=%ums\033[0m",
            unsigned(id(exp296_session_state)),
            unsigned(id(exp296_steady_start_ms)?now-id(exp296_steady_start_ms):0));

interval:
  # EXP296 experiment watchdog / transition robustness guard.
  - interval: 250ms
    then:
      - lambda: |-
          if (!id(exp296_armed)) return;
          const uint32_t now=millis();
          const uint8_t state=id(exp296_session_state);
          const uint32_t resync_delta = id(exp296_bus_return_ms) ?
            id(thermia_parser_resync_count)-id(exp296_resync_at_return) : 0;
          const uint32_t drop_delta = id(exp296_bus_return_ms) ?
            id(thermia_rx_buffer_drop_count)-id(exp296_drop_at_return) : 0;

          auto stop_fault=[&](const char *reason) {
            id(waveshare_rs485_direction).turn_off();
            id(exp296_runtime_allowed)=0;
            id(exp296_mailbox_context)=0;
            id(exp296_session_state)=9;
            id(exp296_armed)=false;
            id(thermia_exp296_active)->publish_state(false);
            id(thermia_exp296_status)->publish_state("ABORTED / watchdog fail-closed / return log");
            id(thermia_exp296_runtime_state)->publish_state("TX disabled");
            id(thermia_exp296_last_event)->publish_state(reason);
            ESP_LOGE("thermia_exp296",
              "\033[31m[EXP296] ===== WATCHDOG_ABORT reason=%s resync=%u drops=%u DE=LOW =====\033[0m",
              reason,unsigned(resync_delta),unsigned(drop_delta));
          };

          // Parser/RX integrity is a hard active-TX abort after controller return.
          if (id(exp296_bus_return_ms) && (resync_delta!=0 || drop_delta!=0) && state<=6) {
            stop_fault("parser/RX integrity delta after bus return"); return;
          }

          if (state==2 && id(exp296_bus_return_ms) && (now-id(exp296_bus_return_ms))>15000UL) {
            stop_fault("no exact approval within 15 s of bus return"); return;
          }
          if (state==3 && (now-id(exp296_last_progress_ms))>8000UL) {
            stop_fault("initial config sync stalled >8 s"); return;
          }
          if (state==4 && (now-id(exp296_last_progress_ms))>10000UL) {
            stop_fault("no startup all-zero 085F within 10 s"); return;
          }
          if (state==5 && (now-id(exp296_last_progress_ms))>10000UL) {
            stop_fault("no startup 0708 within 10 s after 085F ACK"); return;
          }
          if (state==6) {
            if ((now-id(exp296_last_progress_ms))>8000UL) {
              stop_fault("steady-state runtime progress stalled >8 s"); return;
            }
          }

  - interval: 5s
    then:
      - lambda: |-
          const uint32_t last = id(thermia_last_valid_frame_ms);
          if (last == 0 || (millis() - last) > 10000UL) {
            if (!id(thermia_bus_healthy)->has_state() || id(thermia_bus_healthy)->state) {
              id(thermia_bus_healthy)->publish_state(false);
            }
          }