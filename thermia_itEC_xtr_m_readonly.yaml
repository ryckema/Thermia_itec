# =============================================================================
# THERMIA iTec XTR M - PASSIVE READ-ONLY ESPHOME INTEGRATION
# Public / GitHub-safe reference configuration
# Updated 2026-09-19
#
# Reference hardware:
# - ESP32
# - External TTL <-> RS485 receiver/converter
#
# READ ONLY / DIAGNOSTIC:
# - Converter TTL RX output (RO) -> ESP32 GPIO4
# - ESP TX is NOT connected (passive / read-only)
# - Converter TTL GND -> ESP32 GND
# - Thermia side: RJ45 pin 1 -> RS485 A, pin 3 -> RS485 B
#
# Thermia bus observed on the tested installation:
# - 9600 baud
# - 8 data bits
# - EVEN parity
# - 1 stop bit
# - Modbus RTU
#
# IMPORTANT:
# - This project is based on passive bus observation and reverse engineering.
# - It does not transmit Modbus frames to the Thermia bus.
# - Register meanings marked as tentative/diagnostic may change as more captures
#   become available.
# - Keep Wi-Fi, API and OTA credentials in ESPHome secrets.yaml. Never commit
#   real credentials to a public repository.
# =============================================================================


# =============================================================================
# ESP
# =============================================================================

# Board: Generic ESP32 Board (Generic)

esphome:
  name: thermia
  friendly_name: Thermia iTec XTR M

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      # This physical board reports ESP32 rev3.1 in the boot log.
      # Saves legacy-revision workarounds and exposes the bootloader-supported
      # SRAM1 region as an extra 40 KB IRAM for Wi-Fi/API-heavy code.
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

api:
  encryption:
    key: !secret thermia_api_encryption_key
  # Do not reboot merely because Home Assistant/API is temporarily unreachable.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret thermia_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # ESP32 is mains-powered: prefer reliability over Wi-Fi power saving.
  power_save_mode: none

  # Keep a network-stack recovery watchdog, but make it much less aggressive
  # than the ESPHome default. No access-point BSSID is hard-coded.
  reboot_timeout: 30min

  ap:
    ssid: "Thermia Fallback Hotspot"
    password: !secret thermia_fallback_password

# Publish reset/heap/loop diagnostics so Wi-Fi loss can be separated from
# brownouts, watchdog resets, API loss and parser/resource problems.
debug:
  update_interval: 30s


# =============================================================================
# LOGGING
# =============================================================================

logger:
  # Production / long-capture mode:
  # Keep change-only mapper events, suppress noisy frame/parser logs.
  level: INFO
  baud_rate: 0
  logs:
    thermia_scan: INFO
    thermia_map: INFO
    thermia_raw: WARN
    thermia: WARN
    thermia_a7f8: WARN
    thermia_supply: WARN
    thermia_sg: WARN



# =============================================================================
# THERMIA UART
#
# Confirmed from passive captures:
#
# 9600 baud
# 8E1
# Modbus RTU CRC16
#
# External converter TTL output is connected to GPIO4.
# CONFIRMED for the currently working external converter:
# GPIO4 RX, inverted: false, 9600 8E1.
# =============================================================================

# =============================================================================
# BUS HEALTH
# =============================================================================

globals:
  - id: thermia_last_valid_frame_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'


uart:
  id: thermia_uart

  rx_pin:
    number: GPIO4
    inverted: false

  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

  rx_buffer_size: 2048

  # Prevent ESP-IDF from splitting Modbus RTU frames into ~7-byte chunks.
  rx_full_threshold: 120
  rx_timeout: 2

  debug:
    direction: RX
    dummy_receiver: true
    debug_prefix: "[THERMIA] "

    after:
      timeout: 5ms

    sequence:
      - lambda: |-

          // Robust Modbus RTU stream assembler. ESPHome may split long
          // frames across callbacks, so retain bytes until structure + CRC
          // prove a complete frame. Multiple frames per callback are OK.
          static std::vector<uint8_t> pending;
          pending.insert(pending.end(), bytes.begin(), bytes.end());

          auto stream_crc16 = [](const uint8_t *data, size_t len) -> uint16_t {
            uint16_t crc = 0xFFFF;
            for (size_t i = 0; i < len; i++) {
              crc ^= data[i];
              for (uint8_t bit = 0; bit < 8; bit++)
                crc = (crc & 1) ? ((crc >> 1) ^ 0xA001) : (crc >> 1);
            }
            return crc;
          };

          auto valid_crc = [&](size_t len) -> bool {
            if (len < 5 || pending.size() < len) return false;
            uint16_t got = uint16_t(pending[len-2]) | (uint16_t(pending[len-1]) << 8);
            return stream_crc16(pending.data(), len - 2) == got;
          };

          auto known_slave = [](uint8_t s) -> bool {
            return s == 0x02 || s == 0x06 || s == 0x0A ||
                   s == 0x0F || s == 0x14 || s == 0x1E;
          };

          auto process_frame = [&](const std::vector<uint8_t> &bytes) {
              // ===============================================================
              // RAW DIAGNOSTIC LOGGING
              // Always print the received UART chunk before parsing it.
              // ===============================================================

              std::string raw_hex;
              raw_hex.reserve(bytes.size() * 3);

              char hex_byte[4];

              for (size_t i = 0; i < bytes.size(); i++) {
                if (i > 0) {
                  raw_hex += " ";
                }

                snprintf(
                  hex_byte,
                  sizeof(hex_byte),
                  "%02X",
                  bytes[i]
                );

                raw_hex += hex_byte;
              }

              ESP_LOGI(
                "thermia_raw",
                "RX %u bytes: %s",
                (unsigned) bytes.size(),
                raw_hex.c_str()
              );


              // ===============================================================
              // THERMIA ITEC LEGACY PASSIVE MODBUS RTU DECODER
              // ===============================================================

              if (bytes.size() < 5) {
                ESP_LOGW(
                  "thermia",
                  "Chunk too short for Modbus RTU: %u bytes",
                  (unsigned) bytes.size()
                );
                return;
              }


              // ===============================================================
              // HELPERS
              // ===============================================================

              auto crc16_modbus =
                [](const uint8_t *data, size_t len) -> uint16_t {

                  uint16_t crc = 0xFFFF;

                  for (size_t i = 0; i < len; i++) {

                    crc ^= data[i];

                    for (uint8_t bit = 0; bit < 8; bit++) {

                      if (crc & 0x0001) {
                        crc = (crc >> 1) ^ 0xA001;
                      } else {
                        crc >>= 1;
                      }
                    }
                  }

                  return crc;
                };


              auto u16 =
                [](const std::vector<uint8_t> &b, size_t pos) -> uint16_t {

                  return
                    (uint16_t(b[pos]) << 8) |
                    uint16_t(b[pos + 1]);
                };


              auto s16 =
                [](const std::vector<uint8_t> &b, size_t pos) -> int16_t {

                  return int16_t(
                    (uint16_t(b[pos]) << 8) |
                    uint16_t(b[pos + 1])
                  );
                };


              // ===============================================================
              // CHANGE-ONLY PUBLISH HELPERS
              //
              // The Thermia bus repeats many identical values every second.
              // Only forwarding actual changes keeps the ESPHome native API
              // queue small and prevents Home Assistant entities going
              // temporarily unavailable under heavy bus traffic.
              // ===============================================================

              auto publish_float_if_changed =
                [](auto *sensor, float value, float epsilon = 0.001f) {
                  if (!sensor->has_state() ||
                      isnan(sensor->state) ||
                      fabsf(sensor->state - value) >= epsilon) {
                    sensor->publish_state(value);
                  }
                };

              auto publish_bool_if_changed =
                [](auto *sensor, bool value) {
                  if (!sensor->has_state() || sensor->state != value) {
                    sensor->publish_state(value);
                  }
                };

              auto publish_text_if_changed =
                [](auto *sensor, const char *value) {
                  if (!sensor->has_state() || sensor->state != value) {
                    sensor->publish_state(value);
                  }
                };


              // ===============================================================
              // CRC VALIDATION
              // ===============================================================

              const uint16_t received_crc =
                uint16_t(bytes[bytes.size() - 2]) |
                (uint16_t(bytes[bytes.size() - 1]) << 8);

              const uint16_t calculated_crc =
                crc16_modbus(
                  bytes.data(),
                  bytes.size() - 2
                );


              if (received_crc != calculated_crc) {

                ESP_LOGW(
                  "thermia",
                  "CRC FAIL (%u bytes): received=0x%04X calculated=0x%04X",
                  (unsigned) bytes.size(),
                  received_crc,
                  calculated_crc
                );

                return;
              }


              const uint8_t slave = bytes[0];
              const uint8_t fc = bytes[1];

              id(thermia_last_valid_frame_ms) = millis();
              publish_bool_if_changed(id(thermia_bus_healthy), true);

              ESP_LOGI(
                "thermia",
                "CRC OK: slave=0x%02X function=0x%02X length=%u",
                slave,
                fc,
                (unsigned) bytes.size()
              );


              // ===============================================================
              // REQUEST CONTEXT
              //
              // Responses to FC04/FC17 do not contain the original register
              // address. Remember the request so the response can be decoded.
              // ===============================================================

              static uint16_t fc04_start[256] = {};
              static uint16_t fc04_count[256] = {};
              static bool fc04_pending[256] = {};

              static uint16_t fc17_start[256] = {};
              static uint16_t fc17_count[256] = {};
              static bool fc17_pending[256] = {};

              // ===============================================================
              // MAPPER STATE
              // Change-only logging for selected register blocks.
              // ===============================================================

              static bool mapper_initialized = false;

              static int16_t prev_a7f8_block[0x0F] = {};
              static int16_t prev_a80c_block[0x07] = {};
              static int16_t prev_b3b0_block[0x03] = {};
              static int16_t prev_b3c4_block[0x03] = {};
              static int16_t prev_03e8_block[0x0E] = {};
              static int16_t prev_1e_fc04_block[0x16] = {};

              auto log_change =
                [&](const char *group,
                    uint16_t address,
                    int16_t old_value,
                    int16_t new_value) {

                  if (old_value == new_value) {
                    return;
                  }

                  ESP_LOGI(
                    "thermia_map",
                    "%s 0x%04X: %d -> %d",
                    group,
                    address,
                    old_value,
                    new_value
                  );
                };


              // ===============================================================
              // GENERIC REGISTER MAPPER
              //
              // Stores every register we see in supported Modbus blocks and
              // logs only first-seen values and later changes.
              //
              // source:
              //   1 = FC04 response (read)
              //   2 = FC10 request  (write block sent by Thermia)
              //   3 = FC17 request  (write part)
              //   4 = FC17 response (read part)
              // ===============================================================

              static std::vector<uint32_t> generic_keys;
              static std::vector<int16_t> generic_values;

              auto publish_raw_register =
                [&](uint8_t source,
                    uint8_t slave_id,
                    uint16_t address,
                    int16_t value) {

                  // Raw register entities are diagnostic + disabled by default.
                  // They preserve the reverse-engineering view without cluttering
                  // normal Home Assistant dashboards.
