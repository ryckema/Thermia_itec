# =============================================================================
# DERIVED STATES
# =============================================================================

binary_sensor:

  - platform: template
    id: thermia_bus_healthy
    name: "Bus Healthy"
    device_class: connectivity
    entity_category: diagnostic

  - platform: template
    id: thermia_compressor_running
    name: "Compressor Running"
    device_class: running


text_sensor:

  - platform: template
    id: thermia_sg_mode
    name: "SG Mode"

# =============================================================================
# PERIODIC BUS HEALTH CHECK
# =============================================================================

interval:
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t last = id(thermia_last_valid_frame_ms);
          if (last == 0 || (millis() - last) > 10000UL) {
            id(thermia_bus_healthy)->publish_state(false);
          }
