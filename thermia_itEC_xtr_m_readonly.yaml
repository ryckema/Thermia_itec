              if (source == 4 && slave_id == 0x02 && address == 0xA7FF) {
                id(thermia_raw_s4_02_a7ff)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x02 && address == 0xA800) {
                id(thermia_raw_s4_02_a800)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x02 && address == 0xA801) {
                id(thermia_raw_s4_02_a801)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x02 && address == 0xA802) {
                id(thermia_raw_s4_02_a802)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x02 && address == 0xA803) {
                id(thermia_raw_s4_02_a803)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x02 && address == 0xA804) {
                id(thermia_raw_s4_02_a804)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x02 && address == 0xA805) {
                id(thermia_raw_s4_02_a805)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x02 && address == 0xA806) {
                id(thermia_raw_s4_02_a806)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x0A && address == 0xB3B0) {
                id(thermia_raw_s4_0a_b3b0)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x0A && address == 0xB3B1) {
                id(thermia_raw_s4_0a_b3b1)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x0A && address == 0xB3B2) {
                id(thermia_raw_s4_0a_b3b2)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x06 && address == 0xAFC8) {
                id(thermia_raw_s4_06_afc8)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x06 && address == 0xAFC9) {
                id(thermia_raw_s4_06_afc9)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x06 && address == 0xAFCA) {
                id(thermia_raw_s4_06_afca)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x06 && address == 0xAFCB) {
                id(thermia_raw_s4_06_afcb)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x06 && address == 0xAFCC) {
                id(thermia_raw_s4_06_afcc)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x06 && address == 0xAFCD) {
                id(thermia_raw_s4_06_afcd)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x06 && address == 0xAFCE) {
                id(thermia_raw_s4_06_afce)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x06 && address == 0xAFCF) {
                id(thermia_raw_s4_06_afcf)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x06 && address == 0xAFD0) {
                id(thermia_raw_s4_06_afd0)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x06 && address == 0xAFD1) {
                id(thermia_raw_s4_06_afd1)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x06 && address == 0xAFD2) {
                id(thermia_raw_s4_06_afd2)->publish_state(float(value));
                return;
              }
              if (source == 4 && slave_id == 0x06 && address == 0xAFD3) {
                id(thermia_raw_s4_06_afd3)->publish_state(float(value));
                return;
              }
            };

          auto generic_map_update =
            [&](uint8_t source,
                uint8_t slave_id,
                uint16_t address,
                int16_t value) {

              publish_raw_register(
                source,
                slave_id,
                address,
                value
              );

              const uint32_t key =
                (uint32_t(source) << 24) |
                (uint32_t(slave_id) << 16) |
                uint32_t(address);

              for (size_t i = 0; i < generic_keys.size(); i++) {

                if (generic_keys[i] != key) {
                  continue;
                }

                if (generic_values[i] != value) {

                  ESP_LOGI(
                    "thermia_scan",
                    "SRC=%u SLAVE=0x%02X REG=0x%04X %d -> %d",
                    source,
                    slave_id,
                    address,
                    generic_values[i],
                    value
                  );

                  generic_values[i] = value;
                }

                return;
              }

              generic_keys.push_back(key);
              generic_values.push_back(value);

              ESP_LOGD(
                "thermia_scan",
                "INIT SRC=%u SLAVE=0x%02X REG=0x%04X = %d",
                source,
                slave_id,
                address,
                value
              );
            };


          // ===============================================================
          // FC04 REQUEST
          // Read Input Registers
          // ===============================================================

          if (
            fc == 0x04 &&
            bytes.size() == 8
          ) {

            fc04_start[slave] =
              u16(bytes, 2);

            fc04_count[slave] =
              u16(bytes, 4);

            fc04_pending[slave] = true;

            return;
          }


          // ===============================================================
          // FC04 RESPONSE
          // ===============================================================

          if (
            fc == 0x04 &&
            fc04_pending[slave] &&
            bytes.size() >= 5 &&
            bytes.size() == size_t(bytes[2]) + 5
          ) {

            const uint16_t start =
              fc04_start[slave];

            const uint16_t count =
              fc04_count[slave];

            const uint8_t byte_count =
              bytes[2];


            if (byte_count != count * 2) {

              fc04_pending[slave] = false;
              return;
            }


            auto reg_u =
              [&](uint16_t address) -> uint16_t {

                const size_t offset =
                  size_t(address - start);

                const size_t pos =
                  3 + offset * 2;

                return u16(bytes, pos);
              };


            auto reg_s =
              [&](uint16_t address) -> int16_t {

                const size_t offset =
                  size_t(address - start);

                const size_t pos =
                  3 + offset * 2;

                return s16(bytes, pos);
              };


            // Generic mapper: scan complete FC04 response block.
            for (uint16_t i = 0; i < count; i++) {

              const uint16_t address =
                uint16_t(start + i);

              generic_map_update(
                1,
                slave,
                address,
                reg_s(address)
              );
            }


            // =============================================================
            // SLAVE 0x1E
            // Outdoor unit / compressor live data
            //
            // FC04 start 0x0000
            //
            // 0000 condenser inlet          x0.1 °C
            // 0001 condenser outlet         x0.1 °C
            // 0008 high pressure            x0.1 bar
            // 000A requested temperature    x0.1 °C
            // 000B compressor frequency     Hz
            // 000D compressor current       x0.1 A
            // 000E outdoor fan              rpm
            // 0010 expansion valve          steps
            // =============================================================

            if (
              slave == 0x1E &&
              start == 0x0000 &&
              count >= 17
            ) {

              // -----------------------------------------------------------
              // Mapper: slave 0x1E FC04 block 0x0000..0x0015
              // -----------------------------------------------------------

              if (count >= 0x16) {
                for (uint16_t addr = 0x0000; addr <= 0x0015; addr++) {
                  const int16_t v = reg_s(addr);
                  const size_t idx = size_t(addr);

                  if (mapper_initialized) {
                    log_change(
                      "S1E_FC04",
                      addr,
                      prev_1e_fc04_block[idx],
                      v
                    );
                  }

                  prev_1e_fc04_block[idx] = v;
                }
              }

              const float condenser_in =
                float(reg_s(0x0000)) / 10.0f;

              const float condenser_out =
                float(reg_s(0x0001)) / 10.0f;

              const float refrigerant_temperature_1 =
                float(reg_s(0x0002)) / 10.0f;

              const float discharge_gas_temperature =
                float(reg_s(0x0003)) / 10.0f;

              const float refrigerant_temperature_2 =
                float(reg_s(0x0004)) / 10.0f;

              const float average_outdoor_temperature =
                float(reg_s(0x0005)) / 10.0f;

              const float compressor_temperature =
                float(reg_s(0x0006)) / 10.0f;

              const float high_pressure =
                float(reg_u(0x0008)) / 10.0f;

              const float target_temperature =
                float(reg_s(0x000A)) / 10.0f;

              const float compressor_frequency =
                float(reg_u(0x000B));

              const float compressor_current =
                float(reg_u(0x000D)) / 10.0f;

              const float fan_speed =
                float(reg_u(0x000E));

              const float valve_steps =
                float(reg_u(0x0010));


              if (
                condenser_in > -50.0f &&
                condenser_in < 150.0f
              ) {

                id(thermia_condenser_in)->publish_state(condenser_in);
              }


              if (
                condenser_out > -50.0f &&
                condenser_out < 150.0f
              ) {

                id(thermia_condenser_out)->publish_state(condenser_out);
              }


              if (
                condenser_in > -50.0f &&
                condenser_in < 150.0f &&
                condenser_out > -50.0f &&
                condenser_out < 150.0f
              ) {

                id(thermia_condenser_delta_t)->publish_state(
                    condenser_out - condenser_in
                  );
              }


              if (refrigerant_temperature_1 > -80.0f &&
                  refrigerant_temperature_1 < 200.0f) {
                id(thermia_refrigerant_temperature_1)->publish_state(
                    refrigerant_temperature_1
                  );
              }

              if (discharge_gas_temperature > -80.0f &&
                  discharge_gas_temperature < 250.0f) {
                id(thermia_discharge_gas_temperature)->publish_state(
                    discharge_gas_temperature
                  );
              }

              if (refrigerant_temperature_2 > -80.0f &&
                  refrigerant_temperature_2 < 200.0f) {
                id(thermia_refrigerant_temperature_2)->publish_state(
                    refrigerant_temperature_2
                  );
              }

              if (average_outdoor_temperature > -80.0f &&
                  average_outdoor_temperature < 100.0f) {
                id(thermia_average_outdoor_temperature)->publish_state(
                    average_outdoor_temperature
                  );
              }

              if (compressor_temperature > -80.0f &&
                  compressor_temperature < 200.0f) {
                id(thermia_compressor_temperature)->publish_state(
                    compressor_temperature
                  );
              }


              if (
                high_pressure >= 0.0f &&
                high_pressure < 100.0f
              ) {

                id(thermia_high_pressure)->publish_state(high_pressure);
              }


              if (
                target_temperature > -50.0f &&
                target_temperature < 150.0f
              ) {

                id(thermia_target_temperature)->publish_state(
                    target_temperature
                  );
              }


              if (
                compressor_frequency >= 0.0f &&
                compressor_frequency < 200.0f
              ) {

                id(thermia_compressor_frequency)->publish_state(
                    compressor_frequency
                  );
              }


              if (
                compressor_current >= 0.0f &&
                compressor_current < 100.0f
              ) {

                id(thermia_compressor_current)->publish_state(
                    compressor_current
                  );
              }


              if (
                fan_speed >= 0.0f &&
                fan_speed < 5000.0f
              ) {

                id(thermia_fan_speed)->publish_state(
                    fan_speed
                  );
              }


              if (
                valve_steps >= 0.0f &&
                valve_steps < 10000.0f
              ) {

                id(thermia_expansion_valve_steps)->publish_state(
                    valve_steps
                  );
              }


              id(thermia_compressor_running)->publish_state(
                  compressor_frequency > 0.0f
                );
            }


            fc04_pending[slave] = false;
            return;
          }


          // ===============================================================
          // FC10
          // Write Multiple Registers
          //
          // Deze frames worden DOOR THERMIA verzonden.
          // De ESP luistert alleen.
          // ===============================================================

          if (
            fc == 0x10 &&
            bytes.size() >= 9
          ) {

            const uint16_t start =
              u16(bytes, 2);

            const uint16_t count =
              u16(bytes, 4);

            const uint8_t byte_count =
              bytes[6];


            if (
              bytes.size() !=
              size_t(byte_count) + 9
            ) {

              return;
            }


            if (
              byte_count !=
              count * 2
            ) {

              return;
            }


            auto reg_s =
              [&](uint16_t address) -> int16_t {

                const size_t offset =
                  size_t(address - start);

                const size_t pos =
                  7 + offset * 2;

                return s16(bytes, pos);
              };


            // Generic mapper: scan complete FC10 write block.
            for (uint16_t i = 0; i < count; i++) {

              const uint16_t address =
                uint16_t(start + i);

              generic_map_update(
                2,
                slave,
                address,
                reg_s(address)
              );
            }


            // =============================================================
            // SLAVE 0x0F
            // Heating configuration block
            //
            // 03E8 Heating curve
            // 03E9 Heating MIN
            // 03EA Heating MAX
            // 03EB Curve +5
            // 03EC Curve 0
            // 03ED Curve -5
            // 03EE Heating stop
            // 03EF Reduced temperature
            // 03F0 Room factor
            // 03F4 Room setpoint mirror
            // =============================================================

            if (
              slave == 0x0F &&
              start == 0x03E8 &&
              count >= 13
            ) {

              // -----------------------------------------------------------
              // Mapper: slave 0x0F FC10 block 0x03E8..0x03F5
              // -----------------------------------------------------------

              if (count >= 0x0E) {
                for (uint16_t addr = 0x03E8; addr <= 0x03F5; addr++) {
                  const int16_t v = reg_s(addr);
                  const size_t idx = size_t(addr - 0x03E8);

                  if (mapper_initialized) {
                    log_change(
                      "S0F_FC10",
                      addr,
                      prev_03e8_block[idx],
                      v
                    );
                  }

                  prev_03e8_block[idx] = v;
                }
              }

              id(thermia_heating_curve)->publish_state(
                  float(reg_s(0x03E8))
                );


              id(thermia_heating_min)->publish_state(
                  float(reg_s(0x03E9))
                );


              id(thermia_heating_max)->publish_state(
                  float(reg_s(0x03EA))
                );


              id(thermia_heating_stop)->publish_state(
                  float(reg_s(0x03EE))
                );


              id(thermia_reduced_temperature)->publish_state(
                  float(reg_s(0x03EF))
                );


              id(thermia_room_factor)->publish_state(
                  float(reg_s(0x03F0))
                );
            }

            return;
          }


          // ===============================================================
          // FC17 REQUEST
          // Read / Write Multiple Registers
          // ===============================================================

          if (
            fc == 0x17 &&
            bytes.size() >= 13
          ) {

            const uint16_t read_start =
              u16(bytes, 2);

            const uint16_t read_count =
              u16(bytes, 4);

            const uint16_t write_start =
              u16(bytes, 6);

            const uint16_t write_count =
              u16(bytes, 8);

            const uint8_t byte_count =
              bytes[10];

            const size_t expected_size =
              size_t(byte_count) + 13;


            if (
              bytes.size() == expected_size &&
              byte_count == write_count * 2
            ) {

              fc17_start[slave] =
                read_start;

              fc17_count[slave] =
                read_count;

              fc17_pending[slave] =
                true;


              auto write_reg_s =
                [&](uint16_t address) -> int16_t {

                  const size_t offset =
                    size_t(address - write_start);

                  const size_t pos =
                    11 + offset * 2;

                  return s16(bytes, pos);
                };


              // Generic mapper: scan complete FC17 write part.
              for (uint16_t i = 0; i < write_count; i++) {

                const uint16_t address =
                  uint16_t(write_start + i);

                generic_map_update(
                  3,
                  slave,
                  address,
                  write_reg_s(address)
                );
              }


              // ===========================================================
              // MAPPER: FC17 write blocks
              // ===========================================================

              if (
                slave == 0x0A &&
                write_start <= 0xB3C4 &&
                (
                  uint32_t(write_start) +
                  uint32_t(write_count)
                ) >= 0xB3C7
              ) {

                for (uint16_t addr = 0xB3C4; addr <= 0xB3C6; addr++) {
                  const int16_t v = write_reg_s(addr);
                  const size_t idx = size_t(addr - 0xB3C4);

                  if (mapper_initialized) {
                    log_change(
                      "S0A_FC17W",
                      addr,
                      prev_b3c4_block[idx],
                      v
                    );
                  }

                  prev_b3c4_block[idx] = v;
                }
              }


              if (
                slave == 0x02 &&
                write_start <= 0xA80C &&
                (
                  uint32_t(write_start) +
                  uint32_t(write_count)
                ) >= 0xA813
              ) {

                for (uint16_t addr = 0xA80C; addr <= 0xA812; addr++) {
                  const int16_t v = write_reg_s(addr);
                  const size_t idx = size_t(addr - 0xA80C);

                  if (mapper_initialized) {
                    log_change(
                      "S02_FC17W",
                      addr,
                      prev_a80c_block[idx],
                      v
                    );
                  }

                  prev_a80c_block[idx] = v;
                }
              }


              // ===========================================================
              // SLAVE 0x0A
              //
              // B3C5 = requested room temperature
              // ===========================================================

              if (
                slave == 0x0A &&
                write_start <= 0xB3C5 &&
                (
                  uint32_t(write_start) +
                  uint32_t(write_count)
                ) > 0xB3C5
              ) {

                const float room_setpoint =
                  float(
                    write_reg_s(0xB3C5)
                  );


                if (
                  room_setpoint >= 5.0f &&
                  room_setpoint <= 40.0f
                ) {

                  id(thermia_room_setpoint)->publish_state(
                      room_setpoint
                    );
                }
              }

              return;
            }
          }


          // ===============================================================
          // FC17 RESPONSE
          // ===============================================================

          if (
            fc == 0x17 &&
            fc17_pending[slave] &&
            bytes.size() >= 5 &&
            bytes.size() ==
              size_t(bytes[2]) + 5
          ) {

            const uint16_t start =
              fc17_start[slave];

            const uint16_t count =
              fc17_count[slave];

            const uint8_t byte_count =
              bytes[2];


            if (
              byte_count !=
              count * 2
            ) {

              fc17_pending[slave] = false;
              return;
            }


            auto reg_s =
              [&](uint16_t address) -> int16_t {

                const size_t offset =
                  size_t(address - start);

                const size_t pos =
                  3 + offset * 2;

                return s16(bytes, pos);
              };


            // Generic mapper: scan complete FC17 read response block.
            for (uint16_t i = 0; i < count; i++) {

              const uint16_t address =
                uint16_t(start + i);

              generic_map_update(
                4,
                slave,
                address,
                reg_s(address)
              );
            }


            // =============================================================
            // SLAVE 0x02
            //
            // A7F8 Supply temperature
            // A7FB DHW upper
            // A7FC DHW main
            // A7FD SG discriminator 1
            // A802 Outdoor temperature
            // A803 SG discriminator 2
            // =============================================================

            if (
              slave == 0x02 &&
              start == 0xA7F8 &&
              count >= 12
            ) {

              // -----------------------------------------------------------
              // Mapper: slave 0x02 FC17 read block 0xA7F8..0xA806
              // -----------------------------------------------------------

              if (count >= 0x0F) {
                for (uint16_t addr = 0xA7F8; addr <= 0xA806; addr++) {
                  const int16_t v = reg_s(addr);
                  const size_t idx = size_t(addr - 0xA7F8);

                  if (mapper_initialized) {
                    log_change(
                      "S02_FC17R",
                      addr,
                      prev_a7f8_block[idx],
                      v
                    );
                  }

                  prev_a7f8_block[idx] = v;
                }
              }

              const int16_t supply =
                reg_s(0xA7F8);

              const int16_t dhw_upper =
                reg_s(0xA7FB);

              const int16_t dhw =
                reg_s(0xA7FC);

              const int16_t outdoor =
                reg_s(0xA802);

              const int16_t sg_a =
                reg_s(0xA7FD);

              const int16_t sg_b =
                reg_s(0xA803);


              // ===========================================================
              // DIAGNOSTIC: complete A7F8 block
              // Useful to verify whether A7F8 really changes with supply.
              // ===========================================================

              ESP_LOGI(
                "thermia_a7f8",
                "A7F8=%d A7F9=%d A7FA=%d A7FB=%d A7FC=%d A7FD=%d "
                "A7FE=%d A7FF=%d A800=%d A801=%d A802=%d A803=%d "
                "A804=%d A805=%d A806=%d",
                reg_s(0xA7F8),
                reg_s(0xA7F9),
                reg_s(0xA7FA),
                reg_s(0xA7FB),
                reg_s(0xA7FC),
                reg_s(0xA7FD),
                reg_s(0xA7FE),
                reg_s(0xA7FF),
                reg_s(0xA800),
                reg_s(0xA801),
                reg_s(0xA802),
                reg_s(0xA803),
                reg_s(0xA804),
                reg_s(0xA805),
                reg_s(0xA806)
              );

              ESP_LOGI(
                "thermia_supply",
                "Supply candidate A7F8 raw=%d -> %.1f C",
                supply,
                float(supply)
              );


              if (
                supply != -1000 &&
                supply > -50 &&
                supply < 150
              ) {

                id(thermia_supply_temperature)->publish_state(
                    float(supply)
                  );
              }


              if (
                dhw_upper != -1000 &&
                dhw_upper > 0 &&
                dhw_upper < 100
              ) {

                id(thermia_dhw_upper_temperature)->publish_state(
                    float(dhw_upper)
                  );
              }


              if (
                dhw != -1000 &&
                dhw > 0 &&
                dhw < 100
              ) {

                id(thermia_dhw_temperature)->publish_state(
                    float(dhw)
                  );
              }


              if (
                outdoor != -1000 &&
                outdoor > -50 &&
                outdoor < 70
              ) {

                id(thermia_outdoor_temperature)->publish_state(
                    float(outdoor)
                  );
              }


              if (
                dhw_upper != -1000 &&
                dhw != -1000
              ) {

                id(thermia_dhw_delta_t)->publish_state(
                    float(
                      dhw_upper - dhw
                    )
                  );
              }


              // ===========================================================
              // SG MODE
              //
              // Controlled tests:
              //
              // A7FD    A803     SG input state from controlled tests
              //
              // -1000   232      Blocked  (SG 1-0)
              //  1000   224      Normal   (SG 0-0)
              //  1000   232      Enhanced (SG 0-1)
              // -1000   224      Peak     (SG 1-1)
              // ===========================================================

              ESP_LOGI(
                "thermia_sg",
                "SG discriminators: A7FD=%d A803=%d",
                sg_a,
                sg_b
              );


              // Corrected from repeated physical SG1/SG2 test:
              // 00 -> A7FD=-1000, A803=224 -> Normal
              // 10 -> A7FD=-1000, A803=232 -> Blocked
              // 01 -> A7FD= 1000, A803=224 -> Enhanced
              // 11 -> A7FD= 1000, A803=232 -> Peak
              //
              // Intermediate A7FD values are treated as transitions.

              if (
                sg_a == -1000 &&
                sg_b == 224
              ) {

                id(thermia_sg_mode)->publish_state(
                    "Normal (0-0)"
                  );
              }

              else if (
                sg_a == -1000 &&
                sg_b == 232
              ) {

                id(thermia_sg_mode)->publish_state(
                    "Blocked (1-0)"
                  );
              }

              else if (
                sg_a == 1000 &&
                sg_b == 224
              ) {

                id(thermia_sg_mode)->publish_state(
                    "Enhanced (0-1)"
                  );
              }

              else if (
                sg_a == 1000 &&
                sg_b == 232
              ) {

                id(thermia_sg_mode)->publish_state(
                    "Peak (1-1)"
                  );
              }

              else {

                // Hold the last valid state during the short transition.
                // Do not publish a misleading fifth SG mode.
              }
            }


            // =============================================================
            // SLAVE 0x0A
            //
            // B3B0 = room temperature x0.1 °C
            // =============================================================

            if (
              slave == 0x0A &&
              start == 0xB3B0 &&
              count >= 1
            ) {

              // -----------------------------------------------------------
              // Mapper: slave 0x0A FC17 read block 0xB3B0..0xB3B2
              // -----------------------------------------------------------

              if (count >= 3) {
                for (uint16_t addr = 0xB3B0; addr <= 0xB3B2; addr++) {
                  const int16_t v = reg_s(addr);
                  const size_t idx = size_t(addr - 0xB3B0);

                  if (mapper_initialized) {
                    log_change(
                      "S0A_FC17R",
                      addr,
                      prev_b3b0_block[idx],
                      v
                    );
                  }

                  prev_b3b0_block[idx] = v;
                }
              }

              mapper_initialized = true;

              const float room_temperature =
                float(
                  reg_s(0xB3B0)
                ) / 10.0f;


              if (
                room_temperature > -20.0f &&
                room_temperature < 60.0f
              ) {

                id(thermia_room_temperature)->publish_state(
                    room_temperature
                  );
              }
            }


            fc17_pending[slave] = false;
            return;
          }


