# =============================================================================
# TEMPORARY USER-REQUESTED RAW LOG CAPTURE
#
# "Log 120 Seconds" appears under Configuration in Home Assistant.
# It only enables WARN-level logging of already observed CRC-valid frames.
# The button does NOT transmit anything on RS485 and does NOT persist logs on
# the ESP. Open the ESPHome log stream before pressing it, then copy everything
# between ATEC-CAPTURE START and ATEC-CAPTURE END.
# =============================================================================

script:
  - id: dhpaq_log_120_seconds
    mode: restart
    then:
      - lambda: |-
          id(dhpaq_capture_active) = true;
          id(dhpaq_capture_started_ms) = millis();
          id(dhpaq_capture_frame_count) = 0;
          id(dhpaq_capture_active_sensor)->publish_state(true);
          id(dhpaq_capture_status)->publish_state("Recording 120 seconds");
          ESP_LOGW(
            "dhpaq_capture",
            "ATEC-CAPTURE START duration=120s - copy through the END marker"
          );

      - delay: 120s

      - lambda: |-
          id(dhpaq_capture_active) = false;
          id(dhpaq_capture_active_sensor)->publish_state(false);

          char capture_status[64];
          snprintf(
            capture_status,
            sizeof(capture_status),
            "Complete - %lu frames",
            (unsigned long) id(dhpaq_capture_frame_count)
          );
          id(dhpaq_capture_status)->publish_state(capture_status);

          ESP_LOGW(
            "dhpaq_capture",
            "ATEC-CAPTURE END duration=120s frames=%lu",
            (unsigned long) id(dhpaq_capture_frame_count)
          );


button:
  - platform: template
    id: dhpaq_log_120_seconds_button
    name: "Log 120 Seconds"
    icon: "mdi:record-rec"
    entity_category: config
    on_press:
      - script.execute: dhpaq_log_120_seconds


