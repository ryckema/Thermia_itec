# =============================================================================
# PERIODIC BUS HEALTH CHECK
# =============================================================================

interval:
  - interval: 500ms
    then:
      - lambda: |-
          if (!id(eco_exp01_armed)) return;

          const uint32_t now=millis();
          const uint32_t last=id(thermia_last_valid_frame_ms);
          const uint32_t age=last ? (now-last) : (now-id(eco_exp01_arm_ms));

          auto stop_exp=[&](const char *status,const char *event) {
            id(waveshare_rs485_direction).turn_off();
            id(eco_exp01_armed)=false;
            id(eco_exp01_stage)=5;
            id(eco_exp01_armed_sensor)->publish_state(false);
            id(eco_exp01_status)->publish_state(status);
            id(eco_exp01_stage_text)->publish_state("stage 5 / complete or aborted / DE LOW");
            id(eco_exp01_last_event)->publish_state(event);
          };

          // Stage 1 is intentionally passive: only latch a real controller outage.
          if (id(eco_exp01_stage)==1 && !id(eco_exp01_silence_seen) && age>=5000UL) {
            id(eco_exp01_silence_seen)=true;
            id(eco_exp01_status)->publish_state("RUNNING / >=5 s bus silence confirmed / waiting controller return");
            id(eco_exp01_stage_text)->publish_state("stage 1 / silence confirmed / TX=0");
            id(eco_exp01_last_event)->publish_state("SILENCE_CONFIRMED >=5000 ms");
            ESP_LOGE("thermia_eco_write",
              "\033[38;5;130m[ECO-WRITE-01] ===== SILENCE_CONFIRMED age=%ums TX=0 DE=LOW =====\033[0m",
              unsigned(age));
          }

          if (id(eco_exp01_stage)>=2 &&
              (id(eco_exp01_bad_crc_count)!=id(eco_exp01_bad_crc_baseline) ||
               id(eco_exp01_stream_resync_count)!=id(eco_exp01_stream_resync_baseline) ||
               id(eco_exp01_rx_drop_count)!=id(eco_exp01_rx_drop_baseline))) {
            ESP_LOGE("thermia_eco_write",
              "\033[31m[ECO-WRITE-01] ===== ABORT PARSER_RX_INTEGRITY_DELTA crc=%u/%u resync=%u/%u drops=%u/%u TX=0 DE=LOW =====\033[0m",
              unsigned(id(eco_exp01_bad_crc_count)),unsigned(id(eco_exp01_bad_crc_baseline)),
              unsigned(id(eco_exp01_stream_resync_count)),unsigned(id(eco_exp01_stream_resync_baseline)),
              unsigned(id(eco_exp01_rx_drop_count)),unsigned(id(eco_exp01_rx_drop_baseline)));
            stop_exp("ABORTED / parser-RX integrity changed after boot return",
                     "CRC/resync/drop counter changed during active observation window");
            return;
          }

          if (id(eco_exp01_stage)==1 &&
              (now-id(eco_exp01_arm_ms))>180000UL) {
            ESP_LOGE("thermia_eco_write",
              "\033[31m[ECO-WRITE-01] ===== COMPLETE / INCONCLUSIVE arm timeout / no qualified restart =====\033[0m");
            stop_exp("COMPLETE / INCONCLUSIVE / no qualified controller restart within 180 s",
                     "arm timed out before a usable silence->return sequence");
            return;
          }

          if (id(eco_exp01_stage)==2 &&
              id(eco_exp01_boot_return_ms)!=0 &&
              (now-id(eco_exp01_boot_return_ms))>30000UL) {
            ESP_LOGE("thermia_eco_write",
              "\033[31m[ECO-WRITE-01] ===== COMPLETE / INCONCLUSIVE target challenge #3 not reached within 30 s seen=%u TX=0 =====\033[0m",
              unsigned(id(eco_exp01_challenge_count)));
            stop_exp("COMPLETE / INCONCLUSIVE / target challenge #3 not reached within 30 s",
                     "controller returned, but the evidence-based challenge #3 replay point was not reached");
            return;
          }

          if (id(eco_exp01_stage)==3 &&
              id(eco_exp01_r1_ms)!=0 &&
              (now-id(eco_exp01_r1_ms))>10000UL) {
            ESP_LOGE("thermia_eco_write",
              "\033[31m[ECO-WRITE-01] ===== COMPLETE / NEGATIVE no FC16 03E8/count14 within 10 s after R1 =====\033[0m");
            stop_exp("COMPLETE / NEGATIVE / R1 did not trigger 03E8 sync entry",
                     "no controller FC16 03E8/count14 within 10 s after the one replay");
            return;
          }

  - interval: 5s
    then:
      - lambda: |-
          const uint32_t last = id(thermia_last_valid_frame_ms);
          if (last == 0 || (millis() - last) > 10000UL) {
            if (!id(thermia_bus_healthy)->has_state() || id(thermia_bus_healthy)->state) {
              id(thermia_bus_healthy)->publish_state(false);
            }
          }