                  const int16_t port_d = reg_s(0x07DF);
                  const int16_t unknown_07e0 = reg_s(0x07E0);
                  const int16_t unknown_07e1 = reg_s(0x07E1);
                  const int16_t unknown_07e2 = reg_s(0x07E2);

                  auto valid_whole_temp = [](int16_t v) -> bool {
                    return v != -100 && v > -50 && v < 150;
                  };

                  // Native comparison mirrors for values already available
                  // through v29's established sources.
                  if (valid_whole_temp(supply_raw)) {
                    publish_float_if_changed(
                      id(thermia_native_supply_temperature_07d0),
                      float(supply_raw),
                      0.5f
                    );
                  } else {
                    id(thermia_native_supply_temperature_07d0)->publish_state(NAN);
                  }

                  if (valid_whole_temp(dhw_top_raw)) {
                    publish_float_if_changed(
                      id(thermia_native_dhw_top_temperature_07d3),
                      float(dhw_top_raw),
                      0.5f
                    );
                  } else {
                    id(thermia_native_dhw_top_temperature_07d3)->publish_state(NAN);
                  }

                  if (valid_whole_temp(dhw_raw)) {
                    publish_float_if_changed(
                      id(thermia_native_dhw_temperature_07d4),
                      float(dhw_raw),
                      0.5f
                    );
                  } else {
                    id(thermia_native_dhw_temperature_07d4)->publish_state(NAN);
                  }

                  if (valid_whole_temp(outdoor_raw)) {
                    publish_float_if_changed(
                      id(thermia_native_outdoor_temperature_07da),
                      float(outdoor_raw),
                      0.5f
                    );
                  } else {
                    id(thermia_native_outdoor_temperature_07da)->publish_state(NAN);
                  }

                  // Keep distinct native measurements; no redundant comparison entities.

                  // Locally relevant native-only hydraulic temperatures.
                  if (valid_whole_temp(return_raw)) {
                    publish_float_if_changed(id(thermia_return_temperature),
                                             float(return_raw), 0.5f);
                  } else {
                    id(thermia_return_temperature)->publish_state(NAN);
                  }

                  if (valid_whole_temp(system_supply_raw)) {
                    publish_float_if_changed(id(thermia_system_supply_temperature),
                                             float(system_supply_raw), 0.5f);
                  } else {
                    id(thermia_system_supply_temperature)->publish_state(NAN);
                  }

                  if ((id(thermia_capabilities_seen) && (uint32_t(millis() - id(thermia_capabilities_last_seen_ms)) <= 21600000UL) && id(thermia_buffer_tank_config) == 1)) {
                    if (valid_whole_temp(buffer_raw)) {
                      publish_float_if_changed(id(thermia_buffer_tank_temperature),
                                               float(buffer_raw), 0.5f);
                    } else {
                      id(thermia_buffer_tank_temperature)->publish_state(NAN);
                    }
                  } else {
                    id(thermia_buffer_tank_temperature)->publish_state(NAN);
                  }

                  if ((id(thermia_capabilities_seen) && (uint32_t(millis() - id(thermia_capabilities_last_seen_ms)) <= 21600000UL) && id(thermia_distribution_circuit_1_config) == 1)) {
                    if (valid_whole_temp(circuit1_raw)) {
                      publish_float_if_changed(id(thermia_distribution_circuit_1_temperature),
                                               float(circuit1_raw), 0.5f);
                    } else {
                      id(thermia_distribution_circuit_1_temperature)->publish_state(NAN);
                    }
                  } else {
                    id(thermia_distribution_circuit_1_temperature)->publish_state(NAN);
                  }

                  if ((id(thermia_capabilities_seen) && (uint32_t(millis() - id(thermia_capabilities_last_seen_ms)) <= 21600000UL) && id(thermia_buffer_tank_config) == 1) && valid_whole_temp(tank_raw)) {
                    publish_float_if_changed(
                      id(thermia_tank_temperature_07d9),
                      float(tank_raw),
                      0.5f
                    );
                  } else {
                    id(thermia_tank_temperature_07d9)->publish_state(NAN);
                  }

                  // Full raw accounting for cross-profile/unmapped fields.
                  publish_float_if_changed(id(thermia_07d1_raw),
                                           float(cross_profile_07d1_raw), 0.5f);
                  publish_float_if_changed(id(thermia_07d5_raw),
                                           float(unknown_07d5), 0.5f);
                  publish_float_if_changed(id(thermia_07db_raw),
                                           float(unknown_07db), 0.5f);
                  publish_float_if_changed(id(thermia_07dc_raw),
                                           float(unknown_07dc), 0.5f);
                  publish_float_if_changed(id(thermia_07df_raw),
                                           float(port_d), 0.5f);
                  publish_float_if_changed(id(thermia_07e0_raw),
                                           float(unknown_07e0), 0.5f);
                  publish_float_if_changed(id(thermia_07e1_raw),
                                           float(unknown_07e1), 0.5f);
                  publish_float_if_changed(id(thermia_07e2_raw),
                                           float(unknown_07e2), 0.5f);

                  // READ-PROD-01C: auxiliary-heater status words.
                  publish_float_if_changed(id(thermia_aux_status_raw_07dd),
                                           float(port_b), 0.5f);
                  publish_float_if_changed(id(thermia_aux_status_raw_07de),
                                           float(port_c), 0.5f);

                  publish_bool_if_changed(id(thermia_immersion_heater_1_active),
                                          (port_b & (1u << 7)) != 0);
                  publish_bool_if_changed(id(thermia_external_auxiliary_active),
                                          (port_b & (1u << 3)) != 0);
                  publish_bool_if_changed(id(thermia_external_auxiliary_potential_free_active),
                                          (port_b & (1u << 2)) != 0);
                  publish_bool_if_changed(id(thermia_immersion_heater_2_active),
                                          (port_c & (1u << 4)) != 0);
                  publish_bool_if_changed(id(thermia_immersion_heater_3_active),
                                          (port_c & (1u << 3)) != 0);
                }

                // =============================================================
                // READ-PROD-01J — COMPLETE 080C/count18 RUNTIME PAGE
                //
                // Direct CM930 2.3.0-2.4.3 semantic ownership:
                //   080C = room_temp_measured
                //   080D = pool_temp_measured
                //   080E = cool_temp_measured
                //   080F = distribution_circuit_2_temp_measured
                //   0814 = current_consumption_measured
                //   081A = oper_data_port_b_exp_card
                //   081B = oper_data_port_d_exp_card
                //
                // 0810/0811 have supply/return semantics only in 2.2.x/3.x
                // profile families, NOT local 2.3.0-2.4.3, so they stay raw.
                //
                // Local 080C is 200 while the room is ~20 °C; this aligns with
                // the native x0.1 °C representation used by the firmware and is
                // exposed only as a diagnostic comparison entity for now.
                // =============================================================

                if (slave == 0x0F && start == 0x080C && count >= 18) {
                  id(thermia_native_page_seen_mask) |= (1UL << 8);  // RX source 0x080C

                  const int16_t room_raw = reg_s(0x080C);
                  const int16_t pool_raw = reg_s(0x080D);
                  const int16_t cooling_raw = reg_s(0x080E);
                  const int16_t circuit2_raw = reg_s(0x080F);
                  const int16_t current_consumption_raw = reg_s(0x0814);
                  const int16_t exp_port_b = reg_s(0x081A);
                  const int16_t exp_port_d = reg_s(0x081B);

                  // Room temperature: x0.1 °C. Keep diagnostic until the native
                  // mirror has been compared live with the existing room-sensor
                  // production source through several temperature changes.
                  if (room_raw != -1000 && room_raw > -500 && room_raw < 600) {
                    const float native_room = float(room_raw) / 10.0f;
                    publish_float_if_changed(
                      id(thermia_native_room_temperature_080c),
                      native_room,
                      0.05f
                    );

                    // The native room value remains published without the v29 delta.
                  } else {
                    id(thermia_native_room_temperature_080c)->publish_state(NAN);
                  }

                  // These three have strong firmware semantic ownership, but
                  // local installation values are all zero and cannot prove
                  // scale. Preserve raw data instead of guessing units.
                  publish_float_if_changed(
                    id(thermia_pool_temperature_raw_080d),
                    float(pool_raw),
                    0.5f
                  );
                  publish_float_if_changed(
                    id(thermia_cooling_temperature_raw_080e),
                    float(cooling_raw),
                    0.5f
                  );
                  publish_float_if_changed(
                    id(thermia_distribution_circuit_2_temperature_raw_080f),
                    float(circuit2_raw),
                    0.5f
                  );

                  publish_float_if_changed(
                    id(thermia_current_consumption_raw_0814),
                    float(current_consumption_raw),
                    0.5f
                  );

                  publish_float_if_changed(
                    id(thermia_expansion_card_port_b_raw_081a),
                    float(exp_port_b),
                    0.5f
                  );
                  publish_float_if_changed(
                    id(thermia_expansion_card_port_d_raw_081b),
                    float(exp_port_d),
                    0.5f
                  );

                  // Full raw coverage for currently unmapped or profile-
                  // inappropriate fields.
                  publish_float_if_changed(id(thermia_0810_raw), float(reg_s(0x0810)), 0.5f);
                  publish_float_if_changed(id(thermia_0811_raw), float(reg_s(0x0811)), 0.5f);
                  publish_float_if_changed(id(thermia_0812_raw), float(reg_s(0x0812)), 0.5f);
                  publish_float_if_changed(id(thermia_0813_raw), float(reg_s(0x0813)), 0.5f);
                  publish_float_if_changed(id(thermia_0815_raw), float(reg_s(0x0815)), 0.5f);
                  publish_float_if_changed(id(thermia_0816_raw), float(reg_s(0x0816)), 0.5f);
                  publish_float_if_changed(id(thermia_0817_raw), float(reg_s(0x0817)), 0.5f);
                  publish_float_if_changed(id(thermia_0818_raw), float(reg_s(0x0818)), 0.5f);
                  publish_float_if_changed(id(thermia_0819_raw), float(reg_s(0x0819)), 0.5f);
                  publish_float_if_changed(id(thermia_081c_raw), float(reg_s(0x081C)), 0.5f);
                  publish_float_if_changed(id(thermia_081d_raw), float(reg_s(0x081D)), 0.5f);
                }

                // =============================================================
                // READ-PROD-01H — 0848/count23 DEMAND / TARGET RUNTIME PAGE
                //
                // Direct Connect 2.1.105 CM930 2.3.0-2.4.3 semantics:
                //   0848 = heat_demand_integral | heat_demand_pid
                //          (semantic/formula collision -> raw only)
                //   0849 = supply_line_temp_wanted
                //   084A = system_supply_line_temp_wanted
                //   084B = distribution_circuit_1_temp_wanted
                //   084C = distribution_circuit_2_temp_wanted
                //   0851 = tapwater_temp_weighted
                //   0852 = lowest_wanted_tank_temp
                //   0853 = lowest_wanted_tank_reduction_temp
                //
                // 084D is only mapped as buffer_tank_temp_measured in other
                // profile families, NOT the local 2.3.0-2.4.3 profile.
                // 084E..0850 and 0854..085E therefore remain raw diagnostics.
                // =============================================================

                if (slave == 0x0F && start == 0x0848 && count >= 23) {
                  id(thermia_native_page_seen_mask) |= (1UL << 10);  // RX source 0x0848

                  const int16_t heat_demand_raw = reg_s(0x0848);
                  const int16_t supply_wanted = reg_s(0x0849);
                  const int16_t system_supply_wanted = reg_s(0x084A);
                  const int16_t circuit1_wanted = reg_s(0x084B);
                  const int16_t circuit2_wanted = reg_s(0x084C);
                  const int16_t weighted_dhw = reg_s(0x0851);
                  const int16_t lowest_wanted_tank = reg_s(0x0852);
                  const int16_t lowest_wanted_tank_reduction = reg_s(0x0853);

                  auto valid_wanted_temp = [](int16_t v) -> bool {
                    return v != -100 && v > -50 && v < 150;
                  };

                  // 0848 semantics differ by firmware/profile/formula context.
                  // Keep the exact raw value rather than calling it integral
                  // or PID on the local XTR without correlation.
                  publish_float_if_changed(
                    id(thermia_heat_demand_raw_0848),
                    float(heat_demand_raw),
                    0.5f
                  );

                  if (valid_wanted_temp(supply_wanted)) {
                    publish_float_if_changed(
                      id(thermia_supply_temperature_wanted),
                      float(supply_wanted),
                      0.5f
                    );
                  } else {
                    id(thermia_supply_temperature_wanted)->publish_state(NAN);
                  }

                  if (valid_wanted_temp(system_supply_wanted) &&
                      system_supply_wanted != 0) {
                    publish_float_if_changed(
                      id(thermia_system_supply_temperature_wanted),
                      float(system_supply_wanted),
                      0.5f
                    );
                  } else {
                    id(thermia_system_supply_temperature_wanted)->publish_state(NAN);
                  }

                  if ((id(thermia_capabilities_seen) && (uint32_t(millis() - id(thermia_capabilities_last_seen_ms)) <= 21600000UL) && id(thermia_distribution_circuit_1_config) == 1)) {
                    if (valid_wanted_temp(circuit1_wanted)) {
                      publish_float_if_changed(
                        id(thermia_distribution_circuit_1_temperature_wanted),
                        float(circuit1_wanted),
                        0.5f
                      );
                    } else {
                      id(thermia_distribution_circuit_1_temperature_wanted)->publish_state(NAN);
                    }
                  } else {
                    id(thermia_distribution_circuit_1_temperature_wanted)->publish_state(NAN);
                  }

                  if ((id(thermia_capabilities_seen) && (uint32_t(millis() - id(thermia_capabilities_last_seen_ms)) <= 21600000UL) && id(thermia_distribution_circuit_2_config) == 1)) {
                    if (valid_wanted_temp(circuit2_wanted)) {
                      publish_float_if_changed(
                        id(thermia_distribution_circuit_2_temperature_wanted),
                        float(circuit2_wanted),
                        0.5f
                      );
                    } else {
                      id(thermia_distribution_circuit_2_temperature_wanted)->publish_state(NAN);
                    }
                  } else {
                    id(thermia_distribution_circuit_2_temperature_wanted)->publish_state(NAN);
                  }

                  // Firmware-derived DHW runtime semantics.
                  if (valid_wanted_temp(weighted_dhw)) {
                    publish_float_if_changed(
                      id(thermia_weighted_dhw_temperature),
                      float(weighted_dhw),
                      0.5f
                    );
                  } else {
                    id(thermia_weighted_dhw_temperature)->publish_state(NAN);
                  }

                  // Zero is kept valid for the "lowest wanted" fields: the
                  // local capture currently reports zero and we do not yet
                  // know whether zero means inactive or a literal threshold.
                  if ((id(thermia_capabilities_seen) && (uint32_t(millis() - id(thermia_capabilities_last_seen_ms)) <= 21600000UL) && id(thermia_buffer_tank_config) == 1) && valid_wanted_temp(lowest_wanted_tank)) {
                    publish_float_if_changed(
                      id(thermia_lowest_wanted_tank_temperature),
                      float(lowest_wanted_tank),
                      0.5f
                    );
                  } else {
                    id(thermia_lowest_wanted_tank_temperature)->publish_state(NAN);
                  }

                  if ((id(thermia_capabilities_seen) && (uint32_t(millis() - id(thermia_capabilities_last_seen_ms)) <= 21600000UL) && id(thermia_buffer_tank_config) == 1) && valid_wanted_temp(lowest_wanted_tank_reduction)) {
                    publish_float_if_changed(
                      id(thermia_lowest_wanted_tank_reduction_temperature),
                      float(lowest_wanted_tank_reduction),
                      0.5f
                    );
                  } else {
                    id(thermia_lowest_wanted_tank_reduction_temperature)->publish_state(NAN);
                  }

                  // Complete raw coverage of all currently unmapped words in
                  // the 0848/count23 page.
                  publish_float_if_changed(id(thermia_084d_raw), float(reg_s(0x084D)), 0.5f);
                  publish_float_if_changed(id(thermia_084e_raw), float(reg_s(0x084E)), 0.5f);
                  publish_float_if_changed(id(thermia_084f_raw), float(reg_s(0x084F)), 0.5f);
                  publish_float_if_changed(id(thermia_0850_raw), float(reg_s(0x0850)), 0.5f);
                  publish_float_if_changed(id(thermia_0854_raw), float(reg_s(0x0854)), 0.5f);
                  publish_float_if_changed(id(thermia_0855_raw), float(reg_s(0x0855)), 0.5f);
                  publish_float_if_changed(id(thermia_0856_raw), float(reg_s(0x0856)), 0.5f);
                  publish_float_if_changed(id(thermia_0857_raw), float(reg_s(0x0857)), 0.5f);
                  publish_float_if_changed(id(thermia_0858_raw), float(reg_s(0x0858)), 0.5f);
                  publish_float_if_changed(id(thermia_0859_raw), float(reg_s(0x0859)), 0.5f);
                  publish_float_if_changed(id(thermia_085a_raw), float(reg_s(0x085A)), 0.5f);
                  publish_float_if_changed(id(thermia_085b_raw), float(reg_s(0x085B)), 0.5f);
                  publish_float_if_changed(id(thermia_085c_raw), float(reg_s(0x085C)), 0.5f);
                  publish_float_if_changed(id(thermia_085d_raw), float(reg_s(0x085D)), 0.5f);
                  publish_float_if_changed(id(thermia_085e_raw), float(reg_s(0x085E)), 0.5f);
                }

                return;
              }


              // ===============================================================
              // FC17 REQUEST
              // Read / Write Multiple Registers
              // ===============================================================

              if (
                fc == 0x17 &&
                bytes.size() >= 13
              ) {

                const uint16_t read_start =
                  u16(bytes, 2);

                const uint16_t read_count =
                  u16(bytes, 4);

                const uint16_t write_start =
                  u16(bytes, 6);

                const uint16_t write_count =
                  u16(bytes, 8);

                const uint8_t byte_count =
                  bytes[10];

                const size_t expected_size =
                  size_t(byte_count) + 13;


                if (
                  bytes.size() == expected_size &&
                  byte_count == write_count * 2
                ) {

                  fc17_start[slave] =
                    read_start;

                  fc17_count[slave] =
                    read_count;

                  fc17_pending[slave] =
                    true;


                  auto write_reg_s =
                    [&](uint16_t address) -> int16_t {

                      const size_t offset =
                        size_t(address - write_start);

                      const size_t pos =
                        11 + offset * 2;

                      return s16(bytes, pos);
                    };


                  // Generic mapper: scan complete FC17 write part.
                  for (uint16_t i = 0; i < write_count; i++) {

                    const uint16_t address =
                      uint16_t(write_start + i);

                    generic_map_update(
                      3,
                      slave,
                      address,
                      write_reg_s(address)
                    );
                  }


                  // ===========================================================
                  // MAPPER: FC17 write blocks
                  // ===========================================================

                  if (
                    slave == 0x0A &&
                    write_start <= 0xB3C4 &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) >= 0xB3C7
                  ) {

                    for (uint16_t addr = 0xB3C4; addr <= 0xB3C6; addr++) {
                      const int16_t v = write_reg_s(addr);
                      const size_t idx = size_t(addr - 0xB3C4);

                      if (mapper_initialized) {
                        log_change(
                          "S0A_FC17W",
                          addr,
                          prev_b3c4_block[idx],
                          v
                        );
                      }

                      prev_b3c4_block[idx] = v;
                    }

                    // B3C6 is an unresolved room-sensor control/status word.
                    // Values 0 / 2 have been observed, but "boost/enhanced" is
                    // not sufficiently proven. Keep the binary entity diagnostic
                    // and neutral: ON only means B3C6 is non-zero.
                    publish_bool_if_changed(
                      id(thermia_room_boost_request),
                      write_reg_s(0xB3C6) != 0
                    );
                  }


                  if (
                    slave == 0x02 &&
                    write_start <= 0xA80C &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) >= 0xA813
                  ) {

                    for (uint16_t addr = 0xA80C; addr <= 0xA812; addr++) {
                      const int16_t v = write_reg_s(addr);
                      const size_t idx = size_t(addr - 0xA80C);

                      if (mapper_initialized) {
                        log_change(
                          "S02_FC17W",
                          addr,
                          prev_a80c_block[idx],
                          v
                        );
                      }

                      prev_a80c_block[idx] = v;
                    }

                    const uint16_t a80c = uint16_t(write_reg_s(0xA80C));
                    const uint16_t a80e = uint16_t(write_reg_s(0xA80E));

                    publish_float_if_changed(
                      id(thermia_controller_state_a80c),
                      float(a80c),
                      0.5f
                    );

                    const char *controller_context = "Unknown";
                    switch (a80c) {
                      case 64:
                        controller_context = "Normal / baseline";
                        break;
                      case 65:
                        controller_context = "DHW / high temperature";
                        break;
                      case 66:
                        controller_context = "Cooling context / available";
                        break;
                      case 112:
                        controller_context = "Controller housekeeping / transition";
                        break;
                      case 193:
                        controller_context = "Compound / unknown";
                        break;
                      default:
                        controller_context = "Unknown";
                        break;
                    }
                    publish_text_if_changed(
                      id(thermia_controller_context),
                      controller_context
                    );

                    publish_float_if_changed(
                      id(thermia_controller_state_a80e),
                      float(a80e),
                      0.5f
                    );

                    // Keep these raw bit sensors neutral. A80C is primarily
                    // treated as a controller context/sequence value, while A80E
                    // behaves as a controller/accessory status bitfield.
                    publish_bool_if_changed(id(thermia_a80c_flag_0x10), (a80c & 0x0010U) != 0);
                    publish_bool_if_changed(id(thermia_a80c_flag_0x20), (a80c & 0x0020U) != 0);
                    publish_bool_if_changed(id(thermia_a80e_flag_0x08), (a80e & 0x0008U) != 0);
                    publish_bool_if_changed(id(thermia_a80e_flag_0x20), (a80e & 0x0020U) != 0);
                  }


                  // ===========================================================
                  // SLAVE 0x02 - controller sequence value (A80F)
                  //
                  // A80F takes values such as 5, 10, 50 and 75..100.
                  // Heating captures show 10->50 before a cycle, 50->80 at
                  // cycle start and 80->79->...->75 while established. A DHW
                  // capture showed 80->...->100, then 100->80->5->10 on stop.
                  // This strongly ties A80F to controller sequencing/control,
                  // but its exact internal semantics remain unknown.
                  //
                  // IMPORTANT: A80F is NOT compressor frequency, compressor
                  // power, a percentage, or a simple linear heat-demand value.
                  // ===========================================================

                  if (
                    slave == 0x02 &&
                    write_start <= 0xA80F &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) > 0xA80F
                  ) {
                    publish_float_if_changed(id(thermia_demand_raw), float(write_reg_s(0xA80F)), 0.5f);
                  }


                  // ===========================================================
                  // SLAVE 0x0A
                  //
                  // B3C5 = controller-propagated / confirmed room setpoint
                  // ===========================================================

                  if (
                    slave == 0x0A &&
                    write_start <= 0xB3C5 &&
                    (
                      uint32_t(write_start) +
                      uint32_t(write_count)
                    ) > 0xB3C5
                  ) {

                    const float room_setpoint =
                      float(
                        write_reg_s(0xB3C5)
                      );


                    if (
                      room_setpoint >= 5.0f &&
                      room_setpoint <= 40.0f
                    ) {

                      publish_float_if_changed(id(thermia_room_setpoint), room_setpoint, 0.5f);
                    }
                  }

                  return;
                }
              }


              // ===============================================================
              // FC17 RESPONSE
              // ===============================================================

              if (
                fc == 0x17 &&
                fc17_pending[slave] &&
                bytes.size() >= 5 &&
                bytes.size() ==
                  size_t(bytes[2]) + 5
              ) {

                const uint16_t start =
                  fc17_start[slave];

                const uint16_t count =
                  fc17_count[slave];

                const uint8_t byte_count =
                  bytes[2];


                if (
                  byte_count !=
                  count * 2
                ) {

                  fc17_pending[slave] = false;
                  return;
                }


                auto reg_s =
                  [&](uint16_t address) -> int16_t {

                    const size_t offset =
                      size_t(address - start);

                    const size_t pos =
                      3 + offset * 2;

                    return s16(bytes, pos);
                  };


                // Generic mapper: scan complete FC17 read response block.
                for (uint16_t i = 0; i < count; i++) {

                  const uint16_t address =
                    uint16_t(start + i);

                  generic_map_update(
                    4,
                    slave,
                    address,
                    reg_s(address)
                  );
                }


                // =============================================================
                // SLAVE 0x02
                //
                // A7F8 Supply temperature
                // A7FB DHW upper
                // A7FC DHW main
                // A7FD SG discriminator 1
                // A802 Outdoor temperature
                // A803 SG discriminator 2
                // =============================================================

                if (
                  slave == 0x02 &&
                  start == 0xA7F8 &&
                  count >= 15
                ) {

                  // -----------------------------------------------------------
                  // Mapper: slave 0x02 FC17 read block 0xA7F8..0xA806
                  // -----------------------------------------------------------

                  if (count >= 0x0F) {
                    for (uint16_t addr = 0xA7F8; addr <= 0xA806; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr - 0xA7F8);

                      if (mapper_initialized) {
                        log_change(
                          "S02_FC17R",
                          addr,
                          prev_a7f8_block[idx],
                          v
                        );
                      }

                      prev_a7f8_block[idx] = v;
                    }
                  }

                  const int16_t supply =
                    reg_s(0xA7F8);

                  const int16_t dhw_upper =
                    reg_s(0xA7FB);

                  const int16_t dhw =
                    reg_s(0xA7FC);

                  const int16_t outdoor =
                    reg_s(0xA802);

                  const int16_t sg_a =
                    reg_s(0xA7FD);

                  const int16_t sg_b =
                    reg_s(0xA803);


                  // ===========================================================
                  // DIAGNOSTIC: complete A7F8 block
                  // Useful to verify whether A7F8 really changes with supply.
                  // ===========================================================

                  ESP_LOGD(
                    "thermia_a7f8",
                    "A7F8=%d A7F9=%d A7FA=%d A7FB=%d A7FC=%d A7FD=%d "
                    "A7FE=%d A7FF=%d A800=%d A801=%d A802=%d A803=%d "
                    "A804=%d A805=%d A806=%d",
                    reg_s(0xA7F8),
                    reg_s(0xA7F9),
                    reg_s(0xA7FA),
                    reg_s(0xA7FB),
                    reg_s(0xA7FC),
                    reg_s(0xA7FD),
                    reg_s(0xA7FE),
                    reg_s(0xA7FF),
                    reg_s(0xA800),
                    reg_s(0xA801),
                    reg_s(0xA802),
                    reg_s(0xA803),
                    reg_s(0xA804),
                    reg_s(0xA805),
                    reg_s(0xA806)
                  );

                  ESP_LOGD(
                    "thermia_supply",
                    "Supply candidate A7F8 raw=%d -> %.1f C",
                    supply,
                    float(supply)
                  );


                  if (
                    supply != -1000 &&
                    supply > -50 &&
                    supply < 150
                  ) {

                    publish_float_if_changed(id(thermia_supply_temperature), float(supply), 0.5f);
                  }


                  if (
                    dhw_upper != -1000 &&
                    dhw_upper > 0 &&
                    dhw_upper < 100
                  ) {

                    publish_float_if_changed(id(thermia_dhw_upper_temperature), float(dhw_upper), 0.5f);
                  }


                  if (
                    dhw != -1000 &&
                    dhw > 0 &&
                    dhw < 100
                  ) {

                    publish_float_if_changed(id(thermia_dhw_temperature), float(dhw), 0.5f);
                  }


                  if (
                    outdoor != -1000 &&
                    outdoor > -50 &&
                    outdoor < 70
                  ) {

                    publish_float_if_changed(id(thermia_outdoor_temperature), float(outdoor), 0.5f);
                  }


                  if (
                    dhw_upper != -1000 &&
                    dhw != -1000
                  ) {

                    publish_float_if_changed(
                      id(thermia_dhw_delta_t),
                      float(dhw_upper - dhw),
                      0.5f
                    );
                  }


                  // ===========================================================
                  // SG MODE
                  //
                  // Controlled tests:
                  //
                  // A7FD    A803     SG input state from controlled tests
                  //
                  // -1000   232      Blocked  (SG 1-0)
                  //  1000   224      Normal   (SG 0-0)
                  //  1000   232      Enhanced (SG 0-1)
                  // -1000   224      Peak     (SG 1-1)
                  // ===========================================================

                  ESP_LOGD(
                    "thermia_sg",
                    "SG discriminators: A7FD=%d A803=%d",
                    sg_a,
                    sg_b
                  );


                  // Corrected from repeated physical SG1/SG2 test:
                  // 00 -> A7FD=-1000, A803=224 -> Normal
                  // 10 -> A7FD=-1000, A803=232 -> Blocked
                  // 01 -> A7FD= 1000, A803=224 -> Enhanced
                  // 11 -> A7FD= 1000, A803=232 -> Peak
                  //
                  // Intermediate A7FD values are treated as transitions.

                  if (
                    sg_a == -1000 &&
                    sg_b == 224
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Normal (0-0)");
                  }

                  else if (
                    sg_a == -1000 &&
                    sg_b == 232
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Blocked (1-0)");
                  }

                  else if (
                    sg_a == 1000 &&
                    sg_b == 224
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Enhanced (0-1)");
                  }

                  else if (
                    sg_a == 1000 &&
                    sg_b == 232
                  ) {

                    publish_text_if_changed(id(thermia_sg_mode), "Peak (1-1)");
                  }

                  else {

                    // Hold the last valid state during the short transition.
                    // Do not publish a misleading fifth SG mode.
                  }
                }


                // =============================================================
                // SLAVE 0x0A
                //
                // B3B0 = room temperature x0.1 °C
                // =============================================================

                if (
                  slave == 0x0A &&
                  start == 0xB3B0 &&
                  count >= 1
                ) {

                  // -----------------------------------------------------------
                  // Mapper: slave 0x0A FC17 read block 0xB3B0..0xB3B2
                  // -----------------------------------------------------------

                  if (count >= 3) {
                    for (uint16_t addr = 0xB3B0; addr <= 0xB3B2; addr++) {
                      const int16_t v = reg_s(addr);
                      const size_t idx = size_t(addr - 0xB3B0);

                      if (mapper_initialized) {
                        log_change(
                          "S0A_FC17R",
                          addr,
                          prev_b3b0_block[idx],
                          v
                        );
                      }

                      prev_b3b0_block[idx] = v;
                    }
                  }

                  mapper_initialized = true;

                  const float room_temperature =
                    float(
                      reg_s(0xB3B0)
                    ) / 10.0f;


                  if (
                    room_temperature > -20.0f &&
                    room_temperature < 60.0f
                  ) {

                    publish_float_if_changed(id(thermia_room_temperature), room_temperature, 0.05f);
                  }
                }


                fc17_pending[slave] = false;
                return;
              }

          };

          while (true) {
            if (pending.size() < 5) break;

            uint8_t slave = pending[0];
            uint8_t fn = pending[1];
            bool known_fn =
              fn == 0x03 || fn == 0x04 || fn == 0x10 || fn == 0x17 ||
              (fn & 0x80);
            if (!known_slave(slave) || !known_fn) {
              pending.erase(pending.begin());
              continue;
            }

            std::vector<size_t> candidates;
            if (fn & 0x80) candidates.push_back(5);
            if (fn == 0x03) {
              candidates.push_back(8);
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2]));
            }
            if (fn == 0x04) {
              candidates.push_back(8);
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2]));
            }
            if (fn == 0x10) {
              candidates.push_back(8);
              if (pending.size() >= 7 && pending[6] <= 240)
                candidates.push_back(9 + size_t(pending[6]));
            }
            if (fn == 0x17) {
              if (pending.size() >= 3 && pending[2] <= 240)
                candidates.push_back(5 + size_t(pending[2]));
              if (pending.size() >= 11 && pending[10] <= 240)
                candidates.push_back(13 + size_t(pending[10]));
            }

            std::sort(candidates.begin(), candidates.end());
            candidates.erase(std::unique(candidates.begin(), candidates.end()), candidates.end());

            size_t matched = 0;
            bool waiting = false;
            for (size_t len : candidates) {
              if (len < 5 || len > 256) continue;
              if (pending.size() < len) { waiting = true; continue; }
              if (valid_crc(len)) { matched = len; break; }
            }

            if (matched) {
              std::vector<uint8_t> frame(pending.begin(), pending.begin() + matched);
              pending.erase(pending.begin(), pending.begin() + matched);
              process_frame(frame);
              continue;
            }

            if (waiting) break;

            ESP_LOGW("thermia_stream", "CRC resync at 0x%02X 0x%02X", slave, fn);
            pending.erase(pending.begin());
          }

          if (pending.size() > 512) {
            ESP_LOGW("thermia_stream", "Dropping pending buffer (%u bytes)",
                     (unsigned) pending.size());
            pending.clear();
          }

