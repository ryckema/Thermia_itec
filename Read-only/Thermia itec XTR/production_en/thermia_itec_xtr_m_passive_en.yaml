# =============================================================================
# PERIODIC BUS HEALTH CHECK
# =============================================================================

interval:
  - interval: 5s
    then:
      - lambda: |-
          // A registered cooling setting can remain Unknown until a full
          // controller-originated 0442/count13 page is actually received.
          const char *cooling_page_state = id(thermia_cooling_page_0442_seen)
            ? "0442 received since ESP boot"
            : "0442 NOT received since ESP boot";
          if (!id(thermia_cooling_page_source)->has_state() ||
              id(thermia_cooling_page_source)->state != cooling_page_state) {
            id(thermia_cooling_page_source)->publish_state(cooling_page_state);
          }
          // All 13 sources counted only when a valid full FC16 page is decoded.
          // Y = page observed since ESP boot; N = not observed (not an error).
          const uint32_t native_seen = id(thermia_native_page_seen_mask);
          char native_summary[190];
          snprintf(native_summary, sizeof(native_summary),
                   "03E8:%c 03FC:%c 0410:%c 042E:%c 0442:%c 0532:%c 0546:%c 07D0:%c 080C:%c 0820:%c 0848:%c 0864:%c 0870:%c",
                   (native_seen & (1UL << 0)) ? 'Y' : 'N',
                   (native_seen & (1UL << 1)) ? 'Y' : 'N',
                   (native_seen & (1UL << 2)) ? 'Y' : 'N',
                   (native_seen & (1UL << 3)) ? 'Y' : 'N',
                   (native_seen & (1UL << 4)) ? 'Y' : 'N',
                   (native_seen & (1UL << 5)) ? 'Y' : 'N',
                   (native_seen & (1UL << 6)) ? 'Y' : 'N',
                   (native_seen & (1UL << 7)) ? 'Y' : 'N',
                   (native_seen & (1UL << 8)) ? 'Y' : 'N',
                   (native_seen & (1UL << 9)) ? 'Y' : 'N',
                   (native_seen & (1UL << 10)) ? 'Y' : 'N',
                   (native_seen & (1UL << 11)) ? 'Y' : 'N',
                   (native_seen & (1UL << 12)) ? 'Y' : 'N');
          if (!id(thermia_native_pages_seen_summary)->has_state() ||
              id(thermia_native_pages_seen_summary)->state != native_summary) {
            id(thermia_native_pages_seen_summary)->publish_state(native_summary);
          }
          const uint32_t last = id(thermia_last_valid_frame_ms);
          if (last == 0 || (millis() - last) > 10000UL) {
            if (!id(thermia_bus_healthy)->has_state() || id(thermia_bus_healthy)->state) {
              id(thermia_bus_healthy)->publish_state(false);
            }
          }
          // Fresh 0532 capability page required; provisional 6h policy, not locally timed.
          const bool features_fresh = id(thermia_capabilities_seen) &&
            uint32_t(millis() - id(thermia_capabilities_last_seen_ms)) <= 21600000UL;
          auto clear_optional_num = [](auto *v) {
            if (v->has_state() && !isnan(v->state)) v->publish_state(NAN);
          };
          auto clear_optional_bool = [](auto *v) {
            if (v->has_state()) v->invalidate_state();
          };
          if (!features_fresh) {
            clear_optional_bool(id(thermia_pool_enabled_capability));
            clear_optional_bool(id(thermia_distribution_circuit_1_enabled_capability));
            clear_optional_bool(id(thermia_distribution_circuit_2_enabled_capability));
            clear_optional_bool(id(thermia_buffer_tank_enabled_capability));
          }
          if (!(features_fresh && id(thermia_pool_config) == 1)) {
            clear_optional_bool(id(thermia_pool_heating_active));
            clear_optional_bool(id(thermia_pool_demand_queued));
          }
          if (!(features_fresh && id(thermia_distribution_circuit_1_config) == 1)) {
            clear_optional_num(id(thermia_distribution_circuit_1_curve));
            clear_optional_num(id(thermia_distribution_circuit_1_min_temperature));
            clear_optional_num(id(thermia_distribution_circuit_1_max_temperature));
            clear_optional_num(id(thermia_distribution_circuit_1_correction_plus5));
            clear_optional_num(id(thermia_distribution_circuit_1_correction_zero));
            clear_optional_num(id(thermia_distribution_circuit_1_correction_minus5));
            clear_optional_num(id(thermia_distribution_circuit_1_constant_temperature));
            clear_optional_num(id(thermia_distribution_circuit_1_temperature));
            clear_optional_num(id(thermia_distribution_circuit_1_temperature_wanted));
          }
          if (!(features_fresh && id(thermia_distribution_circuit_2_config) == 1)) {
            clear_optional_num(id(thermia_distribution_circuit_2_curve));
            clear_optional_num(id(thermia_distribution_circuit_2_min_temperature));
            clear_optional_num(id(thermia_distribution_circuit_2_max_temperature));
            clear_optional_num(id(thermia_distribution_circuit_2_correction_plus5));
            clear_optional_num(id(thermia_distribution_circuit_2_correction_zero));
            clear_optional_num(id(thermia_distribution_circuit_2_correction_minus5));
            clear_optional_num(id(thermia_distribution_circuit_2_constant_temperature));
            clear_optional_num(id(thermia_distribution_circuit_2_temperature_wanted));
          }
          if (!(features_fresh && id(thermia_buffer_tank_config) == 1)) {
            clear_optional_num(id(thermia_buffer_tank_temperature));
            clear_optional_num(id(thermia_tank_temperature_07d9));
            clear_optional_num(id(thermia_lowest_wanted_tank_temperature));
            clear_optional_num(id(thermia_lowest_wanted_tank_reduction_temperature));
          }
